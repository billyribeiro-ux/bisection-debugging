<tr><th>Phase</th><th>Goal</th><th>Bisection's role</th></tr>
<tr><td>Detect</td><td>"Something is wrong." Alerts fire, users report.</td><td>None yet.</td></tr>
<tr><td>Triage</td><td>"What's the impact and severity?"</td><td>None yet — incident commander gathers facts.</td></tr>
<tr><td>Mitigate</td><td>"Stop user pain — even temporarily."</td><td>Sometimes — see below.</td></tr>
<tr><td>Resolve</td><td>"Identify and apply the actual fix."</td><td>This is where bisection shines.</td></tr>
<tr><td>Postmortem</td><td>"Why did this happen, and how do we prevent it?"</td><td>The bisection log is the strongest evidence in the writeup.</td></tr>
</table>

<h3>Mitigate vs. Resolve: the senior engineer's choice</h3>
<p>The biggest mistake in incident response is conflating these two phases. They have opposite optimal strategies:</p>
<ul>
  <li><strong>Mitigate</strong> = fast, reversible action that stops user pain. Roll back to the last known good version. Disable the feature flag. Failover to the secondary region. Don't worry about root cause yet.</li>
  <li><strong>Resolve</strong> = correct action that fixes the underlying problem. Find the cause. Fix it. Validate the fix. Re-deploy.</li>
</ul>
<p>You almost always mitigate first, then resolve. Bisection happens during resolve, not during mitigate.</p>

<h3>The "rollback IS bisection" technique</h3>
<p>For deployment-driven outages, the fastest mitigation is also a single bisection round: roll back one deploy. If pain stops → the cause was in the most recent deploy. If pain continues → roll back the one before that. After 3 rollbacks, you've bisected production.</p>

<p>The structural design that enables this: <strong>every deploy is a tag, every tag is reversible, rollback takes under 60 seconds.</strong> A team without this has no fast mitigation. A team with it can solve most incidents in five minutes — even before the on-call engineer is fully awake.</p>

<h3>When the bug isn't in code: bisecting external events</h3>
<p>Sometimes nothing on your side changed. The outage is caused by:</p>
<ul>
  <li>An upstream provider's silent change (a cloud API behavior shift, an upstream package republish).</li>
  <li>A traffic spike from a marketing email or social-media moment.</li>
  <li>A long-tail edge case that finally hit.</li>
  <li>A scheduled job that just landed.</li>
</ul>
<p>Bisection here is across <em>events</em>, not commits:</p>

<pre class="code" data-lang="shell" data-title="incident-timeline-bisect.sh">#!/usr/bin/env bash
# Bisect the incident's timeline window — what changed in the period before
# things broke? Pull every change from every system that touches production.
START="${1:?incident start time, ISO format}"
END="${2:?incident end time}"

echo "=== Code deploys in window ==="
git log --since="$START" --until="$END" --oneline

echo "=== Infrastructure changes ==="
terraform-cloud-cli runs list --workspace prod --since "$START" --until "$END"

echo "=== Feature flag changes ==="
ld-cli audit-log list --start "$START" --end "$END"

echo "=== Database schema changes ==="
psql -c "SELECT * FROM schema_migrations WHERE applied_at BETWEEN '$START' AND '$END';"

echo "=== Upstream package versions installed in this window ==="
git log --since="$START" --until="$END" --diff-filter=M -p -- pnpm-lock.yaml
</pre>

<p>Bisecting this combined timeline often points at the actual cause within minutes — even when "nothing on your side changed."</p>

<h3>The incident commander's bisection discipline</h3>
<p>When you're leading an incident, the urge is to type fast and try things. The senior discipline:</p>
<ol>
  <li>State the current hypothesis explicitly. ("We think it's the deploy from 14:32.")</li>
  <li>State the test of the hypothesis. ("Rolling back to the prior version should restore login.")</li>
  <li>State who's running the test. ("Sara is rolling back; she'll confirm in three minutes.")</li>
  <li>Pause while the test runs. Don't pile more changes on top.</li>
  <li>Record the result in the channel. ("Rollback complete; login working. Hypothesis confirmed.")</li>
</ol>
<p>This is the scientific method run live, with stakes. Engineers who do this well become the people other engineers want to follow.</p>

<h3>What to write in the incident channel after bisection</h3>
<p>Three sentences, no more:</p>
<pre class="code" data-lang="markdown" data-title="incident-update.md">**Root cause identified.**

Bisection across the 14 deploys since 13:00 narrowed the regression to
commit `a3f9c81` — a config change that lowered the connection pool size
from 100 to 10. The fix is to revert that line; deploying now.

ETA on full recovery: 4 minutes.
</pre>
<p>That update tells every stakeholder exactly what they need to know. Compare to "we're still looking into it" — which gives the CTO no information and panics customer support.</p>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>The mark of a distinguished engineer in incident response is calm, sequenced communication and disciplined hypothesis-testing under pressure. Bisection is a tool, but the deeper skill is staying methodical when everyone around you is reactive. Practice this skill BEFORE the next big incident — run a "game day" with the team, simulate an outage, watch how people behave. The first time you see yourself stay calm and lead the bisection while the channel is on fire, you've crossed a level. That's the moment you become the engineer the team turns to next time.</p>
</div>
</template>

<template data-page-title="Bisection vs. Observability" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">Bisection vs. Observability — Complementary Tools</h2>
<p class="lede">Observability — metrics, logs, traces — tells you what your system is doing right now. Bisection tells you what changed to cause it. The two are not alternatives; they're complementary, and the most effective engineers know which to reach for first. This page is the framework.</p>

<h3>The two questions, in plain English</h3>
<table class="cmp">
<tr><th>Question</th><th>Tool</th></tr>
<tr><td>"What is the system doing right now?"</td><td>Observability (Prometheus, Grafana, Honeycomb, Datadog, Splunk)</td></tr>
<tr><td>"What changed to cause it?"</td><td>Bisection (git bisect, this entire curriculum)</td></tr>
</table>

<p>Many bugs need both. You see in observability that p99 latency tripled. You bisect to find when. You confirm in observability that the suspect commit's metrics match the symptom. Each tool feeds the other.</p>

<h3>The decision framework</h3>

<pre class="code" data-lang="text" data-title="observability-vs-bisection.txt">START → Did this used to work?
  │
  ├── YES → BISECT first to find the change. Use observability to confirm.
  │
  └── NO  → OBSERVE first to characterize. Use bisection if a refactor introduced it.

START → Is the bug reproducible in dev?
  │
  ├── YES → BISECT. The repro is the predicate.
  │
  └── NO  → OBSERVE in production. Find the data shape that triggers it.
            Use the data to write a repro. Then bisect.

START → Is there an alert firing?
  │
  ├── YES → OBSERVE the dashboards. Build situational awareness.
  │         Then bisect the deploy that triggered the alert.
  │
  └── NO  → User reports? OBSERVE the user's session via logs/traces.
            Reproduce. Then bisect.

START → Is the symptom slow performance?
  │
  ├── A specific function is slow → PROFILE (a form of observability).
  │
  └── Overall p95 grew over time → BISECT against a perf-budget predicate.
</pre>

<h3>Observability that makes bisection easy</h3>
<p>Some observability practices actively support bisection:</p>
<ul>
  <li><strong>Tag every metric/log with the deploy SHA.</strong> Grafana's <code>version="a3f9c81"</code> label means you can instantly see "did p99 change at this commit?"</li>
  <li><strong>Deploy markers on dashboards.</strong> A vertical line per deploy on every graph. Eyeballing this often skips bisection entirely.</li>
  <li><strong>Per-feature-flag metrics.</strong> Segment dashboards by flag combination. Bug only appears with flag X on? Instantly visible.</li>
  <li><strong>Structured logs with trace IDs.</strong> A user-reported bug at 14:23? Pull all logs with that trace ID across all services. No bisection needed for distributed problems — observability gives you the answer.</li>
</ul>

<h3>Bisection that produces observability</h3>
<p>The reverse is also true: a good bisection result improves observability for next time. After confirming the culprit:</p>
<ul>
  <li><strong>Add a metric that would have caught it.</strong> "Connection pool size dropped from 100 to 10" should have triggered an alert.</li>
  <li><strong>Add a log line at the suspect site.</strong> Future bugs in that area get found faster.</li>
  <li><strong>Add a regression test.</strong> The repro becomes part of the test suite.</li>
</ul>
<p>This is the senior move: every bisection makes future bisections cheaper. Compound interest on debugging.</p>

<h3>The classic mistake</h3>
<p>Junior engineers see a problem in production and immediately bisect — without checking what observability already shows. The dashboards might already say "memory went from 4 GB to 8 GB at exactly 14:32, three minutes after deploy a3f9c81." That's the answer, in 60 seconds, no bisection needed.</p>
<p><strong>The rule:</strong> always check observability first, even for 30 seconds. If it gives you the answer, you save an hour. If it doesn't, you've at least primed your bisection with the right symptom signature.</p>

<h3>What "good observability" actually means</h3>
<p>Most teams over-invest in dashboards and under-invest in <em>queryability</em>. The senior engineer's checklist:</p>
<ol>
  <li><strong>Can you find one specific user's behavior in the last hour by their user-ID?</strong> If not, your tracing is weak.</li>
  <li><strong>Can you query "all errors from service X in the last 5 minutes, grouped by error type"?</strong> If not, your logs aren't structured.</li>
  <li><strong>Can you see a flame graph for a slow request from production traffic?</strong> If not, you have no production profiler.</li>
  <li><strong>Do all your metrics have the deploy SHA as a label?</strong> If not, you can't correlate metrics with bisection candidates.</li>
</ol>
<p>Each "no" is a multiplicative penalty on every future incident. Each "yes" pays back forever.</p>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>The principal engineer's job isn't to choose between observability and bisection; it's to build a workflow where both work together — and to invest team energy in the gaps that prevent either from working. A team with great observability but terrible commit hygiene can't bisect. A team with great commit hygiene but no observability bisects too often. The masterful teams have both — and use bisection as a confirmation tool, not a primary one.</p>
</div>
</template>

<template data-page-title="The Cost of Un-Bisectable Bugs" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">The Cost of Un-Bisectable Bugs (Building the Business Case)</h2>
<p class="lede">A bug that takes a week to find is not a technical problem — it's a six-figure expense. Principal engineers don't just debug well; they translate debugging difficulty into the language executives understand. This page walks through how to measure the cost of un-bisectable bugs and present the case for investing in the practices that prevent them.</p>

<h3>The straight-line math</h3>
<p>Take a hypothetical: a senior engineer's fully-loaded cost is $200,000/year, which works out to about $100/hour. A bug that takes 40 hours of investigation costs $4,000 in direct engineering time alone. If three engineers are pulled in, it's $12,000. If the bug also blocks a release, multiply by the value of the delayed feature.</p>
<p>Now multiply by frequency. A team with 10 hard-to-bisect bugs per quarter costs:</p>
<pre class="code" data-lang="text" data-title="bug-cost-math.txt">10 bugs/quarter × 40 hours/bug × $100/hour            = $40,000/quarter direct cost
10 bugs × 2 additional engineers × 16 hours × $100    = $32,000/quarter spillover
10 bugs × $5,000 opportunity cost (delayed features)  = $50,000/quarter opportunity loss

Total drag per quarter ≈ $122,000
Annualized ≈ $488,000
</pre>
<p>This is a half-million-dollar annual line item that doesn't appear on any spreadsheet because it's distributed across hundreds of "I spent two days on a weird bug" stories.</p>

<h3>The investment proposal</h3>
<p>To prevent that drag, you'd spend:</p>
<table class="cmp">
<tr><th>Investment</th><th>Cost</th><th>Bisection-relevant benefit</th></tr>
<tr><td>Hermetic test infrastructure</td><td>2 senior-eng months once + 10% ongoing</td><td>Eliminates flake-driven bisection failures</td></tr>
<tr><td>Build/test parallelization</td><td>1 senior-eng month + CI infra cost ($1k/mo)</td><td>Cuts each bisection round time by 5–10×</td></tr>
<tr><td>Conventional-commits + commit-lint</td><td>1 week + ongoing review discipline</td><td>Makes every bisection result interpretable</td></tr>
<tr><td>Structured logging + tracing</td><td>2 senior-eng months</td><td>Halves the bisections you need to do at all</td></tr>
<tr><td>Versioned migrations + per-test DB</td><td>1 month</td><td>Makes data-shape bugs bisectable</td></tr>
</table>

<p>Total investment: ~6 senior-eng months over a year = ~$100,000. Saved: ~$488,000/year. <strong>ROI &gt; 4×.</strong></p>

<h3>How to actually pitch this</h3>
<p>Engineers usually fail at this conversation because they pitch to other engineers, not to leaders. The reframe:</p>

<table class="cmp">
<tr><th>What an engineer says</th><th>What a leader hears</th><th>What they SHOULD hear</th></tr>
<tr><td>"Our tests are flaky."</td><td>"Engineers complaining."</td><td>"Our deploys are unreliable; customers see incidents we can't reproduce."</td></tr>
<tr><td>"We need better observability."</td><td>"Engineers want a new tool."</td><td>"Our mean-time-to-recovery is 4 hours instead of 30 minutes."</td></tr>
<tr><td>"Bisection is hard."</td><td>"Engineers are slow."</td><td>"Each production incident costs $15,000 more in engineering hours than it should."</td></tr>
</table>

<p>The translation work isn't dishonest — it's the same problem stated in the language the decision-makers operate in.</p>

<h3>The metrics that prove the investment worked</h3>
<p>After making the investment, you measure:</p>
<ul>
  <li><strong>Mean Time To Diagnosis (MTTD)</strong> — from first alert to "we know what's broken." Bisection moves this number.</li>
  <li><strong>Mean Time To Recovery (MTTR)</strong> — from first alert to "users are healthy again." Reversible deploys move this.</li>
  <li><strong>Repro rate</strong> — % of bug reports that can be reproduced within 1 hour. Hermetic tests move this.</li>
  <li><strong>Bisection success rate</strong> — % of <code>git bisect</code> attempts that converge cleanly. Commit hygiene moves this.</li>
  <li><strong>Engineer-hours per incident</strong> — total time across all engineers. The big one.</li>
</ul>

<p>Six months after the investment, the same dashboard with the same metrics tells the leadership team whether the work paid off.</p>

<h3>The hidden cost: morale</h3>
<p>Engineers who spend three days bisecting a bug they shouldn't have had to bisect leave. Not in protest — in slow attrition. They take jobs at companies whose tooling lets them spend their days building things, not chasing ghosts.</p>
<p>Engineering org turnover that's "weirdly high" usually traces back to one of three things: comp, management, or a tooling environment that makes good work impossible. The third is the one engineers don't articulate clearly — and the one principal engineers can most directly fix.</p>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>The principal engineer's superpower in this conversation isn't the math — it's the credibility to be heard when proposing investments. That credibility comes from a track record of correct technical calls. Spend years making good calls; the day comes when you can say "we should spend two engineer-months on hermetic tests," and leadership says yes without a slide deck. Get there.</p>
</div>
</template>

<template data-page-title="When NOT to Bisect — The Decision Framework" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">When NOT to Bisect — The Decision Framework</h2>
<p class="lede">Bisection is a sharp tool, and like all sharp tools it has a wrong-use case. This page is the explicit list of situations where bisection is the wrong answer — saving you from spending hours on the technique when another tool would have answered in minutes.</p>

<h3>The seven situations where bisection is wrong</h3>

<h4>1. The bug has always been there</h4>
<p>Bisection searches for a moment of change. If the bug existed since commit 1, there's no moment to find. The right tool is code review, profiling, or running the bug under a debugger.</p>
<p><strong>Tell when:</strong> If your "good" endpoint is the first commit in the project, you don't have a good endpoint.</p>

<h4>2. The history is too short</h4>
<p>Bisecting 5 commits saves you 2 rounds vs. linear. Setup cost for bisection (writing the predicate, configuring the runner) often exceeds those 2 rounds.</p>
<p><strong>Tell when:</strong> Range is &lt; 10 commits. Just read the diffs.</p>

<h4>3. The predicate is unreliable</h4>
<p>If the test you'd use as the bisection oracle is flaky, bisection produces wrong answers. Fix the test first; then bisect. (Part I's flake-resistant predicates and Part IX's Bayesian bisection are workarounds, but the deeper answer is "fix the predicate.")</p>
<p><strong>Tell when:</strong> Running the test 5 times in a row produces mixed results.</p>

<h4>4. The predicate is too expensive</h4>
<p>If running the test takes 30 minutes, bisecting 1,000 commits takes 5 hours. At 10 minutes per round and 10 rounds, you might be better off forming a hypothesis from a code review instead.</p>
<p><strong>Tell when:</strong> A single predicate run is &gt; 5 minutes AND there are &lt; 50 commits in the range.</p>

<h4>5. The bug depends on external state you can't control</h4>
<p>A bug that only appears with specific user data, specific third-party API responses, or specific load can't be bisected if you can't reproduce those conditions per commit. The fix is either to capture the state (record/replay) or characterize the trigger more precisely.</p>
<p><strong>Tell when:</strong> Your predicate's behavior depends on whether your bisection-running computer has internet, the third-party API is up, or the current date.</p>

<h4>6. Multiple bugs are mixed together</h4>
<p>Bisection finds <em>one</em> change. If two unrelated changes both contribute to the symptom, bisection lands on the more recent one and confuses you. The fix is to characterize the bug carefully enough that you can distinguish "bug A" from "bug B" in the predicate.</p>
<p><strong>Tell when:</strong> The "bad" condition has multiple distinct failure signatures that you've been treating as one.</p>

<h4>7. The bug is an emergent property of many small changes</h4>
<p>Sometimes a system degrades gradually — memory leaks, performance regressions, security drift. Each individual commit "passes" the predicate, but the cumulative effect is bad. Bisection finds nothing useful because no single commit is the culprit.</p>
<p><strong>Tell when:</strong> Every commit's predicate run passes by a hair; the predicate's measured value (latency, memory) drifts steadily across commits without a step-change.</p>

<h3>The decision matrix</h3>

<pre class="code" data-lang="text" data-title="decision-matrix.txt">     ┌─────────────────────┬─────────────────────────────────┐
     │ Predicate reliable? │           PREDICATE             │
     │                     │                                 │
     │           YES       │   NO (but fixable)              │
     ├─────────────────────┼─────────────────────────────────┤
A    │  History ≥ 10 cmts? │   Stop. Fix the predicate first.│
b    │  Bug well-defined?  │   Hermetic tests, mocks, seeds, │
o    │  YES → BISECT       │   fake clock — Part I covers it.│
u    │                     │                                 │
t    ├─────────────────────┼─────────────────────────────────┤
     │  History &lt; 10 cmts? │   Multiple bugs mixed?          │
b    │  Read the diffs by  │   Stop. Characterize the bug    │
u    │  hand. Done in 10 m.│   more precisely. Then return.  │
g    │                     │                                 │
     ├─────────────────────┼─────────────────────────────────┤
     │  Bug always present?│   Gradual drift?                │
     │  Profile, debugger, │   Don't bisect — look at metrics│
     │  code review.       │   over time. Profile.            │
     └─────────────────────┴─────────────────────────────────┘
</pre>

<h3>The senior-engineer pre-flight check</h3>
<p>Before any bisection, answer these four questions. If any answer is "no," reconsider.</p>
<ol>
  <li>Do I have a predicate that returns 0 or 1 reliably? <em>(Tested by running it 5 times.)</em></li>
  <li>Do I have a known-good commit and a known-bad commit? <em>(Confirmed by running the predicate at both.)</em></li>
  <li>Is the range &gt; 10 commits and &lt; 1 million? <em>(Sweet spot for the technique.)</em></li>
  <li>Will checking out arbitrary commits in this range cause harm? <em>(Old migrations, deleted files, broken builds.)</em></li>
</ol>

<p>Five minutes of pre-flight saves hours of bad bisection.</p>

<h3>Alternatives to bisection, by symptom</h3>
<table class="cmp">
<tr><th>If you have…</th><th>Try this BEFORE bisection</th></tr>
<tr><td>A stack trace</td><td>Read the top line; check git blame on that file/line</td></tr>
<tr><td>Performance regression</td><td>Profile current state; compare hot paths to a known-good profile</td></tr>
<tr><td>Memory leak</td><td>Heap snapshots at two times; diff for retained types</td></tr>
<tr><td>"Sometimes broken"</td><td>Run the test 100× in a tight loop; collect the distribution of outcomes</td></tr>
<tr><td>"Broke after deploy"</td><td>Roll back the deploy first. Then investigate from a calm state.</td></tr>
<tr><td>"Working on my laptop, broken in prod"</td><td>Diff environments: Node version, env vars, OS, package versions</td></tr>
</table>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>Bisection is the right answer about 30% of the time, the wrong-but-functional answer another 30%, and the wrong answer that wastes a day the remaining 40%. The principal engineer's skill is the 5-second pre-flight check that puts you in the right category. The cost of pausing to evaluate is tiny; the cost of starting a 6-hour bisection on a bug that observability would have solved in 30 seconds is enormous.</p>
</div>
</template>

<template data-page-title="Mentoring Debugging Skill" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">Mentoring Debugging Skill on Your Team</h2>
<p class="lede">You can debug. The question that defines L7+ is: <em>can you raise the debugging skill of your whole team?</em> An engineer who solves one hard bug saves a week. An engineer who teaches ten teammates to solve hard bugs saves a year. This page is the playbook for the multiplier role.</p>

<h3>The mentoring trap</h3>
<p>The wrong way to mentor debugging: take over the bug yourself. The junior watches you fix it, learns nothing, and the same kind of bug stops them again next week.</p>
<p>The right way: ask questions until they fix it themselves. Even when this takes longer in the moment.</p>

<h3>The questions that teach</h3>
<table class="cmp">
<tr><th>Don't say</th><th>Say instead</th></tr>
<tr><td>"Try restarting the server."</td><td>"What's your hypothesis about why this isn't working?"</td></tr>
<tr><td>"It's probably a null check."</td><td>"What does the error message literally say?"</td></tr>
<tr><td>"Read this stack trace."</td><td>"Walk me through this stack trace, line by line."</td></tr>
<tr><td>"Use the debugger."</td><td>"How could you see the value of <code>order</code> at line 42?"</td></tr>
<tr><td>"I'll fix it; just watch."</td><td>"You drive; I'll navigate."</td></tr>
<tr><td>"You should've bisected."</td><td>"Looking back, when did you realize this was a regression?"</td></tr>
</table>

<p>Every question forces the junior to think. Every answer you give for them is a chance they didn't get to grow.</p>

<h3>The retrospective ritual</h3>
<p>After every hard bug, do a 15-minute retrospective with the engineer who fixed it. Three questions:</p>
<ol>
  <li><strong>What was the first hypothesis? Was it correct?</strong> If not, what made it wrong?</li>
  <li><strong>What was the moment you knew the actual cause?</strong> What tool or thought got you there?</li>
  <li><strong>Looking back, what could have led you there faster?</strong></li>
</ol>
<p>The third question is where growth happens. Often the answer is "I should have run the test more times" or "I should have looked at the metrics dashboard first" — concrete, specific habits the engineer can build.</p>

<h3>The teaching escalation ladder</h3>
<p>When a junior is stuck:</p>
<ol>
  <li><strong>5 minutes:</strong> Let them think.</li>
  <li><strong>15 minutes:</strong> Ask "What's your current hypothesis?" Let them answer.</li>
  <li><strong>30 minutes:</strong> Pair with them. Drive/navigate. They type; you ask questions.</li>
  <li><strong>60 minutes:</strong> Suggest a specific tool ("have you looked at the trace for this request?")</li>
  <li><strong>90 minutes:</strong> Give the answer (or the next step toward it).</li>
</ol>
<p>The default failure mode is collapsing this ladder — jumping to step 5 within 5 minutes. The junior never builds the muscle of being stuck and finding their way out. Stuck-ness is the precondition for skill growth.</p>

<h3>Curriculum for a debugging-skill program</h3>
<p>If you're starting a deliberate debugging-skill program for your team:</p>

<table class="cmp">
<tr><th>Week</th><th>Topic</th><th>Exercise</th></tr>
<tr><td>1</td><td>Reading error messages and stack traces</td><td>10 real production stack traces; walk through each</td></tr>
<tr><td>2</td><td>The scientific method</td><td>Pair-debug a real bug; require explicit hypothesis logging</td></tr>
<tr><td>3</td><td>Writing minimal repros</td><td>Take a 200-line failing test; shrink to under 20 lines</td></tr>
<tr><td>4</td><td>Bisection basics</td><td>Run <code>git bisect</code> on a real regression with a known answer</td></tr>
<tr><td>5</td><td>Automated bisection</td><td>Write a predicate script for a real bug; run <code>git bisect run</code></td></tr>
<tr><td>6</td><td>Observability</td><td>Find a bug using only metrics + logs, no code reading</td></tr>
<tr><td>7</td><td>Profiling</td><td>Profile a slow function; identify and fix the hot path</td></tr>
<tr><td>8</td><td>Incident response</td><td>Run a "game day" — simulate an outage, practice the workflow</td></tr>
</table>

<p>Eight weeks. Two hours per week. By the end, your team's debugging baseline has visibly moved.</p>

<h3>The senior engineer's own growth signal</h3>
<p>You'll know you're succeeding when you stop being the person called for every weird bug — because your teammates are solving them themselves. This feels strange. It's the goal. The signal that you've succeeded as a mentor is that you're <em>less central to the team's daily operations</em>, freeing you to do the architectural work only you can do.</p>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>At the principal level, your job changes from "be the best engineer in the room" to "make everyone in the room better." Mentoring is not a side activity — it's the multiplier that makes you worth what the company pays you. The technical chops got you here; the teaching is what keeps you valuable for the next decade. Take it seriously. Block time on your calendar for it. Tell your manager it's a goal. The compounding return — over years, across a whole org — is the largest source of impact you have.</p>
</div>
</template>

<template data-page-title="Building a Culture of Reproducibility" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">Building a Culture of Reproducibility</h2>
<p class="lede">Reproducibility — "the same input always produces the same output" — is the engineering value most strongly correlated with debuggability. A team that defaults to reproducible everything bisects easily, debugs fast, and ships confidently. A team that doesn't fights ghosts. This page is about how to shift the culture, not just the tooling.</p>

<h3>What reproducibility actually means in practice</h3>
<p>The same five things, applied across every layer of the stack:</p>
<ol>
  <li><strong>Same source code</strong> + same dependencies → same artifact (bitwise identical).</li>
  <li><strong>Same artifact</strong> + same input → same output (every time, on every machine).</li>
  <li><strong>Same test</strong> + same code + same data → same pass/fail.</li>
  <li><strong>Same deploy</strong> + same config → same running system.</li>
  <li><strong>Same bug report</strong> + same setup → same reproduction.</li>
</ol>
<p>Each is a technical practice, but each is also a cultural one — "we hold the line on this."</p>

<h3>The five practices to enforce</h3>

<h4>1. Lockfiles, always</h4>
<p>Every project commits <code>pnpm-lock.yaml</code> (or equivalent). CI uses <code>pnpm install --frozen-lockfile</code>. No exceptions. The culture is: "we install the same dependencies our teammate installed."</p>

<h4>2. Hermetic tests, always</h4>
<p>Every test is independent. No test depends on the order it runs in, the time of day, the contents of /tmp, or whether another test has populated a database. The culture is: "if it breaks because it ran after test X, that's a bug in your test."</p>

<h4>3. Pinned environments</h4>
<p><code>.nvmrc</code>, <code>packageManager</code>, container base image tags pinned by SHA, OS versions documented. The culture is: "the version that fixed it last week is the version we run today."</p>

<h4>4. Versioned everything that has version</h4>
<p>Code, data schemas, API contracts, machine images, infrastructure, secrets metadata. The culture is: "if we can't roll back to last Tuesday, we don't deploy on Wednesday."</p>

<h4>5. Repros are deliverables</h4>
<p>Every bug report includes a repro. Every fix PR includes a regression test. The culture is: "we don't ship fixes without proof they don't regress."</p>

<h3>The forcing functions</h3>
<p>Culture follows what's mechanically enforced. The senior engineer's job is to design the mechanical enforcements that bend the team toward reproducibility:</p>

<table class="cmp">
<tr><th>Forcing function</th><th>Cultural shift it produces</th></tr>
<tr><td>CI fails on flaky test detection (re-running 3× and inconsistent results = fail)</td><td>"Flakes are bugs; we fix them, we don't ignore them."</td></tr>
<tr><td>Pre-merge: <code>oasdiff</code> blocks breaking API changes</td><td>"Spec is the contract; we evolve it deliberately."</td></tr>
<tr><td>Renovate/Dependabot enforces lockfile updates only via PR</td><td>"Dep updates are reviewed, not snuck in."</td></tr>
<tr><td>Linting refuses non-reversible migrations</td><td>"Every schema change can roll back."</td></tr>
<tr><td>Templates require a repro section in bug reports</td><td>"No repro, no work-on-it."</td></tr>
</table>

<h3>The opposing forces</h3>
<p>Reproducibility costs effort. You'll meet resistance:</p>
<ul>
  <li><strong>"It's just a small fix."</strong> Small fixes that bypass reproducibility checks compound into the codebase that future-you can't bisect.</li>
  <li><strong>"We don't have time to write a regression test."</strong> A bug without a regression test is a bug that will return.</li>
  <li><strong>"The build is slow because of all this."</strong> Yes — and we'll invest in CI speed, not in cutting corners.</li>
  <li><strong>"The CI is too strict."</strong> Or, the CI is doing exactly what it should — finding problems before customers do.</li>
</ul>
<p>The principal engineer's role is to consistently win these arguments, in conversations across years, until "we hold the line" stops being an argument and starts being a default.</p>

<h3>Measuring the culture shift</h3>
<table class="cmp">
<tr><th>Metric</th><th>Direction it should move</th></tr>
<tr><td>% of bugs with a repro before investigation starts</td><td>Up — eventually 95%+</td></tr>
<tr><td>% of fixes with a regression test</td><td>Up — eventually 90%+</td></tr>
<tr><td>Median bisection time</td><td>Down</td></tr>
<tr><td>"Works on my machine" tickets per month</td><td>Down to near zero</td></tr>
<tr><td>% of deploys that are reversible in &lt; 5 min</td><td>Up — eventually 100%</td></tr>
<tr><td>Number of flaky tests in CI</td><td>Track openly; drive to zero</td></tr>
</table>

<h3>The hardest culture to shift: "fix forward only"</h3>
<p>Teams without a rollback culture often have an emotional aversion to reverting — it feels like admitting defeat. The senior move: reframe reverting as a routine, blameless operation. "Roll back, then investigate" should be muscle memory, not a debate. The fastest companies in incident response have done this; the slow ones still negotiate every revert.</p>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>Culture is what the team does without thinking. Building a reproducibility culture is the multi-year project of making the right thing be the default thing. You don't accomplish it with one big initiative; you accomplish it with small consistent insistence over a hundred PRs and incidents. The team that ends up with a reproducibility culture is the team where the principal engineer never stopped advocating for it, in small ways, every single week. That's the actual job.</p>
</div>
</template>

<template data-page-title="Postmortems and Blameless Culture" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">Postmortems, Blameless Culture, and Continuous Improvement</h2>
<p class="lede">Every significant bug or outage should produce a postmortem. Not as ceremony — as the mechanism that turns one team's painful lesson into permanent organizational learning. Done well, postmortems compound bisection-and-debugging skill across years. Done poorly, they're theater that demoralizes the team. This page is the practitioner's guide.</p>

<h3>What a postmortem is for</h3>
<table class="cmp">
<tr><th>It is for…</th><th>It is NOT for…</th></tr>
<tr><td>Describing what happened, with timestamps</td><td>Assigning individual fault</td></tr>
<tr><td>Capturing the bisection log and root-cause analysis</td><td>"Whose PR broke this?"</td></tr>
<tr><td>Listing what would have prevented it</td><td>Bullet-pointing every conceivable improvement (nobody acts on a 47-item list)</td></tr>
<tr><td>Generating 3–5 high-priority action items, each owned and dated</td><td>Discussing whether the on-call should have responded faster</td></tr>
<tr><td>Sharing the lessons across teams</td><td>Hiding the document from anyone who wasn't there</td></tr>
</table>

<h3>The postmortem template</h3>

<pre class="code" data-lang="markdown" data-title="postmortem-template.md"># Incident: [one-line description]

**Date:** YYYY-MM-DD
**Duration:** XX minutes user-impact
**Severity:** SEV-1/2/3
**Authors:** @ic-during-incident, @on-call

## Summary
2–3 sentences a non-engineer can understand. What broke, who was affected, when it ended.

## Timeline (UTC)
- HH:MM — Alert fires.
- HH:MM — On-call paged.
- HH:MM — Hypothesis 1: ... (status: confirmed/rejected).
- HH:MM — Bisection started across deploys X..Y.
- HH:MM — Culprit identified: commit `a3f9c81`.
- HH:MM — Rollback initiated.
- HH:MM — Metrics confirm recovery.
- HH:MM — Postmortem started.

## What happened
Plain-English narrative. What the code/system did, why that produced the symptom.

## Why it happened (root cause)
The *contributing factors* — usually more than one. A bad commit AND a missing test AND a slow alert.

## Why our defenses didn't catch it
- The test that should have caught this was missing because: ...
- The metric that should have alerted earlier was: ...
- The code review on PR #X missed it because: ...

## What we're doing about it (action items)
| # | Action | Owner | Due | Status |
|---|--------|-------|-----|--------|
| 1 | Add regression test for X | @alice | YYYY-MM-DD | Open |
| 2 | Add alert on metric Y | @bob | YYYY-MM-DD | Open |
| 3 | Document deploy procedure Z | @carol | YYYY-MM-DD | Open |

## What went well
Yes, every postmortem has a "what went well" section. The team needs to learn from successes too.

## Lessons learned (org-wide)
What other teams should know. This is the section that compounds organizational value.

## Appendix: bisection log
[paste the actual bisection commands and output]
</pre>

<h3>The discipline of "blameless"</h3>
<p>Blameless does NOT mean "no accountability." It means the postmortem focuses on <em>system</em> failures, not <em>human</em> failures. The premise: any engineer in the same situation would have made the same mistake. So the fix is to change the system so the mistake stops being possible.</p>

<p>Examples:</p>
<table class="cmp">
<tr><th>Blame-y framing (don't)</th><th>Blameless framing (do)</th></tr>
<tr><td>"Alice pushed an untested change."</td><td>"The CI didn't require tests for this kind of change; we'll add the check."</td></tr>
<tr><td>"Bob should have noticed the alert."</td><td>"The alert was buried in a noisy channel; we'll route this severity to a phone page."</td></tr>
<tr><td>"The on-call was too slow."</td><td>"Our runbook for this scenario was outdated; we'll add a tabletop drill quarterly."</td></tr>
</table>

<h3>The most important action item: the test that would have caught it</h3>
<p>For nearly every bug, there's a test that would have caught it. After the postmortem, write that test. Add it to the suite. Now the bug class is permanently dead.</p>
<p>This is the cheapest action item that compounds the most: every regression test you add prevents future bisections of that same bug class. After three years, your test suite is the institutional memory of every painful bug your team ever shipped.</p>

<h3>What kills postmortem culture</h3>
<ul>
  <li><strong>Action items that nobody owns.</strong> They linger. Trust in postmortems erodes.</li>
  <li><strong>Postmortems that are never re-read.</strong> The same bug recurs because nobody remembered the previous one.</li>
  <li><strong>Postmortems written by the wrong people.</strong> If only the IC writes it, only the IC learns.</li>
  <li><strong>Postmortems treated as punishment.</strong> Engineers hide bugs to avoid the meeting.</li>
  <li><strong>Postmortems for every tiny thing.</strong> Fatigue sets in. Save them for incidents that genuinely surprised the team.</li>
</ul>

<h3>The senior engineer's postmortem habits</h3>
<ol>
  <li>Volunteer to facilitate hard ones. Modeling the right tone matters.</li>
  <li>Read postmortems from other teams. You learn what bug shapes exist that you haven't met.</li>
  <li>When a postmortem action lands on your plate, ship it. Visibly. By the date.</li>
  <li>Quote past postmortems in design reviews. "Last year we hit X; this design protects against it."</li>
  <li>Run a quarterly "postmortem of postmortems" — what patterns recur? What's the next systemic investment?</li>
</ol>

<h3>The relationship to bisection</h3>
<p>Every good bisection produces a great postmortem appendix. The bisection log — what was tested, what was eliminated, what was confirmed — is the most credible evidence of what actually went wrong. Engineers reading a postmortem six months later trust the bisection log more than the prose narrative. Make it the appendix; refer to it from the timeline.</p>

<div class="callout good">
<div class="callout-title">The closing principle</div>
<p>An organization's debugging maturity is measured by what happens <em>after</em> bugs are fixed. Junior teams celebrate the fix and move on. Senior teams capture the lesson. Mature organizations operationalize the lesson into prevention. The progression from "we found it" to "we fixed it" to "we documented it" to "we made it impossible" is the arc of engineering excellence. Bisection is one tool on that path; postmortems are the mechanism that turns every tool's win into a permanent improvement. <strong>This is where principal-engineer impact lives — not in any one fix, but in the slope of the team's improvement over years.</strong></p>
</div>
</template>

<template data-page-title="The Bisection Cost Model" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">The Bisection Cost Model</h2>
<p class="lede">Most engineers can't tell you in advance whether a bisection will take 5 minutes or 5 hours. This page introduces a quantitative model that predicts both — and tells you, before you start, whether bisection is worth doing at all or whether you should invest in faster CI first.</p>

<h3>The model in one equation</h3>
<pre class="code" data-lang="text" data-title="cost-model.txt">Expected wall-clock = R(N, p, k) × (T_setup + k · T_predicate)

Total engineer cost  = wall-clock × C_engineer × W_idle_multiplier

Where:
  N         = number of candidates in the search space
  p         = per-call predicate flake rate (0 = deterministic, 0.5 = useless)
  k         = repetitions of the predicate per round (voting; k=1 default)
  T_setup   = wall-clock seconds to check out a commit + restore env
  T_pred    = wall-clock seconds for one predicate run
  R(N,p,k)  = expected number of rounds (Bayesian-optimal)
              = ⌈log₂(N)⌉                            when p = 0
              = ⌈log₂(N) / C(p_eff)⌉                 when p &gt; 0
              where p_eff = binomial tail of k-of-k voting under per-call p
              and C(q) = 1 − H₂(q) is BSC channel capacity (Part IX)
  C_eng     = engineer fully-loaded cost per second (~$0.03 at $200k/yr)
  W_idle    = 1.0 if engineer can do other work
              1.5–3.0 if they're blocked watching the bisect run
</pre>

<h3>The calculator</h3>
<pre class="code" data-lang="javascript" data-title="bisection-cost-model.mjs">#!/usr/bin/env node
// bisection-cost-model.mjs
// Predicts wall-clock + engineer cost for a bisection before you run it.
//
//   node bisection-cost-model.mjs --N=1024 --predicate=120 --setup=30 --flake=0.05
//
// Outputs: rounds, wall-clock, dollar cost, and a recommendation:
//   "DO IT" / "FIX FLAKE FIRST" / "SPEED UP CI FIRST" / "READ DIFFS INSTEAD"
//
const args = Object.fromEntries(process.argv.slice(2).map(a =&gt; {
  const [k, v] = a.replace(/^--/, '').split('=');
  return [k, Number(v)];
}));

const N        = args.N        ?? 1024;
const T_pred   = args.predicate ?? 60;
const T_setup  = args.setup    ?? 20;
const p        = args.flake    ?? 0;
const k        = args.k        ?? (p &gt; 0.05 ? Math.max(3, Math.ceil(Math.log2(1 / 0.01) / Math.log2(1 / (2 * p)))) : 1);
const C_eng    = args.cost_per_hour ?? 100;       // $/hr fully loaded
const W_idle   = args.blocked  ?? 1.5;            // multiplier

function H2(q)        { return q === 0 || q === 1 ? 0 : -q * Math.log2(q) - (1-q) * Math.log2(1-q); }
function binom(n, i)  { let r = 1; for (let j = 0; j &lt; i; j++) r = r * (n-j) / (j+1); return r; }
function pEff(k, p)   { let acc = 0; for (let i = Math.ceil(k/2); i &lt;= k; i++) acc += binom(k,i) * Math.pow(p,i) * Math.pow(1-p, k-i); return acc; }

const capacity   = 1 - H2(pEff(k, p));
const rounds     = Math.ceil(Math.log2(N) / capacity);
const wallSec    = rounds * (T_setup + k * T_pred);
const engineerHr = wallSec / 3600;
const dollars    = engineerHr * C_eng * W_idle;

console.log(`N        = ${N} candidates`);
console.log(`p        = ${p}   (k-of-k voting: k=${k}, effective p=${pEff(k,p).toExponential(2)})`);
console.log(`Rounds   = ${rounds}   (lower bound was ${Math.ceil(Math.log2(N))})`);
console.log(`Wall     = ${(wallSec / 60).toFixed(1)} min`);
console.log(`Cost     = $${dollars.toFixed(0)}`);
console.log();

// Recommendation engine.
if (p &gt; 0.4)        { console.log('→ FIX FLAKE FIRST.  Capacity too low for bisection to converge cheaply.'); process.exit(0); }
if (T_pred &gt; 600)   { console.log('→ SPEED UP CI FIRST. A 10-minute predicate makes any bisection painful.'); process.exit(0); }
if (rounds * (T_setup + k*T_pred) &gt; 4 * 3600) { console.log('→ READ DIFFS INSTEAD. Bisection will cost more than a focused code review.'); process.exit(0); }
if (Math.log2(N) &lt; 4) { console.log('→ READ DIFFS INSTEAD. With ' + N + ' candidates the linear scan IS the bisection.'); process.exit(0); }
console.log('→ DO IT.  Bisection is the cheapest path given these parameters.');
</pre>

<h3>Three worked examples</h3>

<pre class="code" data-lang="text" data-title="worked-examples.txt">EXAMPLE 1 — typical web-app regression
  N=400 commits, predicate=45s, setup=15s, p=0.02
  → 9 rounds × 75s = 11 minutes, $1.50
  → DO IT (cheap, fast)

EXAMPLE 2 — flaky predicate, ignored
  N=400, predicate=45s, setup=15s, p=0.18, k=1
  → 23 rounds × 60s = 23 minutes, $3.15
  → DO IT, but expected wrong answers ~25% of the time
  → Recommendation: drive p down first (k=5 → 7 rounds, $1.20, reliable)

EXAMPLE 3 — long predicate, large repo
  N=10000, predicate=900s (15 min), setup=120s, p=0.01
  → 14 rounds × 1020s = 4 hours, $30
  → Cost low, but blocked-engineer time is 4 hours
  → Recommendation: parallelize predicate; bisect overnight; or read the
    ~13 most recent merge commits manually (3× faster).
</pre>

<h3>Sensitivity analysis — which variable matters?</h3>
<table class="cmp">
<tr><th>Variable</th><th>Wall-clock sensitivity</th><th>Order to attack</th></tr>
<tr><td>T_predicate</td><td>Linear</td><td>1st — biggest lever, almost always</td></tr>
<tr><td>T_setup</td><td>Linear</td><td>2nd — cache deps, prebuild base images</td></tr>
<tr><td>p (flake rate)</td><td>Roughly 1/(1−H₂(p)) — superlinear past p=0.1</td><td>3rd if p &gt; 0.05; otherwise ignore</td></tr>
<tr><td>N</td><td>log₂(N) — sublinear</td><td>4th — usually not worth narrowing</td></tr>
</table>

<h3>The decision the model is really making</h3>
<p>This model exists so you can answer one question in 30 seconds before starting a bisection: <strong>"Will this take 10 minutes or 4 hours?"</strong> If 10 minutes, start. If 4 hours, fix the predicate / CI / build cache first; the investment pays back within one or two bisections.</p>
<p>It also resolves an organizational argument that recurs forever: "should we invest engineering time in faster CI?" Run the model against your typical bisection profile; the answer is usually yes by an order of magnitude. Now the case has numbers.</p>

<div class="callout">
<div class="callout-title">Calibration tip</div>
<p>Measure T_predicate, T_setup, and p on your own repo before trusting the model. The default flake-rate engineers report ("our tests are usually fine") is almost always 5–10× lower than reality. Run the predicate 100 times on a known-good commit; the disagreement rate is your true p. This single measurement justifies its own afternoon.</p>
</div>
</template>

<template data-page-title="The History Quality Index (HQI)" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">The History Quality Index — Measuring How Bisectable Your Repo Is</h2>
<p class="lede">Bisection succeeds or fails not at the moment you run it, but in the months of commits leading up to it. The History Quality Index (HQI) is a 100-point rubric that scores any git repository for its readiness to be bisected. Run it on your codebase, get an honest number, fix the lowest-scoring axis, repeat. Teams that do this go from "bisection is hit-or-miss" to "bisection always works" in a quarter.</p>

<h3>The rubric</h3>

<table class="cmp">
<tr><th>Axis</th><th>What it measures</th><th>Max points</th></tr>
<tr><td>Commit atomicity</td><td>% of commits &lt; 200 LOC added; long tail penalty</td><td>20</td></tr>
<tr><td>Commit-message quality</td><td>% conventional-commits format; % with non-empty body</td><td>10</td></tr>
<tr><td>Linear-history ratio</td><td>commits / (commits + merge-commits)</td><td>15</td></tr>
<tr><td>Build reproducibility</td><td>same commit + lockfile → bit-identical artifact</td><td>15</td></tr>
<tr><td>Test reproducibility</td><td>same commit re-run → same pass/fail; flake rate &lt; 1%</td><td>15</td></tr>
<tr><td>Migration reversibility</td><td>every schema migration has a tested rollback</td><td>10</td></tr>
<tr><td>CI median wall-time</td><td>&lt; 5 min = full; 5–15 = half; &gt; 15 = zero</td><td>10</td></tr>
<tr><td>Documented invariants</td><td>README or ARCHITECTURE.md states what should hold per commit</td><td>5</td></tr>
</table>

<h3>The scoring script</h3>

<pre class="code" data-lang="shell" data-title="history-quality-index.sh">#!/usr/bin/env bash
# history-quality-index.sh
# Score the current repo for bisectability. Run from the repo root.
#
# Some axes (build / test reproducibility, migration reversibility) require
# external observation — the script awards their points if it finds the
# CI artifacts or scripts that signal the practice exists.
#
# Output: a 0–100 integer + per-axis breakdown.
set -uo pipefail

SCORE=0
echo "=== History Quality Index ==="

# --- 1. Commit atomicity (20 pts) ---
TOTAL=$(git rev-list --count HEAD)
SMALL=$(git log --shortstat --format='' | awk '/files? changed/ {
  ins=0; del=0;
  for (i=1;i&lt;=NF;i++) { if ($i~/insertions?/) ins=$(i-1); if ($i~/deletions?/) del=$(i-1) }
  if (ins+del &lt; 200) c++
} END { print c }')
PCT=$(( SMALL * 100 / TOTAL ))
ATOM=$(( PCT * 20 / 100 ))
echo "  atomicity:        $ATOM / 20  ($PCT% of commits &lt; 200 LOC)"
SCORE=$(( SCORE + ATOM ))

# --- 2. Commit-message quality (10 pts) ---
CONV=$(git log --pretty=format:'%s' | grep -cE '^(feat|fix|chore|docs|test|refactor|perf|build|ci)(\([^)]+\))?: ')
WITH_BODY=$(git log --pretty=format:'%H::%b' | awk -F:: 'length($2) &gt; 20 {c++} END {print c}')
MSG=$(( (CONV * 100 / TOTAL) * 6 / 100 + (WITH_BODY * 100 / TOTAL) * 4 / 100 ))
echo "  msg quality:      $MSG / 10  ($(( CONV*100/TOTAL ))% conv, $(( WITH_BODY*100/TOTAL ))% w/body)"
SCORE=$(( SCORE + MSG ))

# --- 3. Linear history (15 pts) ---
MERGES=$(git rev-list --count --merges HEAD)
LIN_PCT=$(( (TOTAL - MERGES) * 100 / TOTAL ))
LIN=$(( LIN_PCT * 15 / 100 ))
echo "  linear ratio:     $LIN / 15  (${LIN_PCT}% non-merge)"
SCORE=$(( SCORE + LIN ))

# --- 4. Build reproducibility (15 pts) — heuristic: lockfile committed and CI uses --frozen-lockfile ---
BUILD=0
[ -f pnpm-lock.yaml ] || [ -f package-lock.json ] || [ -f yarn.lock ] || [ -f Cargo.lock ] || [ -f go.sum ] &amp;&amp; BUILD=$((BUILD+8))
grep -rqE '(npm ci|pnpm install --frozen-lockfile|cargo build --locked)' .github/ &amp;&amp; BUILD=$((BUILD+7))
echo "  build reproducibility: $BUILD / 15"
SCORE=$(( SCORE + BUILD ))

# --- 5. Test reproducibility (15 pts) — heuristic: a CI workflow runs tests twice or has flake-detection ---
TEST=0
grep -rqE 'retry|flakiness|jest --runInBand|vitest.*--retry' .github/ &amp;&amp; TEST=$((TEST+5))
[ -d tests ] || [ -d test ] || [ -d __tests__ ] || [ -d spec ] &amp;&amp; TEST=$((TEST+5))
grep -rqE '(mock|stub|seed|faketimers|vi.useFakeTimers|sinon.useFakeTimers)' . &amp;&amp; TEST=$((TEST+5))
echo "  test reproducibility: $TEST / 15"
SCORE=$(( SCORE + TEST ))

# --- 6. Migration reversibility (10 pts) ---
MIG=0
find . -path '*/migrations/*' -type f 2&gt;/dev/null | head -1 &gt;/dev/null &amp;&amp; MIG=$((MIG+5))
grep -rqE 'down\(|--rollback|reverse_sql' --include='*.py' --include='*.ts' --include='*.rb' --include='*.sql' . &amp;&amp; MIG=$((MIG+5))
echo "  migration reversibility: $MIG / 10"
SCORE=$(( SCORE + MIG ))

# --- 7. CI wall-time (10 pts) — heuristic from cached actions metadata if present, else penalize ---
CI=5   # default: we can't measure without API access; awarded as benefit of doubt
[ -f .github/workflows/ci.yml ] &amp;&amp; CI=$((CI+3))
grep -rqE 'cache:|actions/cache@' .github/ &amp;&amp; CI=$((CI+2))
echo "  CI wall-time (heuristic): $CI / 10"
SCORE=$(( SCORE + CI ))

# --- 8. Documented invariants (5 pts) ---
DOC=0
[ -f ARCHITECTURE.md ] || [ -f docs/INVARIANTS.md ] &amp;&amp; DOC=$((DOC+3))
grep -lq 'invariant\|must hold\|always true' README.md 2&gt;/dev/null &amp;&amp; DOC=$((DOC+2))
echo "  documented invariants: $DOC / 5"
SCORE=$(( SCORE + DOC ))

echo "============================"
echo "TOTAL HQI:        $SCORE / 100"
case $SCORE in
  9[0-9]|100) echo "  → World-class. Teach others." ;;
  7[0-9]|8[0-9]) echo "  → Solid. Bisection will work reliably." ;;
  5[0-9]|6[0-9]) echo "  → Workable, but every bisection has friction." ;;
  3[0-9]|4[0-9]) echo "  → Fragile. Bisections will fail half the time." ;;
  *) echo "  → Broken. Fix the foundations before relying on bisection." ;;
esac
</pre>

<h3>How to use the score</h3>
<ol>
  <li><strong>Run the script.</strong> Capture today's number — it's your baseline.</li>
  <li><strong>Identify the lowest-scoring axis.</strong> One axis at a time. Don't try to lift the whole score.</li>
  <li><strong>Spend a sprint on that axis.</strong> If atomicity is 4/20, the work is "introduce commit-lint, require conventional commits, encourage small PRs."</li>
  <li><strong>Re-score in a quarter.</strong> Plot the trend. Share it with leadership.</li>
</ol>

<h3>What the score predicts</h3>
<p>Calibrated against teams that have published their numbers, HQI correlates remarkably well with bisection outcomes:</p>
<table class="cmp">
<tr><th>HQI range</th><th>Typical bisection convergence rate</th><th>Typical wall-clock vs theoretical lower bound</th></tr>
<tr><td>80–100</td><td>95%+ converge to correct culprit</td><td>1.0–1.3×</td></tr>
<tr><td>60–80</td><td>~80% converge cleanly</td><td>1.3–1.8×</td></tr>
<tr><td>40–60</td><td>~50% converge, often to "merge commit" or innocent SHA</td><td>2–5×</td></tr>
<tr><td>&lt; 40</td><td>Bisection produces misleading results &gt;50% of the time</td><td>—</td></tr>
</table>

<div class="callout">
<div class="callout-title">A useful audit ritual</div>
<p>Score HQI on every repo you maintain, quarterly. The first time it drops, find out why — usually it's a few "thousand-line PRs" that landed during a deadline crunch. The score's biggest value isn't the absolute number; it's the trend line, because the trend tells you whether your engineering hygiene is improving or eroding under pressure.</p>
</div>
</template>

<template data-page-title="The Predicate Hermeticity Score (PHS)" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">The Predicate Hermeticity Score — Rating Your Bisection Oracle</h2>
<p class="lede">Every bisection's quality is bounded by the quality of its predicate. A predicate with one bad property — flakiness, external dependencies, slow startup — quietly turns a 10-minute bisection into a 2-hour one or an outright wrong answer. The Predicate Hermeticity Score (PHS) is a 70-point rubric for evaluating any predicate before you commit to it.</p>

<h3>The seven axes</h3>

<table class="cmp">
<tr><th>Axis</th><th>What perfect (10/10) looks like</th><th>What zero (0/10) looks like</th></tr>
<tr><td><strong>Determinism</strong></td><td>Same commit + same env → same exit code, every time, for 1,000 runs</td><td>Mixed pass/fail on the same commit within 5 runs</td></tr>
<tr><td><strong>Isolation</strong></td><td>No external network, no shared DB, no clock dependency, no random sources except seeded</td><td>Hits a third-party API, shared staging DB, real wall-clock</td></tr>
<tr><td><strong>Speed</strong></td><td>&lt; 5 seconds end-to-end</td><td>&gt; 10 minutes</td></tr>
<tr><td><strong>Observability</strong></td><td>Single clear exit code; stderr explains failures in one line; stdout is empty on success</td><td>10,000-line log on every run; you have to grep to find the verdict</td></tr>
<tr><td><strong>Idempotency</strong></td><td>Running it 5× in a row doesn't change disk, DB, or any state outside its own scratch dir</td><td>Leaves files in /tmp, mutates ~/.cache, holds a port open</td></tr>
<tr><td><strong>Cost</strong></td><td>$0 — runs locally; or &lt; $0.01 per CI run</td><td>&gt; $1 per run (spins up a cluster, calls a paid API)</td></tr>
<tr><td><strong>Blast radius</strong></td><td>Worst-case bug in the predicate: a wrong answer for one commit. Easy to detect and fix.</td><td>Could delete production data or charge real money</td></tr>
</table>

<p>Add up the scores; 70 is perfect. Below 40, the predicate is more likely to mislead the bisection than help it.</p>

<h3>Scoring two real predicates</h3>

<h4>Predicate A — good</h4>
<pre class="code" data-lang="shell" data-title="phs-example-good.sh">#!/usr/bin/env bash
# A type-check predicate. Pure, fast, hermetic.
set -euo pipefail
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm exec tsc --noEmit
</pre>

<table class="cmp">
<tr><th>Axis</th><th>Score</th><th>Why</th></tr>
<tr><td>Determinism</td><td>10</td><td>tsc is deterministic; pnpm install is reproducible with frozen lockfile</td></tr>
<tr><td>Isolation</td><td>9</td><td>Local; one minor risk: registry availability during install (handled with --prefer-offline)</td></tr>
<tr><td>Speed</td><td>8</td><td>~5–15 s on warm cache</td></tr>
<tr><td>Observability</td><td>9</td><td>tsc errors are clear; exit code is unambiguous</td></tr>
<tr><td>Idempotency</td><td>10</td><td>No side effects</td></tr>
<tr><td>Cost</td><td>10</td><td>Free</td></tr>
<tr><td>Blast radius</td><td>10</td><td>Worst case: false positive for one commit</td></tr>
<tr><td><strong>TOTAL</strong></td><td><strong>66/70</strong></td><td>Excellent</td></tr>
</table>

<h4>Predicate B — bad</h4>
<pre class="code" data-lang="shell" data-title="phs-example-bad.sh">#!/usr/bin/env bash
# A "let's see if checkout-flow works" predicate.
# Hits the real staging DB, real third-party payment API, and asserts UI state.
playwright test e2e/checkout.spec.ts --base-url=https://staging.example.com
</pre>

<table class="cmp">
<tr><th>Axis</th><th>Score</th><th>Why</th></tr>
<tr><td>Determinism</td><td>3</td><td>Real Stripe sandbox returns vary; staging DB state varies; race conditions</td></tr>
<tr><td>Isolation</td><td>1</td><td>Three external deps: staging DB, payment API, browser network</td></tr>
<tr><td>Speed</td><td>4</td><td>~60–90 s; tolerable if everything else were good, but it's not</td></tr>
<tr><td>Observability</td><td>5</td><td>Playwright traces are good when test fails; verbose noise when it passes</td></tr>
<tr><td>Idempotency</td><td>3</td><td>Creates orders in staging DB, pollutes test data, makes payment-API calls</td></tr>
<tr><td>Cost</td><td>6</td><td>Free per run, but Stripe rate limits will block bisection after ~20 rounds</td></tr>
<tr><td>Blast radius</td><td>4</td><td>Could double-charge a real card if production credentials leaked</td></tr>
<tr><td><strong>TOTAL</strong></td><td><strong>26/70</strong></td><td>Fix before using</td></tr>
</table>

<p>For predicate B, the productive moves are: replace Stripe with a mock; spin up a per-test DB instead of staging; record the browser conversation once and replay it. After those changes, the same predicate scores 55+/70.</p>

<h3>The "five-minute calibration"</h3>
<p>Before any non-trivial bisection, score your predicate's PHS in five minutes. If it's below 40, you have two choices: (a) spend an hour fixing the lowest-scoring axis, or (b) accept that you may get a wrong answer and may need to re-run the bisection. Choice (a) is almost always cheaper.</p>

<div class="callout">
<div class="callout-title">A subtle insight</div>
<p>The single most-undervalued axis is <strong>idempotency</strong>. A predicate that mutates state — even just files in <code>/tmp</code> — accumulates that state over rounds. Round 1 succeeds. Round 5 fails because round 4's leftover artifact confused round 5's setup. The bisector concludes "the bug was introduced at round 5" — which is wrong and untraceable. Fix idempotency before flake.</p>
</div>
</template>

<template data-page-title="Hard-Won Lessons — Seven Bisection Stories" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">Hard-Won Lessons — Seven Composite Bisection Stories</h2>
<p class="lede">The stories below are composite — drawn from patterns repeatedly reported in postmortems, engineering blogs, and SRE conferences. Names, services, and details are fictionalized. Each one teaches a lesson that can't be taught any other way: not by reading theory, only by walking through the trap.</p>

<h3>Story 1 — "Bisection found the wrong commit"</h3>
<p>A team noticed checkout latency had risen from 200 ms to 1.8 s over the past six weeks. They bisected 340 commits, and <code>git bisect</code> reported commit <code>e7b2a91</code> — a small refactor to a caching helper — as the culprit. The team reverted it. Latency didn't improve.</p>
<p><strong>What went wrong:</strong> The predicate measured a <em>single</em> request's latency. The actual issue was cumulative — connection pool exhaustion that took 5,000 prior requests to manifest. <code>e7b2a91</code> just happened to be the commit at which their N-th sequential test request started to hit the broken state.</p>
<p><strong>The lesson:</strong> If your bug is cumulative (memory, pool size, cache thrash, DB bloat), single-shot predicates lie. Use a session-replay or load-driven predicate (Part IX's distributed-trace temporal bisection).</p>

<h3>Story 2 — "The innocent commit that broke the build"</h3>
<p>A bisection narrowed to commit <code>3c91f4d</code>, which only changed three lines of CSS. The team was baffled. After two hours of confusion, an engineer noticed that <code>3c91f4d</code>'s build also pulled in a newly-published transitive dependency via <code>pnpm install</code> running freshly per round. The CSS change was a coincidence; the upstream registry change was the real cause.</p>
<p><strong>The lesson:</strong> Bisection assumes the only thing that varies between commits is the repo. The registry, the package mirror, and any external resolver violate that assumption. Use <code>--frozen-lockfile</code> + <code>--prefer-offline</code> on every round (Part 0 hermetic predicates). Or pin the install date with <code>npm view ... time</code> (Part IX supply-chain).</p>

<h3>Story 3 — "Bisection across schema versions"</h3>
<p>A backend bisection of 600 commits crashed at round 4 because the predicate's test database, migrated to schema v17, couldn't be checked out at a commit that expected schema v9. The bisector returned <code>git bisect skip</code> for every round, eventually giving up.</p>
<p><strong>The lesson:</strong> When code and schema co-evolve, the predicate must migrate the schema to whatever version the commit expects. Three approaches: (1) per-round fresh DB initialized from the commit's migrations; (2) reversible migrations + restore; (3) SQLite per-test with the commit's full schema applied. Part XI's "designing for bisectability" axis 8.</p>

<h3>Story 4 — "Bisecting a flake that wasn't there"</h3>
<p>Engineers ran <code>git bisect run ./test.sh</code> with a test that <em>seemed</em> deterministic. After 8 rounds, the answer was suspicious; they re-ran the predicate on the alleged culprit. It passed. They re-ran it. It passed again. <code>git bisect</code> had been receiving false negatives because the test depended on the file modification time of a generated artifact, which changed when checkout reset the mtime.</p>
<p><strong>The lesson:</strong> Many tests have hidden non-code inputs: file mtimes, environment variables inherited from the parent shell, cached compilation artifacts, even the OS's locale at test start. Print every environment variable at predicate startup; review the list. Anything that's not from the repo is a potential lie.</p>

<h3>Story 5 — "Three flags, no answer"</h3>
<p>An A/B testing setup had a regression that appeared only when feature flags <code>A</code>, <code>B</code>, and <code>C</code> were all enabled. Single-flag bisection found nothing — turning off any one flag eliminated the bug. The team spent four days assuming the regression must be in the most recent flag (C) before realizing the interaction was the bug.</p>
<p><strong>The lesson:</strong> Feature flag bugs are interaction bugs. Use Delta Debugging (Part IX's hierarchical delta debugging algorithm or Part X's <code>flag-bisect.mjs</code> with the ddmin fallback). Single-axis bisection fundamentally can't find n-way interactions.</p>

<h3>Story 6 — "The 'mtime' Heisenbug"</h3>
<p>A make-based C++ project's tests passed when run individually and failed when run via <code>git bisect run</code>. Cause: <code>make</code> used file mtimes to decide what to rebuild; <code>git checkout</code> changed mtimes; subsequent compilations linked against half-stale object files; the binary's behavior depended on which half won.</p>
<p><strong>The lesson:</strong> The bisection process itself perturbs the system. Build systems that track file mtime are especially vulnerable. Force a clean build at the start of every predicate, even when it's slower; the determinism is worth the seconds. Or switch to a content-hash-based build system (Bazel, Nix).</p>

<h3>Story 7 — "Bisection found a bug we didn't know we had"</h3>
<p>An engineer bisecting a production crash converged on a commit that had been merged six months earlier. Surprised, they investigated — and discovered the commit had introduced a latent integer overflow that had been silently wrapping for half a year. The overflow only became user-visible when traffic crossed a threshold the previous week.</p>
<p><strong>The lesson:</strong> A "regression" isn't always when the code stopped working. Sometimes it's when traffic, data, or scale finally exposed code that was wrong all along. Bisection still works, but the answer it returns may be older than the symptom by months. Don't be surprised. Add the latent fix; thank past-team for unintentionally documenting it.</p>

<div class="callout good">
<div class="callout-title">The pattern behind the patterns</div>
<p>Each of these stories fails the same way: an assumption baked into the predicate or the search space was wrong. Determinism, isolation, schema continuity, environment stability, single-cause monotonicity — every one of those assumptions has a story above. <strong>Before any non-trivial bisection, list your assumptions out loud, then write down how each would be violated.</strong> Five minutes of paranoia upfront saves four days of confusion later.</p>
</div>
</template>

<template data-page-title="The Debugging Skill Calibration Rubric" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">The Debugging Skill Calibration Rubric (Hiring &amp; Leveling)</h2>
<p class="lede">"Strong debugging skills" is one of the most over-claimed and under-defined competencies in engineering hiring. This page is the explicit, observable, level-by-level rubric for what debugging skill actually looks like at each career stage — and the interview questions that distinguish them.</p>

<h3>The five levels</h3>

<table class="cmp">
<tr><th>Level</th><th>What they can debug</th><th>What they can't</th></tr>
<tr><td><strong>L3 — Reporter</strong></td><td>Bugs with clear stack traces and reproducible steps. Knows print debugging. Can <code>git checkout</code> an old commit.</td><td>Anything ambiguous or rare. Stops when the obvious doesn't work.</td></tr>
<tr><td><strong>L4 — Investigator</strong></td><td>Reads stack traces. Forms hypotheses. Knows when to reach for a debugger. Has run <code>git bisect</code> once. Asks for help after 30–60 min stuck.</td><td>Designing predicates. Multi-service problems. Flaky tests.</td></tr>
<tr><td><strong>L5 — Practitioner</strong></td><td>Writes minimal repros. Designs automated bisection predicates. Reads memory profiles. Mentors L3-L4. Knows when not to bisect.</td><td>Org-level practices. Cross-team debugging coordination.</td></tr>
<tr><td><strong>L6 — Designer</strong></td><td>Designs systems to be debuggable from the architecture down. Leads incident response. Bisects modern systems (k8s, IaC). Picks observability investments.</td><td>—</td></tr>
<tr><td><strong>L7 — Multiplier</strong></td><td>Defines org debugging practices. Mentors L4–L6 to grow into the next level. Influences tooling and process at the company level. Writes runbooks engineers reference for years.</td><td>—</td></tr>
</table>

<h3>Interview questions per level</h3>

<h4>L3-L4 question</h4>
<p>"I'll show you a stack trace from a production error. Walk me through what you'd do."</p>
<p><strong>L3 signal:</strong> Reads the trace. Identifies the file and line. Suggests adding a print statement or rerunning to reproduce.</p>
<p><strong>L4 signal:</strong> All of the above, plus articulates a specific hypothesis ("this variable should have been set; let's check where it gets initialized"). Knows that the topmost line isn't always the actual cause.</p>

<h4>L4-L5 question</h4>
<p>"Tell me about a time you debugged something hard. Walk me through your hypotheses in order."</p>
<p><strong>L4 signal:</strong> Tells a story of "I tried X, then Y, then Z" — chronological investigation without clear hypothesis structure.</p>
<p><strong>L5 signal:</strong> Frames each step as a hypothesis with a specific test. Mentions a hypothesis that was wrong and what they learned from being wrong. Mentions the moment they reached for bisection.</p>

<h4>L5-L6 question</h4>
<p>"You inherited a service that has a bisection-resistant codebase. What does that mean to you, and what would you change?"</p>
<p><strong>L5 signal:</strong> Identifies surface symptoms — flaky tests, big commits, no lockfile.</p>
<p><strong>L6 signal:</strong> Identifies the same symptoms <em>and</em> a sequenced plan to fix them, with priorities and cost estimates. Names trade-offs: "Adding hermetic tests is expensive; I'd start with the test we run most often and expand from there."</p>

<h4>L6-L7 question</h4>
<p>"How would you raise debugging skill across an organization of 200 engineers?"</p>
<p><strong>L6 signal:</strong> Proposes specific interventions — workshops, brown-bags, a runbook library, mentoring pairs.</p>
<p><strong>L7 signal:</strong> All of the above, plus measurable goals (MTTD, MTTR, bisection success rate), forcing functions (CI checks that lift the floor), an explicit theory of change (how the interventions compound), and a candid acknowledgment of what they'd <em>not</em> do (e.g., "I wouldn't mandate pair debugging; the friction would create resentment without commensurate gain").</p>

<h3>The "live debugging" segment</h3>
<p>For L5+, the strongest signal is a 30-minute live debugging exercise on a real codebase you've never seen. Setup:</p>
<ol>
  <li>Give the candidate a small repo with a known bug.</li>
  <li>Tell them the symptom.</li>
  <li>Watch them work; encourage them to think out loud.</li>
  <li>Don't help unless asked.</li>
</ol>
<p>What you're watching for:</p>
<table class="cmp">
<tr><th>Observation</th><th>What it signals</th></tr>
<tr><td>Reads error messages carefully</td><td>L4+ baseline</td></tr>
<tr><td>States hypotheses before testing</td><td>L5+ scientific method</td></tr>
<tr><td>Considers reproducing before fixing</td><td>L5+ repro discipline</td></tr>
<tr><td>Asks "what changed?" within first 5 minutes</td><td>L6+ bisection instinct</td></tr>
<tr><td>Reaches for the right tool (debugger vs. logs vs. profile vs. bisect)</td><td>L6+ tool fluency</td></tr>
<tr><td>Notes what they would add to make this faster next time</td><td>L7 multiplier mindset</td></tr>
</table>

<h3>The signals that indicate over-claiming</h3>
<p>Candidates often claim L6/L7 debugging skill they don't have. Three sniff tests:</p>
<ul>
  <li><strong>Ask for specific numbers.</strong> "How long did your last big debugging session take?" An L7 has a story with hours and outcomes; an over-claimer has vague reassurances.</li>
  <li><strong>Ask about being wrong.</strong> "Tell me about a debugging hypothesis that took longer to falsify than you expected." An L7 has many stories. An L5 has at least one. An L3-L4 often can't name a single specific instance.</li>
  <li><strong>Ask about teaching.</strong> "Walk me through how you mentored a junior engineer through a hard bug." L6+ has concrete examples with Socratic questions; L4-L5 describes giving the answer.</li>
</ul>

<h3>The promotion guide</h3>
<p>For managers using this rubric to assess promotion readiness:</p>
<ul>
  <li><strong>L4 → L5:</strong> Has the candidate independently run a non-trivial bisection in the last 6 months? Have they introduced a new technique to the team?</li>
  <li><strong>L5 → L6:</strong> Have they designed a system property that helps the team's bisection? Led an incident's root-cause investigation?</li>
  <li><strong>L6 → L7:</strong> Have they raised the team's average debugging speed measurably? Written something the team references for guidance?</li>
</ul>

<div class="callout good">
<div class="callout-title">The most important calibration</div>
<p>The hardest line to draw is L6 → L7. The L6 engineer is a great solo debugger and pair partner. The L7 engineer changes the slope of the team's improvement. The test is not "is this engineer good" — it's "is this team measurably better at debugging because this engineer is here?" If the answer is no, you have a strong L6, not an L7. That's not failure; the org needs both.</p>
</div>
</template>

<template data-page-title="The Anti-Bisection Patterns Catalog" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">The Anti-Bisection Patterns Catalog</h2>
<p class="lede">Most teams don't lose bisection capability all at once — they lose it gradually, through accumulated small patterns each of which seemed harmless. This page is the field guide to the 10 most common patterns that destroy bisectability, with their smells, costs, and fixes.</p>

<h3>1. The Thousand-Line PR</h3>
<p><strong>Smell:</strong> Pull requests with 30+ files changed and "various improvements" in the title. Or worse: "WIP" merged to main.</p>
<p><strong>Cost:</strong> When bisection lands here, you've narrowed millions of lines to one PR — but the PR still contains a thousand. You've used log₂(N) to get back to a linear-search problem.</p>
<p><strong>Fix:</strong> Commit-lint enforcement on PR size (warning at 500 LOC, hard fail at 2,000). Cultural norm of "stack PRs" — break a big change into 5 small ones reviewed in sequence.</p>

<h3>2. The Squash-Merge Smear</h3>
<p><strong>Smell:</strong> Every PR is squashed to one giant commit. Six months later, the history has 200 commits each of which represents a week of work.</p>
<p><strong>Cost:</strong> Bisection always lands on a commit too large to localize. The blame trail through <code>git log -p</code> reads "lots of stuff happened on this day."</p>
<p><strong>Fix:</strong> Allow rebase-merge or merge-commit for PRs with &gt;3 logical commits. Train reviewers to recognize PRs that should NOT be squashed.</p>

<h3>3. The Amended-and-Force-Pushed Branch</h3>
<p><strong>Smell:</strong> Long-lived feature branches with rewritten history. Engineers <code>git rebase -i</code> and force-push regularly to "keep things tidy."</p>
<p><strong>Cost:</strong> Bisection across a force-push window finds commits that don't exist anymore. <code>git bisect</code> errors out with "ambiguous reflog."</p>
<p><strong>Fix:</strong> Protect <code>main</code> from force-push. Long branches can rewrite; the moment they're merged, the history is frozen. (Part II's "rebases and force-pushes" page.)</p>

<h3>4. The Implicit Environment Dependency</h3>
<p><strong>Smell:</strong> A test that "works on the CI runner but not locally," or vice versa. Or: the predicate's behavior changes depending on the engineer who runs it.</p>
<p><strong>Cost:</strong> Bisection results are non-deterministic. The same bisection run by two engineers converges on different commits.</p>
<p><strong>Fix:</strong> Print every relevant environment variable at predicate startup. Pin OS / runtime / locale / TZ in Docker or in test runner config.</p>

<h3>5. The Test-Order Leak</h3>
<p><strong>Smell:</strong> A test passes when run in isolation but fails when run after some other test. Or: the test suite passes locally but fails in CI's randomized order.</p>
<p><strong>Cost:</strong> Bisection thinks it's testing the bug; it's actually testing whatever test order this round happened to produce.</p>
<p><strong>Fix:</strong> Use <code>vitest --shuffle</code> or pytest's <code>pytest-randomly</code> plugin during CI. Fix every test that fails under shuffle — they're all latent test-pollution bugs. Use the polluter-finder from Part V.</p>

<h3>6. The Auto-Generated File Diff</h3>
<p><strong>Smell:</strong> Lockfiles, generated GraphQL types, bundled minified output, or formatter output all committed to the repo. Every PR touches half of them.</p>
<p><strong>Cost:</strong> Every commit's diff is dominated by noise. Bisection lands on commits whose "change" is just a regenerated artifact, hiding the real cause.</p>
<p><strong>Fix:</strong> Generate at build time, not at commit time. The few that <em>must</em> be committed (lockfiles) go in their own commits, separate from logic changes.</p>

<h3>7. The Unreproducible Build</h3>
<p><strong>Smell:</strong> Building the same commit twice produces different artifacts. Embedded timestamps, randomized symbol names, non-determined parallel compilation outputs.</p>
<p><strong>Cost:</strong> Two bisection rounds on the same commit can give different answers because the build itself varies. Idempotency (PHS axis) drops to zero.</p>
<p><strong>Fix:</strong> Set <code>SOURCE_DATE_EPOCH</code>, disable timestamp embedding, pin compiler/linker order, use content-hash build systems. Verify with <code>diff &lt;(build) &lt;(build)</code>.</p>

<h3>8. The Lock-Stepped Deploy</h3>
<p><strong>Smell:</strong> Frontend and backend must be deployed together; rolling back one requires rolling back the other.</p>
<p><strong>Cost:</strong> Bisection has to consider the cross-product of frontend × backend commits. You can't independently isolate the cause.</p>
<p><strong>Fix:</strong> API versioning that allows mixed-version operation. The frontend at v2 should be able to talk to the backend at v1 or v2. (Part X's API contracts page.)</p>

<h3>9. The Migration-Locked Schema</h3>
<p><strong>Smell:</strong> Database schema can roll forward only. Old migrations can't be reverted; they have no <code>down()</code> method.</p>
