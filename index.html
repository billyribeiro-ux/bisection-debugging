<template data-page-title="What Is Bisection Debugging?" data-part="I — Foundations">
<span class="badge">Part I · Foundations</span>
<h2 class="page-title">What Is Bisection Debugging?</h2>
<p class="lede">Bisection debugging is the engineer's version of the "guess a number between 1 and 100" game. Instead of testing every suspect one by one, you cut the suspect list in half each round. With 1,024 suspects, you find the culprit in <strong>10 tests</strong> instead of up to 1,024. That's the entire idea — but the implications run deep.</p>

<h3>The childhood game, reframed</h3>
<p>Imagine your friend picks a number from 1 to 100. If you guess <em>linearly</em> — "1? 2? 3?" — you'll average 50 guesses. If you guess in the middle — "50? higher. 75? lower. 62? lower." — you'll always finish in about 7. That's <strong>O(log₂ n)</strong> versus <strong>O(n)</strong>. The math is so favorable that experienced engineers reach for bisection before almost any other technique when a bug is hiding inside a large set.</p>

<h3>Why this matters in real software</h3>
<p>Every test you run costs something:</p>
<ul>
  <li><strong>Time.</strong> A CI run can take 20 minutes. 1,000 linear runs is a month of wall-clock. 10 bisection runs is 3 hours.</li>
  <li><strong>Money.</strong> CI minutes, cloud compute, and engineer salary all cost real dollars.</li>
  <li><strong>Cognitive load.</strong> Every minute spent waiting is a minute you cannot focus on the actual bug.</li>
</ul>
<p>So we trade a tiny amount of <em>setup work</em> (a predicate script, a way to split the input) for a <em>massive</em> reduction in tests. That trade almost always pays off.</p>

<h3>The three things you need</h3>
<div class="callout">
<div class="callout-title">The Bisection Triangle</div>
<ol>
  <li><strong>An ordered (or splittable) set</strong> — commits in history, files in a directory, items in a list, parameter values in a range.</li>
  <li><strong>A predicate</strong> — a yes/no test you can run against any element or subset. "Does the build fail?" "Does the leak appear?" "Does the test time out?"</li>
  <li><strong>The monotonic invariant</strong> — the predicate must flip from "good" to "bad" exactly once across the set. We'll spend the next page on this; it's where most bisection attempts go wrong.</li>
</ol>
</div>

<h3>Where you'll see bisection in this course</h3>
<p>We'll bisect across nine very different domains. The mental model is the same every time:</p>
<table class="cmp">
<tr><th>Domain</th><th>The "set"</th><th>The predicate</th></tr>
<tr><td>Git history</td><td>Commits between v1.4 and HEAD</td><td>Does <code>pnpm test</code> pass?</td></tr>
<tr><td>Source files</td><td>All <code>*.svelte</code> in <code>src/lib</code></td><td>Does <code>svelte-check</code> succeed?</td></tr>
<tr><td>Components in memory</td><td>Mounted children of a page</td><td>Does retained heap grow?</td></tr>
<tr><td>Dependencies</td><td>Entries in <code>package.json</code></td><td>Does the app boot?</td></tr>
<tr><td>Tests</td><td>Files in your <code>vitest</code> suite</td><td>Does the suspect test still flake?</td></tr>
<tr><td>Configuration</td><td>Keys in <code>tsconfig.json</code></td><td>Does the build succeed?</td></tr>
<tr><td>Feature flags</td><td>The flag set in your control plane</td><td>Does the bug reproduce?</td></tr>
<tr><td>Data rows</td><td>A CSV that crashes ingestion</td><td>Does the row import cleanly?</td></tr>
<tr><td>Service versions</td><td>Image tags across a fleet</td><td>Does end-to-end work?</td></tr>
</table>

<h3>A first taste — by hand, on the napkin</h3>
<p>Here is the smallest possible bisection script. It takes a list of files, runs a predicate, and narrows down to one culprit. We will rewrite this six different ways before the course is over.</p>

<pre class="code" data-lang="shell" data-title="napkin-bisect.sh">#!/usr/bin/env bash
# napkin-bisect.sh — the absolute simplest bisection.
# Usage:  ./napkin-bisect.sh "svelte-check --filter {}" src/lib/**/*.svelte
#
# {} is replaced with the file being tested.

predicate="$1"; shift
files=("$@")

lo=0; hi=$((${#files[@]} - 1))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  half=("${files[@]:lo:mid-lo+1}")
  echo "Testing files [$lo..$mid] (${#half[@]} files)"
  cmd="${predicate//\{\}/${half[*]}}"
  if eval "$cmd" &gt;/dev/null 2&gt;&amp;1; then
    lo=$((mid + 1))   # this half is good → bad must be in upper half
  else
    hi=$mid           # this half is bad → keep narrowing
  fi
done
echo "Culprit: ${files[$lo]}"
</pre>

<p>Don't worry if every line isn't clear yet — by Part VI you'll be able to write this from memory and explain every choice. For now, just notice: <em>each iteration halves the search space.</em></p>
<p style="color: var(--fg-dim); font-size: 13px; margin-top: 18px;">⊕ <em>Why is log₂(N) optimal, not just clever?</em> See <strong>Part IX — The Information Theory of Bisection</strong> for the Shannon-style lower bound that proves no algorithm can beat it.</p>

<template data-page-title="The Bisection Invariant" data-part="I — Foundations">
<span class="badge">Part I · Foundations</span>
<h2 class="page-title">The Bisection Invariant — and Why Bisection Lies</h2>
<p class="lede">Bisection works because of a single mathematical property: <strong>monotonicity</strong>. Without it, the whole technique gives you a confidently wrong answer. Senior engineers who get burned by bisection got burned here. Read this page twice.</p>

<h3>What monotonicity means in plain English</h3>
<p>"Monotonic" sounds intimidating; it isn't. It means: <em>as you walk through the set, the predicate flips from "good" to "bad" exactly once, and never flips back.</em> Like a light switch: off, off, off, off, <strong>ON</strong>, on, on, on. Never off-on-off-on.</p>
<p>For git bisect, that means: every commit before the bad one is good; every commit at-or-after the bad one is bad. For file bisection: every subset that excludes the bad file is good; every subset that includes it is bad.</p>

<h3>Three ways the invariant breaks (and how to repair it)</h3>

<h4>1. Flakiness — the predicate is noisy</h4>
<p>The test fails 30% of the time even on a good commit. Bisection sees the noise as a real signal and points at an innocent commit. <strong>Fix:</strong> wrap your predicate in a "best of N" loop.</p>

<pre class="code" data-lang="shell" data-title="flake-resistant-predicate.sh">#!/usr/bin/env bash
# flake-resistant-predicate.sh
# Runs the test up to 5 times. Calls it "good" only if it passes ≥4 times.
# Exit codes follow `git bisect run` convention:
#   0   = good
#   1   = bad
#   125 = skip (cannot determine — e.g. build itself broken)
set -uo pipefail

RUNS=5
THRESHOLD=4
passes=0

# Refuse to judge if the build is broken — that's a "skip", not a "bad".
if ! pnpm install --frozen-lockfile &gt;/dev/null 2&gt;&amp;1; then exit 125; fi
if ! pnpm build &gt;/dev/null 2&gt;&amp;1; then exit 125; fi

for i in $(seq 1 "$RUNS"); do
  if pnpm test --run --bail 1 &gt;/dev/null 2&gt;&amp;1; then
    passes=$((passes + 1))
  fi
done

if (( passes &gt;= THRESHOLD )); then exit 0; else exit 1; fi
</pre>

<h4>2. Non-determinism — the environment drifts</h4>
<p>The bug only appears with a specific Node version, OS, or system clock. Halfway through bisection, <code>nvm</code> picks up a different Node and your predicate changes meaning. <strong>Fix:</strong> pin everything explicitly inside the predicate.</p>

<pre class="code" data-lang="shell" data-title="hermetic-predicate.sh">#!/usr/bin/env bash
# hermetic-predicate.sh — pin every variable that could shift under us.
set -euo pipefail

# Pin Node, pnpm, locale, timezone, random seed.
export NODE_VERSION="20.18.0"
export PNPM_VERSION="9.12.0"
export LC_ALL=C.UTF-8
export TZ=UTC
export NODE_OPTIONS="--no-warnings"
export VITEST_SEED=42

# Use a deterministic ordering for tests.
export VITEST_SEQUENCE_SHUFFLE=false

# Honor .nvmrc only if it matches the pin; otherwise fail loudly.
if command -v nvm &gt;/dev/null 2&gt;&amp;1; then
  nvm use "$NODE_VERSION" &gt;/dev/null 2&gt;&amp;1 || { echo "Wrong Node"; exit 125; }
fi

# Clean every byproduct cache — caches lie under bisection.
rm -rf node_modules/.vite node_modules/.cache .svelte-kit dist

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm test --run
</pre>

<h4>3. Multiple causes — the bug isn't a single switch</h4>
<p>Two unrelated commits together cause the failure; neither alone reproduces it. Bisection will land on <em>one</em> of them and tell you it's the culprit. It's not lying — it's telling you the smallest commit that, given everything else after it, produces the failure. <strong>Fix:</strong> when you find the "bad" commit, confirm by cherry-picking it onto a known good base and checking the bug still reproduces. If it doesn't, you have a multi-cause bug — split it.</p>

<h3>The cardinal rule</h3>
<blockquote><strong>Before you bisect anything, prove the predicate is stable.</strong> Run it 3 times on a known-good state. Run it 3 times on a known-bad state. If both runs agree with themselves, you're safe to bisect. If they don't, fix the predicate first, then bisect. Skipping this step is the #1 way principal engineers waste a Friday.</blockquote>
</template>

<template data-page-title="Manual Bisection — The Napkin Method" data-part="I — Foundations">
<span class="badge">Part I · Foundations</span>
<h2 class="page-title">Manual Bisection — The Napkin Method</h2>
<p class="lede">Before automating, you should be able to bisect with a piece of paper and a clear head. This page shows the technique by hand so the automation later feels obvious instead of magical.</p>

<h3>A worked example: 1,024 files, 10 tests</h3>
<p>You broke <code>svelte-check</code>. You don't know which file. You have 1,024 <code>.svelte</code> files. You could check them one at a time (linear), or:</p>
<ol>
  <li><strong>Round 1.</strong> Move files 1–512 out of the project. Run <code>svelte-check</code>. Pass? The bad file is in 1–512. Fail? It's in 513–1,024. Move them back.</li>
  <li><strong>Round 2.</strong> Take the suspect half and split it again — 256 files moved out. Test.</li>
  <li><strong>Round 3.</strong> 128 files.</li>
  <li>… <strong>Round 10.</strong> 1 file. That's your culprit.</li>
</ol>
<p>Ten tests instead of up to 1,024. Each round costs you one <code>svelte-check</code> run and a few seconds of file shuffling.</p>

<h3>The mental model: <code>lo</code>, <code>hi</code>, <code>mid</code></h3>
<p>Every bisection has three pointers. Memorize them:</p>
<ul>
  <li><code>lo</code> — the index of the first <em>possibly-bad</em> element.</li>
  <li><code>hi</code> — the index of the last <em>possibly-bad</em> element.</li>
  <li><code>mid</code> — <code>(lo + hi) / 2</code>, the element you'll test this round.</li>
</ul>
<p>After each test, you either move <code>lo</code> up to <code>mid + 1</code> ("the bad one is above mid") or move <code>hi</code> down to <code>mid</code> ("the bad one is at or below mid"). You stop when <code>lo == hi</code>. That index is your answer.</p>

<h3>A reusable manual log sheet</h3>
<p>When bisecting by hand — especially during a stressful incident — write the table. It prevents the most common mistake: forgetting whether a tested subset was good or bad.</p>

<pre class="code" data-lang="markdown" data-title="bisection-log.md"># Bisection log: SvelteCheck failing after main merge
Date: 2026-06-03  Engineer: you  Predicate: `pnpm exec svelte-check`

Initial suspect range: src/lib/**/*.svelte → 1024 files (sorted alphabetically)

| Round | lo   | hi   | mid  | tested subset    | result | new lo | new hi |
|------:|-----:|-----:|-----:|------------------|:------:|-------:|-------:|
| 1     |    0 | 1023 |  511 | files[0..511]    | BAD    |      0 |    511 |
| 2     |    0 |  511 |  255 | files[0..255]    | GOOD   |    256 |    511 |
| 3     |  256 |  511 |  383 | files[256..383]  | BAD    |    256 |    383 |
| 4     |  256 |  383 |  319 | files[256..319]  | GOOD   |    320 |    383 |
| 5     |  320 |  383 |  351 | files[320..351]  | BAD    |    320 |    351 |
| 6     |  320 |  351 |  335 | files[320..335]  | BAD    |    320 |    335 |
| 7     |  320 |  335 |  327 | files[320..327]  | GOOD   |    328 |    335 |
| 8     |  328 |  335 |  331 | files[328..331]  | BAD    |    328 |    331 |
| 9     |  328 |  331 |  329 | files[328..329]  | GOOD   |    330 |    331 |
| 10    |  330 |  331 |  330 | files[330..330]  | BAD    |    330 |    330 |

→ Culprit: files[330] = src/lib/components/data/HeavyChart.svelte
</pre>

<h3>The "split the suspect set" script</h3>
<p>To actually move files in/out by hand, this helper does it deterministically — and is reversible. Move-then-test-then-move-back avoids the most common foot-gun: leaving the repo in a half-modified state and forgetting which.</p>

<pre class="code" data-lang="shell" data-title="halve-and-test.sh">#!/usr/bin/env bash
# halve-and-test.sh — interactively halve a suspect file list.
# Moves files into .bisect-stash/, runs your predicate, restores on exit.
# Usage:  ./halve-and-test.sh 'pnpm exec svelte-check' src/lib/**/*.svelte
set -euo pipefail

PREDICATE="$1"; shift
ALL=("$@")
STASH=".bisect-stash"
mkdir -p "$STASH"

restore() {
  echo "Restoring stashed files…"
  if [ -d "$STASH" ]; then
    find "$STASH" -type f | while read -r f; do
      mv "$f" "${f#$STASH/}"
    done
    rm -rf "$STASH"
  fi
}
trap restore EXIT INT TERM

lo=0; hi=$(( ${#ALL[@]} - 1 ))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  echo
  echo "── Round: lo=$lo hi=$hi mid=$mid (testing lower half [lo..mid]) ──"

  # Stash the UPPER half so only [lo..mid] remain under test.
  for (( i = mid + 1; i &lt;= hi; i++ )); do
    f="${ALL[$i]}"
    mkdir -p "$STASH/$(dirname "$f")"
    mv "$f" "$STASH/$f"
  done

  if eval "$PREDICATE" &gt;/dev/null 2&gt;&amp;1; then
    echo "  → lower half GOOD; bad file is in upper half"
    # Restore upper, stash lower for next iteration.
    find "$STASH" -type f | while read -r f; do mv "$f" "${f#$STASH/}"; done
    lo=$((mid + 1))
  else
    echo "  → lower half BAD; narrowing"
    find "$STASH" -type f | while read -r f; do mv "$f" "${f#$STASH/}"; done
    hi=$mid
  fi
done

echo
echo "═══════════════════════════════════════════"
echo "Culprit: ${ALL[$lo]}"
echo "═══════════════════════════════════════════"
</pre>

<p>Note the <code>trap restore EXIT INT TERM</code> line. <strong>Always</strong> guarantee restoration. Bisection scripts crash. Networks drop. Cats walk on keyboards. Without a restore guarantee, you leave the repository in a broken state — far worse than the original bug.</p>
</template>

<template data-page-title="git bisect Basics" data-part="II — Git Bisect">
<span class="badge">Part II · Git Bisect</span>
<h2 class="page-title">git bisect — The Canonical Tool</h2>
<p class="lede"><code>git bisect</code> is the bisection technique built into git itself. It's been there since 2007 and it remains, in 2026, the single most leveraged debugging command most engineers never use. By the end of this page you'll be running it confidently.</p>

<h3>The five commands you actually need</h3>
<table class="cmp">
<tr><th>Command</th><th>What it does</th></tr>
<tr><td><code>git bisect start</code></td><td>Begins a bisection session. Tells git: "I'm hunting for the commit that introduced something."</td></tr>
<tr><td><code>git bisect bad &lt;ref&gt;</code></td><td>Marks a commit (default: HEAD) as <em>bad</em> — the bug is present here.</td></tr>
<tr><td><code>git bisect good &lt;ref&gt;</code></td><td>Marks a commit as <em>good</em> — the bug was not present.</td></tr>
<tr><td><code>git bisect reset</code></td><td>Ends the session and returns you to your original branch.</td></tr>
<tr><td><code>git bisect run &lt;cmd&gt;</code></td><td>Automates the loop. We cover this in detail on the next page.</td></tr>
</table>

<h3>A real session, narrated</h3>
<p>You shipped v2.4 last week. Today, login is broken. You know v2.3 worked. Somewhere in the 60 commits between them is the bad one. Here's the entire session:</p>

<pre class="code" data-lang="shell" data-title="manual-git-bisect.sh"># 1. Start the session.
git bisect start

# 2. Tell git the current state is bad.
git bisect bad HEAD

# 3. Tell git which earlier commit was known good.
git bisect good v2.3

# Git replies with something like:
#   Bisecting: 30 revisions left to test after this (roughly 5 steps)
#   [a1b2c3d] Refactor session store
# It has checked out the middle commit and is waiting for you.

# 4. Test the checked-out commit. Manually run login. Did it work?
#    If yes:
git bisect good
#    If no:
git bisect bad
#    Git checks out the next midpoint and repeats.

# 5. Repeat steps 3–4 until git tells you:
#   a1b2c3d is the first bad commit
#   commit a1b2c3d
#   Author: someone
#   Date:   Tue May 27 14:02:31 2026 +0000
#       Refactor session store to use signed cookies

# 6. End the session and go back to your branch.
git bisect reset
</pre>

<h3>What git is actually doing under the hood</h3>
<p>This is the kind of detail that separates engineers who <em>use</em> the tool from engineers who <em>own</em> the technique:</p>
<ul>
  <li>Git keeps two refs: <code>refs/bisect/bad</code> and <code>refs/bisect/good-&lt;sha&gt;</code> (one per good commit).</li>
  <li>It computes the set of commits reachable from <code>bad</code> but not from any <code>good</code>. That's your search space.</li>
  <li>It picks the commit with the most-balanced descendant/ancestor split. For a linear history this is the midpoint; for branchy history it's a graph-aware "best bisect" using a polynomial described in <code>git-bisect-lk2009.txt</code>.</li>
  <li>It detaches HEAD to that commit. Your working tree is now at the suspect.</li>
  <li>It writes <code>BISECT_LOG</code> with everything that happened. You can resume with <code>git bisect replay</code>.</li>
</ul>

<h3>Three commands you'll need eventually</h3>
<pre class="code" data-lang="shell" data-title="git-bisect-extras.sh"># Skip the current commit (build broken, can't decide).
git bisect skip

# Save the bisection log for later (e.g. resume after a crash, or for review).
git bisect log &gt; /tmp/bisect.log
git bisect reset                 # end session
# Later:
git bisect start
git bisect replay /tmp/bisect.log

# Visualize the remaining search space.
git bisect visualize             # uses gitk if installed
# or, simpler:
git bisect view --stat
</pre>

<h3>The shortcut form</h3>
<p>The verbose form above is great for learning. In practice you'll use this one-liner:</p>
<pre class="code" data-lang="shell" data-title="git-bisect-oneline.sh"># Start, bad, and good in a single command.
git bisect start HEAD v2.3
# (positional: &lt;bad&gt; &lt;good...&gt;; you can pass multiple goods)
</pre>
</template>

<template data-page-title="Automated git bisect run" data-part="II — Git Bisect">
<span class="badge">Part II · Git Bisect</span>
<h2 class="page-title">Automating with <code class="no-style">git bisect run</code></h2>
<p class="lede">Manual bisection is great for learning. In real life you'll write a script and walk away. <code>git bisect run</code> drives the whole loop for you — it can find a needle in 300 commits while you make coffee.</p>

<h3>The contract: exit codes are the API</h3>
<p><code>git bisect run</code> calls your script at each midpoint. Your script's <em>exit code</em> is the only thing that matters:</p>
<table class="cmp">
<tr><th>Exit</th><th>Meaning</th><th>When to return it</th></tr>
<tr><td><code>0</code></td><td>good</td><td>Bug not present. Tests pass.</td></tr>
<tr><td><code>1–124, 126, 127</code></td><td>bad</td><td>Bug present. Tests fail.</td></tr>
<tr><td><code>125</code></td><td>skip</td><td>Cannot tell — build broken, dependencies won't install, environment problem. Git will pick a neighboring commit.</td></tr>
<tr><td><code>128+</code></td><td>abort</td><td>Fatal error. Git stops the bisection entirely.</td></tr>
</table>

<h3>A production-quality predicate</h3>
<p>Here is the script I actually drop into projects. It handles every corner: hermetic install, build/test separation, retries for flakes, and clean exit codes.</p>

<pre class="code" data-lang="shell" data-title="bisect-predicate.sh">#!/usr/bin/env bash
# bisect-predicate.sh — generic predicate for `git bisect run`.
#
# WHAT TO EDIT:  the THREE variables below + the SUSPECT_TEST.
# WHY EXIT 125: build/install failure isn't the bug; it's an environment problem.
#               Skipping lets bisection continue around the broken commits.
# USAGE:
#   git bisect start HEAD v2.3
#   git bisect run ./bisect-predicate.sh

set -uo pipefail

INSTALL_CMD="pnpm install --frozen-lockfile --prefer-offline"
BUILD_CMD="pnpm build"
SUSPECT_TEST="pnpm vitest run tests/auth/login.test.ts"
FLAKE_RETRIES=3            # run the suspect test N times before declaring bad

# 1) Reset known-dirty caches that survive checkouts.
rm -rf node_modules/.vite .svelte-kit .turbo dist 2&gt;/dev/null || true

# 2) Hermetic install. If the lockfile or registry rejects this commit, SKIP.
if ! $INSTALL_CMD &gt;/tmp/bisect-install.log 2&gt;&amp;1; then
  echo "::skip:: install failed at $(git rev-parse --short HEAD)"
  exit 125
fi

# 3) Build. Broken build isn't necessarily the bug — but it might be.
#    If the bug you're hunting is "the build broke", change exit 125 → exit 1 here.
if ! $BUILD_CMD &gt;/tmp/bisect-build.log 2&gt;&amp;1; then
  echo "::skip:: build failed at $(git rev-parse --short HEAD)"
  exit 125
fi

# 4) Run the suspect test multiple times, declare bad only on a clear majority.
fails=0
for i in $(seq 1 "$FLAKE_RETRIES"); do
  if ! $SUSPECT_TEST &gt;/tmp/bisect-test.$i.log 2&gt;&amp;1; then
    fails=$((fails + 1))
  fi
done

if (( fails &gt; FLAKE_RETRIES / 2 )); then
  echo "::bad:: $(git rev-parse --short HEAD) failed $fails/$FLAKE_RETRIES"
  exit 1
fi

echo "::good:: $(git rev-parse --short HEAD)"
exit 0
</pre>

<h3>Driving it</h3>
<pre class="code" data-lang="shell" data-title="drive-bisect.sh">#!/usr/bin/env bash
# drive-bisect.sh — end-to-end automated bisection between two refs.
set -euo pipefail

BAD="${1:-HEAD}"
GOOD="${2:?usage: drive-bisect.sh &lt;bad-ref&gt; &lt;good-ref&gt;}"
PREDICATE="${3:-./bisect-predicate.sh}"

chmod +x "$PREDICATE"

git bisect start
git bisect bad "$BAD"
git bisect good "$GOOD"
git bisect run "$PREDICATE" | tee /tmp/bisect-output.log

# Whatever happened, leave the repo clean.
git bisect log &gt; /tmp/bisect-history.log
git bisect reset

# Surface the verdict.
grep -E "is the first bad commit" /tmp/bisect-output.log || \
  echo "Bisection inconclusive — check /tmp/bisect-output.log"
</pre>

<h3>Reading the output</h3>
<p>At the end, git prints something like:</p>
<pre class="code" data-lang="shell" data-title="bisect-output.txt">a1b2c3d4e5f6 is the first bad commit
commit a1b2c3d4e5f6
Author: jordan@example.com
Date:   Tue May 27 14:02:31 2026 +0000

    refactor: move session decryption to edge middleware

 src/lib/server/session.ts | 42 +++++++++++++-----------
 src/hooks.server.ts       | 18 ++++++++--
 2 files changed, 41 insertions(+), 19 deletions(-)

bisect found first bad commit
</pre>

<p>That's it — the commit, the author, the files, ready for your code review. From here you either revert it, fix it forward, or have a precise conversation with the author about what they intended.</p>
</template>

<template data-page-title="Skips, Flakes, Merge Commits" data-part="II — Git Bisect">
<span class="badge">Part II · Git Bisect</span>
<h2 class="page-title">Skips, Flakes, and the Treacherous Merge Commit</h2>
<p class="lede">In a clean linear history, <code>git bisect run</code> is paradise. In a real repository — with squashes, reverts, force-pushes, and merge commits from upstream — it can get strange. This page is the survival guide.</p>

<h3>Skipping intelligently</h3>
<p>When your predicate returns 125, git tries the neighboring commits. But what if a whole <em>range</em> is broken (a botched merge that took 5 commits to fix forward)? You can pre-skip them:</p>

<pre class="code" data-lang="shell" data-title="bisect-skip-range.sh"># Skip a known-broken range so bisection avoids it.
git bisect skip $(git rev-list abc123^..def456)

# Or skip the merges from a noisy upstream branch.
git bisect skip $(git rev-list --merges --first-parent HEAD~50..HEAD)
</pre>

<h3>The <code>--first-parent</code> trick</h3>
<p>If your team uses merge commits, the linear history of <code>main</code> hides hundreds of feature-branch commits. Most of the time you want bisection to step through <em>merges into main</em>, not into the internals of each PR.</p>

<pre class="code" data-lang="shell" data-title="bisect-first-parent.sh"># Bisect only along the first-parent chain of main.
# This treats each PR merge as a single unit instead of descending into it.
git bisect start --first-parent
git bisect bad HEAD
git bisect good v2.3
git bisect run ./bisect-predicate.sh
</pre>

<p>Trade-off: you'll identify the offending <em>PR</em>, not the offending commit-within-the-PR. That's usually what you want anyway; PR-level granularity matches how you do code review.</p>

<h3>Handling flakes mid-bisection</h3>
<p>What if you discover a flake only halfway through? Don't restart — you can edit the verdict:</p>

<pre class="code" data-lang="shell" data-title="bisect-fix-mistake.sh"># I told git this commit was good; now I think it was bad. Fix the log.
git bisect log &gt; /tmp/bisect-log

# Edit /tmp/bisect-log in your editor. Change `good abc123` to `bad abc123`,
# or delete the line entirely if you can't tell.

git bisect reset
git bisect replay /tmp/bisect-log
# Bisection resumes with the corrected history.
</pre>

<h3>The "good-after-bad" anomaly</h3>
<p>Sometimes you'll see git report:</p>
<pre class="code" data-lang="shell" data-title="bisect-anomaly.txt">$ git bisect bad
Bisecting: 3 revisions left to test after this
running ./predicate
::good:: f3a2b1c
Bisecting: ...
::bad:: a4d5e6f
::good:: 9c8b7a6     # ← but 9c8b7a6 is AFTER a4d5e6f!
</pre>
<p>This means your invariant is broken. The predicate is either flaky or non-monotonic. Stop. Don't trust the answer. Run the predicate 5 times against a single commit and see whether it answers consistently. If not, fix the predicate. If yes, you have a multi-cause bug.</p>

<h3>Resumable sessions across machines</h3>
<p>Long bisections (hundreds of slow commits) sometimes outlive your laptop session. Save the log and resume anywhere:</p>

<pre class="code" data-lang="shell" data-title="bisect-portable.sh"># Save current state.
git bisect log &gt; bisect-state.log
git bisect reset

# On another machine (after cloning the same repo):
git bisect start
git bisect replay bisect-state.log
# Now continue from where you left off.
</pre>

<h3>The terms vocabulary</h3>
<p>If your codebase uses "broken" / "working" instead of "bad" / "good", teach git the synonyms — your muscle memory will thank you:</p>

<pre class="code" data-lang="shell" data-title="bisect-terms.sh">git bisect start --term-old=working --term-new=broken
git bisect broken           # equivalent to `bad`
git bisect working v2.3     # equivalent to `good v2.3`

# Or for performance regressions:
git bisect start --term-old=fast --term-new=slow
</pre>
</template>

<template data-page-title="Rebases, Squashes, and Hidden History" data-part="II — Git Bisect">
<span class="badge">Part II · Git Bisect</span>
<h2 class="page-title">Bisecting Across Rebases and Squash-Merges</h2>
<p class="lede">If your team squash-merges every PR, bisection lands on a single 4,000-line commit and says "good luck." This page shows how to <em>continue bisecting inside</em> that squashed PR — and how to survive force-pushes that rewrote the history you were trying to bisect.</p>

<h3>The squash-merge problem</h3>
<p>You bisect from v2.4 → v2.3 and land on this:</p>
<pre class="code" data-lang="shell" data-title="squash-result.txt">d4e5f6a is the first bad commit
commit d4e5f6a
Author: dev@example.com
    feat: rewrite the payment pipeline (#1284)
 42 files changed, 3812 insertions(+), 1204 deletions(-)
</pre>
<p>Now you "know" the bad commit, but it contains a month of work. The actual bug is hiding in one of the <em>original</em> branch commits that got squashed. The fix:</p>

<pre class="code" data-lang="shell" data-title="bisect-squashed-pr.sh">#!/usr/bin/env bash
# bisect-squashed-pr.sh — bisect inside a squashed PR by replaying its branch.
set -euo pipefail

PR_NUMBER="${1:?usage: bisect-squashed-pr.sh &lt;pr-number&gt;}"
SQUASH_COMMIT="${2:?&lt;squash-commit-sha&gt;}"

# 1) Most providers (GitHub, GitLab) keep the original PR branch reachable via
#    a special ref. For GitHub:  refs/pull/&lt;n&gt;/head
git fetch origin "refs/pull/$PR_NUMBER/head:bisect-pr-$PR_NUMBER"

PR_TIP="bisect-pr-$PR_NUMBER"
PR_BASE="$(git merge-base "$PR_TIP" "$SQUASH_COMMIT^")"

echo "PR branch tip: $PR_TIP"
echo "PR branch base: $PR_BASE"

# 2) Cherry-pick the PR onto a known-good base so bisection has a linear history.
git checkout -b bisect-replay "$PR_BASE"
git cherry-pick "$PR_BASE..$PR_TIP" || {
  echo "Cherry-pick conflicts — resolve and run 'git cherry-pick --continue'"
  exit 1
}

# 3) Now bisect inside the cherry-picked range.
git bisect start
git bisect bad HEAD            # bug present after the whole PR
git bisect good "$PR_BASE"     # bug absent before the PR
git bisect run ./bisect-predicate.sh

git bisect reset
git checkout -
git branch -D bisect-replay bisect-pr-$PR_NUMBER
</pre>

<h3>Surviving force-pushes</h3>
<p>You started bisecting against <code>origin/main</code> at SHA <code>a1b2c3d</code>. Halfway through, someone force-pushed and <code>a1b2c3d</code> no longer exists on the remote. Your local commits are detached but intact — until <code>git gc</code> sweeps them.</p>

<pre class="code" data-lang="shell" data-title="bisect-survive-force-push.sh"># Pin the bisection range to objects in your local object database so they
# can't be garbage-collected mid-bisection.
git update-ref refs/bisect-pin/bad   $(git rev-parse HEAD)
git update-ref refs/bisect-pin/good  v2.3

# Now if `origin/main` rotates under you, your pins survive.
# Reference them by the pin ref:
git bisect start refs/bisect-pin/bad refs/bisect-pin/good

# When done:
git update-ref -d refs/bisect-pin/bad
git update-ref -d refs/bisect-pin/good
</pre>

<h3>Reflogs: your last line of defense</h3>
<p>If everything goes wrong and you can't find the bad commit anymore:</p>
<pre class="code" data-lang="shell" data-title="bisect-reflog-rescue.sh"># Every checkout git has done during this session is in the reflog.
git reflog --date=iso | grep -E "checkout|bisect" | head -40

# Recover a specific SHA you saw earlier in bisection:
git checkout HEAD@{42}
# or
git checkout abc1234

# Pin it before it expires (default expiry: 90 days for unreachable objects).
git update-ref refs/recovered/possibly-bad HEAD
</pre>

<h3>A team-wide best practice</h3>
<div class="callout good">
<div class="callout-title">Recommendation</div>
<p>Keep <em>merge commits</em> on <code>main</code> and let GitHub/GitLab also retain PR head refs (<code>refs/pull/N/head</code> on GitHub). Then <code>--first-parent</code> bisection finds the PR, and the cherry-pick-and-bisect technique finds the line. Squash-only workflows trade developer convenience for incident-response speed; pay attention to that trade.</p>
</div>
</template>

<template data-page-title="Bisecting Svelte Files" data-part="III — File & Module">
<span class="badge">Part III · File & Module Bisection</span>
<h2 class="page-title">Bisecting Files in a SvelteKit Project</h2>
<p class="lede">This is the exact problem you asked about: a <code>svelte-check</code> error somewhere in a 500-file project, and the obvious linear-scan script. We're going to turn it into a logarithmic bisector — and a real one, with restoration, parallelization, and resumability.</p>

<h3>Why the linear scan in your original snippet is wrong</h3>
<p>The script you pasted is fine for 10 files. For 500 files it runs <code>svelte-check --filter</code> 500 times. At ~3 seconds per invocation (warm), that's 25 minutes. At ~15 seconds per invocation (cold, large project), that's two hours.</p>
<p>A binary-halving scan finds the same file in <strong>9 invocations</strong>. At 15 seconds each: 2 minutes 15 seconds. A 50× speedup for ten extra lines of shell.</p>

<h3>The binary-halving leak finder</h3>

<pre class="code" data-lang="shell" data-title="find-leak-binary.sh">#!/usr/bin/env bash
# find-leak-binary.sh
# Binary-halves a set of files to find the one that breaks `svelte-check`.
# Works on any check command that accepts a file list, not just svelte-check.
#
# WHY THIS WORKS:
#   svelte-check (and tsc, eslint, biome) accept multiple files at once.
#   If we hand it half the project and it passes, the bad file is in the other half.
#   Recurse. log₂(N) invocations instead of N.
#
# USAGE:
#   ./find-leak-binary.sh "pnpm exec svelte-check --filter" "src/lib/**/*.svelte"
#   ./find-leak-binary.sh "pnpm exec tsc --noEmit"          "src/**/*.ts"
#
# OUTPUT:
#   The exact file that, in isolation, fails the predicate.
#
set -euo pipefail
shopt -s globstar nullglob

CHECK_CMD="${1:?usage: $0 \"&lt;check-cmd&gt;\" \"&lt;glob&gt;\"}"
GLOB="${2:?missing glob}"

# Expand glob → array. Sorted for deterministic, resumable runs.
mapfile -t FILES &lt; &lt;(printf '%s\n' $GLOB | sort)
N="${#FILES[@]}"
echo "Bisecting $N files with: $CHECK_CMD"

# Sanity check: the FULL set must actually fail. Otherwise nothing to find.
if $CHECK_CMD "${FILES[@]}" &gt;/dev/null 2&gt;&amp;1; then
  echo "Predicate passes on full set — nothing to bisect."
  exit 0
fi

lo=0
hi=$((N - 1))
round=0

while (( lo &lt; hi )); do
  round=$((round + 1))
  mid=$(( (lo + hi) / 2 ))
  lower=("${FILES[@]:lo:mid-lo+1}")

  printf "round %2d: testing %d files (indices %d..%d)\n" \
    "$round" "${#lower[@]}" "$lo" "$mid"

  if $CHECK_CMD "${lower[@]}" &gt;/dev/null 2&gt;&amp;1; then
    # Lower half is clean → culprit is in upper half.
    lo=$((mid + 1))
  else
    # Lower half fails → culprit is in lower half.
    hi=$mid
  fi
done

echo
echo "═══════════════════════════════════════════"
echo "Culprit file: ${FILES[$lo]}"
echo "═══════════════════════════════════════════"

# Show the actual error for the culprit.
echo
echo "Reproducing error:"
$CHECK_CMD "${FILES[$lo]}" || true
</pre>

<h3>When the predicate doesn't accept multiple files</h3>
<p>Some checkers (older eslint plugins, custom scripts) only accept one file at a time. You can still halve by <em>moving</em> the other half out of the project — the trick from the Napkin Method page, made robust:</p>

<pre class="code" data-lang="shell" data-title="find-leak-by-stashing.sh">#!/usr/bin/env bash
# find-leak-by-stashing.sh
# Binary-halves by moving non-suspect files into .bisect-stash/, then running
# a project-wide predicate (e.g. `pnpm build`).
# Guarantees full restoration even on Ctrl-C, error, or kill.
set -euo pipefail
shopt -s globstar nullglob

PREDICATE="${1:?usage: $0 &lt;predicate-cmd&gt; &lt;glob&gt;}"
GLOB="${2:?missing glob}"
STASH="$(mktemp -d -p . .bisect-stash-XXXXXX)"

mapfile -t FILES &lt; &lt;(printf '%s\n' $GLOB | sort)

cleanup() {
  echo "Restoring stash…"
  if [ -d "$STASH" ]; then
    (cd "$STASH" &amp;&amp; find . -type f -print) | while read -r rel; do
      mkdir -p "$(dirname "${rel#./}")"
      mv "$STASH/${rel#./}" "${rel#./}"
    done
    rm -rf "$STASH"
  fi
}
trap cleanup EXIT INT TERM

stash() {
  local f="$1"
  mkdir -p "$STASH/$(dirname "$f")"
  mv "$f" "$STASH/$f"
}
unstash() {
  local f="$1"
  mkdir -p "$(dirname "$f")"
  mv "$STASH/$f" "$f"
}

lo=0; hi=$(( ${#FILES[@]} - 1 ))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  # Stash UPPER half; predicate runs against [lo..mid].
  for (( i = mid + 1; i &lt;= hi; i++ )); do stash "${FILES[$i]}"; done

  if $PREDICATE &gt;/dev/null 2&gt;&amp;1; then
    # Lower half is clean → culprit is in upper half.
    for (( i = mid + 1; i &lt;= hi; i++ )); do unstash "${FILES[$i]}"; done
    lo=$((mid + 1))
  else
    # Restore upper, then stash lower-upper for next round.
    for (( i = mid + 1; i &lt;= hi; i++ )); do unstash "${FILES[$i]}"; done
    hi=$mid
  fi
done

echo "Culprit: ${FILES[$lo]}"
</pre>

<h3>Caching predicate results</h3>
<p>A subtle win: the same subset can be re-tested across runs. Hash the subset, memoize the answer.</p>

<pre class="code" data-lang="shell" data-title="memoized-predicate.sh"># Run the predicate, but cache pass/fail by the SHA of the input file list.
predicate_memo() {
  local key
  key="$(printf '%s\n' "$@" | sort | sha256sum | cut -d' ' -f1)"
  local cache=".bisect-cache/$key"
  mkdir -p .bisect-cache
  if [ -f "$cache" ]; then
    return "$(cat "$cache")"
  fi
  pnpm exec svelte-check --filter "$@" &gt;/dev/null 2&gt;&amp;1
  local rc=$?
  echo "$rc" &gt; "$cache"
  return "$rc"
}
</pre>

<p>Memoization matters more than it looks. When you abort a run, fix something, and re-bisect, every previously tested subset is free. Combined with halving, a 1000-file project narrows in under a minute on the second pass.</p>
</template>

<template data-page-title="Bisecting Memory Leaks" data-part="III — File & Module">
<span class="badge">Part III · File & Module Bisection</span>
<h2 class="page-title">Bisecting Component Memory Leaks (real heap snapshots)</h2>
<p class="lede">The hardest leaks are the silent ones: the page renders fine, the tests pass, but RAM creeps up over the demo. We'll bisect which component is leaking by mounting halves of the suspect list under Playwright, sampling the heap via Chrome DevTools Protocol, and recursing.</p>

<h3>The principle</h3>
<p>A real memory leak is monotonic: the retained heap after a mount/unmount cycle either returns to baseline (no leak) or stays above baseline (leak). If we mount <em>half</em> the suspect components in sequence, take a snapshot, and compare against baseline, we know which half is leaking. Recurse.</p>

<h3>The full bisector</h3>
<p>This is a real Node script. It uses Playwright (already in most modern Svelte/React stacks for tests) and the CDP <code>HeapProfiler.takeHeapSnapshot</code> endpoint. Drop it into a project that has Playwright installed.</p>

<pre class="code" data-lang="javascript" data-title="mem-leak-bisect.mjs">#!/usr/bin/env node
// mem-leak-bisect.mjs
// Binary-search across a set of components to find the one that leaks memory.
//
// HOW IT WORKS:
//   1. Boot a Playwright Chromium instance, navigate to a harness URL.
//   2. The harness exposes a `mount(name)` and `unmount()` function via window.
//   3. For each suspect subset: mount every component in sequence, unmount,
//      force GC via CDP, take a heap snapshot, record retained size.
//   4. Compare against baseline. Above threshold = "leak in this subset".
//   5. Recurse.
//
// USAGE:
//   node mem-leak-bisect.mjs http://localhost:5173/__leak-harness "Button,Card,Chart,Modal,..."
//
// HARNESS REQUIREMENT (drop into your SvelteKit dev server):
//   src/routes/__leak-harness/+page.svelte:
//   &lt;script&gt;
//     import { mount, unmount } from 'svelte';
//     const components = import.meta.glob('/src/lib/components/**/*.svelte', { eager: true });
//     let current = null;
//     window.__mount = async (name) =&gt; {
//       const mod = Object.entries(components).find(([k]) =&gt; k.endsWith('/' + name + '.svelte'))?.[1];
//       if (!mod) throw new Error('Unknown component: ' + name);
//       current = mount(mod.default, { target: document.getElementById('host') });
//     };
//     window.__unmount = async () =&gt; { if (current) { await unmount(current); current = null; } };
//   &lt;/script&gt;
//   &lt;div id="host"&gt;&lt;/div&gt;

import { chromium } from 'playwright';

const HARNESS_URL = process.argv[2];
const SUSPECTS   = (process.argv[3] || '').split(',').filter(Boolean);
const LEAK_BYTES = Number(process.env.LEAK_BYTES_THRESHOLD || 512 * 1024); // 512 KB

if (!HARNESS_URL || !SUSPECTS.length) {
  console.error('usage: mem-leak-bisect.mjs &lt;harness-url&gt; &lt;comp1,comp2,...&gt;');
  process.exit(2);
}

const browser = await chromium.launch();
const ctx = await browser.newContext();
const page = await ctx.newPage();
const cdp = await ctx.newCDPSession(page);

await page.goto(HARNESS_URL, { waitUntil: 'networkidle' });
await cdp.send('HeapProfiler.enable');

async function forceGC() {
  await cdp.send('HeapProfiler.collectGarbage');
  await page.evaluate(() =&gt; new Promise(r =&gt; setTimeout(r, 100)));
  await cdp.send('HeapProfiler.collectGarbage');
}

async function retainedHeap() {
  await forceGC();
  const { usedSize } = await cdp.send('Runtime.getHeapUsage');
  return usedSize;
}

async function mountCycle(names) {
  for (const name of names) {
    await page.evaluate((n) =&gt; window.__mount(n), name);
    await page.evaluate(() =&gt; new Promise(r =&gt; setTimeout(r, 50)));
    await page.evaluate(() =&gt; window.__unmount());
  }
}

async function leakSize(subset) {
  const baseline = await retainedHeap();
  await mountCycle(subset);
  const after = await retainedHeap();
  return after - baseline;
}

// Stabilize the page; do a warm-up cycle that we discard.
console.log('Warming up…');
await mountCycle(SUSPECTS.slice(0, Math.min(3, SUSPECTS.length)));
await forceGC();

console.log(`Bisecting ${SUSPECTS.length} components, leak threshold = ${LEAK_BYTES} bytes`);

let lo = 0, hi = SUSPECTS.length - 1, round = 0;
while (lo &lt; hi) {
  round++;
  const mid = (lo + hi) &gt;&gt; 1;
  const subset = SUSPECTS.slice(lo, mid + 1);
  const leaked = await leakSize(subset);
  const verdict = leaked &gt; LEAK_BYTES ? 'LEAK' : 'clean';
  console.log(`round ${round}: subset [${lo}..${mid}] (${subset.length} comps) → ${leaked} bytes ${verdict}`);

  if (leaked &gt; LEAK_BYTES) {
    hi = mid;
  } else {
    lo = mid + 1;
  }
}

console.log('\n═══════════════════════════════════════════');
console.log(`Leaking component: ${SUSPECTS[lo]}`);
console.log('═══════════════════════════════════════════');

await browser.close();
</pre>

<h3>Why force-GC matters</h3>
<p>Without explicit <code>HeapProfiler.collectGarbage</code>, V8 keeps short-lived garbage around until <em>it</em> decides to collect. Your "leak" might just be deferred collection. Calling collect twice (the second pass finalizes weak references freed in the first) is the convention used by Chrome's own DevTools "Take heap snapshot" button.</p>

<h3>Tuning the threshold</h3>
<table class="cmp">
<tr><th>Symptom</th><th>Threshold to try</th><th>Why</th></tr>
<tr><td>"Tiny" leak: a forgotten listener</td><td>64–256 KB</td><td>Single closure + node retention; noisy below this floor.</td></tr>
<tr><td>Subscription leak (stores, observables)</td><td>256 KB–1 MB</td><td>Each cycle accumulates one closure per missed unsubscribe.</td></tr>
<tr><td>"Big" leak: detached DOM tree</td><td>1–10 MB</td><td>Whole subtrees pinned by a global ref.</td></tr>
<tr><td>Worker / canvas leak</td><td>10 MB+</td><td>Native-backed objects retain large GPU/CPU buffers.</td></tr>
</table>

<h3>Extending it: heap-snapshot diffing</h3>
<p>Want to know <em>what's being retained</em>, not just that something is? Replace <code>retainedHeap()</code> with a real snapshot and diff:</p>

<pre class="code" data-lang="javascript" data-title="snapshot-diff.mjs">async function takeSnapshot(label) {
  let chunks = '';
  const handler = ({ chunk }) =&gt; { chunks += chunk; };
  cdp.on('HeapProfiler.addHeapSnapshotChunk', handler);
  await cdp.send('HeapProfiler.takeHeapSnapshot', { reportProgress: false });
  cdp.off('HeapProfiler.addHeapSnapshotChunk', handler);
  await import('fs').then(fs =&gt; fs.writeFileSync(`heap-${label}.heapsnapshot`, chunks));
  return chunks.length; // returned size is a quick monotonic proxy
}
// Open both .heapsnapshot files in Chrome DevTools → Memory → "Comparison" view.
</pre>
</template>

<template data-page-title="Bisecting CSS &amp; Tailwind" data-part="III — File & Module">
<span class="badge">Part III · File & Module Bisection</span>
<h2 class="page-title">Bisecting CSS & Tailwind Regressions</h2>
<p class="lede">"The header looks wrong." Twenty stylesheets, hundreds of utilities, one broken rule. The bisection adapts: instead of a build pass/fail, your predicate is a visual diff.</p>

<h3>Setup: a baseline screenshot</h3>
<p>You need a reference image from when the page looked right. Capture it before you start:</p>

<pre class="code" data-lang="javascript" data-title="capture-baseline.mjs">// capture-baseline.mjs — run once on the last known-good commit.
import { chromium } from 'playwright';
const browser = await chromium.launch();
const page = await (await browser.newContext({ viewport: { width: 1280, height: 800 }})).newPage();
await page.goto('http://localhost:5173/');
await page.waitForLoadState('networkidle');
await page.screenshot({ path: 'baseline.png', fullPage: true });
await browser.close();
</pre>

<h3>The predicate: pixel diff with a tolerance</h3>

<pre class="code" data-lang="javascript" data-title="pixel-diff-predicate.mjs">#!/usr/bin/env node
// pixel-diff-predicate.mjs — exit 0 if current page matches baseline, 1 if not.
// Used both standalone and inside a bisection loop.
import { chromium } from 'playwright';
import pixelmatch from 'pixelmatch';
import { PNG } from 'pngjs';
import fs from 'fs';

const URL = process.env.URL || 'http://localhost:5173/';
const TOL_PIXELS = Number(process.env.TOL_PIXELS || 200);

const browser = await chromium.launch();
const page = await (await browser.newContext({ viewport: { width: 1280, height: 800 }})).newPage();
await page.goto(URL); await page.waitForLoadState('networkidle');
const current = await page.screenshot({ fullPage: true });
await browser.close();

const a = PNG.sync.read(fs.readFileSync('baseline.png'));
const b = PNG.sync.read(current);
const diff = new PNG({ width: a.width, height: a.height });
const changed = pixelmatch(a.data, b.data, diff.data, a.width, a.height, { threshold: 0.1 });

fs.writeFileSync('diff.png', PNG.sync.write(diff));
console.log(`changed pixels: ${changed} (tolerance: ${TOL_PIXELS})`);
process.exit(changed &gt; TOL_PIXELS ? 1 : 0);
</pre>

<h3>Bisecting Tailwind utility classes</h3>
<p>The exotic case: a long <code>class="…"</code> string in a component has 40 utilities. You added 8 recently. One of them is the culprit. The bisector takes the class list and binary-halves it, rewriting the component each round:</p>

<pre class="code" data-lang="javascript" data-title="bisect-tailwind-classes.mjs">#!/usr/bin/env node
// bisect-tailwind-classes.mjs
// Bisects which Tailwind class in a component's `class` attribute causes a regression.
// Rewrites the component in place each round, restores on exit.
//
// USAGE:
//   node bisect-tailwind-classes.mjs ./src/lib/Header.svelte
//   (script will prompt you to pick which `class="…"` attribute to bisect)
//
import fs from 'fs';
import { spawnSync } from 'child_process';

const file = process.argv[2];
const orig = fs.readFileSync(file, 'utf8');

// Find every class="…" occurrence.
const re = /class="([^"]+)"/g;
const matches = [...orig.matchAll(re)];
if (!matches.length) { console.error('No class attributes found.'); process.exit(2); }
matches.forEach((m, i) =&gt; console.log(`[${i}] ${m[1].slice(0, 80)}${m[1].length &gt; 80 ? '…' : ''}`));

const which = Number(process.argv[3] || 0);
const target = matches[which];
const classes = target[1].split(/\s+/).filter(Boolean);
console.log(`Bisecting ${classes.length} classes in attribute #${which}`);

process.on('exit', () =&gt; fs.writeFileSync(file, orig));
process.on('SIGINT', () =&gt; process.exit(130));

function applyKeep(keep) {
  const patched = orig.replace(target[0], `class="${keep.join(' ')}"`);
  fs.writeFileSync(file, patched);
}

function predicateFails() {
  const r = spawnSync('node', ['pixel-diff-predicate.mjs'], { stdio: 'inherit' });
  return r.status !== 0;
}

let lo = 0, hi = classes.length - 1;
while (lo &lt; hi) {
  const mid = (lo + hi) &gt;&gt; 1;
  const keepLower = classes.slice(0, mid + 1);
  applyKeep(keepLower);
  console.log(`testing classes [0..${mid}]`);
  if (predicateFails()) hi = mid; else lo = mid + 1;
}
applyKeep(classes); // restore full set before reporting
console.log(`\nCulprit class: "${classes[lo]}"`);
</pre>

<h3>When CSS bisection lies</h3>
<div class="callout bad">
<div class="callout-title">Watch out</div>
<p>CSS rules <em>interact</em>. Removing <code>flex</code> can mask a bug caused by <code>justify-between</code>. Class bisection assumes <em>independence</em>; in CSS that's often false. If the bisector lands on a class that "looks fine on its own," it's because that class enables a second, real culprit. Re-add the suggested class and bisect the rest of the list again — you'll find the partner.</p>
</div>
</template>

<template data-page-title="Bisecting Dependencies" data-part="IV — Dependency & Build">
<span class="badge">Part IV · Dependency & Build Bisection</span>
<h2 class="page-title">Bisecting <code class="no-style">package.json</code> Dependencies</h2>
<p class="lede">You ran <code>pnpm update</code>. Forty packages got bumped. The app no longer boots. Linear: bump them back one by one (40 reinstall cycles). Logarithmic: halve them — six reinstalls and you have the culprit.</p>

<h3>The pnpm-lock trick</h3>
<p>pnpm exposes <code>pnpm.overrides</code> in <code>package.json</code> and an <code>overrides</code> field in <code>pnpm-workspace.yaml</code>. We can use it to pin <em>half</em> the bumped packages back to their old versions and reinstall — without editing the lockfile by hand.</p>

<pre class="code" data-lang="javascript" data-title="dep-bisect.mjs">#!/usr/bin/env node
// dep-bisect.mjs
// Binary-search across recently-bumped dependencies to find the one that broke
// the app. Uses pnpm overrides to pin halves of the set back to known-good versions.
//
// PRECONDITIONS:
//   • A list of (name, oldVersion, newVersion) tuples. Build it from a diff
//     of `pnpm.lock` between the last green commit and HEAD, or pipe in
//     `pnpm outdated --json` from before the update.
//   • A predicate command (default: `pnpm build &amp;&amp; pnpm test --run`).
//
// USAGE:
//   node dep-bisect.mjs bumps.json "pnpm build &amp;&amp; pnpm test --run"
//
// bumps.json:
//   [
//     {"name": "vite", "old": "5.4.10", "new": "6.0.0"},
//     {"name": "svelte", "old": "5.0.0", "new": "5.1.4"},
//     ...
//   ]

import fs from 'fs';
import { spawnSync } from 'child_process';

const BUMPS = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
const PREDICATE = process.argv[3] || 'pnpm build';
const PKG = './package.json';

const originalPkg = fs.readFileSync(PKG, 'utf8');
process.on('exit', () =&gt; {
  fs.writeFileSync(PKG, originalPkg);
  spawnSync('pnpm', ['install', '--silent'], { stdio: 'inherit' });
});

function withOverrides(pinNames) {
  const pkg = JSON.parse(originalPkg);
  pkg.pnpm = pkg.pnpm || {};
  pkg.pnpm.overrides = Object.fromEntries(
    BUMPS.filter(b =&gt; pinNames.has(b.name)).map(b =&gt; [b.name, b.old])
  );
  fs.writeFileSync(PKG, JSON.stringify(pkg, null, 2));
  const r = spawnSync('pnpm', ['install', '--no-frozen-lockfile', '--silent'], { stdio: 'inherit' });
  if (r.status !== 0) throw new Error('install failed');
}

function runPredicate() {
  const r = spawnSync('sh', ['-c', PREDICATE], { stdio: 'inherit' });
  return r.status === 0;
}

console.log(`Bisecting ${BUMPS.length} dependency bumps`);

// Invariant we're searching for:
//   Pinning bump set S to their OLD versions makes the build work.
//   Smallest such S includes the culprit.
//
// Strategy: classical binary search across an ordered list of bumps.
// If pinning lower half WORKS, the culprit is in the lower half (one of those
// pins is necessary). If pinning lower half DOES NOT work, the culprit is in
// the upper half (and we'd need to also pin one of those).

let lo = 0, hi = BUMPS.length - 1, round = 0;
while (lo &lt; hi) {
  round++;
  const mid = (lo + hi) &gt;&gt; 1;
  const pinNames = new Set(BUMPS.slice(lo, mid + 1).map(b =&gt; b.name));
  console.log(`\nround ${round}: pinning [${lo}..${mid}] (${pinNames.size} pkgs)`);
  withOverrides(pinNames);
  if (runPredicate()) {
    // Pinning lower half fixed it → culprit is in lower half.
    hi = mid;
  } else {
    lo = mid + 1;
  }
}

console.log(`\nCulprit bump: ${BUMPS[lo].name}  ${BUMPS[lo].old} → ${BUMPS[lo].new}`);
</pre>

<h3>Building the <code>bumps.json</code> from a real update</h3>

<pre class="code" data-lang="shell" data-title="build-bumps-json.sh">#!/usr/bin/env bash
# Captures what `pnpm update` changed so dep-bisect.mjs can drive it.
set -euo pipefail

# 1) Snapshot current versions BEFORE updating.
node -e '
  const pkg = require("./package.json");
  const all = {...pkg.dependencies, ...pkg.devDependencies};
  process.stdout.write(JSON.stringify(all, null, 2));
' &gt; /tmp/versions-before.json

# 2) Update.
pnpm update --latest

# 3) Snapshot AFTER, diff.
node -e '
  const before = require("/tmp/versions-before.json");
  const pkg = require("./package.json");
  const after = {...pkg.dependencies, ...pkg.devDependencies};
  const bumps = Object.keys(after)
    .filter(n =&gt; before[n] &amp;&amp; before[n] !== after[n])
    .map(n =&gt; ({ name: n, old: before[n].replace(/^[~^]/, ""), new: after[n].replace(/^[~^]/, "") }));
  process.stdout.write(JSON.stringify(bumps, null, 2));
' &gt; bumps.json

echo "Wrote bumps.json with $(jq length bumps.json) entries"
</pre>

<h3>The transitive-dependency caveat</h3>
<p>Sometimes the broken package is a <em>transitive</em> dep: your direct deps are fine, but one of them now pulls in a broken sub-dep. Detect this by also bisecting <code>pnpm-lock.yaml</code> directly — check out the lockfile from the last green commit, install, and confirm the bug disappears. If it does, the culprit is a transitive bump; widen <code>bumps.json</code> to include every changed entry in <code>pnpm-lock.yaml</code>, not just direct deps.</p>

<pre class="code" data-lang="shell" data-title="dep-bisect-transitive.sh"># Extract every package whose version differs between two lockfile commits.
git show HEAD~1:pnpm-lock.yaml &gt; /tmp/lock.old
git show HEAD:pnpm-lock.yaml   &gt; /tmp/lock.new

node -e '
  const yaml = require("yaml");
  const fs = require("fs");
  const old = yaml.parse(fs.readFileSync("/tmp/lock.old", "utf8")).packages || {};
  const neu = yaml.parse(fs.readFileSync("/tmp/lock.new", "utf8")).packages || {};
  const bumps = [];
  for (const k of Object.keys(neu)) {
    if (old[k]) continue;
    // pnpm lock keys look like /react@18.3.1
    const m = k.match(/^\/(.+)@([^\/]+)/);
    if (!m) continue;
    const [, name, version] = m;
    const oldKey = Object.keys(old).find(o =&gt; o.startsWith("/" + name + "@"));
    if (!oldKey) continue;
    const oldV = oldKey.match(/@([^\/]+)$/)[1];
    if (oldV !== version) bumps.push({ name, old: oldV, new: version });
  }
  process.stdout.write(JSON.stringify(bumps, null, 2));
' &gt; bumps-transitive.json
</pre>
</template>

<template data-page-title="Bisecting TypeScript Config" data-part="IV — Dependency & Build">
<span class="badge">Part IV · Dependency & Build Bisection</span>
<h2 class="page-title">Bisecting <code class="no-style">tsconfig.json</code> Compiler Options</h2>
<p class="lede">You turned on <code>"strict": true</code>. 1,500 errors. Which sub-flag is doing the damage? You could just narrow them one at a time. Or you can bisect the option set in 4 rounds.</p>

<h3>The strict flag set</h3>
<p>Under the hood, <code>strict: true</code> enables a known list of sub-flags. TypeScript 5.6+ uses this set (verify with <code>tsc --showConfig</code>):</p>
<table class="cmp">
<tr><th>Flag</th><th>Typical error count when turned on</th></tr>
<tr><td><code>noImplicitAny</code></td><td>Often the largest hit on legacy code.</td></tr>
<tr><td><code>strictNullChecks</code></td><td>Universally large; the most valuable.</td></tr>
<tr><td><code>strictFunctionTypes</code></td><td>Rare hits unless using complex callbacks.</td></tr>
<tr><td><code>strictBindCallApply</code></td><td>Rare. Usually clean.</td></tr>
<tr><td><code>strictPropertyInitialization</code></td><td>Class-heavy codebases.</td></tr>
<tr><td><code>noImplicitThis</code></td><td>Mostly old-school <code>function() { this… }</code> code.</td></tr>
<tr><td><code>alwaysStrict</code></td><td>Almost never an error source.</td></tr>
<tr><td><code>useUnknownInCatchVariables</code></td><td>Catch handlers using <code>err.message</code>.</td></tr>
</table>

<h3>The bisector</h3>

<pre class="code" data-lang="javascript" data-title="tsconfig-bisect.mjs">#!/usr/bin/env node
// tsconfig-bisect.mjs
// Bisects which of a list of compiler options is responsible for a build failure.
//
// USAGE:
//   node tsconfig-bisect.mjs '["noImplicitAny","strictNullChecks","strictFunctionTypes",...]'
//
import fs from 'fs';
import { spawnSync } from 'child_process';

const OPTIONS = JSON.parse(process.argv[2]);
const CFG = './tsconfig.json';

const original = fs.readFileSync(CFG, 'utf8');
process.on('exit', () =&gt; fs.writeFileSync(CFG, original));

function apply(enabled) {
  const cfg = JSON.parse(original);
  cfg.compilerOptions = cfg.compilerOptions || {};
  // Reset every option in OPTIONS to false, then enable only `enabled`.
  for (const o of OPTIONS) cfg.compilerOptions[o] = false;
  for (const o of enabled) cfg.compilerOptions[o] = true;
  // Make sure umbrella `strict` isn't masking us.
  cfg.compilerOptions.strict = false;
  fs.writeFileSync(CFG, JSON.stringify(cfg, null, 2));
}

function buildFails() {
  const r = spawnSync('pnpm', ['exec', 'tsc', '--noEmit'], { stdio: 'pipe' });
  return r.status !== 0;
}

console.log(`Bisecting ${OPTIONS.length} compiler options`);

// Confirm: enabling ALL options fails; enabling NONE passes.
apply(OPTIONS);
if (!buildFails()) { console.log('All options on → still passes. Nothing to find.'); process.exit(0); }
apply([]);
if (buildFails())  { console.log('No options on → still fails. The bug is elsewhere.'); process.exit(0); }

let lo = 0, hi = OPTIONS.length - 1;
while (lo &lt; hi) {
  const mid = (lo + hi) &gt;&gt; 1;
  apply(OPTIONS.slice(lo, mid + 1));
  console.log(`testing [${OPTIONS.slice(lo, mid + 1).join(', ')}]`);
  if (buildFails()) hi = mid; else lo = mid + 1;
}
console.log(`\nCulprit option: ${OPTIONS[lo]}`);
</pre>

<h3>When multiple options interact</h3>
<p>Some flags only error <em>in combination</em>. <code>strictNullChecks</code> + <code>exactOptionalPropertyTypes</code> together produce errors neither produces alone. After the bisector lands, try toggling its companion flags one at a time on top — that's a quick sanity check for interaction.</p>

<h3>Same idea, JS engines: bisecting <code>NODE_OPTIONS</code></h3>
<pre class="code" data-lang="shell" data-title="bisect-node-flags.sh">#!/usr/bin/env bash
# Bisect which V8/Node flag in a long NODE_OPTIONS string causes a regression.
set -euo pipefail

FLAGS=(--experimental-vm-modules --enable-source-maps --no-warnings \
       --max-old-space-size=8192 --experimental-fetch --trace-deprecation \
       --inspect-publish-uid=stderr)

PREDICATE="pnpm test --run"

lo=0; hi=$(( ${#FLAGS[@]} - 1 ))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  subset=("${FLAGS[@]:lo:mid-lo+1}")
  NODE_OPTIONS="${subset[*]}" $PREDICATE &gt;/dev/null 2&gt;&amp;1 \
    &amp;&amp; lo=$((mid + 1)) || hi=$mid
  echo "narrowed to [$lo..$hi]"
done
echo "Culprit flag: ${FLAGS[$lo]}"
</pre>
</template>

<template data-page-title="Bisecting Vite Plugins" data-part="IV — Dependency & Build">
<span class="badge">Part IV · Dependency & Build Bisection</span>
<h2 class="page-title">Bisecting Vite (or Webpack) Plugins</h2>
<p class="lede">Your build was healthy until you added six plugins for analytics, sentry, MDsveX, image optimization, GraphQL codegen, and PWA. Build is now 4× slower or breaks. Which plugin?</p>

<h3>The bisector</h3>

<pre class="code" data-lang="javascript" data-title="vite-plugin-bisect.mjs">#!/usr/bin/env node
// vite-plugin-bisect.mjs
// Edits vite.config.js to binary-halve the plugins array, runs `pnpm build`,
// and reports the culprit. Restores the file on exit.
//
// REQUIRED MARKER in your vite.config.js:
//   plugins: [
//     /* @bisect:begin */
//     pluginA(),
//     pluginB(),
//     pluginC(),
//     /* @bisect:end */
//   ],
//
import fs from 'fs';
import { spawnSync } from 'child_process';

const FILE = 'vite.config.js';
const original = fs.readFileSync(FILE, 'utf8');
process.on('exit', () =&gt; fs.writeFileSync(FILE, original));

const begin = original.indexOf('/* @bisect:begin */');
const end   = original.indexOf('/* @bisect:end */');
if (begin === -1 || end === -1) {
  console.error('Add /* @bisect:begin */ … /* @bisect:end */ markers around the plugins array.');
  process.exit(2);
}

const head = original.slice(0, begin + '/* @bisect:begin */'.length);
const tail = original.slice(end);
const middle = original.slice(begin + '/* @bisect:begin */'.length, end);

// Split on commas at depth 0.
const plugins = [];
let depth = 0, current = '';
for (const ch of middle) {
  if (ch === '(' || ch === '[' || ch === '{') depth++;
  if (ch === ')' || ch === ']' || ch === '}') depth--;
  if (ch === ',' &amp;&amp; depth === 0) {
    if (current.trim()) plugins.push(current.trim());
    current = '';
  } else current += ch;
}
if (current.trim()) plugins.push(current.trim());

console.log(`Found ${plugins.length} plugins to bisect.`);

function withPlugins(list) {
  fs.writeFileSync(FILE, head + '\n' + list.join(',\n') + (list.length ? ',\n' : '') + tail);
}

function buildOk() {
  return spawnSync('pnpm', ['build'], { stdio: 'inherit' }).status === 0;
}

let lo = 0, hi = plugins.length - 1;
while (lo &lt; hi) {
  const mid = (lo + hi) &gt;&gt; 1;
  withPlugins(plugins.slice(lo, mid + 1));
  console.log(`testing plugins [${lo}..${mid}]`);
  if (buildOk()) lo = mid + 1; else hi = mid;
}
console.log(`\nCulprit plugin: ${plugins[lo]}`);
</pre>

<h3>For Webpack</h3>
<p>The same technique works against a <code>webpack.config.js</code> — just point at the <code>module.exports.plugins</code> array. Module-rule bisection is a useful variant: split <code>module.rules</code> in halves to find the loader chain that's choking.</p>

<h3>Plugin ordering is real</h3>
<div class="callout">
<div class="callout-title">Gotcha</div>
<p>Vite/Webpack plugins often <em>depend</em> on order. A bisection that removes plugins from the middle changes the order relative to surrounding plugins. If your build relies on (say) <code>vite-plugin-svelte</code> running before <code>vite-plugin-mdx</code>, bisection can find a "culprit" that is really just an ordering victim. To rule this out: when the bisector lands, manually re-add the suspect at its original position and confirm the failure still reproduces.</p>
</div>
</template>

<template data-page-title="Bisecting Flaky Tests" data-part="V — Test & Performance">
<span class="badge">Part V · Test & Performance Bisection</span>
<h2 class="page-title">Bisecting a Flaky Test (finding the polluter)</h2>
<p class="lede">A test passes in isolation. It fails when the full suite runs. Some <em>other</em> test is polluting global state (the DOM, the network mock registry, a singleton). We'll find the polluter by bisecting which subset of the suite, run before the suspect, causes the failure.</p>

<h3>The setup</h3>
<ol>
  <li>Identify the failing test (call it <code>tests/auth/session.test.ts</code>).</li>
  <li>List every other test file, in the order vitest runs them.</li>
  <li>Bisect: run halves of "everything before", then the suspect. The half that reproduces contains the polluter.</li>
</ol>

<h3>The bisector</h3>

<pre class="code" data-lang="shell" data-title="flaky-test-bisect.sh">#!/usr/bin/env bash
# flaky-test-bisect.sh
# Find which earlier test pollutes global state and makes a suspect test flake.
#
# USAGE:
#   ./flaky-test-bisect.sh tests/auth/session.test.ts
#
# OUTPUT:
#   Path of the polluting test file.
#
set -euo pipefail

SUSPECT="${1:?usage: $0 &lt;suspect-test-file&gt;}"

# Get the canonical order vitest uses, excluding the suspect.
mapfile -t SUITE &lt; &lt;(
  pnpm exec vitest list --reporter=json 2&gt;/dev/null \
    | jq -r '.testModules[].moduleId' \
    | grep -v -F "$SUSPECT"
)
N="${#SUITE[@]}"
echo "Suite has $N tests before $SUSPECT"

# Confirm: running suspect ALONE passes.
if ! pnpm exec vitest run "$SUSPECT" --reporter=dot &gt;/dev/null 2&gt;&amp;1; then
  echo "Suspect fails in isolation — not a pollution flake. Stopping."
  exit 1
fi
# Confirm: running suite + suspect together FAILS.
if pnpm exec vitest run "${SUITE[@]}" "$SUSPECT" --reporter=dot &gt;/dev/null 2&gt;&amp;1; then
  echo "Suite + suspect passes — not reproducible. Stopping."
  exit 0
fi

lo=0; hi=$((N - 1)); round=0
while (( lo &lt; hi )); do
  round=$((round + 1))
  mid=$(( (lo + hi) / 2 ))
  before=("${SUITE[@]:lo:mid-lo+1}")
  echo "round $round: running ${#before[@]} tests before suspect (indices $lo..$mid)"
  if pnpm exec vitest run "${before[@]}" "$SUSPECT" --reporter=dot &gt;/dev/null 2&gt;&amp;1; then
    # Lower half didn't reproduce → polluter is in upper half.
    lo=$((mid + 1))
  else
    hi=$mid
  fi
done
echo
echo "Polluter: ${SUITE[$lo]}"
</pre>

<h3>What pollution looks like</h3>
<p>Once you have the polluter, look for the usual suspects (the irony):</p>
<ul>
  <li><strong>Unrestored globals:</strong> <code>globalThis.fetch</code>, <code>window.location</code>, <code>document.body.innerHTML</code> overwritten and never reset.</li>
  <li><strong>Module-level state:</strong> a service module that lazily caches a config object on first call — and the polluter sets it to test mode.</li>
  <li><strong>Network mock registry:</strong> MSW handlers added without <code>server.resetHandlers()</code> in <code>afterEach</code>.</li>
  <li><strong>Timer/zone leaks:</strong> a <code>setInterval</code> the polluter starts and never clears.</li>
  <li><strong>Database/transaction leaks:</strong> a rolled-back transaction that didn't actually roll back because of nested savepoints.</li>
</ul>

<h3>Bisecting <em>within</em> the polluter</h3>
<p>If the polluter is large, recurse: bisect which test <em>case</em> inside the polluter file does the damage. Vitest exposes per-test isolation via the <code>--testNamePattern</code> flag, so the inner loop is symmetric.</p>

<pre class="code" data-lang="shell" data-title="bisect-within-file.sh"># Bisect across test names inside one polluter file.
POLLUTER="$1"; SUSPECT="$2"
mapfile -t NAMES &lt; &lt;(
  pnpm exec vitest list --reporter=json "$POLLUTER" \
    | jq -r '.testModules[0].tasks[].name'
)
lo=0; hi=$((${#NAMES[@]} - 1))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  pattern=$(IFS='|'; echo "${NAMES[*]:lo:mid-lo+1}")
  if pnpm exec vitest run "$POLLUTER" -t "$pattern" "$SUSPECT" &gt;/dev/null 2&gt;&amp;1; then
    lo=$((mid + 1))
  else
    hi=$mid
  fi
done
echo "Polluting test case: ${NAMES[$lo]}"
</pre>
</template>

<template data-page-title="Bisecting Performance Regressions" data-part="V — Test & Performance">
<span class="badge">Part V · Test & Performance Bisection</span>
<h2 class="page-title">Bisecting a Performance Regression</h2>
<p class="lede">The build was 6 seconds. Now it's 22. Or the API p95 was 80 ms; now it's 600. Same bisection, with a numeric predicate: "did the benchmark cross the threshold?"</p>

<h3>The predicate</h3>

<pre class="code" data-lang="shell" data-title="perf-bisect-predicate.sh">#!/usr/bin/env bash
# perf-bisect-predicate.sh
# Returns 0 (good) if benchmark p50 ≤ BUDGET_MS, 1 (bad) if over, 125 if can't run.
# Designed for `git bisect run`.
#
# REQUIREMENTS: hyperfine, jq.
set -uo pipefail

BUDGET_MS="${BUDGET_MS:-10000}"
COMMAND="${COMMAND:-pnpm build}"
WARMUPS=3
RUNS=5

# Skip if install/build can't even start.
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125

# Run the benchmark; emit JSON for jq.
if ! hyperfine --warmup "$WARMUPS" --runs "$RUNS" --export-json /tmp/bench.json \
     "$COMMAND" &gt;/tmp/bench.log 2&gt;&amp;1; then
  exit 125
fi

# hyperfine reports mean/median in seconds.
P50_MS=$(jq '.results[0].median * 1000 | round' /tmp/bench.json)
echo "median: ${P50_MS} ms (budget ${BUDGET_MS} ms)"

if (( P50_MS &gt; BUDGET_MS )); then exit 1; else exit 0; fi
</pre>

<h3>Driving the bisection</h3>
<pre class="code" data-lang="shell" data-title="drive-perf-bisect.sh">#!/usr/bin/env bash
# Find the commit that crossed the performance budget.
set -euo pipefail

BAD="${1:-HEAD}"
GOOD="${2:?usage: $0 &lt;bad&gt; &lt;good&gt; [budget-ms] [command]}"
BUDGET_MS="${3:-10000}"
COMMAND="${4:-pnpm build}"

export BUDGET_MS COMMAND

git bisect start "$BAD" "$GOOD"
git bisect run ./perf-bisect-predicate.sh | tee /tmp/perf-bisect.log
git bisect reset
</pre>

<h3>Statistical care</h3>
<p>Performance numbers are inherently noisy. The threshold trick works only when the regression is much larger than the noise. Two guards:</p>
<ul>
  <li><strong>Set the budget halfway between known-good and known-bad medians.</strong> If good is 6s and bad is 22s, use 14s. Big margin = stable verdict.</li>
  <li><strong>Use hyperfine's <code>--runs</code> and the <em>median</em>, not mean.</strong> One stray cosmic ray can blow your average. Median ignores it.</li>
</ul>

<h3>Per-route API benchmark predicate</h3>

<pre class="code" data-lang="shell" data-title="api-perf-predicate.sh">#!/usr/bin/env bash
# Boot the server in the background, fire k6 against it, threshold p95.
set -uo pipefail

# Start the server.
pnpm start &amp;&gt;/tmp/server.log &amp;
PID=$!
trap 'kill $PID 2&gt;/dev/null || true' EXIT

# Wait for readiness (10s timeout).
for i in {1..20}; do
  curl -sf http://localhost:3000/health &gt;/dev/null &amp;&amp; break
  sleep 0.5
done

# Run a 20-second k6 test.
k6 run --quiet --duration 20s --vus 50 --summary-export=/tmp/k6.json - &lt;&lt;'JS'
import http from 'k6/http';
import { sleep } from 'k6';
export default function () {
  http.get('http://localhost:3000/api/products');
  sleep(0.1);
}
JS

P95_MS=$(jq '.metrics.http_req_duration["p(95)"] | round' /tmp/k6.json)
BUDGET_MS="${API_BUDGET_MS:-200}"
echo "p95 ${P95_MS}ms (budget ${BUDGET_MS}ms)"

(( P95_MS &gt; BUDGET_MS )) &amp;&amp; exit 1 || exit 0
</pre>
</template>

<template data-page-title="Bisecting Server Memory Leaks" data-part="V — Test & Performance">
<span class="badge">Part V · Test & Performance Bisection</span>
<h2 class="page-title">Bisecting Memory Leaks in Long-Running Node Servers</h2>
<p class="lede">Your Node API server's RSS grows ~50 MB per hour in production. It restarts before OOM and nobody notices for a sprint. We'll bisect <em>which routes</em> leak by halving the route table under synthetic load and watching heap retained size with <code>clinic heapprofiler</code>.</p>

<h3>The architecture</h3>
<p>One Node process under test. A wrapper script that loads a configurable subset of routes (driven by an env var). A synthetic load generator (autocannon) that hits every loaded route. A monitor that polls <code>process.memoryUsage()</code> and exits with a verdict.</p>

<pre class="code" data-lang="javascript" data-title="server-with-route-subset.mjs">// server-with-route-subset.mjs
// Boots the app but only mounts the routes listed in ROUTES env var.
//
// In your app code, separate route registration from server start:
//   export const allRoutes = [
//     { path: '/api/users',    handler: userRouter },
//     { path: '/api/products', handler: productRouter },
//     ...
//   ];
//
import { createServer } from 'http';
import express from 'express';
import { allRoutes } from './app.js';

const SUBSET = (process.env.ROUTES || '').split(',').filter(Boolean);
const routes = SUBSET.length
  ? allRoutes.filter(r =&gt; SUBSET.includes(r.path))
  : allRoutes;

const app = express();
for (const { path, handler } of routes) app.use(path, handler);
app.get('/__health', (_req, res) =&gt; res.json({ ok: true, routes: routes.map(r =&gt; r.path) }));

createServer(app).listen(3000, () =&gt; {
  console.log(`Listening with ${routes.length} routes: ${routes.map(r=&gt;r.path).join(',')}`);
});
</pre>

<h3>The leak detector</h3>

<pre class="code" data-lang="javascript" data-title="server-leak-bisect.mjs">#!/usr/bin/env node
// server-leak-bisect.mjs
// Binary-search across routes to find the one that leaks memory under load.
//
// USAGE:
//   node server-leak-bisect.mjs '/api/users,/api/products,/api/orders,/api/auth,...'
//
import { spawn } from 'child_process';
import { setTimeout as sleep } from 'timers/promises';

const ROUTES = process.argv[2].split(',').filter(Boolean);
const LEAK_MB_PER_MIN = Number(process.env.LEAK_MB_PER_MIN || 25);

async function runOne(subset) {
  return new Promise((resolve, reject) =&gt; {
    const env = { ...process.env, ROUTES: subset.join(',') };
    const server = spawn('node', ['server-with-route-subset.mjs'], { env, stdio: 'pipe' });
    server.stderr.on('data', d =&gt; process.stderr.write(d));

    let samples = [];
    let load = null;

    (async () =&gt; {
      await sleep(1000); // let server boot
      load = spawn('autocannon', ['-c', '50', '-d', '60', '-R', '500', 'http://localhost:3000'],
                   { stdio: 'ignore' });

      // Sample heap every 5s for 60s via /__health-extended? Simpler: poll RSS via /proc.
      for (let t = 0; t &lt; 60; t += 5) {
        await sleep(5000);
        try {
          const status = await import('fs').then(fs =&gt; fs.promises.readFile(`/proc/${server.pid}/status`, 'utf8'));
          const m = status.match(/VmRSS:\s+(\d+)/);
          if (m) samples.push(Number(m[1]) / 1024); // MB
        } catch {}
      }

      try { load.kill('SIGTERM'); } catch {}
      try { server.kill('SIGTERM'); } catch {}

      if (samples.length &lt; 6) return reject(new Error('Not enough samples'));
      const slope = (samples.at(-1) - samples[0]) / (samples.length * 5 / 60); // MB / min
      resolve(slope);
    })().catch(reject);
  });
}

console.log(`Bisecting ${ROUTES.length} routes; leak threshold ${LEAK_MB_PER_MIN} MB/min`);

let lo = 0, hi = ROUTES.length - 1;
while (lo &lt; hi) {
  const mid = (lo + hi) &gt;&gt; 1;
  const subset = ROUTES.slice(lo, mid + 1);
  console.log(`subset [${lo}..${mid}]: ${subset.join(',')}`);
  const slope = await runOne(subset);
  console.log(`  slope: ${slope.toFixed(1)} MB/min`);
  if (slope &gt; LEAK_MB_PER_MIN) hi = mid; else lo = mid + 1;
}
console.log(`\nLeaking route: ${ROUTES[lo]}`);
</pre>

<h3>Once you have the route — find the line</h3>
<p>Now <code>clinic heapprofiler</code> on the isolated route narrows further:</p>

<pre class="code" data-lang="shell" data-title="clinic-heap.sh"># Profile only the suspect route.
ROUTES="/api/orders" pnpm exec clinic heapprofiler -- node server-with-route-subset.mjs &amp;
sleep 2

# Drive the route for 90 seconds.
autocannon -c 30 -d 90 -R 200 http://localhost:3000/api/orders

# Stop the server; clinic opens the heap profile in a browser.
kill %1 2&gt;/dev/null
wait
</pre>

<p>In the clinic UI, sort by "retained" and look at the call stack. Almost always you'll find a closure capturing a request-scoped variable into a process-scoped Map.</p>
</template>

<template data-page-title="Bash — Simple to Intermediate" data-part="VI — Bash Toolkit">
<span class="badge">Part VI · Bash Toolkit</span>
<h2 class="page-title">Bash Bisection — Simple to Intermediate</h2>
<p class="lede">Every Linux/macOS machine has Bash. The patterns on this page assume nothing else — no jq, no fd, just GNU coreutils and bash 4+. They are the bedrock you reach for when you're SSH'd into a stranger's box at 2am.</p>

<h3>Level 1: a single-glob, single-predicate halver</h3>

<pre class="code" data-lang="shell" data-title="bash-l1-halve.sh">#!/usr/bin/env bash
# bash-l1-halve.sh
# The smallest useful bisector. Halve a glob, run a predicate, narrow.
# Bash 4+ required (for `shopt -s globstar`).

set -euo pipefail
shopt -s globstar nullglob

PRED="${1:?usage: $0 &lt;predicate&gt; &lt;glob&gt;}"
GLOB="${2:?missing glob}"

# Bash's `**/` requires globstar; word-split on whitespace into an array.
mapfile -t FILES &lt; &lt;(printf '%s\n' $GLOB | sort)
echo "candidates: ${#FILES[@]}"

lo=0; hi=$(( ${#FILES[@]} - 1 ))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  half=("${FILES[@]:lo:mid-lo+1}")
  if $PRED "${half[@]}" &gt;/dev/null 2&gt;&amp;1; then
    lo=$((mid + 1))
  else
    hi=$mid
  fi
done
echo "culprit: ${FILES[$lo]}"
</pre>

<h3>Level 2: <code>mapfile</code> from a command (no glob hard-coded)</h3>

<pre class="code" data-lang="shell" data-title="bash-l2-mapfile.sh">#!/usr/bin/env bash
# bash-l2-mapfile.sh
# Source the candidate list from any command — git, find, etc.
#
# USAGE:
#   ./bash-l2-mapfile.sh "git ls-files '*.svelte'" "pnpm exec svelte-check"
set -euo pipefail

LIST_CMD="${1:?usage: $0 &lt;list-cmd&gt; &lt;predicate&gt;}"
PRED="${2:?missing predicate}"

mapfile -t FILES &lt; &lt;(eval "$LIST_CMD" | sort -u)
N="${#FILES[@]}"
echo "Candidates: $N"

# Process substitution `&lt; &lt;(…)` keeps the variables in the parent shell — a
# pipeline `cmd | while read` would not, because the loop runs in a subshell
# and its variable assignments would be lost. This is the most-asked Bash
# bisection bug. Use &lt; &lt;(…), not | while.

lo=0; hi=$((N - 1)); round=0
while (( lo &lt; hi )); do
  round=$((round + 1))
  mid=$(( (lo + hi) / 2 ))
  half=("${FILES[@]:lo:mid-lo+1}")
  printf 'round %2d  [%4d..%4d]  %d files  ' "$round" "$lo" "$mid" "${#half[@]}"
  if $PRED "${half[@]}" &gt;/dev/null 2&gt;&amp;1; then
    echo "good"
    lo=$((mid + 1))
  else
    echo "bad"
    hi=$mid
  fi
done
echo "==&gt; culprit: ${FILES[$lo]}"
</pre>

<h3>Level 3: command substitution patterns you'll use a lot</h3>

<pre class="code" data-lang="shell" data-title="bash-l3-patterns.sh">#!/usr/bin/env bash
# A grab-bag of Bash idioms that come up constantly in bisection scripts.

# 1) Read a list of files NUL-separated (handles spaces, newlines in names).
mapfile -d '' -t FILES &lt; &lt;(git ls-files -z '*.svelte')

# 2) Run a predicate against each file in parallel, fail-fast on first failure.
printf '%s\0' "${FILES[@]}" | xargs -0 -n 1 -P 8 \
  bash -c 'pnpm exec svelte-check --filter "$0" &gt;/dev/null 2&gt;&amp;1 || { echo "FAIL: $0"; exit 1; }'

# 3) Compute a SHA of a set of files (for memoization keys).
KEY=$(printf '%s\n' "${FILES[@]}" | sort | sha256sum | cut -c1-12)

# 4) Difference between two arrays (e.g. "all files except suspect set").
all=( "${ALL_FILES[@]}" )
suspects=( "${SUSPECTS[@]}" )
others=()
declare -A in_suspects
for s in "${suspects[@]}"; do in_suspects["$s"]=1; done
for f in "${all[@]}"; do [[ -z "${in_suspects[$f]:-}" ]] &amp;&amp; others+=( "$f" ); done

# 5) Run a command with a deadline.
timeout 30s "$PRED" "$@"
case $? in
  0)   echo "passed";;
  1)   echo "failed";;
  124) echo "TIMED OUT — count as bad? or skip?";;
esac

# 6) Save &amp; restore git state around any bisection that edits the worktree.
trap 'git stash pop &gt;/dev/null 2&gt;&amp;1 || true' EXIT
git stash push -u -m "bisect-runtime" &gt;/dev/null
# … run experimental bisection that edits files …
</pre>

<h3>Level 4: a resumable bisector with state file</h3>

<pre class="code" data-lang="shell" data-title="bash-l4-resumable.sh">#!/usr/bin/env bash
# bash-l4-resumable.sh
# A bisector that persists its (lo, hi) state to /tmp/bisect.state so you can
# Ctrl-C, drink coffee, fix your predicate, and continue.
#
# USAGE:
#   ./bash-l4-resumable.sh start "&lt;list-cmd&gt;" "&lt;predicate&gt;"
