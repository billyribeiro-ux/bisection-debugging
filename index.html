<p><strong>Cost:</strong> Once you've applied migration #45, you can't bisect to a commit that expected #44. Bisection ranges are bounded by the oldest reversible migration.</p>
<p><strong>Fix:</strong> Every migration must have a tested rollback. Migrations that can't be reverted (irreversible data loss) are a code smell — refactor to add a parallel schema and migrate data, then drop the old after a cooldown.</p>

<h3>10. The Inherited-State Test</h3>
<p><strong>Smell:</strong> A test that requires "the database to be in some state" before running, set up manually by an earlier developer.</p>
<p><strong>Cost:</strong> When you bisect this test, you can't reproduce the inherited state at each commit. The test fails for reasons unrelated to the bisection.</p>
<p><strong>Fix:</strong> Tests own their setup. The test creates whatever state it needs from scratch, in isolation, every time. Setup must be a function of the test, not of the environment.</p>

<h3>A self-audit checklist</h3>
<pre class="code" data-lang="markdown" data-title="anti-pattern-checklist.md"># Anti-Bisection Pattern Audit

For each repo you maintain, check:

[ ] Average PR size below 500 LOC?
[ ] Squash-merge used judiciously, not universally?
[ ] main branch protected from force-push?
[ ] Environment variables logged at predicate start?
[ ] Tests pass under randomized order?
[ ] Generated files NOT committed (except lockfiles)?
[ ] Two builds of the same commit are bitwise identical?
[ ] Frontend can run against multiple backend versions?
[ ] Every migration has a tested rollback?
[ ] Tests don't rely on inherited state?

Each unchecked box ≈ one future bisection that will mislead you.
</pre>

<div class="callout">
<div class="callout-title">The pattern that creates patterns</div>
<p>The root cause of most anti-bisection patterns is the same: <em>optimizing for the speed of writing the code, at the expense of the speed of debugging it later</em>. A 2-day saving when writing a feature can cost 2 weeks when bisecting a regression six months later. The senior engineer's discipline is the willingness to take a small upfront cost — atomic commits, reversible migrations, hermetic tests — for a far larger return at debug time. It's compound interest, paid in patience now, redeemed in calm when the on-call page fires.</p>
</div>
</template>

<template data-page-title="Game Day — A Runnable Bisection Workshop" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">Game Day — A Three-Hour Bisection Workshop You Can Run</h2>
<p class="lede">Skills are built by deliberate practice, not by reading. This page is a complete, runnable workshop format for raising your team's bisection skills in a single afternoon. The setup script builds a practice repository with three known bugs at known commits, so the facilitator knows the answers and can coach in real time.</p>

<h3>The workshop in one sentence</h3>
<p>Six engineers, three hours, one buggy repo with three known regressions, three escalating bisection exercises, fifteen-minute retrospective. Output: each engineer has run a full automated bisection at least twice and has a personal action list.</p>

<h3>The agenda</h3>

<table class="cmp">
<tr><th>Time</th><th>Block</th><th>What happens</th></tr>
<tr><td>00:00 — 00:15</td><td>Frame the day</td><td>Facilitator introduces the goals, the repo, and how the predicate works.</td></tr>
<tr><td>00:15 — 00:45</td><td>Round 1 — solo manual</td><td>Each engineer runs <code>git bisect</code> manually on bug #1. Timed.</td></tr>
<tr><td>00:45 — 01:15</td><td>Round 2 — solo automated</td><td>Each engineer writes a predicate and runs <code>git bisect run</code> on bug #2.</td></tr>
<tr><td>01:15 — 01:25</td><td>Coffee break</td><td>—</td></tr>
<tr><td>01:25 — 02:25</td><td>Round 3 — pair, with a curveball</td><td>Pairs bisect bug #3 — but it's a multi-flag interaction (ddmin required).</td></tr>
<tr><td>02:25 — 02:55</td><td>Retrospective</td><td>Each engineer writes one thing they learned, one habit they'll change, one tool they want to try.</td></tr>
<tr><td>02:55 — 03:00</td><td>Wrap</td><td>Facilitator collects retro notes; commits to a follow-up session in 4 weeks.</td></tr>
</table>

<h3>The setup script</h3>
<pre class="code" data-lang="shell" data-title="game-day-setup.sh">#!/usr/bin/env bash
# game-day-setup.sh
# Generates a practice repo with three known-bad commits planted in a
# history of harmless commits. Use this as the warm-up before a bisection
# workshop.
#
# Output: ./game-day-repo (a git repo ready to clone for each participant)
#
# THE THREE BUGS:
#   Bug A — single-commit, in-source: ~commit 47 of ~100, simple regression
#   Bug B — single-commit, requires a predicate: ~commit 73, asymptotic perf
#   Bug C — multi-flag interaction: only fires with FLAG_X + FLAG_Y both on
#
set -euo pipefail
DEST="${1:-./game-day-repo}"
rm -rf "$DEST" &amp;&amp; mkdir "$DEST" &amp;&amp; cd "$DEST"

git init -q
git config user.name "Game Day"
git config user.email "gameday@example.com"

# Initial commit.
cat &gt; calculator.mjs &lt;&lt;'EOF'
export function add(a, b) { return a + b; }
export function sub(a, b) { return a - b; }
export function mul(a, b) { return a * b; }
export function div(a, b) { return a / b; }
EOF
cat &gt; test.mjs &lt;&lt;'EOF'
import { add, sub, mul, div } from './calculator.mjs';
console.assert(add(2, 3) === 5);
console.assert(sub(5, 2) === 3);
console.assert(mul(4, 5) === 20);
console.assert(div(10, 2) === 5);
console.log('OK');
EOF
git add . &amp;&amp; git commit -q -m "feat: initial calculator"

# 99 noise commits + 3 bugs planted at predictable positions.
for i in $(seq 1 99); do
  echo "// noise $i" &gt;&gt; calculator.mjs
  case $i in
    47)  # BUG A: regression in sub
      sed -i 's/return a - b/return a + b/' calculator.mjs
      MSG="refactor: tidy up sub"   # innocent-looking
      ;;
    73)  # BUG B: O(n) → O(n²) regression in a 'sum' function
      cat &gt;&gt; calculator.mjs &lt;&lt;'EOF'
export function sum(xs) {
  let total = 0;
  for (const x of xs) for (const y of xs) total += (x === y ? x : 0);  // BUG: nested
  return total;
}
EOF
      MSG="feat: add sum function"
      ;;
    *)
      MSG="chore: tidy commit $i"
      ;;
  esac
  git add . &amp;&amp; git commit -q -m "$MSG"
done

# Bug C — multi-flag, last commit.
cat &gt;&gt; calculator.mjs &lt;&lt;'EOF'
export function multiply(a, b) {
  if (process.env.FLAG_X &amp;&amp; process.env.FLAG_Y) return a * b + 1;   // BUG when both
  return a * b;
}
EOF
git add . &amp;&amp; git commit -q -m "feat: refactor multiply with flags"

echo "=== Game Day repo ready at $DEST ==="
echo "Bug A — sub regression: introduced around commit ~47"
echo "Bug B — quadratic sum:  introduced around commit ~73"
echo "Bug C — flag interaction: requires FLAG_X + FLAG_Y both on"
</pre>

<h3>The three predicates participants must write</h3>

<pre class="code" data-lang="shell" data-title="game-day-predicates.sh">#!/usr/bin/env bash
# BUG A — simple correctness regression. Easy to spot.
node -e "import('./calculator.mjs').then(m=&gt; process.exit(m.sub(5,2)===3 ? 0 : 1))"

# BUG B — performance regression. Predicate measures time on a 1k array.
node -e "
import('./calculator.mjs').then(m =&gt; {
  const xs = Array.from({length:1000}, (_,i)=&gt;i);
  const t = Date.now();
  m.sum(xs);
  process.exit(Date.now() - t &lt; 50 ? 0 : 1);
});"

# BUG C — flag interaction. Must enable both flags in the predicate to reveal.
FLAG_X=1 FLAG_Y=1 node -e "
import('./calculator.mjs').then(m =&gt; process.exit(m.multiply(2,3)===6 ? 0 : 1));"
</pre>

<h3>The retro template</h3>
<pre class="code" data-lang="markdown" data-title="game-day-retro.md"># Game Day Retro — [date]

## My times
| Bug | Approach | Wall-clock | Got it right? |
|-----|----------|------------|---------------|
| A   | manual   |            |               |
| B   | automated|            |               |
| C   | ddmin    |            |               |

## One thing I learned

## One habit I'll change

## One tool or technique I want to try next

## What I'd want from the next workshop
</pre>

<h3>Why this format works</h3>
<ul>
  <li><strong>Solo first, then pair.</strong> Solo proves people can do it alone; pairing builds shared vocabulary.</li>
  <li><strong>Three escalating difficulties.</strong> Round 1 is doable for L3-L4; round 2 forces L5 skill; round 3 forces L6 ddmin instinct.</li>
  <li><strong>The bugs are real but bounded.</strong> Engineers practice on a manageable repo, not on a 50,000-commit beast where they'd give up halfway.</li>
  <li><strong>The facilitator knows the answers.</strong> Coaching is fast; no "let me look this up" moments.</li>
  <li><strong>Retro forces transfer.</strong> Without the retro, the workshop is entertainment; with it, the team carries new habits home.</li>
</ul>

<h3>The follow-through</h3>
<p>One workshop builds awareness; a follow-up four weeks later builds habit. At the follow-up:</p>
<ul>
  <li>Each engineer brings one bug they bisected since the workshop.</li>
  <li>They share what worked and what they got stuck on.</li>
  <li>The facilitator introduces one new technique (e.g., Bayesian bisection from Part IX).</li>
  <li>Group identifies the next investment to lift HQI on the team's main repo.</li>
</ul>

<div class="callout good">
<div class="callout-title">A workshop's quietest victory</div>
<p>The point of a game day is not that engineers can now bisect — most could, technically, before. The point is that bisection becomes <em>the first thing they reach for</em> when a regression appears. That instinct is built by repetition. One afternoon of focused practice changes the next year of reactive debugging.</p>
</div>
</template>

<template data-page-title="Bisection Across Languages and Ecosystems" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">Bisection Across Languages and Ecosystems</h2>
<p class="lede">Every language ecosystem has its own bisection friction. The git mechanics are universal, but the predicate's reliability — install times, lockfile behavior, build determinism, test reproducibility — varies wildly. This page is the comparative reference: what works easily, what breaks subtly, and the ecosystem-specific tactic for each.</p>

<h3>Quick comparison</h3>

<table class="cmp">
<tr><th>Ecosystem</th><th>Lockfile situation</th><th>Install time (typical)</th><th>Cold-build cost</th><th>Bisection friction</th></tr>
<tr><td>Node + pnpm</td><td><code>pnpm-lock.yaml</code>, frozen-lockfile honored</td><td>3–15 s (warm store)</td><td>Low</td><td>Low — best-in-class</td></tr>
<tr><td>Node + npm</td><td><code>package-lock.json</code>, <code>npm ci</code></td><td>20–60 s</td><td>Low–medium</td><td>Low</td></tr>
<tr><td>Node + yarn classic</td><td><code>yarn.lock</code></td><td>10–40 s</td><td>Low</td><td>Low</td></tr>
<tr><td>Python + uv</td><td><code>uv.lock</code></td><td>3–10 s</td><td>Low</td><td>Low</td></tr>
<tr><td>Python + pip-tools</td><td><code>requirements.txt</code> compiled</td><td>30–120 s</td><td>Low–medium</td><td>Medium</td></tr>
<tr><td>Python + Poetry</td><td><code>poetry.lock</code></td><td>20–90 s</td><td>Low–medium</td><td>Medium</td></tr>
<tr><td>Go modules</td><td><code>go.sum</code></td><td>5–30 s (with module cache)</td><td>Medium</td><td>Low</td></tr>
<tr><td>Rust + cargo</td><td><code>Cargo.lock</code></td><td>10–60 s</td><td>High (full compile)</td><td>Medium — solved by sccache</td></tr>
<tr><td>Java + Gradle</td><td><code>gradle.lockfile</code></td><td>20–90 s warm</td><td>Medium</td><td>Medium</td></tr>
<tr><td>Java + Maven</td><td><code>pom.xml</code> (no lock by default!)</td><td>30–180 s</td><td>Medium</td><td>High — version drift</td></tr>
<tr><td>Ruby + Bundler</td><td><code>Gemfile.lock</code></td><td>20–90 s</td><td>Low</td><td>Medium — old Gemfile.lock can be hostile</td></tr>
<tr><td>PHP + Composer</td><td><code>composer.lock</code></td><td>10–40 s</td><td>Low</td><td>Low</td></tr>
<tr><td>.NET + NuGet</td><td><code>packages.lock.json</code> (opt-in)</td><td>30–90 s</td><td>Medium</td><td>Medium — lock often missing</td></tr>
<tr><td>C/C++ + CMake</td><td>varies wildly</td><td>—</td><td>Often high</td><td>High — system libs vary</td></tr>
</table>

<h3>Per-ecosystem tactics</h3>

<h4>Node (pnpm)</h4>
<pre class="code" data-lang="shell" data-title="bisect-node.sh">pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm test
</pre>
<p>Best-in-class. The content-addressable store makes per-round installs nearly free on warm cache. Keep <code>pnpm-lock.yaml</code> committed.</p>

<h4>Python (uv)</h4>
<pre class="code" data-lang="shell" data-title="bisect-python-uv.sh">uv sync --frozen &gt;/dev/null 2&gt;&amp;1 || exit 125
uv run pytest -x
</pre>
<p>uv (the Rust-based pip replacement) reduces install times by 10–100×. If your project still uses pip, the single-highest-leverage change for bisection speed is to migrate to uv.</p>

<h4>Python (legacy pip)</h4>
<pre class="code" data-lang="shell" data-title="bisect-python-pip.sh">python -m venv .venv-bisect
. .venv-bisect/bin/activate
pip install --no-deps -r requirements.txt &gt;/dev/null 2&gt;&amp;1 || exit 125
pytest -x
</pre>
<p>Pre-create the venv outside the bisection loop; use <code>--no-deps</code> + a precompiled <code>requirements.txt</code> from pip-tools to avoid resolution time per round.</p>

<h4>Go</h4>
<pre class="code" data-lang="shell" data-title="bisect-go.sh">export GOFLAGS=-mod=mod
go test ./... &gt;/dev/null 2&gt;&amp;1
</pre>
<p>Go's module cache makes bisection fast — <code>$GOMODCACHE</code> stays warm across commits. Watch for <code>replace</code> directives that point at local paths; those break checkout-and-rebuild.</p>

<h4>Rust</h4>
<pre class="code" data-lang="shell" data-title="bisect-rust.sh">export CARGO_INCREMENTAL=1
export RUSTC_WRAPPER=sccache
cargo test --offline --frozen 2&gt;&amp;1
</pre>
<p>Rust's main bisection cost is compilation. <code>sccache</code> caches compiled crates content-addressably; with it warm, a 60-second build drops to 5. Always use <code>--offline --frozen</code> to pin to <code>Cargo.lock</code>.</p>

<h4>Java (Gradle)</h4>
<pre class="code" data-lang="shell" data-title="bisect-java-gradle.sh">./gradlew --offline --no-daemon test 2&gt;&amp;1
</pre>
<p>Daemon-less mode is critical for bisection: stale daemons hold incremental state from the previous round and can poison results. <code>--offline</code> keeps the resolver from contacting Maven Central per round.</p>

<h4>Java (Maven, no lockfile)</h4>
<p>Maven's default has no lockfile — every <code>mvn install</code> can pull a different transitive version. For bisection, you must:</p>
<ol>
  <li>Add <code>dependency:tree</code> output to source control.</li>
  <li>Use <code>mvn -o</code> (offline) once the local repository is populated.</li>
  <li>Snapshot <code>~/.m2/repository</code> at the start of the bisection; restore between rounds.</li>
</ol>
<p>Or: adopt the Apache <code>locker</code> plugin (or io.takari.maven dependencies-lock).</p>

<h4>Ruby</h4>
<pre class="code" data-lang="shell" data-title="bisect-ruby.sh">bundle install --frozen --jobs=4 &gt;/dev/null 2&gt;&amp;1 || exit 125
bundle exec rspec --fail-fast
</pre>
<p>An old <code>Gemfile.lock</code> that references gem versions no longer on rubygems.org will skip — code 125 is the right response.</p>

<h4>PHP / Composer</h4>
<pre class="code" data-lang="shell" data-title="bisect-php.sh">composer install --no-dev --no-interaction --prefer-dist 2&gt;&amp;1 || exit 125
./vendor/bin/phpunit
</pre>

<h4>.NET</h4>
<pre class="code" data-lang="shell" data-title="bisect-dotnet.sh">dotnet restore --locked-mode --use-lock-file 2&gt;&amp;1 || exit 125
dotnet test --no-restore
</pre>
<p>Enable <code>RestorePackagesWithLockFile</code> in csproj. Without lock files, .NET behaves like Maven and bisection is unreliable.</p>

<h4>C/C++</h4>
<p>The hardest ecosystem to bisect. Build determinism requires:</p>
<ul>
  <li>Pinned compiler version (e.g., via Nix or Docker).</li>
  <li>Pinned system libraries (vendored or via Conan / vcpkg with locked manifests).</li>
  <li><code>SOURCE_DATE_EPOCH</code> set to a fixed value.</li>
  <li>Deterministic parallel build (use ninja, not make).</li>
  <li>Optionally: <code>ccache</code> or <code>sccache</code> for speed.</li>
</ul>
<p>Bazel makes all of this automatic; that's the most senior team's answer.</p>

<h3>The cross-ecosystem patterns</h3>
<table class="cmp">
<tr><th>Pattern</th><th>Applies everywhere</th></tr>
<tr><td>Commit the lockfile</td><td>Yes</td></tr>
<tr><td>Use the frozen/locked install flag</td><td>Yes</td></tr>
<tr><td>Cache the package store / module cache between rounds</td><td>Yes</td></tr>
<tr><td>Exit 125 on install failure, not 1</td><td>Yes</td></tr>
<tr><td>Run tests with stable seed / order</td><td>Yes</td></tr>
<tr><td>Disable daemons / persistent caches that span rounds</td><td>Yes</td></tr>
</table>

<div class="callout">
<div class="callout-title">The senior choice: pick an ecosystem with bisection-friendly defaults</div>
<p>If you're starting a new project and choosing tooling, weight bisection-friendliness alongside the usual concerns. pnpm vs npm, uv vs pip, sccache-Rust vs raw Cargo, Gradle vs Maven — the wins compound over years. The principal engineer's choice between equally-capable tools often comes down to "which one will let our future selves debug faster?" That's a question juniors don't think to ask.</p>
</div>
</template>

<template data-page-title="Bisection in 2030 — A Forward Look" data-part="XII — Frameworks, Data &amp; Future">
<span class="badge">Part XII · Frameworks, Data &amp; Future</span>
<h2 class="page-title">Bisection in 2030 — Opinionated Predictions</h2>
<p class="lede">This page is forward-looking and opinionated. The techniques in this curriculum reflect the state of the art in 2026; in five years, parts of it will feel quaint. This is the principal-engineer's bet on what changes, what remains, and which skills you should invest in now to be valuable in the field that's coming.</p>

<h3>Change #1 — LLMs write predicates</h3>
<p>By 2028, most engineers will not write bisection predicates by hand for common scenarios. They will describe the bug ("the checkout button has been returning 500s since last Tuesday") and an AI agent will (a) propose 3–5 candidate predicates, (b) test each on a known-good commit to confirm baseline, (c) run the bisection with the chosen predicate, (d) summarize the result.</p>
<p><strong>What this changes:</strong> The marginal cost of starting a bisection drops by 5–10×. Bisection becomes the default debugging step, not a planned activity.</p>
<p><strong>What this does NOT change:</strong> The engineer still must read the result critically. AI agents trained on bisection patterns still hit the same anti-patterns from Part XII's catalog — the seven stories in "Hard-Won Lessons" all still happen, just faster.</p>
<p><strong>Skill to invest in now:</strong> Articulating bugs precisely. The same skill that produces a Level-4 repro produces a working AI prompt.</p>

<h3>Change #2 — Production replay becomes universal</h3>
<p>Mozilla's <code>rr</code> is a research tool today. By 2029, equivalents will be available for most production environments: every request to a service can be deterministically replayed at any commit, with the exact same memory, scheduler, and IO timing. eBPF + content-addressable storage make this affordable.</p>
<p><strong>What this changes:</strong> "Can't reproduce" stops being a viable excuse. Every production bug becomes bisectable. The Hard-Won Lesson #1 (cumulative-state bugs) disappears as a category.</p>
<p><strong>Skill to invest in now:</strong> Reasoning about determinism. Engineers who can articulate exactly which inputs determine an output will be the ones who can effectively use replay debugging at scale.</p>

<h3>Change #3 — Continuous background bisection</h3>
<p>IDEs and CI systems will run bisection continuously, in the background, on every metric they observe. The day a performance regression appears in dashboards, the system has already pre-computed "here are the three candidate commits we narrowed it to" before any engineer files a ticket.</p>
<p><strong>What this changes:</strong> The reactive bisection workflow — engineer notices bug, engineer starts <code>git bisect</code> — disappears for most regressions. The remaining bisections are the hard cases: multi-cause, non-monotonic, cumulative.</p>
<p><strong>Skill to invest in now:</strong> Designing predicates that capture <em>continuous</em> performance and behavior signals, not pass/fail. Today's perf-budget predicates (Part V) are the predecessor.</p>

<h3>Change #4 — Probabilistic predicates by default</h3>
<p>The Bayesian bisection algorithm from Part IX is too sophisticated for hand-coding today. By 2028, it'll be built into <code>git bisect</code>. Engineers will tag flaky predicates with their measured error rate; the bisector will automatically apply Bayesian updates.</p>
<p><strong>What this changes:</strong> The 5–25% flake regime stops being a brick wall. Bisections succeed even when predicates are imperfect, with explicit confidence intervals on the answer.</p>
<p><strong>Skill to invest in now:</strong> Reasoning about uncertainty. Engineers who can articulate "I'm 85% sure the bug is in this commit, here's what would shift my belief" will be the ones who use probabilistic tools well.</p>

<h3>Change #5 — Cross-repository bisection</h3>
<p>Today bisection is single-repo. By 2030, it's cross-repo: tools will let you bisect across a coordinated set of services — frontend, backend, microservice, infrastructure-as-code, all simultaneously, with the bisection respecting their version-compatibility constraints.</p>
<p><strong>What this changes:</strong> The hardest bisection cases today (multi-service distributed bugs) become tractable.</p>
<p><strong>Skill to invest in now:</strong> Articulating contracts between services. The teams whose services have explicit contracts (Part X's API contracts) will benefit; teams without will be blocked.</p>

<h3>Change #6 — Compiler-level continuous bisection</h3>
<p>Compilers (rustc, LLVM, V8) will report not just "this commit broke optimization X" but "this commit changed semantic behavior of pass Y for inputs matching pattern Z." Compiler-pass bisection (Part IX) becomes routine, not advanced.</p>
<p><strong>What this changes:</strong> Compiler regressions get reported with surgical specificity. Workarounds become trivial.</p>

<h3>What does NOT change</h3>
<table class="cmp">
<tr><th>Skill</th><th>Why it endures</th></tr>
<tr><td>Articulating a bug precisely</td><td>Required for any debugging — AI or otherwise — to be effective.</td></tr>
<tr><td>The scientific method</td><td>The structure of "hypothesis → test → refine" is older than computing and outlasts it.</td></tr>
<tr><td>Designing for bisectability</td><td>The eight properties from Part XI are about how systems should be structured. AI doesn't restructure your codebase.</td></tr>
<tr><td>Reading stack traces</td><td>Until programs stop crashing, this skill is foundational.</td></tr>
<tr><td>Mentoring</td><td>Multipliers always matter.</td></tr>
<tr><td>Cultural advocacy for reproducibility</td><td>Tools won't fix culture; that's still humans persuading humans.</td></tr>
</table>

<h3>The investment recommendation</h3>
<p>If you have 2026 dollars to spend on debugging capability, the rank-ordered investments:</p>
<ol>
  <li><strong>Hermeticity.</strong> Faster CI + fewer flakes + reproducible builds. Pays back forever, regardless of how AI tools evolve.</li>
  <li><strong>Observability with deploy tags.</strong> Becomes the substrate for continuous bisection (Change #3).</li>
  <li><strong>Conventional commits + small PRs.</strong> Makes every bisection result interpretable — AI agents can read your history too.</li>
  <li><strong>API contracts.</strong> Required for Change #5 (cross-repo bisection).</li>
  <li><strong>Hiring for articulation skill.</strong> The engineers who can describe bugs precisely will dominate the AI-augmented era.</li>
</ol>

<h3>What this means for the principal engineer</h3>
<p>The role doesn't disappear; it shifts. The high-leverage work moves up the stack:</p>
<ul>
  <li>Less time writing predicates; more time designing for the predicates the AI will write.</li>
  <li>Less time reading individual stack traces; more time defining what classes of bug your team should never have to debug.</li>
  <li>Less time bisecting; more time ensuring bisection is always available — to humans and AI agents alike.</li>
  <li>More time on the meta-question: <em>which capabilities matter, in five years, given how the tooling will evolve?</em></li>
</ul>

<div class="callout good">
<div class="callout-title">The closing observation</div>
<p>Every era of debugging has had a similar prediction: "this will be automated; debugging skill will become obsolete." Stack traces were going to replace debuggers. Logging was going to make profilers unnecessary. Observability was going to make manual debugging extinct. None of those predictions came true; the work shifted upward, and the engineers who shifted with it became more valuable, not less. The same will be true of AI-augmented bisection. The technique you've learned in this curriculum isn't going obsolete — its surface area is changing, and the engineers fluent in its underlying logic will be the ones who shape how the next tools work.</p>
<p style="margin-top: 18px;">That fluency is what this curriculum has been building toward. <strong>The investment you've made in reading it is good for at least the next decade.</strong></p>
</div>
</template>

<template data-page-title="The Anatomy of a Predicate" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">The Anatomy of a Predicate</h2>
<p class="lede">Up to this page, you've read 117 finished predicates. This Part teaches you to write your own from scratch — not by giving you more examples to copy, but by teaching you the structure every good predicate follows and the iterative process that gets you there. We start with anatomy.</p>

<h3>Every predicate has the same five sections</h3>
<p>Open any predicate in this curriculum. Trace its structure. You'll find the same five sections, every time, in the same order:</p>

<table class="cmp">
<tr><th>Section</th><th>Purpose</th><th>If you skip it</th></tr>
<tr><td><strong>1. Setup</strong></td><td>Restore deps, fixtures, env, DB state to what the commit expects</td><td>Predicate fails for environmental reasons; bisection lies</td></tr>
<tr><td><strong>2. Exercise</strong></td><td>Run the code path whose behavior you're judging</td><td>You're testing nothing</td></tr>
<tr><td><strong>3. Observe</strong></td><td>Capture the signal: an exit code, a number, a file's contents</td><td>You can't tell if it passed</td></tr>
<tr><td><strong>4. Cleanup</strong></td><td>Restore state, kill processes, remove temp files (always — via trap)</td><td>Round N+1 inherits round N's mess; rounds drift</td></tr>
<tr><td><strong>5. Exit</strong></td><td>Translate the observation into <code>0</code>, <code>1</code>, or <code>125</code></td><td>Bisection misinterprets your verdict</td></tr>
</table>

<h3>The skeleton</h3>

<pre class="code" data-lang="shell" data-title="predicate-skeleton.sh">#!/usr/bin/env bash
# predicate.sh — &lt;one-line description of what this judges&gt;
# Exit codes follow `git bisect run`: 0=good, 1=bad, 125=skip.
set -uo pipefail   # strict but NOT -e (we handle errors deliberately)

# === 1. SETUP =========================================================
# Restore deps, fixtures, env. Exit 125 on any
# "this commit isn't testable" condition (missing dep, broken build).
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1                                     || exit 125

# === 2. CLEANUP (registered FIRST, before exercise) ===================
# Whatever we set up below must be torn down even on Ctrl-C.
SERVER_PID=""
cleanup() {
  [ -n "$SERVER_PID" ] &amp;&amp; kill "$SERVER_PID" 2&gt;/dev/null || true
  rm -rf /tmp/predicate-scratch.*
}
trap cleanup EXIT INT TERM

# === 3. EXERCISE ======================================================
# Do the thing we're judging.
node dist/server.js &amp;
SERVER_PID=$!
sleep 1   # let server bind

# === 4. OBSERVE =======================================================
# Capture the signal — the one thing that decides pass/fail.
RESPONSE=$(curl -sf -m 5 -w '%{http_code}' http://localhost:3000/checkout || echo "fail")

# === 5. EXIT ==========================================================
# Translate observation into git bisect's expected codes.
[ "$RESPONSE" = "200" ] &amp;&amp; exit 0 || exit 1
</pre>

<p>That's 25 lines. Every predicate in Part X is a variation on this template. Once you internalize the five sections, writing new predicates becomes muscle memory.</p>

<h3>Why this order matters</h3>
<p>Three structural rules are non-negotiable:</p>
<ol>
  <li><strong>Cleanup is registered BEFORE exercise.</strong> If you register cleanup after the exercise and the exercise fails (or you Ctrl-C), cleanup never runs. Trap first, exercise second.</li>
  <li><strong>Setup uses 125, not 1, for environment errors.</strong> If <code>pnpm install</code> can't find a registry, this commit isn't <em>bad</em> — it's <em>untestable</em>. <code>git bisect</code> will skip the commit and move on. Confusing the two convicts innocent commits.</li>
  <li><strong>Exercise and Observe are separate.</strong> If you combine them ("run the test and check its exit code in one go"), you can't distinguish "the test ran and decided no" from "the test couldn't run at all." Capture the side effect (file, exit code, network response) in a variable; judge it afterward.</li>
</ol>

<h3>The most common beginner mistake, visualized</h3>

<pre class="code" data-lang="shell" data-title="naive-vs-correct.sh"># ❌ NAIVE
pnpm test           # tests + judgment in one step
# What if pnpm itself wasn't installed? exit 1 → "this commit is bad"
# What if the test crashed for unrelated reasons? exit 1 → still "bad"
# What if a port was in use from the previous round? exit 1 → still "bad"
# All three of these convict innocent commits.

# ✅ CORRECT
pnpm install --frozen-lockfile || exit 125    # 125 = skip
PORT=$(get-free-port) pnpm test --json &gt; /tmp/result.json
status=$?
case $status in
  0)   exit 0 ;;
  130) exit 125 ;;   # user pressed Ctrl-C
  *)   # check if it crashed for env reasons or actually failed assertions
       grep -q '"numFailingTests":0' /tmp/result.json &amp;&amp; exit 125 || exit 1 ;;
esac
</pre>

<p>The naive version is shorter. Engineers reach for it because it "looks like" a working predicate. It runs once on a known-good commit, returns 0, and they declare it ready. Then bisection runs it for 6 hours and produces a confidently-wrong answer.</p>

<div class="callout">
<div class="callout-title">Internalize the structure first</div>
<p>Don't try to write predicates from scratch yet. For the next four pages, focus on understanding the structure and the decisions you'd make at each section. The page after the patterns walk you through a full narrated build. You'll know you've internalized the structure when you can sketch a predicate's five sections — in shorthand, on paper — before opening a terminal. That's the goal.</p>
</div>
</template>

<template data-page-title="The Pre-Flight Worksheet" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">The Pre-Flight Worksheet — Five Minutes Before Code</h2>
<p class="lede">Engineers who write reliable predicates do something every junior engineer skips: they answer seven specific questions in writing before they open a text editor. Five minutes of writing saves four hours of bisecting the wrong thing. This page is the worksheet, with a worked example.</p>

<h3>The seven questions</h3>

<table class="cmp">
<tr><th>#</th><th>Question</th><th>What a good answer looks like</th></tr>
<tr><td>1</td><td>What is the candidate set?</td><td>"Commits from <code>a3f9c81</code> (last known good, Mar 12) through <code>HEAD</code>. About 340 commits."</td></tr>
<tr><td>2</td><td>What monotonic property defines the bug?</td><td>"Before the bug: <code>GET /checkout</code> p99 &lt; 300 ms. After: p99 &gt; 1 s. The property flips once and doesn't flip back."</td></tr>
<tr><td>3</td><td>What's the good endpoint, and have I confirmed it?</td><td>"<code>a3f9c81</code>. Confirmed by running the predicate manually: 8 measurements, all under 280 ms."</td></tr>
<tr><td>4</td><td>What's the bad endpoint, and have I confirmed it?</td><td>"<code>HEAD</code> (<code>e7b2a91</code>). Confirmed: 8 measurements, all over 1.5 s."</td></tr>
<tr><td>5</td><td>How long does one predicate run take?</td><td>"Setup ~30s (cached deps) + exercise ~10s + cleanup ~2s = ~45s. Times log₂(340) = 9 rounds × 45s ≈ 7 minutes total."</td></tr>
<tr><td>6</td><td>What could go wrong (top 3)?</td><td>"(a) Port collision between rounds; (b) Stale connection pool from previous server; (c) Network flake on health-check."</td></tr>
<tr><td>7</td><td>What's the recovery plan if the predicate is wrong?</td><td>"After bisect lands, manually run the predicate 5 times on the alleged culprit + its parent. If results disagree, the predicate is wrong; re-tighten and retry."</td></tr>
</table>

<h3>A worked example, end to end</h3>

<pre class="code" data-lang="markdown" data-title="worksheet-example.md"># Pre-Flight Worksheet — checkout latency regression

**Date:** 2026-06-04
**Author:** Alex Chen
**Bug:** GET /checkout p99 latency went from ~200 ms (April) to ~1.8 s (June).

## 1. Candidate set
- Commits from `release-2026-04-15` (~340 commits) through `HEAD`.
- Restricted to commits touching `services/checkout/**` using `git bisect start -- services/checkout/`.

## 2. Monotonic property
- Before culprit: p99 of 20 sequential `GET /checkout` calls is &lt; 300 ms.
- After culprit: p99 is &gt; 1 s.
- We've verified at the endpoints that the threshold is unambiguous.

## 3. Good endpoint (confirmed)
- `release-2026-04-15` → SHA `a3f9c81`.
- Manual measurement: 8 runs, p99 = 280 ms ± 30 ms.

## 4. Bad endpoint (confirmed)
- `HEAD` → SHA `e7b2a91`.
- Manual measurement: 8 runs, p99 = 1.65 s ± 200 ms.

## 5. Predicate cost
- Setup (pnpm install --prefer-offline, build cached): ~30 s.
- Exercise: spin up server (1s), 20 curls (10s), shutdown (1s): ~12 s.
- Cleanup: ~2 s.
- Per round: ~45 s. Total bisection: 9 rounds × 45 s ≈ 7 min.

## 6. What could go wrong
- (a) **Port collision** between rounds. Mitigate: use random port; pass via env.
- (b) **Stale connection pool** in DB driver. Mitigate: fresh container each round.
- (c) **Network flake** in healthcheck. Mitigate: 5× retry with 1s backoff.

## 7. Recovery plan
- After bisection completes, run the predicate 10× on the alleged culprit.
- If &lt; 8/10 say "bad", the predicate is noisy — increase k-of-k from 1 to 5.
- If the culprit looks innocent (e.g., only touches comments), reverse-verify
  by reverting the suspect on HEAD and re-running the predicate; should pass.
</pre>

<h3>Why each question matters</h3>
<ul>
  <li><strong>Q1 forces you to bound the search.</strong> "I think the regression is from this quarter" is too vague to bisect.</li>
  <li><strong>Q2 forces you to make monotonicity explicit.</strong> If you can't write the property in one sentence, your bug isn't bisectable yet — you're describing a symptom, not a binary state.</li>
  <li><strong>Q3 + Q4 force you to confirm endpoints.</strong> Most failed bisections fail because the "known-good" wasn't actually good. Manually run the predicate at each endpoint <em>before</em> starting the run.</li>
  <li><strong>Q5 forces you to estimate cost.</strong> If the estimate is 4 hours, you might choose to read the diffs instead (see XII.5 — When Not to Bisect).</li>
  <li><strong>Q6 forces you to pre-plan robustness.</strong> The first three failure modes you think of are the ones that will bite you. Plan for them now.</li>
  <li><strong>Q7 forces you to plan for being wrong.</strong> Senior engineers expect to be wrong; juniors assume the bisect output is gospel.</li>
</ul>

<h3>The "what's NOT monotonic" check</h3>
<p>Question 2 is where most worksheets fail. If you can't articulate a property that flips exactly once, bisection isn't your tool. Bugs that are NOT monotonic:</p>
<ul>
  <li>"It's slow some of the time, fast other times" — not monotonic; it never <em>flipped</em>, it's intermittent throughout.</li>
  <li>"Two flags both have to be on" — not single-axis monotonic; needs ddmin (Part IX HDD), not bisection.</li>
  <li>"It got worse, then better, then worse again" — non-monotonic; bisect would converge to the wrong commit. Plot the metric over time first; identify which transition you actually care about.</li>
</ul>

<div class="callout good">
<div class="callout-title">A team norm worth establishing</div>
<p>Every PR that introduces a bisection script should include the seven-question worksheet in its description. Reviewers check it before approving. Six months later, when someone debugs <em>that</em> predicate, the original author's worksheet tells them what the predicate was designed to find. The worksheet becomes documentation. Cost: five minutes per script. Return: every future engineer who touches the predicate knows what it's for.</p>
</div>
</template>

<template data-page-title="Building a Predicate, Step by Step" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">Building a Predicate, Step by Step — A Narrated Walk-Through</h2>
<p class="lede">Here we build a real predicate from scratch, narrating every decision. The naive version is 5 lines and broken. The final version is 35 lines and bullet-proof. Each iteration solves one specific problem the previous version had. Read this once and you'll have internalized the entire iterative shape of predicate-writing.</p>

<h3>The bug</h3>
<p>The same one from the previous page's worksheet: checkout latency went from ~200 ms to ~1.8 s sometime in the last 340 commits. We want <code>git bisect run</code> to find the culprit.</p>

<h3>Iteration 1 — The naive version</h3>

<pre class="code" data-lang="shell" data-title="iter-1-naive.sh">#!/usr/bin/env bash
node dist/server.js &amp;
sleep 2
ms=$(curl -o /dev/null -w '%{time_total}' http://localhost:3000/checkout)
[ "$(echo "$ms &lt; 0.3" | bc)" = "1" ] &amp;&amp; exit 0 || exit 1
</pre>

<p>What's wrong:</p>
<ul>
  <li>No setup — uses whatever <code>dist/</code> was already on disk.</li>
  <li>One measurement, on the head of a queue — single sample, no smoothing.</li>
  <li>Server is leaked (never killed).</li>
  <li>No distinction between "checkout slow" and "server didn't start at all."</li>
  <li>Port 3000 may be in use from the previous round.</li>
</ul>

<h3>Iteration 2 — Add setup and cleanup</h3>

<pre class="code" data-lang="shell" data-title="iter-2-setup-cleanup.sh">#!/usr/bin/env bash
set -uo pipefail

# Setup
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1                                     || exit 125

# Cleanup registered first
SERVER_PID=""
trap '[ -n "$SERVER_PID" ] &amp;&amp; kill "$SERVER_PID" 2&gt;/dev/null || true' EXIT

# Exercise
node dist/server.js &amp;
SERVER_PID=$!
sleep 2

# Observe + exit
ms=$(curl -o /dev/null -w '%{time_total}' http://localhost:3000/checkout)
[ "$(echo "$ms &lt; 0.3" | bc)" = "1" ] &amp;&amp; exit 0 || exit 1
</pre>

<p>Better. Now:</p>
<ul>
  <li>Install errors return 125 (skip) instead of 1 (bad) — preserves bisection integrity.</li>
  <li>The server is cleaned up on exit, even on Ctrl-C.</li>
  <li>But: still single measurement, still uses fixed port 3000.</li>
</ul>

<h3>Iteration 3 — Random port + measurement loop</h3>

<pre class="code" data-lang="shell" data-title="iter-3-loop.sh">#!/usr/bin/env bash
set -uo pipefail

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1                                     || exit 125

PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("",0));print(s.getsockname()[1]);s.close()')
SERVER_PID=""
trap '[ -n "$SERVER_PID" ] &amp;&amp; kill "$SERVER_PID" 2&gt;/dev/null || true' EXIT

PORT=$PORT node dist/server.js &amp;
SERVER_PID=$!

# Wait for readiness, not arbitrary sleep
for i in $(seq 1 20); do
  curl -sf "http://localhost:$PORT/health" &gt;/dev/null &amp;&amp; break
  sleep 0.5
done

# Measure 20× — drop fastest 5 and slowest 5 to reduce outliers
measurements=()
for i in $(seq 1 20); do
  ms=$(curl -o /dev/null -w '%{time_total}\n' "http://localhost:$PORT/checkout")
  measurements+=("$ms")
done

# p99 ≈ max of the middle 90% (here: median-ish since we drop tails)
p99=$(printf '%s\n' "${measurements[@]}" | sort -n | sed -n '12p')

awk -v p="$p99" 'BEGIN { exit (p &lt; 0.3 ? 0 : 1) }'
</pre>

<p>Much better. But there are still subtle issues:</p>
<ul>
  <li>What if the server didn't start in 10 seconds? The loop exits but the predicate continues and curls succeed against nothing → measurements default to ~0 → predicate says "good" wrongly.</li>
  <li>What if a DB connection fails midway through? Some curls return 500 with very low latency.</li>
  <li>The fast-path "0.0s" of a connection-refused error fools the latency check.</li>
</ul>

<h3>Iteration 4 — Distinguish "no signal" from "good signal"</h3>

<pre class="code" data-lang="shell" data-title="iter-4-signal.sh">#!/usr/bin/env bash
set -uo pipefail

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1                                     || exit 125

PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("",0));print(s.getsockname()[1]);s.close()')
SERVER_PID=""
trap '[ -n "$SERVER_PID" ] &amp;&amp; kill "$SERVER_PID" 2&gt;/dev/null || true' EXIT

PORT=$PORT node dist/server.js &amp;
SERVER_PID=$!

# Wait for readiness with a hard cap
READY=0
for i in $(seq 1 30); do
  curl -sf "http://localhost:$PORT/health" &gt;/dev/null &amp;&amp; { READY=1; break; }
  sleep 0.5
done
[ "$READY" = "0" ] &amp;&amp; exit 125    # server never came up — not the bug we're hunting

# Measure 20 valid requests; refuse to count failures as "fast"
declare -a measurements=()
fails=0
for i in $(seq 1 20); do
  out=$(curl -sf -o /dev/null -w '%{http_code} %{time_total}\n' "http://localhost:$PORT/checkout" || echo "000 0")
  code=$(echo "$out" | awk '{print $1}')
  ms=$(echo "$out"   | awk '{print $2}')
  if [ "$code" = "200" ]; then
    measurements+=("$ms")
  else
    fails=$((fails + 1))
  fi
done

# Too many failures = predicate can't judge this commit
[ "$fails" -gt 5 ] &amp;&amp; exit 125

# p99 from sorted measurements
p99=$(printf '%s\n' "${measurements[@]}" | sort -n | tail -n 2 | head -n 1)
echo "p99 = $p99 s, fails = $fails / 20"

awk -v p="$p99" 'BEGIN { exit (p &lt; 0.3 ? 0 : 1) }'
</pre>

<h3>Iteration 5 — The final form</h3>

<pre class="code" data-lang="shell" data-title="iter-5-final.sh">#!/usr/bin/env bash
# checkout-latency-bisect.sh
# Identifies the commit at which p99 of GET /checkout exceeded 300 ms.
# Exit: 0 = good (p99 &lt; 300ms), 1 = bad (p99 ≥ 300ms), 125 = untestable.
set -uo pipefail

# --- SETUP ---
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1                                     || exit 125

# --- CLEANUP (registered before exercise) ---
PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("",0));print(s.getsockname()[1]);s.close()')
SERVER_PID=""
SCRATCH=$(mktemp -d)
cleanup() {
  [ -n "$SERVER_PID" ] &amp;&amp; kill "$SERVER_PID" 2&gt;/dev/null || true
  rm -rf "$SCRATCH"
}
trap cleanup EXIT INT TERM

# --- EXERCISE: spin up server ---
PORT=$PORT node dist/server.js &gt; "$SCRATCH/server.log" 2&gt;&amp;1 &amp;
SERVER_PID=$!

# Wait for readiness
READY=0
for i in $(seq 1 30); do
  curl -sf "http://localhost:$PORT/health" &gt;/dev/null &amp;&amp; { READY=1; break; }
  sleep 0.5
done
if [ "$READY" = "0" ]; then
  echo "Server failed to start; logs:"; cat "$SCRATCH/server.log"
  exit 125
fi

# --- EXERCISE + OBSERVE: 20 measurements ---
declare -a measurements=()
fails=0
for i in $(seq 1 20); do
  out=$(curl -sf -o /dev/null -m 5 -w '%{http_code} %{time_total}\n' \
        "http://localhost:$PORT/checkout" || echo "000 0")
  code=$(echo "$out" | awk '{print $1}')
  ms=$(echo "$out"   | awk '{print $2}')
  [ "$code" = "200" ] &amp;&amp; measurements+=("$ms") || fails=$((fails + 1))
done

# --- EXIT ---
[ "$fails" -gt 5 ] &amp;&amp; { echo "Too many failures ($fails/20) — skip"; exit 125; }

p99=$(printf '%s\n' "${measurements[@]}" | sort -n | tail -n 2 | head -n 1)
echo "p99 = ${p99}s  fails = ${fails}/20"

awk -v p="$p99" 'BEGIN { exit (p &lt; 0.3 ? 0 : 1) }'
</pre>

<h3>What the five iterations taught</h3>
<table class="cmp">
<tr><th>Iteration</th><th>Problem solved</th></tr>
<tr><td>1 → 2</td><td>Distinguish env errors from real bug; clean up state</td></tr>
<tr><td>2 → 3</td><td>Random port + readiness wait + multiple measurements</td></tr>
<tr><td>3 → 4</td><td>Distinguish "no signal" (failed requests) from "good signal"</td></tr>
<tr><td>4 → 5</td><td>Capture diagnostic output; bound resource use; final polish</td></tr>
</table>

<p><strong>This iteration pattern is how every predicate gets written.</strong> You don't start with the 35-line version; you arrive at it through five honest revisions, each driven by an observed failure of the previous one. The senior engineer's skill isn't writing the 35-line version on the first try — it's <em>predicting</em> which failure modes will hit, so iteration 1 already includes the protections for 80% of them.</p>

<div class="callout good">
<div class="callout-title">A useful drill</div>
<p>Pick any script in the curriculum's <code>scripts/</code> directory. Rewrite it as a "naive iteration 1" — strip out all the protections, retain only the core logic. Then write down what would break first when you ran the naive version. Then add only that protection. Repeat. This drill is how you build intuition for which protections matter. After doing it five times, you'll write better iteration 1s on real bugs.</p>
</div>
</template>

<template data-page-title="The Five Predicate Patterns" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">The Five Predicate Patterns — Templates You'll Use Forever</h2>
<p class="lede">Most predicates fall into one of five shapes. Recognize the shape, fill in the template. You'll write 90% of your career's predicates faster, and the remaining 10% will be obvious novelty cases. This page is the catalog.</p>

<h3>Pattern 1 — The Type-Check Predicate (fastest)</h3>
<p><strong>Use when:</strong> the bug is "this won't compile / type-check / lint." Often the cheapest possible predicate at ~1–5 seconds per round.</p>

<pre class="code" data-lang="shell" data-title="pattern-type-check.sh">#!/usr/bin/env bash
set -uo pipefail
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm exec tsc --noEmit
</pre>

<p>Variations: <code>cargo check</code> (Rust), <code>go vet</code> (Go), <code>mypy</code> (Python), <code>shellcheck</code> (bash), <code>eslint</code> (JS without execution).</p>

<h3>Pattern 2 — The Smoke-Test Predicate</h3>
<p><strong>Use when:</strong> the bug is "the app no longer starts" or "a basic endpoint returns the wrong status code." 3–30 seconds per round.</p>

<pre class="code" data-lang="shell" data-title="pattern-smoke.sh">#!/usr/bin/env bash
set -uo pipefail
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1 || exit 125

PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("",0));print(s.getsockname()[1]);s.close()')
PORT=$PORT pnpm start &amp;
PID=$!
trap "kill $PID 2&gt;/dev/null || true" EXIT

# Wait for readiness
for i in $(seq 1 30); do
  curl -sf "http://localhost:$PORT/health" &gt;/dev/null &amp;&amp; break
  sleep 0.5
done

# The one smoke check
curl -sf -o /dev/null -m 5 "http://localhost:$PORT/api/users/1"
</pre>

<h3>Pattern 3 — The Behavioral-Assertion Predicate</h3>
<p><strong>Use when:</strong> the bug is "function X returns the wrong value for input Y." This is the most common pattern.</p>

<pre class="code" data-lang="javascript" data-title="pattern-assert.mjs">#!/usr/bin/env node
// pattern-assert.mjs
// Behavioral predicate — asserts function X returns expected value for input Y.
import { spawnSync } from 'child_process';

// Setup
if (spawnSync('pnpm', ['install', '--frozen-lockfile', '--prefer-offline'], { stdio: 'ignore' }).status !== 0) process.exit(125);
if (spawnSync('pnpm', ['build'], { stdio: 'ignore' }).status !== 0) process.exit(125);

// Exercise + Observe
const { calculateTax } = await import('./dist/tax.mjs');
const result = calculateTax({ items: [{ price: 100 }], region: 'US-CA' });

// Exit
const ok = result.total === 108.5 &amp;&amp; result.tax === 8.5;
process.exit(ok ? 0 : 1);
</pre>

<h3>Pattern 4 — The Perf-Budget Predicate</h3>
<p><strong>Use when:</strong> the bug is "something got slower." Use the iteration-5 template from the previous page as your baseline.</p>

<pre class="code" data-lang="shell" data-title="pattern-perf.sh">#!/usr/bin/env bash
# Perf-budget predicate. Returns 0 if p99 of N measurements is under THRESHOLD.
set -uo pipefail
THRESHOLD_SEC="${THRESHOLD:-0.5}"
SAMPLES="${SAMPLES:-20}"

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1 || exit 125

# Use hyperfine for warm-cache statistical perf measurement
pnpm dlx hyperfine -m "$SAMPLES" --warmup 3 --export-json /tmp/perf.json \
  -- "pnpm exec node dist/run-benchmark.mjs" &gt;/dev/null

p99=$(node -e "
  const d = JSON.parse(require('fs').readFileSync('/tmp/perf.json'));
  const t = d.results[0].times.sort((a,b)=&gt;a-b);
  console.log(t[Math.floor(t.length * 0.99)]);
")
echo "p99 = ${p99}s threshold=${THRESHOLD_SEC}s"
awk -v p="$p99" -v t="$THRESHOLD_SEC" 'BEGIN { exit (p &lt; t ? 0 : 1) }'
</pre>

<h3>Pattern 5 — The Golden-File Comparison Predicate</h3>
<p><strong>Use when:</strong> the bug is "output looks different and we don't know how." Compare the current commit's output to a saved "golden" output from a known-good commit.</p>

<pre class="code" data-lang="shell" data-title="pattern-golden.sh">#!/usr/bin/env bash
# Compares the current commit's output to a frozen "golden" file.
# Use when you can't reduce the bug to a single assertion.
set -uo pipefail

GOLDEN="${GOLDEN:?path to golden file from a known-good commit}"

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1 || exit 125

# Produce output for THIS commit, normalize (strip timestamps, sort lines, etc.)
pnpm exec node dist/produce-report.mjs --input fixture.json \
  | sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z/[TIME]/g' \
  | sort &gt; /tmp/actual.txt

# Compare. diff returns 0 if files match.
diff -q /tmp/actual.txt "$GOLDEN" &gt;/dev/null
</pre>

<h3>Choosing between the patterns</h3>
<table class="cmp">
<tr><th>If the symptom is…</th><th>Reach for…</th><th>Per-round cost</th></tr>
<tr><td>"It doesn't compile / type-check"</td><td>Type-check (Pattern 1)</td><td>~5 s</td></tr>
<tr><td>"It crashes on startup" / "Endpoint X is 500"</td><td>Smoke (Pattern 2)</td><td>~15 s</td></tr>
<tr><td>"Function returns wrong value"</td><td>Assertion (Pattern 3)</td><td>~10 s</td></tr>
<tr><td>"It got slower"</td><td>Perf-budget (Pattern 4)</td><td>~30 s + measurement overhead</td></tr>
<tr><td>"The output is subtly different"</td><td>Golden (Pattern 5)</td><td>~10 s</td></tr>
</table>

<h3>Composing patterns</h3>
<p>Real predicates often combine two: a smoke test (Pattern 2) <em>then</em> an assertion (Pattern 3) on the response. The composition is sequential — each check exits with 125 if the previous setup didn't succeed.</p>

<pre class="code" data-lang="shell" data-title="composed-predicate.sh">#!/usr/bin/env bash
# Smoke + assertion composed.
set -uo pipefail
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1 || exit 125

PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("",0));print(s.getsockname()[1]);s.close()')
PORT=$PORT pnpm start &amp; PID=$!
trap "kill $PID 2&gt;/dev/null || true" EXIT
for i in $(seq 1 30); do curl -sf "http://localhost:$PORT/health" &amp;&amp; break; sleep 0.5; done

# Smoke: did the endpoint return 200?
HTTP=$(curl -sf -o /tmp/body -w '%{http_code}' "http://localhost:$PORT/api/checkout?amount=100" || echo 000)
[ "$HTTP" = "200" ] || exit 1

# Assertion: did the body match the expected shape?
jq -e '.tax == 8.5 and .total == 108.5' /tmp/body &gt;/dev/null
</pre>

<div class="callout">
<div class="callout-title">Internalize the patterns, not the scripts</div>
<p>The point of this page isn't to memorize five scripts; it's to recognize, in any new bug report, which of the five shapes fits. Once you can say "this is a perf-budget bug" out loud, the predicate is 80% written before you open a terminal. The other 20% is the iteration cycle from the previous page.</p>
</div>
</template>

<template data-page-title="Predicate Anti-Patterns" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">Predicate Anti-Patterns — Ten Mistakes That Make Bisections Lie</h2>
<p class="lede">Every page so far has shown predicates that work. This page is the negative space: the ten specific mistakes that produce confidently-wrong bisection results. Memorize them — every one of them I (and you) will instinctively write at least once before noticing the trap.</p>

<h3>1. Exit-1 for environment errors</h3>

<pre class="code" data-lang="shell" data-title="anti-1.sh"># ❌ Wrong
pnpm install &amp;&amp; pnpm test         # any install failure = exit 1 = "bad"

# ✅ Right
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm test
</pre>

<p><strong>Why it matters:</strong> When the registry has a hiccup, you convict an innocent commit. <code>125</code> tells <code>git bisect</code> "skip — untestable," which is the correct signal for "I couldn't even set up to test."</p>

<h3>2. Combining exercise and observation</h3>

<pre class="code" data-lang="shell" data-title="anti-2.sh"># ❌ Wrong
pnpm test         # tests + their own assertions; pass/fail mixed with crashes

# ✅ Right
pnpm test --json --output /tmp/result.json || true   # don't conflate yet
jq -e '.numFailedTests == 0 and .numTotalTests &gt; 0' /tmp/result.json
</pre>

<p><strong>Why it matters:</strong> The naive version returns exit 1 when (a) tests genuinely failed AND (b) the test runner itself crashed AND (c) zero tests ran. These are three different states; only (a) means "bad commit." Separate the observation.</p>

<h3>3. Hitting external services</h3>

<pre class="code" data-lang="shell" data-title="anti-3.sh"># ❌ Wrong
node test-against-staging.mjs   # depends on staging environment, which drifts

# ✅ Right
docker run --rm -p 5432:5432 -e POSTGRES_PASSWORD=test postgres:16 &amp;
DB_PID=$!
trap "kill $DB_PID" EXIT
sleep 3
DATABASE_URL=postgresql://postgres:test@localhost/test node test.mjs
</pre>

<p><strong>Why it matters:</strong> Staging environments mutate between rounds. If staging breaks during round 4, the predicate fails for reasons that have nothing to do with the commit. Predicates must own their entire environment.</p>

<h3>4. No cleanup trap</h3>

<pre class="code" data-lang="shell" data-title="anti-4.sh"># ❌ Wrong
pnpm start &amp;
SERVER=$!
# ... do tests ...
kill $SERVER

# ✅ Right
pnpm start &amp;
SERVER=$!
trap "kill $SERVER 2&gt;/dev/null || true" EXIT INT TERM
# ... do tests ...
</pre>

<p><strong>Why it matters:</strong> If the test crashes between starting and killing, the server is leaked. By round 10 you've got 10 zombie servers fighting for port 3000.</p>

<h3>5. Implicit time / locale / timezone dependency</h3>

<pre class="code" data-lang="shell" data-title="anti-5.sh"># ❌ Wrong
node check-order-flow.mjs   # creates an order; checks "created_at" displays right

# ✅ Right
TZ=UTC LC_ALL=C SOURCE_DATE_EPOCH=1700000000 node check-order-flow.mjs
</pre>

<p><strong>Why it matters:</strong> A predicate that passes during business hours and fails at midnight, or passes for US-format dates and fails for European ones, fails for reasons unrelated to the bisection. Pin every implicit input.</p>

<h3>6. Mutating shared state between rounds</h3>

<pre class="code" data-lang="shell" data-title="anti-6.sh"># ❌ Wrong
psql -c "INSERT INTO users (email) VALUES ('test@example.com')"
node assert-user-exists.mjs

# ✅ Right — fresh database per round
TMPDB=$(mktemp -u)
createdb "$TMPDB"
trap "dropdb '$TMPDB'" EXIT
DATABASE_URL="postgresql://localhost/$TMPDB" pnpm migrate
DATABASE_URL="postgresql://localhost/$TMPDB" node assert-user-exists.mjs
</pre>

<p><strong>Why it matters:</strong> Round 1 inserts a row. Round 2's "INSERT" fails because of unique-constraint violation. The predicate's behavior depends on the previous round, which is the opposite of what a bisection oracle is.</p>

<h3>7. Treating compile errors as test failures</h3>

<pre class="code" data-lang="shell" data-title="anti-7.sh"># ❌ Wrong
pnpm build &amp;&amp; pnpm test || exit 1

# ✅ Right — build failure = untestable
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1                                     || exit 125
pnpm test
</pre>

<p><strong>Why it matters:</strong> A commit that doesn't build isn't necessarily "bad" — it's "in a broken intermediate state." Skip it (125) so bisection continues, instead of converging on the unbuilt commit.</p>

<h3>8. Using <code>set -e</code> alone</h3>

<pre class="code" data-lang="shell" data-title="anti-8.sh"># ❌ Wrong (too aggressive)
set -e
pnpm test
some-tool   # script bails before checking observation

# ✅ Right
set -uo pipefail   # warn on unset vars, propagate pipe errors, but DON'T auto-exit
RESULT=$(pnpm test --json || echo '{"numFailedTests":-1}')
jq -e '.numFailedTests == 0' &lt;&lt;&lt; "$RESULT"
</pre>

<p><strong>Why it matters:</strong> <code>set -e</code> bails on the first nonzero exit, including ones you wanted to handle. In predicates you almost always want <code>set -uo pipefail</code> (strict variables, pipe error propagation) but explicit error handling for the exit-code decision.</p>

<h3>9. Counting tests instead of asserting outcomes</h3>

<pre class="code" data-lang="shell" data-title="anti-9.sh"># ❌ Wrong
[ "$(pnpm test --silent | grep -c PASS)" -gt 100 ]

# ✅ Right
pnpm test --json --output /tmp/r.json
jq -e '.numFailedTests == 0 and .numTotalTests &gt; 100' /tmp/r.json
</pre>

<p><strong>Why it matters:</strong> A commit that runs zero tests "passes" the naive count check. A commit that runs 1000 tests and fails 999 also "passes" if you only check "100 PASSes appeared." Always assert both that tests ran AND that none failed.</p>

<h3>10. Forgetting timeouts</h3>

<pre class="code" data-lang="shell" data-title="anti-10.sh"># ❌ Wrong
node integration-test.mjs   # no timeout — could hang forever

# ✅ Right
timeout 60 node integration-test.mjs
case $? in
  0)   exit 0 ;;
  124) echo "timed out"; exit 125 ;;   # likely an env issue, not the bug
  *)   exit 1 ;;
esac
</pre>

<p><strong>Why it matters:</strong> A bisection that's running unattended overnight will hang for hours on a single bad commit if its predicate has no timeout. Cap every operation. Bias toward 125 on timeout (skip, not bad) unless you have specific reason to believe a timeout IS the bug.</p>

<h3>The audit checklist</h3>

<pre class="code" data-lang="markdown" data-title="predicate-audit.md"># Predicate Audit (do this before `git bisect run`)

For each section of your predicate, check:

## Setup
[ ] Install / build failures exit 125, not 1
[ ] Lockfile is committed and the install uses --frozen-lockfile
[ ] External services are mocked or containerized — NOT staging

## Exercise
[ ] Random port (not hard-coded :3000)
[ ] Wait-for-ready loop, not arbitrary `sleep`
[ ] Environment pinned: TZ=UTC LC_ALL=C SOURCE_DATE_EPOCH=...
[ ] Timeouts on every potentially-long operation

## Observe
[ ] Captures the actual signal (HTTP code, value, file diff)
[ ] Does NOT conflate "failed assertion" with "test runner crashed"
[ ] Validates BOTH that work happened AND that it produced correct output

## Cleanup
[ ] `trap cleanup EXIT INT TERM` registered BEFORE any state is created
[ ] Removes temp files and dirs
[ ] Kills any backgrounded processes
[ ] Drops temporary databases / cleans up volumes

## Exit
[ ] Three-way: 0 (good), 1 (bad), 125 (skip)
[ ] No silent `exit 0` paths
[ ] Last line is the explicit exit decision, not an accident
</pre>

<div class="callout good">
<div class="callout-title">A reading drill</div>
<p>The next time you read someone else's bisection predicate (in a PR, a runbook, a Stack Overflow answer), run through these ten anti-patterns mentally. Most predicates in the wild have 2–4 of them. The skill of <em>seeing</em> the anti-patterns is what eventually lets you not <em>write</em> them.</p>
</div>
</template>

<template data-page-title="Debugging Your Own Predicate" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">Debugging Your Own Predicate — When the Predicate Itself Is Broken</h2>
<p class="lede">A predicate is code. Code has bugs. When <code>git bisect</code> returns a confidently-wrong answer, the bug is almost never in <code>git bisect</code> — it's in your predicate. This page walks you through the four symptoms of a broken predicate and the diagnostic steps for each.</p>

<h3>Symptom 1 — The "alleged culprit" doesn't reproduce</h3>
<p><strong>The signal:</strong> Bisect reports commit X is bad. You check out X, run the predicate manually. It passes.</p>

<p><strong>Diagnosis steps:</strong></p>
<ol>
  <li>Run the predicate 10 times in a row on X. How often does it pass vs. fail?</li>
  <li>If mixed: your predicate is flaky. Move to Symptom 3.</li>
  <li>If always passes: the predicate exited 1 during the bisection for a different reason than the bug. Check the bisect log for the actual stderr at round X — was it an OOM kill, a network timeout, a port collision?</li>
  <li>The fix: refine the predicate to return 125 for the env condition that caused the spurious failure.</li>
</ol>

<h3>Symptom 2 — Every commit is "bad"</h3>
<p><strong>The signal:</strong> Bisect narrows nothing — every <code>git bisect run</code> step reports "bad." The first or second commit becomes the culprit.</p>

<p><strong>Diagnosis steps:</strong></p>
<ol>
  <li>Did you confirm the good endpoint by running the predicate manually there? If no, do it now.</li>
  <li>If it fails at the alleged good endpoint: the predicate is wrong. Most likely your "expected" value is wrong, or your assertion logic is inverted (returning 1 when it should return 0).</li>
  <li>If it passes at the good endpoint but fails everywhere else: the predicate depends on something that's only present on your local working copy (e.g., a config file, a built artifact, environment variables) that doesn't get checked out by <code>git bisect</code>.</li>
  <li>The fix: ensure the predicate ONLY depends on committed code + the deps in the lockfile. Print every relevant env var at predicate start.</li>
</ol>

<h3>Symptom 3 — "Bisect is stuck in a loop of skips"</h3>
<p><strong>The signal:</strong> <code>git bisect</code> reports "I cannot decide because all commits left are skipped." Bisection effectively gave up.</p>

<p><strong>Diagnosis steps:</strong></p>
<ol>
  <li>Check the bisect log for the reason each commit was skipped (your <code>exit 125</code> paths).</li>
  <li>If skips are caused by install failures: your lockfile is too strict for the older commits. Try <code>--prefer-offline</code> + a pre-warmed cache; or relax to <code>pnpm install</code> (no <code>--frozen-lockfile</code>) for the bisection only.</li>
  <li>If skips are from build failures: the bug is in a code path that the older commits don't include. The good endpoint may be set too far back. Move it forward to the most recent confirmed-good commit.</li>
  <li>If skips are from timeouts: predicate or setup is hitting a hard limit. Either extend the timeout or skip commits known to be slow-but-correct.</li>
</ol>

<h3>Symptom 4 — Results differ between two engineers running the same predicate</h3>
<p><strong>The signal:</strong> Alice runs the bisection; gets commit X. Bob runs the same predicate; gets commit Y.</p>

<p><strong>Diagnosis steps:</strong></p>
<ol>
  <li>Compare their environments: OS, Node version, locale, timezone, installed system packages.</li>
  <li>Compare their working copies: untracked files, uncommitted local changes, different lockfile cache state.</li>
  <li>Run the predicate inside the same container (Docker / devcontainer) on both machines — does it now agree?</li>
  <li>The fix: every predicate that's worth committing should be runnable inside a containerized environment. Lock the OS + Node + lockfile + env vars. The "works on my machine" failure mode is solved at the predicate level by making "my machine" the same machine for everyone.</li>
</ol>

<h3>The reverse-engineering technique</h3>
<p>When you suspect your predicate is wrong but can't see why, instrument it:</p>

<pre class="code" data-lang="shell" data-title="instrument-predicate.sh">#!/usr/bin/env bash
# Wrap your predicate with verbose tracing.
exec &gt; &gt;(tee "/tmp/predicate-$(git rev-parse --short HEAD).log") 2&gt;&amp;1

# Print everything that might affect behavior.
echo "=== ENV ==="
env | sort

echo "=== CWD ==="
pwd
ls -la

echo "=== GIT STATE ==="
git rev-parse HEAD
git status --short

echo "=== UNTRACKED FILES (these don't get checked out) ==="
git status --short --untracked-files | head -20

echo "=== STARTING PREDICATE ==="
set -x   # bash trace mode: prints every command before running it

# ... your predicate code ...

set +x
echo "=== EXIT $? ==="
</pre>

<p>Then run <code>git bisect</code> with this instrumented version. After it finishes, you have a per-commit log of exactly what the predicate saw. The cause of the wrong answer is almost always visible in one of those logs.</p>

<h3>The "swap good/bad" sanity check</h3>
<p>Before running any non-trivial bisection, do this check (60 seconds):</p>
<ol>
  <li>Check out the known-good commit. Run the predicate. It should exit 0.</li>
  <li>Check out the known-bad commit. Run the predicate. It should exit 1.</li>
  <li>If either is wrong, the predicate is wrong; do not start the bisection.</li>
  <li>Re-run step 1 and 2 a few times (3 each, minimum) to check for flakiness.</li>
</ol>

<p>This check catches more predicate bugs than any other single technique. Senior engineers do it instinctively before every bisection. Juniors usually skip it and learn the importance the hard way.</p>

<h3>The meta-predicate technique</h3>
<p>For high-stakes bisections (a production incident, a customer-facing regression), write a <em>predicate for your predicate</em>:</p>

<pre class="code" data-lang="shell" data-title="meta-predicate.sh">#!/usr/bin/env bash
# Tests the predicate itself, not the code.
# Runs the predicate at 5 known points; verifies expected behavior.
set -uo pipefail

declare -a CHECKS=(
  "a3f9c81:0"    # known-good → should exit 0
  "b1c2d3e:0"    # also known-good → should exit 0
  "e7b2a91:1"    # known-bad → should exit 1
  "f9a8b7c:1"    # also known-bad → should exit 1
  "deadbeef:125" # known-broken (won't build) → should exit 125
)

for check in "${CHECKS[@]}"; do
  sha="${check%:*}"
  expected="${check#*:}"
  git checkout -q "$sha"
  ./predicate.sh &gt;/dev/null 2&gt;&amp;1
  got=$?
  if [ "$got" != "$expected" ]; then
    echo "FAIL: $sha expected $expected, got $got"
    exit 1
  fi
done
echo "All 5 checks pass — predicate is calibrated."
</pre>

<div class="callout">
<div class="callout-title">The predicate-craft mindset</div>
<p>A predicate is a tiny program that decides truth. Like any program that makes important decisions, it deserves the same care you'd give production code: clear sections, error handling, observability, tests. The first time you treat a predicate this way it feels like overkill. The first time you would have made a 4-hour mistake without it, you'll never write a predicate any other way again.</p>
</div>
</template>

<template data-page-title="Practice Exercises" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">Practice Exercises — Five Scenarios with Model Solutions</h2>
<p class="lede">Reading about predicate craft and writing predicates are different skills. The five exercises below give you the practice that turns understanding into competence. For each: read the scenario, write your own predicate, then compare to the model solution. Don't peek before attempting.</p>

<h3>Exercise 1 — The Slow Function</h3>
<p><strong>Scenario:</strong> Your library has a function <code>formatReport(data)</code> in <code>src/report.mjs</code>. Last quarter it ran in ~50ms on a 10,000-row input; today it takes 4 seconds. The repo has 500 commits since the last good measurement. Write a predicate.</p>

<details>
<summary>Pre-flight worksheet sketch (try yours, then compare)</summary>
<table class="cmp">
<tr><td>Candidate set</td><td>500 commits since last-known-good</td></tr>
<tr><td>Monotonic property</td><td><code>formatReport</code> on 10k rows finishes in &lt; 200ms</td></tr>
<tr><td>Good endpoint</td><td>~v2.3.0 (confirmed: 8 runs avg 52ms)</td></tr>
<tr><td>Bad endpoint</td><td>HEAD (confirmed: 8 runs avg 4.1s)</td></tr>
<tr><td>Predicate cost</td><td>install 5s + measurement 1s × 5 = ~10s per round; ~90s total</td></tr>
<tr><td>Could go wrong</td><td>JIT warm-up on first call; cold-cache filesystem reads</td></tr>
</table>
</details>

<details>
<summary>Model solution</summary>
<pre class="code" data-lang="javascript" data-title="ex-1-solution.mjs">#!/usr/bin/env node
// ex-1-solution.mjs — Exercise 1 model.
import { spawnSync } from 'child_process';
import fs from 'fs';
import { performance } from 'perf_hooks';

if (spawnSync('pnpm', ['install', '--frozen-lockfile', '--prefer-offline'], { stdio: 'ignore' }).status !== 0) process.exit(125);

let formatReport;
try { ({ formatReport } = await import('./src/report.mjs')); }
catch { process.exit(125); }                                       // unimportable = skip

const rows = JSON.parse(fs.readFileSync('fixtures/10k-rows.json'));

// Warm-up to let JIT settle
for (let i = 0; i &lt; 3; i++) formatReport(rows);

// Measure k=5; use median
const times = [];
for (let i = 0; i &lt; 5; i++) {
  const t = performance.now();
  formatReport(rows);
  times.push(performance.now() - t);
}
times.sort((a, b) =&gt; a - b);
const median = times[2];

console.log(`median = ${median.toFixed(1)} ms`);
process.exit(median &lt; 200 ? 0 : 1);
</pre>
<p><strong>Key choices:</strong> Use <code>performance.now()</code>, not <code>Date.now()</code> (sub-millisecond precision). Warm-up before measuring (JIT). Take the median, not the mean (resistant to outliers). The 200ms threshold is comfortably above good (~52ms) and well below bad (~4100ms).</p>
</details>

<h3>Exercise 2 — The Wrong HTTP Header</h3>
<p><strong>Scenario:</strong> An API endpoint <code>/users</code> used to set <code>Cache-Control: no-store</code>. Last week customers noticed pages caching their data. The bug is somewhere in the last 200 commits. Write a predicate.</p>

<details>
<summary>Model solution</summary>
<pre class="code" data-lang="shell" data-title="ex-2-solution.sh">#!/usr/bin/env bash
# ex-2-solution.sh — Exercise 2 model.
set -uo pipefail

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1 || exit 125

PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("",0));print(s.getsockname()[1]);s.close()')
PORT=$PORT pnpm start &amp; PID=$!
trap "kill $PID 2&gt;/dev/null || true" EXIT

# Wait for readiness
for i in $(seq 1 30); do
  curl -sf "http://localhost:$PORT/health" &gt;/dev/null &amp;&amp; break
  sleep 0.5
done

# Check the header (not the body)
CACHE_HEADER=$(curl -sf -I "http://localhost:$PORT/users" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control" {print $2}')
echo "Cache-Control: $CACHE_HEADER"

[ "$CACHE_HEADER" = "no-store" ] &amp;&amp; exit 0 || exit 1
</pre>
<p><strong>Key choice:</strong> The bug is in <em>headers</em>, not the body. <code>curl -I</code> requests headers only. We extract the specific header instead of grep-and-hope.</p>
</details>

<h3>Exercise 3 — The Cache Pollution Bug</h3>
<p><strong>Scenario:</strong> A function <code>getUserById(id)</code> caches results in-memory. Recently, calling <code>getUserById(1)</code> after <code>getUserById(2)</code> returns user 2's data. The cache was supposed to key by ID. Write a predicate.</p>

<details>
<summary>Model solution</summary>
<pre class="code" data-lang="javascript" data-title="ex-3-solution.mjs">#!/usr/bin/env node
// ex-3-solution.mjs — Exercise 3 model.
import { spawnSync } from 'child_process';

if (spawnSync('pnpm', ['install', '--frozen-lockfile', '--prefer-offline'], { stdio: 'ignore' }).status !== 0) process.exit(125);

let getUserById;
try { ({ getUserById } = await import('./src/users.mjs')); } catch { process.exit(125); }

// The bug only appears in a specific call sequence — encode it.
const u2 = await getUserById(2);
const u1 = await getUserById(1);    // should return user 1, not user 2

if (!u1 || !u2)                          process.exit(125);  // missing fixture data
if (u1.id !== 1 || u2.id !== 2)          process.exit(1);    // BUG present
process.exit(0);
</pre>
<p><strong>Key choice:</strong> The predicate's exercise step encodes the <em>exact sequence</em> that triggers the bug — not "test getUserById" in isolation. Bisection's quality is bounded by how precisely you describe the bug.</p>
</details>

<h3>Exercise 4 — The Bundle Size Doubled</h3>
<p><strong>Scenario:</strong> Last release, your built bundle was 240 KB gzipped. The newest is 510 KB. Find the commit that added the bulk.</p>

<details>
<summary>Model solution</summary>
<pre class="code" data-lang="shell" data-title="ex-4-solution.sh">#!/usr/bin/env bash
# ex-4-solution.sh — Exercise 4 model.
set -uo pipefail
THRESHOLD_KB="${THRESHOLD_KB:-300}"

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125

# Build to dist/
rm -rf dist
pnpm build &gt;/dev/null 2&gt;&amp;1 || exit 125

# Sum up gzipped sizes of all .js files in dist/
TOTAL_BYTES=$(find dist -name '*.js' -exec sh -c 'gzip -c "$1" | wc -c' _ {} \; | awk '{s+=$1} END {print s}')
TOTAL_KB=$((TOTAL_BYTES / 1024))
echo "Gzipped JS total: ${TOTAL_KB} KB (threshold ${THRESHOLD_KB} KB)"

[ "$TOTAL_KB" -lt "$THRESHOLD_KB" ] &amp;&amp; exit 0 || exit 1
</pre>
<p><strong>Key choice:</strong> Compare against <em>gzipped</em> size — that's what actually crosses the network. The 300 KB threshold is comfortably between the known-good (~240) and known-bad (~510) bands.</p>
</details>

<h3>Exercise 5 — The Race Condition</h3>
<p><strong>Scenario:</strong> A function <code>chargeCard()</code> sometimes double-charges. It happens ~10% of concurrent calls. The bug was introduced in the last 100 commits. Write a predicate. (Hint: this is harder than the others.)</p>

<details>
<summary>Model solution — with k-of-k voting</summary>
<pre class="code" data-lang="javascript" data-title="ex-5-solution.mjs">#!/usr/bin/env node
// ex-5-solution.mjs — Exercise 5 model.
// Race conditions are inherently noisy. We exercise the suspected race many
// times, then use a binomial threshold to decide "this commit is bad."
import { spawnSync } from 'child_process';

if (spawnSync('pnpm', ['install', '--frozen-lockfile', '--prefer-offline'], { stdio: 'ignore' }).status !== 0) process.exit(125);

let chargeCard, resetCardState;
try { ({ chargeCard, resetCardState } = await import('./src/payments.mjs')); } catch { process.exit(125); }

const N_TRIALS    = 50;          // run the race-prone code path 50 times
const FAIL_THRESH = 3;           // 3+ double-charges = predicate says "bad"

let doubleCharges = 0;
for (let i = 0; i &lt; N_TRIALS; i++) {
  resetCardState();
  // Two concurrent calls — race the lock.
  const [r1, r2] = await Promise.all([chargeCard('card_x', 100), chargeCard('card_x', 100)]);
  if (r1.charged + r2.charged &gt; 100) doubleCharges++;     // bug fires
}

console.log(`double-charges: ${doubleCharges} / ${N_TRIALS}`);
if (doubleCharges &gt;= FAIL_THRESH) process.exit(1);

// Even with the right behavior, sometimes the race never fires. To avoid
// returning "good" when we just got lucky, require enough trials with at
// least one near-race detected. (For complex races, k-of-k voting is
// the right answer at the bisection level — see Part IX Bayesian.)
process.exit(0);
</pre>
<p><strong>Key choice:</strong> Race conditions are noisy by nature. We trade per-round time for confidence: run 50 trials per round, threshold at 3. If the bug fires &gt; 5% of the time, this catches it almost always.</p>
</details>

<h3>Self-grading</h3>
<table class="cmp">
<tr><th>If your solution…</th><th>You're at level…</th></tr>
<tr><td>Was a single CLI invocation, no setup or cleanup</td><td>L3 — read more of the curriculum, then try again</td></tr>
<tr><td>Had setup, exercise, observation in clear sections — but no cleanup trap</td><td>L4 — close; add the trap and re-read XIII.1</td></tr>
<tr><td>Had all five sections; correct 125 vs 1 distinction; reasonable threshold choice</td><td>L5 — you've got it</td></tr>
<tr><td>Also noticed the issues the model solutions deliberately avoid (JIT warm-up; locale; rate limits)</td><td>L6 — you're writing the predicates the team uses for the hard incidents</td></tr>
<tr><td>Pre-wrote the worksheet and the meta-predicate sanity check before starting</td><td>L7 — you'd be reviewing the team's predicates, not just writing them</td></tr>
</table>

<div class="callout good">
<div class="callout-title">A drill that compounds</div>
<p>For the next ten bugs you bisect at work, write the predicate alone first. Then ask a senior teammate to review just the predicate (not the bisection result). Their feedback is the fastest single way to develop predicate-writing craft. Three or four review cycles and your predicates will be self-reviewing.</p>
</div>
