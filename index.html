<template data-page-title="Sharing Predicates" data-part="XIII — The Craft">
<span class="badge">Part XIII · The Craft of Writing Predicates</span>
<h2 class="page-title">Sharing Predicates — Making Them Survive Their Author</h2>
<p class="lede">A predicate you wrote in a panic at 2am for one bisection is fine. A predicate that lives in your repo for two years and is run by every engineer who joins the team needs different qualities. This final page is about making predicates that survive — read, understood, and used by people who weren't there when you wrote them.</p>

<h3>The five qualities of a sharable predicate</h3>

<table class="cmp">
<tr><th>Quality</th><th>What it means</th></tr>
<tr><td><strong>1. Documented intent</strong></td><td>The header explains WHY this predicate exists — what bug it found, what monotonic property it tests</td></tr>
<tr><td><strong>2. Explicit inputs</strong></td><td>Every env var the predicate reads is listed and documented at the top</td></tr>
<tr><td><strong>3. Example invocation</strong></td><td>The header includes a copy-pasteable example of how to run it</td></tr>
<tr><td><strong>4. Self-test mode</strong></td><td>Running the predicate with <code>--check</code> runs the meta-predicate against the known endpoints</td></tr>
<tr><td><strong>5. Failure-mode catalog</strong></td><td>Known ways this predicate can go wrong, with the fix for each</td></tr>
</table>

<h3>The shareable predicate template</h3>

<pre class="code" data-lang="shell" data-title="shareable-predicate.sh">#!/usr/bin/env bash
# ============================================================================
# checkout-latency-predicate.sh
# ----------------------------------------------------------------------------
# PURPOSE
#   Detects the commit at which p99 latency of GET /checkout exceeded 300 ms.
#   Originally written to find the regression introduced ~2026-04-15.
#
# CONTRACT
#   exit 0   → p99 of 20 sequential requests &lt; 300 ms
#   exit 1   → p99 ≥ 300 ms
#   exit 125 → environment problem; commit is untestable (build/install failed,
#              server didn't start, &gt; 25% of measurement requests failed)
#
# INPUTS (environment variables — all optional)
#   THRESHOLD_SEC   default 0.3 — the p99 threshold in seconds
#   N_SAMPLES       default 20  — how many request measurements per round
#   READY_TIMEOUT_S default 15  — how long to wait for server readiness
#
# EXAMPLE
#   git bisect start HEAD release-2026-04-15 -- services/checkout/
#   git bisect run ./checkout-latency-predicate.sh
#
# SELF-TEST
#   ./checkout-latency-predicate.sh --check
#     runs the predicate against known-good (a3f9c81) and known-bad (e7b2a91)
#     and verifies the expected exit codes. Exit 0 if predicate is calibrated.
#
# KNOWN FAILURE MODES
#   - If pnpm registry is unreachable, install fails → exit 125 (correct).
#   - If port 3000 was already in use by a stuck process, the server may
#     start on the random port but `kill` of the previous one may leak a
#     socket; rerun the bisection in a fresh shell.
#   - If you bisect across commits that pre-date the introduction of
#     /health, the readiness loop times out — set READY_TIMEOUT_S=60
#     and accept slower rounds.
#
# AUTHOR &amp; HISTORY
#   alex.chen@example.com — initial — 2026-06-04
#   maintained by @perf-eng-team
# ============================================================================
set -uo pipefail

THRESHOLD_SEC="${THRESHOLD_SEC:-0.3}"
N_SAMPLES="${N_SAMPLES:-20}"
READY_TIMEOUT_S="${READY_TIMEOUT_S:-15}"

# --- Self-test mode -------------------------------------------------------
if [ "${1:-}" = "--check" ]; then
  declare -a CHECKS=( "a3f9c81:0" "e7b2a91:1" )
  for c in "${CHECKS[@]}"; do
    sha="${c%:*}" expected="${c#*:}"
    git checkout -q "$sha" || { echo "skip: can't checkout $sha"; continue; }
    "$0" &gt;/dev/null 2&gt;&amp;1
    got=$?
    [ "$got" = "$expected" ] || { echo "FAIL $sha expected $expected got $got"; exit 1; }
  done
  echo "Calibration OK"; exit 0
fi

# --- Setup ---------------------------------------------------------------
pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm build &gt;/dev/null 2&gt;&amp;1                                     || exit 125

# --- Cleanup registered first --------------------------------------------
PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("",0));print(s.getsockname()[1]);s.close()')
SERVER_PID=""
SCRATCH=$(mktemp -d)
cleanup() {
  [ -n "$SERVER_PID" ] &amp;&amp; kill "$SERVER_PID" 2&gt;/dev/null || true
  rm -rf "$SCRATCH"
}
trap cleanup EXIT INT TERM

# --- Exercise ------------------------------------------------------------
PORT=$PORT node dist/server.js &gt; "$SCRATCH/server.log" 2&gt;&amp;1 &amp;
SERVER_PID=$!

READY=0
for _ in $(seq 1 $((READY_TIMEOUT_S * 2))); do
  curl -sf "http://localhost:$PORT/health" &gt;/dev/null &amp;&amp; { READY=1; break; }
  sleep 0.5
done
[ "$READY" = "0" ] &amp;&amp; { echo "server failed to start"; cat "$SCRATCH/server.log"; exit 125; }

# --- Observation ---------------------------------------------------------
declare -a measurements=()
fails=0
for i in $(seq 1 "$N_SAMPLES"); do
  out=$(curl -sf -o /dev/null -m 5 -w '%{http_code} %{time_total}\n' \
        "http://localhost:$PORT/checkout" || echo "000 0")
  code=$(echo "$out" | awk '{print $1}')
  ms=$(echo "$out"   | awk '{print $2}')
  [ "$code" = "200" ] &amp;&amp; measurements+=("$ms") || fails=$((fails + 1))
done

# --- Exit ----------------------------------------------------------------
if [ "$fails" -gt $((N_SAMPLES / 4)) ]; then
  echo "too many fails ($fails/$N_SAMPLES) — untestable"; exit 125
fi

p99=$(printf '%s\n' "${measurements[@]}" | sort -n \
      | awk -v n="$((${#measurements[@]} * 99 / 100))" 'NR==n+1')
echo "p99 = ${p99}s (threshold ${THRESHOLD_SEC}s, fails ${fails}/${N_SAMPLES})"

awk -v p="$p99" -v t="$THRESHOLD_SEC" 'BEGIN { exit (p &lt; t ? 0 : 1) }'
</pre>

<h3>Where to commit predicates</h3>
<table class="cmp">
<tr><th>Predicate's role</th><th>Where it lives</th></tr>
<tr><td>One-off, this-bisection-only</td><td>Don't commit; delete after bisection completes</td></tr>
<tr><td>Used quarterly for recurring regression checks</td><td><code>scripts/bisect/</code> in the repo it tests</td></tr>
<tr><td>Used across multiple repos by the team</td><td>A shared team tools repo, referenced as a git submodule or via <code>pnpm dlx git+...</code></td></tr>
<tr><td>Generic enough to publish</td><td>An npm/PyPI package, with versioning</td></tr>
</table>

<h3>The CI integration that compounds</h3>
<p>Every saved predicate is a regression test for its bug. Wire it into CI as a one-shot post-deploy check:</p>

<pre class="code" data-lang="yaml" data-title="ci-predicate-check.yml">name: regression-checks
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  regression-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Run every saved bisection predicate. Each one prevents the bug
      # that bisection originally found from sneaking back in.
      - name: Run saved bisection predicates
        run: |
          for p in scripts/bisect/*.sh; do
            echo "::group::$p"
            "$p"
            rc=$?
            [ "$rc" = "0" ] || { echo "::error::$p exited $rc"; exit 1; }
            echo "::endgroup::"
          done
</pre>

<p>Now every saved predicate prevents its bug from regressing. Your bisection investments compound forever.</p>

<h3>The handoff conversation</h3>
<p>When a teammate inherits a predicate you wrote, they should be able to answer three questions from the file alone:</p>
<ol>
  <li><strong>What bug did this find?</strong> Answer: the PURPOSE section of the header.</li>
  <li><strong>How do I run it?</strong> Answer: the EXAMPLE section.</li>
  <li><strong>What if it gives weird results?</strong> Answer: the KNOWN FAILURE MODES section.</li>
</ol>

<p>If any of those three answers requires asking you, the predicate is under-documented. Add the missing section. Next handoff will be quieter.</p>

<h3>Predicate code review checklist (for reviewers)</h3>

<pre class="code" data-lang="markdown" data-title="predicate-review.md"># Predicate PR Review Checklist

## Documentation
[ ] Header explains PURPOSE in 1–3 sentences
[ ] CONTRACT section lists exit codes and their meanings
[ ] INPUTS lists every env var with defaults and descriptions
[ ] EXAMPLE shows a copy-pasteable invocation
[ ] KNOWN FAILURE MODES lists 1+ failure with its remediation

## Structure (Part XIII.1)
[ ] Five sections clearly delineated (or equivalent in another language)
[ ] Cleanup registered before exercise

## Correctness (Part XIII.5 anti-patterns)
[ ] Env errors → exit 125
[ ] Random port if a server is involved
[ ] No external services (or explicitly documented exception)
[ ] Time / locale / TZ pinned
[ ] Hard timeouts on long operations
[ ] Threshold chosen with documented good/bad measurements

## Calibration
[ ] `--check` mode verifies known endpoints
[ ] At least one good SHA and one bad SHA in the self-test

## Sustainability
[ ] Committed to a discoverable location
[ ] Referenced from regression CI
</pre>

<div class="callout good">
<div class="callout-title">The closing principle of the craft</div>
<p>A predicate is a small program that decides truth about your code's history. The discipline of writing it well is one of the most leveraged skills in engineering — every good predicate finds one bug now and prevents that class of bug forever after. The investment in writing it with care: thirty extra minutes. The return: years of saved debugging time, for everyone who comes after you. <strong>This is the work that distinguishes engineering hobbies from engineering professions, and engineering professions from engineering excellence.</strong></p>
<p>You now know how to do it. Go build the next one.</p>
</div>
<p style="margin-top: 36px; color: var(--fg-faint); font-size: 13px;">— end of curriculum. Now go halve something. And teach the next engineer how. And design the next system so that future bisections always work. And write predicates that survive you.</p>
</template>

          colors: {
            'editor.background': '#ffffff',
            'editor.foreground': '#1c2025',
            'editor.lineHighlightBackground': '#f5f7fa',
            'editorLineNumber.foreground': '#a0a8b4'
          }
        });
        resolve();
      });
    });
    return monacoReady;
  }

  function currentMonacoTheme() {
    return document.body.dataset.theme === 'light' ? 'bisect-light' : 'bisect-dark';
  }

  function langFor(tag) {
    const map = {
      shell: 'shell', bash: 'shell', sh: 'shell', zsh: 'shell',
      javascript: 'javascript', js: 'javascript', mjs: 'javascript',
      typescript: 'typescript', ts: 'typescript',
      yaml: 'yaml', yml: 'yaml',
      json: 'json',
      svelte: 'html', html: 'html',
      markdown: 'markdown', md: 'markdown'
    };
    return map[(tag || '').toLowerCase()] || 'plaintext';
  }

  async function hydrateCodeOnPage(section) {
    if (!section) return;
    const blocks = section.querySelectorAll('pre.code:not([data-hydrated])');
    if (!blocks.length) return;

    await ensureMonaco();
    blocks.forEach((pre) => {
      pre.setAttribute('data-hydrated', '1');
      const lang = langFor(pre.dataset.lang);
      const title = pre.dataset.title || lang;
      const code = pre.textContent.replace(/\s+$/, '');

      const wrap = document.createElement('div');
      wrap.className = 'code-wrap';

      const header = document.createElement('div');
      header.className = 'code-header';
      header.innerHTML =
        '<span><span class="lang-tag">' + lang + '</span> &nbsp;·&nbsp; ' + escapeHtml(title) + '</span>' +
        '<button class="copy-btn" type="button">Copy</button>';
      wrap.appendChild(header);

      const editorHost = document.createElement('div');
      editorHost.className = 'monaco-host';
      const lines = code.split('\n').length;
      editorHost.style.height = Math.min(560, Math.max(80, lines * 19 + 18)) + 'px';
      wrap.appendChild(editorHost);

      pre.replaceWith(wrap);

      const editor = monaco.editor.create(editorHost, {
        value: code,
        language: lang,
        theme: currentMonacoTheme(),
        readOnly: true,
        automaticLayout: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        fontSize: 13,
        fontFamily: '"JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,monospace',
        renderLineHighlight: 'none',
        wordWrap: 'off',
        scrollbar: { vertical: 'auto', horizontal: 'auto', alwaysConsumeMouseWheel: false }
      });
      editors.push(editor);

      const copyBtn = header.querySelector('.copy-btn');
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(editor.getValue());
          copyBtn.textContent = 'Copied!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('copied');
          }, 1400);
        } catch (e) {
          copyBtn.textContent = 'Copy failed';
        }
      });
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
  }

  // ---- theme toggle
  const THEME_KEY = 'bisect-curriculum-theme';
  function applyTheme(theme) {
    document.body.dataset.theme = theme;
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (theme === 'light') { icon.textContent = '☼'; label.textContent = 'Dark'; }
    else                   { icon.textContent = '☾'; label.textContent = 'Light'; }
    // Re-theme every existing Monaco editor.
    if (window.monaco) {
      monaco.editor.setTheme(currentMonacoTheme());
    }
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }
  (function initTheme() {
    let stored;
    try { stored = localStorage.getItem(THEME_KEY); } catch {}
    if (stored === 'light' || stored === 'dark') {
      applyTheme(stored);
    } else {
      // Prefer system preference if no stored value.
      const prefersLight = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(prefersLight ? 'light' : 'dark');
    }
  })();
  document.getElementById('theme-btn').addEventListener('click', () => {
    applyTheme(document.body.dataset.theme === 'light' ? 'dark' : 'light');
  });

  // ---- search
  function highlightInString(haystack, needle) {
    if (!needle) return escapeHtml(haystack);
    const re = new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return escapeHtml(haystack).replace(
      new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'),
      '<mark>$1</mark>'
    );
  }
  // Build a haystack per page = title + text content (without code blocks).
  const pageHaystacks = PAGES.map((p, i) => {
    const sec = document.querySelector('section.page[data-page="' + i + '"]');
    const clone = sec ? sec.cloneNode(true) : null;
    if (clone) clone.querySelectorAll('pre.code').forEach(el => el.remove());
    const text = (clone ? clone.textContent : p.title).replace(/\s+/g, ' ').trim();
    return (p.title + ' ' + text).toLowerCase();
  });

  function applySearch(q) {
    const needle = q.trim().toLowerCase();
    const tocAnchors = Array.from(document.querySelectorAll('#toc-list a'));
    const tocParts   = Array.from(document.querySelectorAll('#toc-list .part'));

    if (!needle) {
      tocAnchors.forEach((a) => {
        a.classList.remove('hidden');
        const i = Number(a.dataset.idx);
        a.querySelector('span:last-child').textContent = PAGES[i].title;
      });
      tocParts.forEach(p => p.classList.remove('hidden'));
      const empty = document.getElementById('search-empty');
      if (empty) empty.remove();
      return;
    }

    let matches = 0;
    tocAnchors.forEach((a) => {
      const i = Number(a.dataset.idx);
      const hit = pageHaystacks[i].includes(needle);
      a.classList.toggle('hidden', !hit);
      if (hit) {
        matches++;
        // Highlight the matched portion of the title (if any).
        const titleSpan = a.querySelector('span:last-child');
        titleSpan.innerHTML = highlightInString(PAGES[i].title, q.trim());
      }
    });

    // Hide a Part heading if every page under it is hidden.
    tocParts.forEach((p) => {
      let next = p.nextElementSibling;
      let anyVisible = false;
      while (next && next.tagName === 'A') {
        if (!next.classList.contains('hidden')) { anyVisible = true; break; }
        next = next.nextElementSibling;
      }
      p.classList.toggle('hidden', !anyVisible);
    });

    let empty = document.getElementById('search-empty');
    if (matches === 0) {
      if (!empty) {
        empty = document.createElement('div');
        empty.id = 'search-empty';
        empty.className = 'search-empty';
        empty.textContent = 'No pages match.';
        document.getElementById('toc-list').appendChild(empty);
      }
    } else if (empty) empty.remove();
  }

  const searchInput = document.getElementById('search');
  let searchTimer = null;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => applySearch(e.target.value), 80);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { searchInput.value = ''; applySearch(''); searchInput.blur(); }
    if (e.key === 'Enter') {
      // Jump to first visible match.
      const first = document.querySelector('#toc-list a:not(.hidden)');
      if (first) go(Number(first.dataset.idx));
    }
  });
  // Global "/" focuses search.
  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  // first render
  render();
})();
</script>

</body>
</html>
