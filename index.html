<template data-page-title="What Is a Bug, Really?" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">What Is a Bug, Really?</h2>
<p class="lede">If you've never written software, the word "bug" sounds informal — a cute term for something that's broken. It's not. A bug is a precise concept, and understanding what it actually is changes how you think about every problem in this curriculum. This page explains it in plain language, with no prior coding experience assumed.</p>

<h3>The shortest definition</h3>
<p>A bug is <strong>a gap between what software does and what it should do</strong>. That's it. Three words: <em>should, does, gap.</em></p>
<p>Example. You click "Buy Now." The site charges you $10 instead of $5. The <em>should</em>: charge $5. The <em>does</em>: charge $10. The <em>gap</em>: $5. That gap is the bug.</p>

<h3>Why bugs happen</h3>
<p>Software is made of instructions — millions of them, written by humans over years. Each instruction is exact: do this, then that, with these numbers. The smallest typo can flip the meaning. A single wrong character ("&lt;" instead of "&lt;=") can charge customers twice. There's no "the computer figured out what you meant" — computers do exactly what they're told.</p>
<p>So bugs are inevitable. The question isn't "how do we write bug-free code" (we can't). The question is: <strong>when a bug appears, how fast can we find it?</strong> That's where this curriculum begins.</p>

<h3>The three things you need to know about every bug</h3>
<table class="cmp">
<tr><th>Question</th><th>Why it matters</th></tr>
<tr><td>What does it do? (the <em>does</em>)</td><td>You can't fix a bug you can't describe.</td></tr>
<tr><td>What should it do? (the <em>should</em>)</td><td>Sometimes nobody actually agrees on this. That's a different problem from a bug.</td></tr>
<tr><td>When did it start? (the <em>when</em>)</td><td>This is the question bisection answers. If you know when the gap appeared, you know <em>what changed</em> at that moment — and that's almost always the cause.</td></tr>
</table>

<h3>The "when" is the secret</h3>
<p>Most beginners assume debugging is about <em>where</em> — "which line of code is wrong?" Experienced engineers know it's about <em>when</em> — "which change caused this?" Because at any moment in time, every line of code was either present-and-working or not-yet-written-or-broken. If you find the moment things changed from "working" to "broken," you've narrowed millions of lines to one change. That change is almost always your bug.</p>
<p>This is what bisection does. It's a fast way to find <em>the moment things changed</em>.</p>

<h3>The cost of bugs (a senior-engineer view)</h3>
<p>Engineers at a junior level often think bugs are technical inconveniences. They're not. Bugs are economic events:</p>
<ul>
  <li>A bug that charges customers twice will get refunded — that's direct revenue loss.</li>
  <li>A bug that crashes the app loses users — long-term revenue loss.</li>
  <li>A bug that exposes private data costs lawsuit money and trust.</li>
  <li>A bug that takes a week to find ties up engineers who could be building features.</li>
</ul>
<p>The cost of a bug is measured in money and time, not in "how hard it is to fix." A simple typo that takes two weeks to locate costs the same as two weeks of engineering payroll. <strong>This is why "how fast can we find it" matters — not as a personal pride thing, but as a real business cost.</strong></p>

<h3>What this curriculum will give you</h3>
<p>By the end you'll know how to:</p>
<ol>
  <li>Take a bug report and figure out what's actually happening.</li>
  <li>Reproduce the bug reliably (this alone is most of debugging).</li>
  <li>Use bisection to narrow millions of suspects to one in minutes.</li>
  <li>Tell when bisection is the right tool and when it's not.</li>
  <li>Design new systems so that future bugs are easy to find.</li>
  <li>Lead other engineers through debugging without taking over.</li>
</ol>
<p>You don't need to be able to code to read what follows. The next few pages will give you just enough vocabulary to make sense of every example in the curriculum.</p>
</template>

<template data-page-title="The Terminal in 10 Minutes" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">The Terminal in 10 Minutes</h2>
<p class="lede">Every code example in this curriculum runs in something called a "terminal." If you've only used software through windows, icons, and menus, the terminal looks weird and scary. It's not. It's just a different kind of door into the same computer — one that lets you give instructions in writing. Ten minutes from now you'll be able to follow every command in this curriculum.</p>

<h3>What it actually is</h3>
<p>A terminal is a text window where you type a command, press Enter, and the computer does it. That's the whole interface. There are no buttons. The cursor blinks; you tell it what to do.</p>

<pre class="code" data-lang="text" data-title="what-terminal-looks-like.txt">user@my-laptop:~/Documents$ ls
notes.txt    project/    photo.jpg

user@my-laptop:~/Documents$ cd project
user@my-laptop:~/Documents/project$ ls
README.md   src/    package.json
</pre>

<p>The bit before the <code>$</code> is the "prompt" — it tells you who you are (<code>user</code>), what computer (<code>my-laptop</code>), and where you currently are in the file system (<code>~/Documents</code>, where <code>~</code> means "your home folder"). The <code>$</code> is just "your turn — type something."</p>

<h3>The five commands you need to know</h3>
<table class="cmp">
<tr><th>Command</th><th>Means</th><th>Like clicking…</th></tr>
<tr><td><code>ls</code></td><td>"list" the files here</td><td>Opening a folder window</td></tr>
<tr><td><code>cd folder-name</code></td><td>"change directory" — go into a folder</td><td>Double-clicking a folder</td></tr>
<tr><td><code>cd ..</code></td><td>Go back up one folder</td><td>Clicking the "back" arrow</td></tr>
<tr><td><code>pwd</code></td><td>"print working directory" — where am I?</td><td>Reading the title bar of a folder window</td></tr>
<tr><td><code>cat file-name</code></td><td>Print the contents of a text file</td><td>Double-clicking a text file</td></tr>
</table>

<p>That's enough to navigate any code project on any computer. Let's try it:</p>

<pre class="code" data-lang="shell" data-title="first-session.sh"># See where you are.
pwd
# → /Users/alice  (or /home/alice on Linux)

# Look around.
ls
# → Desktop  Documents  Downloads  Music  Pictures

# Go into one of those.
cd Documents
ls
# → notes.txt  project

# Look at a file.
cat notes.txt
# → (whatever's inside notes.txt prints here)

# Go back up.
cd ..
pwd
# → /Users/alice
</pre>

<h3>Running a "script"</h3>
<p>A "script" is just a file with commands inside it. To run one, type <code>./</code> followed by its name:</p>

<pre class="code" data-lang="shell" data-title="run-a-script.sh">./hello.sh
# → Hello, world!
</pre>

<p>The <code>./</code> means "in the current folder." Without it, the terminal looks for a system-wide command — and gets confused if you meant a local script.</p>

<h3>Stopping something that's running</h3>
<p>If a command takes too long or gets stuck, press <strong>Ctrl+C</strong> (Cmd+C on Mac — but use Ctrl+C in the terminal, even on Mac). That sends a "stop now" signal. Memorize this; you'll use it constantly.</p>

<h3>The thing that confuses beginners most</h3>
<p>Terminal commands give <em>no confirmation when they succeed</em>. If you type <code>cd Documents</code> and nothing prints, that means it worked. The Unix philosophy is: silence = success. Beginners often stare at the screen thinking "did anything happen?" Yes. The lack of error is the success message.</p>

<div class="callout">
<div class="callout-title">The principal-engineer angle</div>
<p>Every engineer at every level uses the terminal daily. The reason isn't tradition — it's that the terminal is the most efficient interface ever invented for one specific thing: <strong>composing actions</strong>. You can stack commands, save them in scripts, share scripts with teammates, and a year later the script still works exactly the same. No interface element moved, no button got redesigned. The terminal isn't old-fashioned; it's the most stable user interface in computing.</p>
</div>

<h3>What about Mac, Windows, Linux?</h3>
<table class="cmp">
<tr><th>Your OS</th><th>How to open a terminal</th></tr>
<tr><td>Mac</td><td>Spotlight (Cmd+Space), type "Terminal", press Enter</td></tr>
<tr><td>Linux</td><td>Look for "Terminal" in your applications, or press Ctrl+Alt+T on many distros</td></tr>
<tr><td>Windows</td><td>Use <a href="https://learn.microsoft.com/en-us/windows/wsl/install" target="_blank" rel="noopener">WSL (Windows Subsystem for Linux)</a>. Mac and Linux terminals work the same; Windows's built-in Command Prompt and PowerShell are different enough to be confusing for this curriculum.</td></tr>
</table>
<p>That's the whole primer. The next page covers git, and from there you can read every example in this curriculum.</p>
</template>

<template data-page-title="Git in 10 Minutes" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">Git in 10 Minutes</h2>
<p class="lede">Git is the tool that lets engineers save snapshots of code as they work, see what changed between any two snapshots, and roll back to any earlier state. Every bisection example in this curriculum builds on git. You don't need to be an expert — you need three concepts (commits, branches, history) and four commands.</p>

<h3>The mental model</h3>
<p>Imagine you're writing a novel. Every time you finish a paragraph you're proud of, you save a copy of the whole document with today's date. That way if tomorrow you write something terrible, you can go back to yesterday's version.</p>
<p>Git does this for code, automatically, perfectly. Every save (called a <strong>commit</strong>) records exactly what changed since the last save. Years of work become a chain of thousands of small saves you can browse, compare, and rewind.</p>

<h3>The three concepts</h3>

<h4>1. Commit (a saved snapshot)</h4>
<p>A commit is one save point. It has:</p>
<ul>
  <li>An exact copy of every file at that moment.</li>
  <li>A message describing what changed ("Fix login button color").</li>
  <li>The author and timestamp.</li>
  <li>A unique ID — a long string of letters and numbers like <code>a3f2c91</code>.</li>
</ul>

<h4>2. History (the chain of all commits)</h4>
<p>Commits link to each other. The newest one points to the one before it, which points to the one before that, all the way back to the very first commit. This chain is the project's history.</p>

<pre class="code" data-lang="text" data-title="git-history.txt">[newest]  d4e5f6  "Fix payment bug"
              ↓
          c3d4e5  "Add receipt email"
              ↓
          b2c3d4  "Update prices"
              ↓
          a1b2c3  "Initial commit"  [oldest]
</pre>

<p>This chain is exactly what bisection searches through.</p>

<h4>3. Branch (a parallel line of commits)</h4>
<p>Sometimes two engineers work on different features at the same time. Each works on their own "branch" — a side chain of commits — and merges back to the main branch when ready. For this curriculum's basics, you can mostly ignore branches and treat history as a single line.</p>

<h3>The four commands you need</h3>

<pre class="code" data-lang="shell" data-title="git-essentials.sh"># See where you are in the history.
git log --oneline -5
# → d4e5f6 Fix payment bug
#   c3d4e5 Add receipt email
#   b2c3d4 Update prices
#   a1b2c3 Initial commit

# Jump to a specific commit (read-only — to look around).
git checkout c3d4e5
# → "HEAD is now at c3d4e5 Add receipt email"
# Now your files look exactly like they did at that commit.

# Go back to the latest version (the "main" branch).
git checkout main
# → "Switched to branch 'main'"

# See what changed in one specific commit.
git show d4e5f6
# → (prints the message and the exact lines added/removed)
</pre>

<h3>That's all you need for bisection</h3>
<p>The curriculum's git bisect commands use the same four concepts: checkout, history, commits, messages. Once you're comfortable jumping between commits with <code>git checkout</code>, <code>git bisect</code> automates jumping in a binary-search pattern — and that's the whole tool.</p>

<h3>The mistake that scares beginners</h3>
<p>Beginners hear horror stories about git eating their work. In practice, this almost never happens — git keeps everything you've committed forever, even if you "delete" a branch. <strong>The only way to lose work in git is to lose work that was never committed.</strong></p>
<p>The rule: <em>commit early and often</em>. Even commits with messages like "WIP" are worth saving. You can always reorganize them later; you can't recover work you never saved.</p>

<div class="callout">
<div class="callout-title">The principal-engineer angle</div>
<p>Git history is documentation. A year from now, when you're trying to understand <em>why</em> some line of code exists, the only honest answer is in the commit that introduced it — its message, its diff, the PR that referenced it. Engineers who treat commits as "I'll squash these later" are throwing away their team's future memory. A clean, atomic, well-messaged git history is one of the highest-leverage artifacts any team produces. <strong>Bisection's superpower depends on history quality.</strong> A history of "WIP", "fix", "fix again", "actually fix it" makes bisection useless.</p>
</div>

<h3>Going deeper (later)</h3>
<p>This page deliberately skips branches, merges, rebases, stashes, and remotes. Part II of the curriculum covers <code>git bisect</code> assuming nothing more than what you've just read. When you're ready to learn more, the official "<a href="https://git-scm.com/book/en/v2" target="_blank" rel="noopener">Pro Git</a>" book is free, excellent, and authoritative.</p>
</template>

<template data-page-title="How to Read the Code in This Curriculum" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">How to Read the Code in This Curriculum</h2>
<p class="lede">Code looks intimidating until you realize it's just instructions, written in shorthand, in one of a few well-known dialects. This page walks through every kind of code block you'll see in the curriculum — bash scripts, JavaScript, JSON, YAML — and explains the patterns you need to skim them confidently. You won't be writing them, but you'll <em>read</em> them like an engineer.</p>

<h3>The five dialects you'll meet</h3>
<table class="cmp">
<tr><th>Dialect</th><th>What it's for</th><th>How to recognize</th></tr>
<tr><td><strong>Bash / shell</strong></td><td>Step-by-step instructions for the terminal</td><td>Lines start with commands like <code>ls</code>, <code>cd</code>, <code>git</code>, <code>echo</code></td></tr>
<tr><td><strong>JavaScript (Node)</strong></td><td>"Real programs" that do calculations and logic</td><td><code>function</code>, <code>const</code>, <code>=&gt;</code>, curly braces <code>{}</code></td></tr>
<tr><td><strong>JSON</strong></td><td>Structured data — settings and lists</td><td>Curly braces everywhere, <code>"keys"</code> and values</td></tr>
<tr><td><strong>YAML</strong></td><td>Structured data, but more readable</td><td>Indented lines with <code>key:</code> at the start</td></tr>
<tr><td><strong>Markdown</strong></td><td>Notes and documentation</td><td><code>#</code>, <code>-</code>, plain prose</td></tr>
</table>

<h3>Bash, the most common one here</h3>
<p>Bash is what runs in a terminal. Bash scripts are files full of terminal commands, run top to bottom. The patterns to recognize:</p>

<pre class="code" data-lang="shell" data-title="reading-bash.sh">#!/usr/bin/env bash
# This first line says "run me with bash."
# Lines starting with # are comments — notes for humans, ignored by the computer.

# A "variable" stores a value with a name.
NAME="Alice"

# To use a variable, prefix it with $.
echo "Hello, $NAME"
# → Hello, Alice

# A "loop" repeats something for each item in a list.
for fruit in apple banana cherry; do
  echo "I like $fruit"
done
# → I like apple
# → I like banana
# → I like cherry

# An "if" runs code only when a condition is true.
if [ "$NAME" = "Alice" ]; then
  echo "Hi Alice!"
fi
</pre>

<p>That's 80% of every bash script you'll see in this curriculum. The remaining 20% is fancier — but if you can recognize variables (<code>$NAME</code>), loops (<code>for ... do ... done</code>), and conditionals (<code>if ... then ... fi</code>), you can <em>skim</em> any bash script and follow the logic.</p>

<h3>JavaScript</h3>
<p>JavaScript looks more like math equations and English combined. The patterns:</p>

<pre class="code" data-lang="javascript" data-title="reading-js.mjs">// Lines starting with // are comments.

// Storing values:
const name = "Alice";              // const = "won't change"
let count = 0;                     // let = "will change"

// A "function" is a named recipe.
function greet(who) {              // takes one input (who)
  return "Hello, " + who;          // outputs a string
}
console.log(greet("Alice"));       // → Hello, Alice

// A "loop" works similarly to bash.
for (const fruit of ["apple", "banana"]) {
  console.log("I like " + fruit);
}

// An "if" works similarly.
if (count === 0) {
  console.log("Nothing yet.");
}
</pre>

<p>You'll see curly braces <code>{}</code> a lot — they group lines into blocks. Semicolons end statements. The double-equals (<code>==</code>) and triple-equals (<code>===</code>) both mean "compare" — the triple version is the modern, stricter one.</p>

<h3>JSON</h3>
<p>JSON is structured data. Two shapes: objects (key-value pairs in curly braces) and arrays (lists in square brackets). That's it.</p>

<pre class="code" data-lang="json" data-title="reading-json.json">{
  "name": "Alice",
  "age": 30,
  "favorite-fruits": ["apple", "banana"],
  "address": {
    "city": "Lisbon",
    "country": "Portugal"
  }
}
</pre>

<p>You'll see <code>package.json</code> a lot — it's a settings file for projects. <code>tsconfig.json</code> is a settings file for TypeScript projects. The format is always the same: keys in quotes, values can be numbers, strings, lists, or nested objects.</p>

<h3>YAML</h3>
<p>YAML is like JSON but without quotes and braces — easier on the eyes. Indentation does the grouping. You'll see this in CI files (<code>.github/workflows/*.yml</code>) and Kubernetes configs.</p>

<pre class="code" data-lang="yaml" data-title="reading-yaml.yml">name: Alice
age: 30
favorite-fruits:
  - apple
  - banana
address:
  city: Lisbon
  country: Portugal
</pre>

<p>Lines starting with <code>-</code> are list items. Lines indented under another line are nested inside it.</p>

<h3>What you do <em>not</em> need to understand</h3>
<p>You don't need to:</p>
<ul>
  <li>Memorize the syntax. Refer back to this page whenever something looks odd.</li>
  <li>Understand every line of every code block. The curriculum's prose explains what each block does.</li>
  <li>Write any of this from scratch. Reading and modifying is enough.</li>
</ul>

<div class="callout good">
<div class="callout-title">The L7 angle on code reading</div>
<p>Senior engineers don't "read code" the way beginners do — line by line. They <em>skim for shapes</em>: "this is a loop, this is a variable assignment, this is a function call." The shape gives 80% of the meaning. Then they zoom into the 20% that matters for the question they're answering. You'll develop this skill faster than you expect. Just lean on the patterns above and keep going.</p>
</div>
</template>

<template data-page-title="Binary Search, Visualized" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">Binary Search, Visualized</h2>
<p class="lede">Bisection IS binary search applied to bugs. So before we talk about debugging, let's understand binary search itself — visually, no math, no code. By the end you'll see why it's almost magical.</p>

<h3>The high-low game</h3>
<p>You've played this. Someone picks a number between 1 and 100. You guess. They say "higher" or "lower." How few guesses do you need to always win, no matter what number they picked?</p>

<p><strong>Bad strategy: guess 1, 2, 3, 4...</strong> Worst case: 100 guesses.</p>

<p><strong>Smart strategy: always guess the middle.</strong></p>

<pre class="code" data-lang="text" data-title="binary-search-game.txt">Round 1: Range is 1..100. Middle is 50. You guess 50.
         "Higher." So the answer is between 51 and 100.

Round 2: Range is 51..100. Middle is 75. You guess 75.
         "Lower." So the answer is between 51 and 74.

Round 3: Range is 51..74. Middle is 62. You guess 62.
         "Higher." So the answer is between 63 and 74.

Round 4: Range is 63..74. Middle is 68. You guess 68.
         "Lower." So the answer is between 63 and 67.

Round 5: Range is 63..67. Middle is 65. You guess 65.
         "Higher." So the answer is between 66 and 67.

Round 6: Range is 66..67. Middle is 66. You guess 66.
         "Higher." Answer is 67.

Round 7: You guess 67. ✓

Total guesses: 7.
</pre>

<p>Seven guesses out of 100. <strong>That's binary search.</strong></p>

<h3>What just happened</h3>
<p>Each guess told you the answer was either in the lower half or the upper half. You <em>threw away half the possibilities</em> with every guess. After 7 rounds, you've cut 100 numbers down to 1.</p>

<p>Let's draw it:</p>

<pre class="code" data-lang="text" data-title="binary-search-shrinking.txt">Round 1:  [================================================] 100 numbers
Round 2:  [========================]                          50 numbers
Round 3:  [============]                                      25 numbers
Round 4:  [======]                                            12 numbers
Round 5:  [===]                                                6 numbers
Round 6:  [=]                                                  3 numbers
Round 7:  done                                                 1 number
</pre>

<p>That halving is the entire trick. The technical name for "how many times you can halve N before you reach 1" is <em>log base 2 of N</em>, written <code>log₂(N)</code>. For 100, log₂(100) is about 7. For 1,000 it's 10. For a million it's 20.</p>

<h3>The numbers that will surprise you</h3>
<table class="cmp">
<tr><th>If you have this many suspects…</th><th>Linear search worst case</th><th>Binary search worst case</th></tr>
<tr><td>10</td><td>10 guesses</td><td>4 guesses</td></tr>
<tr><td>100</td><td>100</td><td>7</td></tr>
<tr><td>1,000</td><td>1,000</td><td>10</td></tr>
<tr><td>10,000</td><td>10,000</td><td>14</td></tr>
<tr><td>100,000</td><td>100,000</td><td>17</td></tr>
<tr><td>1,000,000</td><td>1,000,000</td><td>20</td></tr>
<tr><td>1,000,000,000 (a billion)</td><td>a billion</td><td>30</td></tr>
</table>

<p>Read that last row again. <strong>A billion suspects can be narrowed to one with thirty yes/no questions.</strong> This is the most powerful idea in computer science applied to debugging. The bigger the problem, the more impressive bisection becomes.</p>

<h3>The two rules you must follow</h3>
<p>Binary search only works when:</p>
<ol>
  <li><strong>The list is ordered.</strong> "Higher" and "lower" must make sense. For numbers, that's obvious. For bugs, "before this commit it worked, after this commit it broke" is the same idea — the list of commits is ordered by time.</li>
  <li><strong>The order doesn't switch.</strong> If the answer is "yes" before some point and "no" after, and never switches back, you're good. If it switches back and forth, binary search misleads you. (This is the "monotonicity invariant" you'll meet in Part I.)</li>
</ol>

<h3>Why this matters for debugging</h3>
<p>Think of every commit in a project's history as a number from 1 to N. The "should we go higher or lower?" question becomes "is this commit's code working or broken?" Once you answer that for the middle commit, you've thrown away half of history.</p>

<p>With ten yes/no answers, you've narrowed a thousand commits to one. <strong>That one commit is your bug.</strong> This is the entire premise of Part I onwards.</p>

<div class="callout good">
<div class="callout-title">The principal-engineer angle</div>
<p>Binary search isn't just a debugging trick — it's a mental discipline you'll apply to every search problem for the rest of your career. Looking for a corrupted record in a database log? Bisect. Looking for a leaky resource in a service? Bisect by routing rules. Looking for the date a config changed? Bisect across snapshots. Whenever someone says "we have to check 10,000 of these," your reaction should be: <em>can I cut that to 14 with bisection?</em> Usually yes.</p>
</div>
</template>

<template data-page-title="The Scientific Method for Debugging" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">The Scientific Method for Debugging</h2>
<p class="lede">Debugging is a science. Not a metaphor for science — actual science. You observe, you form a hypothesis, you design an experiment, you check the result. Engineers who do this well find bugs in minutes; engineers who don't can spend days "trying things." The difference is method, not talent. This page teaches the method.</p>

<h3>The five steps</h3>
<ol>
  <li><strong>Observe.</strong> What exactly is happening? Get the actual error, the actual numbers, the actual symptoms. Don't paraphrase. Don't guess.</li>
  <li><strong>Hypothesize.</strong> What's the simplest explanation that fits the observation? Make it specific. "Something's wrong with the database" is not a hypothesis. "The user record for ID 4827 is missing the email field" is a hypothesis.</li>
  <li><strong>Predict.</strong> If the hypothesis is true, what should you see when you do <em>X</em>? Be specific: "if I query the user record, the email column will be empty."</li>
  <li><strong>Test.</strong> Do the experiment. Carefully, with as few variables changing as possible.</li>
  <li><strong>Conclude.</strong> Either the result matches the prediction (hypothesis stands; you've learned something) or it doesn't (hypothesis is wrong; back to step 2 with new information).</li>
</ol>

<h3>Walk-through: a real bug</h3>
<p>Bug report: "The login button doesn't work for some users."</p>

<table class="cmp">
<tr><th>Step</th><th>What you do</th></tr>
<tr><td>Observe</td><td>Watch a user log in. The button is clicked. The page reloads. They see "Email not verified" — but they verified their email yesterday. So: it's not that login doesn't work, it's that the system thinks they're unverified.</td></tr>
<tr><td>Hypothesis</td><td>The verification flag isn't being saved when users click the verification link.</td></tr>
<tr><td>Prediction</td><td>If I look up this user in the database, the <code>email_verified</code> field will be false even though they clicked the link.</td></tr>
<tr><td>Test</td><td>Query the database for this user. Look at the field.</td></tr>
<tr><td>Conclude (case A)</td><td>The field is false. Hypothesis confirmed. Next question: <em>why</em> isn't it being saved? New hypothesis loop.</td></tr>
<tr><td>Conclude (case B)</td><td>The field is true! Hypothesis wrong. The bug is elsewhere — maybe the login code is reading the wrong field. Form a new hypothesis.</td></tr>
</table>

<p>Notice what didn't happen: nobody said "let me just try restarting the server." Nobody re-read the login code hoping to spot something. Every step had a specific question and a specific way to answer it.</p>

<h3>The "what did you try?" trap</h3>
<p>Junior engineers describe debugging as "I tried this, then I tried that, then I tried something else." Each "try" is an unstructured experiment. Senior engineers describe debugging as "my hypothesis was X; the result was Y; so I refined to hypothesis Z." Each step builds on the last. The first style can run for days. The second usually finishes in an hour.</p>

<h3>Bisection IS the scientific method applied at scale</h3>
<p>This is the key insight that ties this page back to the rest of the curriculum:</p>
<ul>
  <li><strong>Hypothesis:</strong> "The bug is somewhere in the first half of these commits."</li>
  <li><strong>Prediction:</strong> "If I check out the middle commit and run the predicate, it will fail."</li>
  <li><strong>Test:</strong> Check out the middle commit. Run the predicate.</li>
  <li><strong>Conclude:</strong> If it fails, the bug is in the first half. If it passes, the second half.</li>
</ul>
<p>That's one round of bisection. Every round is one scientific experiment. Running ten rounds is running ten experiments in twenty minutes — far faster than any human can think their way through a bug. <strong>Bisection turns intuition into method.</strong></p>

<h3>The discipline most engineers skip</h3>
<p>The discipline isn't the steps themselves — they're obvious. It's <em>writing them down</em>. Keep a notebook or text file open while debugging. Write the hypothesis. Write the prediction. Write the result. Three lines per round. After ten rounds, you have a record of exactly what you've ruled out and what you've confirmed. This prevents:</p>
<ul>
  <li>Forgetting what you already tested ("did I check that case?")</li>
  <li>Running the same test twice</li>
  <li>Sharing nothing useful with the next engineer who picks up the bug</li>
  <li>Believing your own incorrect memory of "I'm pretty sure I checked that"</li>
</ul>

<div class="callout good">
<div class="callout-title">The L7 angle</div>
<p>Distinguished engineers don't debug faster because they're smarter. They debug faster because their hypotheses are sharper and their tests rule out more possibilities per experiment. This is a learnable skill. The fastest way to develop it: when you've finished debugging a bug, look back at your notebook. Which hypothesis was right? At which step did you finally know? Could you have skipped earlier guesses? Over months, this retrospective sharpens your instincts. Bisection is one specific way to apply the method — the most powerful one when the search space is large.</p>
</div>
</template>

<template data-page-title="Reading Error Messages and Stack Traces" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">Reading Error Messages and Stack Traces</h2>
<p class="lede">When code breaks, it usually prints something. Beginners glance at the error, get scared, and copy-paste it into Google. Senior engineers read it carefully — and the error tells them almost exactly what's wrong, line and all. This page teaches how to read error messages and stack traces the way an engineer does.</p>

<h3>An error message is a written report from the computer</h3>
<p>When a program crashes, it tries to tell you:</p>
<ol>
  <li>What kind of problem it ran into ("file not found", "division by zero", "permission denied").</li>
  <li>Where exactly it was when the problem happened (which file, which line).</li>
  <li>How it got there (which function called which function called which function).</li>
</ol>
<p>That third part — the "how it got here" — is called a <strong>stack trace</strong>. It's the most useful part. Reading it backward usually points straight at the bug.</p>

<h3>An example, line by line</h3>

<pre class="code" data-lang="text" data-title="example-stack-trace.txt">TypeError: Cannot read properties of undefined (reading 'email')
    at sendWelcomeEmail (/app/src/email.js:42:18)
    at registerUser (/app/src/users.js:127:5)
    at handleSignup (/app/src/routes/signup.js:34:11)
    at Layer.handle [as handle_request] (/app/node_modules/express/lib/router/layer.js:95:5)
</pre>

<p>Let's decode it:</p>

<table class="cmp">
<tr><th>Line</th><th>What it says</th><th>What it means in plain English</th></tr>
<tr><td>1</td><td><code>TypeError: Cannot read properties of undefined (reading 'email')</code></td><td>"I tried to look up the 'email' field on something, but that something didn't exist."</td></tr>
<tr><td>2</td><td><code>at sendWelcomeEmail (/app/src/email.js:42:18)</code></td><td>"I was in the function called <code>sendWelcomeEmail</code>, in the file <code>email.js</code>, on line 42, character 18, when it broke."</td></tr>
<tr><td>3</td><td><code>at registerUser (/app/src/users.js:127:5)</code></td><td>"<code>sendWelcomeEmail</code> was called from <code>registerUser</code> in users.js line 127."</td></tr>
<tr><td>4</td><td><code>at handleSignup (/app/src/routes/signup.js:34:11)</code></td><td>"…which was called from <code>handleSignup</code> in signup.js line 34."</td></tr>
<tr><td>5</td><td>"at Layer.handle…"</td><td>"…and that was inside Express, the web framework. This part isn't your code — you can ignore it."</td></tr>
</table>

<p>The stack trace reads "newest at the top, oldest at the bottom." So you read top-down to learn <em>what broke last</em>, and bottom-up to understand <em>how the program got there</em>.</p>

<h3>Where to focus first</h3>
<p>Almost always: <strong>the top line that points to YOUR code, not framework code</strong>. In the example above, that's line 2: <code>sendWelcomeEmail at email.js:42</code>. Go open that file, look at line 42. Whatever it tries to access an <code>email</code> field on, that thing was probably <code>undefined</code>.</p>

<h3>The three error patterns you'll see most</h3>

<h4>1. "Cannot read properties of undefined" (JavaScript) / "AttributeError: 'NoneType' object has no attribute" (Python)</h4>
<p>You tried to use something that doesn't exist. Almost always: a variable that should have been set wasn't. Go look at where it gets set — there's a conditional that didn't fire, or a fetch that returned nothing.</p>

<h4>2. "Permission denied"</h4>
<p>The operating system refused to let your program do something — open a file, run a command, talk to a network port. Usually a config issue, not a code bug. But if it appears only after a deploy, something in the deploy changed file permissions.</p>

<h4>3. "Timeout" / "Connection refused" / "ECONNREFUSED"</h4>
<p>Your program tried to talk to another program (a database, an API, another service) and the conversation didn't happen. The other program is down, slow, or moved.</p>

<h3>What error messages do NOT tell you</h3>
<p>They tell you <em>where</em> things broke, not <em>why</em>. The file and line are the symptom; the cause is usually somewhere else. <code>email.js:42</code> says the email field wasn't there — but the actual bug is wherever the user object was supposed to get its email field, which might be a different file entirely.</p>
<p>This is where bisection helps. If the file at line 42 has been the same for months, the bug isn't in line 42 — it's in something <em>else</em> that changed recently. Bisecting the recent commits finds what changed.</p>

<h3>Reading logs (which are like piles of error messages)</h3>
<p>A log is a chronological list of things a program reported as it ran. Every line has a timestamp, a severity level (INFO, WARN, ERROR), and a message. To find a bug in a log:</p>
<ul>
  <li>Search for <code>ERROR</code> first. Most of the time the cause is the first ERROR before everything broke.</li>
  <li>Look at what happened just before. Often a <code>WARN</code> or an <code>INFO</code> line tells you why the error came next.</li>
  <li>Note the timestamp. Correlate with when the user reported the problem.</li>
</ul>

<div class="callout good">
<div class="callout-title">The L7 angle</div>
<p>Error messages and stack traces are <em>conversations</em>. The computer is telling you, in a slightly stiff voice, exactly what it tried to do and where it failed. Engineers who read them well save hours per week. The discipline is: <strong>never close a stack trace until you've understood it.</strong> If you can't, ask out loud: "what's this line of code trying to access? What did it expect to be there?" Write the answer down. By the time you've written one sentence, you'll often realize the answer.</p>
</div>
</template>

<template data-page-title="Writing a Minimal Reproduction" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">Writing a Minimal Reproduction (Repro)</h2>
<p class="lede">A "minimal reproduction" — repro for short — is the smallest, simplest, most consistent way to make a bug happen. Most debugging time is spent trying to reproduce bugs, not fix them. Engineers who can produce a clean repro fix bugs ten times faster than those who can't. This page teaches what a repro is and how to write one.</p>

<h3>The repro pyramid</h3>
<p>Bug reports come in five levels of repro quality. Each level up makes the bug roughly twice as fast to fix:</p>

<table class="cmp">
<tr><th>Level</th><th>What it looks like</th><th>What it costs the engineer</th></tr>
<tr><td>Level 0</td><td>"Something's broken."</td><td>Hours of guessing what to investigate.</td></tr>
<tr><td>Level 1</td><td>"The login page doesn't work for some users."</td><td>Still guessing — which users? When?</td></tr>
<tr><td>Level 2</td><td>"User alice@x.com can't log in since yesterday."</td><td>Now there's something to look at, but no recipe to reproduce.</td></tr>
<tr><td>Level 3</td><td>"Steps: open /login, type alice@x.com + correct password, click Login. Expected: dashboard. Actual: 'Email not verified' page."</td><td>The engineer can try it themselves.</td></tr>
<tr><td>Level 4 (minimal)</td><td>A self-contained test case (a script, a snippet, a project) that triggers the bug on a fresh machine in seconds.</td><td>Bug becomes a 30-minute fix.</td></tr>
</table>

<p>Level 4 is the goal. It's called "minimal" because everything that isn't necessary to trigger the bug has been removed.</p>

<h3>How to shrink a bug to its minimum</h3>
<p>You're given a 50,000-line web app that crashes when a specific user tries to check out. The crash involves their cart, their payment method, and an analytics call. Where do you start to shrink the repro?</p>

<ol>
  <li><strong>Confirm the bug reproduces at all.</strong> Run the full setup. Crash? Good. Doesn't crash? Stop — the bug isn't here. (You'd be amazed how often this is the actual answer.)</li>
  <li><strong>Remove things one at a time.</strong> Take out the analytics call. Crash still happens? Remove it permanently. Take out the discount code. Still crashes? Remove. Take out the second item in the cart. Still crashes? Remove.</li>
  <li><strong>Keep going until removing anything makes the crash disappear.</strong> That's your minimum.</li>
</ol>

<p>At the end, you might have a repro like: "user with one specific item in cart + the 'apply gift card' field, on the checkout page." Twelve lines of input, instead of a whole signed-up session.</p>

<h3>Why this is bisection in disguise</h3>
<p>Sound familiar? <strong>Shrinking a repro IS bisection.</strong> Each round you cut things in half — if it still crashes, the cause is in the half you kept. If it stops crashing, the cause is in the half you removed. The technique is so universal it has a formal name: <em>delta debugging</em>, covered in Part IX.</p>

<h3>The four tests of a good repro</h3>
<ol>
  <li><strong>Reproducible.</strong> Anyone running the same steps gets the same result, every time. If it only fails sometimes, write down how often (1 in 10? 1 in 1000?). That number is itself a clue.</li>
  <li><strong>Minimal.</strong> Nothing extraneous. If you can take something out and the bug still happens, take it out.</li>
  <li><strong>Self-contained.</strong> A fresh engineer should be able to set it up in under five minutes. Include exact commands, exact data, exact versions.</li>
  <li><strong>Specific.</strong> Says exactly what you expected vs. what you got. "Doesn't work" is useless. "Returns 500 instead of 200, body says 'CSRF token missing'" is gold.</li>
</ol>

<h3>The "but it works on my machine" trap</h3>
<p>The single most expensive sentence in software engineering. When you can't reproduce a bug locally but it happens in production, the bug isn't impossible — your machine just isn't reproducing the conditions. The conditions usually are:</p>
<ul>
  <li>A specific data shape only present in production.</li>
  <li>A specific timing or concurrency pattern.</li>
  <li>A specific dependency version mismatch.</li>
  <li>A specific OS or environment setting.</li>
</ul>
<p>The repro work then becomes: <strong>find which of those conditions is the actual trigger.</strong> Often the answer surprises you — and finding it is the bug fix itself.</p>

<div class="callout good">
<div class="callout-title">The L7 angle</div>
<p>The discipline of writing minimal repros pays compounding interest. Every repro is a permanent artifact: it becomes a test in your test suite (preventing the regression forever), a paragraph in the postmortem (teaching the team), and sometimes a paper in a conference (if the bug was deep enough). Engineers who consistently produce good repros end up with the best bug-fix track records — not because they're better debuggers, but because they've reduced every bug to its irreducible core before debugging starts.</p>
</div>
</template>

<template data-page-title="The Debugging Tool Hierarchy" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">The Debugging Tool Hierarchy</h2>
<p class="lede">There are five families of debugging tools. Each one is the right answer for a specific kind of question. Beginners reach for the same one for every problem; senior engineers know which to grab when. This page introduces all five so you can recognize them in the rest of the curriculum and beyond.</p>

<h3>The five families</h3>

<table class="cmp">
<tr><th>Family</th><th>Answers the question</th><th>Cost to use</th></tr>
<tr><td>1. Print statements / logging</td><td>"What value did this variable have when we got here?"</td><td>Free, slow to set up new ones</td></tr>
<tr><td>2. Interactive debuggers (gdb, Chrome DevTools, etc.)</td><td>"What's the program's state RIGHT NOW? Can I step through it line by line?"</td><td>Steep learning curve, then very fast</td></tr>
<tr><td>3. Profilers</td><td>"Where is this program spending its time / memory?"</td><td>Cheap to run, harder to interpret</td></tr>
<tr><td>4. Tracers (strace, eBPF, OpenTelemetry)</td><td>"What is the program doing at the OS / network / inter-service level?"</td><td>Free, moderately readable</td></tr>
<tr><td>5. Bisection</td><td>"WHICH CHANGE caused this?"</td><td>Setup time, then automatic — the topic of this whole curriculum</td></tr>
</table>

<h3>1. Print debugging (the universal first tool)</h3>
<p>Adding a line that prints out a variable. "What value is this thing right now?" — answered. It's the oldest debugging technique and still the most popular among all engineers.</p>

<p><strong>When it's right:</strong> Quick investigation. You have one specific question. The bug is somewhere narrow.</p>
<p><strong>When it's wrong:</strong> The bug is in production, where you can't add prints. Or the bug is rare and you'd have to add prints in 100 places to catch it.</p>

<pre class="code" data-lang="javascript" data-title="print-debug-example.mjs">function processOrder(order) {
  console.log("DEBUG: order is", JSON.stringify(order));   // ← added for debugging
  const total = order.items.reduce((sum, item) =&gt; sum + item.price, 0);
  console.log("DEBUG: total computed as", total);          // ← added for debugging
  return chargeCard(order.userId, total);
}
</pre>

<h3>2. Interactive debuggers</h3>
<p>A program-within-a-program that pauses your code at any line and lets you inspect every variable, step forward one line at a time, and watch values change. Chrome DevTools is the one you've probably already seen (Right-click → Inspect → Sources tab in a browser). Node has <code>node --inspect</code>. C/C++ has <code>gdb</code>. Python has <code>pdb</code>.</p>

<p><strong>When it's right:</strong> The bug is reproducible locally and you want to crawl through the code's behavior step by step. Complex logic where prints would be too many.</p>
<p><strong>When it's wrong:</strong> The bug only appears at high concurrency, only in production, or the steps to set it up are too elaborate to attach a debugger.</p>

<h3>3. Profilers</h3>
<p>Tools that watch your program run and report "this function ran 1.4 million times" or "this code path used 800MB of memory." For performance bugs, profilers are the right answer almost always.</p>

<p><strong>When it's right:</strong> The bug is "it's slow" or "it uses too much memory." You need to know where time/memory is going.</p>
<p><strong>When it's wrong:</strong> Correctness bugs. A profiler tells you where the program spends time, not whether it's spending it correctly.</p>

<p>Examples: Chrome DevTools' Performance tab, Node's <code>--prof</code> + <code>clinic</code>, Java's <code>jfr</code> (Flight Recorder), Linux's <code>perf</code>.</p>

<h3>4. Tracers</h3>
<p>Tools that watch your program's <em>boundary interactions</em> — every system call, every network packet, every file open. <code>strace</code> is the classic Linux tool. OpenTelemetry tracing follows a single user's request across many services in a distributed system.</p>

<p><strong>When it's right:</strong> "Why is my program slow?" when you suspect the OS, the network, or another service. Mysterious silent hangs. Bugs at the boundary between systems.</p>
<p><strong>When it's wrong:</strong> Pure-logic bugs inside your own code.</p>

<p>OpenTelemetry-style distributed tracing is now table stakes for any multi-service application. Part IX's "Distributed Trace Bisection" page builds on this.</p>

<h3>5. Bisection (this curriculum)</h3>
<p>When the question is "<em>which change</em> caused this?", bisection is the only efficient answer. Every other tool tells you about the current state of the program; bisection tells you about the <em>history</em> of the program.</p>

<p><strong>When it's right:</strong> The code used to work; now it doesn't. The version that worked is somewhere in history; the version that didn't is more recent. The space is large.</p>
<p><strong>When it's wrong:</strong> The bug has always existed. The history is too short to be worth bisecting (e.g., 5 commits). The predicate is too expensive to run dozens of times.</p>

<h3>The decision tree</h3>

<pre class="code" data-lang="text" data-title="which-tool.txt">Symptom: "the value is wrong"
  → Did this used to work?
       yes →  BISECT to find the change that broke it
       no  →  PRINT DEBUG or use a DEBUGGER to inspect current state

Symptom: "it's slow"
  → Did this used to be fast?
       yes →  BISECT against a perf-budget predicate (Part V)
       no  →  PROFILE to find the hotspot

Symptom: "it crashes sometimes"
  → Can you reproduce it locally?
       yes →  DEBUGGER + add breakpoints
       no  →  TRACER (strace, OTel) to capture the failing run

Symptom: "memory keeps growing forever"
  → Did this used to be stable?
       yes →  BISECT against a memory-budget predicate
       no  →  PROFILE the heap (clinic, heaptrack, etc.)

Symptom: "it makes the wrong HTTP call to another service"
  → TRACE the network boundary (OTel, tcpdump, mitmproxy)
</pre>

<h3>The L7 insight: they compose</h3>
<p>A senior engineer rarely uses just one. A typical flow:</p>
<ol>
  <li>"Memory's growing" → <strong>profile</strong> to find which object accumulates (Part V's heap-snapshot diffing).</li>
  <li>"What allocated those objects?" → <strong>print debug</strong> the allocation site to confirm hypothesis.</li>
  <li>"Did this code used to behave differently?" → <strong>bisect</strong> to find the commit that started accumulating.</li>
  <li>"Why does that commit cause this?" → <strong>debugger</strong> + breakpoints on the suspect line.</li>
</ol>
<p>Four tools, one bug. Each used for what it does best. <strong>This is what fluency looks like.</strong></p>

<div class="callout good">
<div class="callout-title">The principal-engineer angle</div>
<p>If you only ever learn one tool, learn bisection — it answers questions other tools can't. But the goal of senior engineering isn't to make every problem a nail for your hammer. It's to develop opinionated taste about which tool is right for each shape of bug. After a year of deliberate practice, you'll find yourself reaching for the right tool unconsciously. After ten years, you'll be the engineer everyone asks: "what tool would you use here?"</p>
</div>
</template>

<template data-page-title="Rubber Duck and Pair Debugging" data-part="0 — Before You Start">
<span class="badge">Part 0 · Before You Start</span>
<h2 class="page-title">Rubber Duck Debugging and Pair Debugging</h2>
<p class="lede">Two of the most powerful debugging techniques don't use any tools. The first is talking out loud to an inanimate object. The second is talking it through with another human. Both work for the same reason — and understanding why is itself a senior-engineer skill.</p>

<h3>The rubber duck</h3>
<p>The technique: when you're stuck on a bug, put a rubber duck on your desk (or anything else — a printout, a coffee cup, a houseplant) and explain the problem to it out loud, line by line.</p>

<p>"OK, duck. So I have this function. It takes a user object. It looks up the user's email — wait. Why am I assuming the user object has an email field at this point? Oh. That's the bug."</p>

<p>You just solved it. The duck did nothing.</p>

<h3>Why it works</h3>
<p>When you read code silently to yourself, your brain skips familiar patterns — including the buggy one. When you have to explain it word by word, you're forced to actually look at each part. Your brain notices what your eyes have been gliding over.</p>

<p>It also forces you to articulate assumptions. "This function gets a user" — true? "...with an email field" — true? Every time you say "and then it does X" out loud, your brain checks "wait, does it really?"</p>

<h3>When the duck won't work</h3>
<p>If you don't actually explain, just stare at the code while holding the duck, it won't help. You have to talk. Out loud is best; whispering counts; muttering under your breath in a coffee shop counts. The act of producing words is what does the work.</p>

<h3>Pair debugging</h3>
<p>Same idea, but with a person. Two engineers, one bug, one screen. Take turns "driving" (typing) and "navigating" (watching, thinking, asking).</p>

<h4>Why two engineers are more than twice as good as one</h4>
<ul>
  <li><strong>One engineer has tunnel vision.</strong> The other notices things you've stopped seeing.</li>
  <li><strong>One engineer skips explanations.</strong> The other forces you to articulate — and your articulation reveals the bug, rubber-duck style.</li>
  <li><strong>One engineer makes assumptions.</strong> The other asks "wait, why?" at exactly the right time.</li>
  <li><strong>One engineer gets tired and frustrated.</strong> The other resets the rhythm.</li>
</ul>

<h3>How to pair debug well</h3>
<table class="cmp">
<tr><th>Do</th><th>Don't</th></tr>
<tr><td>Share one screen, one keyboard, one document of notes.</td><td>Have one person type and the other check their phone.</td></tr>
<tr><td>Explain what you're doing as you do it. "I'm checking the value of <code>orders</code> now."</td><td>Silently type. The other person learns nothing.</td></tr>
<tr><td>Ask "what's the next thing to test?" before testing it.</td><td>Just dive in and hope.</td></tr>
<tr><td>Take breaks every 45–60 minutes.</td><td>Power through. Frustration breeds bad bisections.</td></tr>
<tr><td>Switch driver/navigator every 20 minutes.</td><td>Let one person dominate. The other disengages.</td></tr>
</table>

<h3>When pair debugging is the right answer</h3>
<ul>
  <li>The bug is mysterious and you've been stuck for over an hour.</li>
  <li>The system is unfamiliar to you (the other engineer knows it).</li>
  <li>The fix has high blast radius and you want a second opinion.</li>
  <li>You're mentoring a junior engineer and the bug is good practice.</li>
  <li>You'll need to write a postmortem and want two memories of the investigation.</li>
</ul>

<h3>The senior-engineer move: <em>ask for the pair</em></h3>
<p>Junior engineers are afraid that asking for help signals weakness. Senior engineers know the opposite: asking after 30 minutes of being stuck signals discipline. The waste isn't in asking — it's in spending three more hours stuck before someone finds out. <strong>"I've been stuck on this for 30 minutes; can you pair with me for 20?"</strong> is one of the most professional sentences in software.</p>

<div class="callout good">
<div class="callout-title">The L7 angle</div>
<p>Distinguished engineers don't only pair-debug as a tactic; they cultivate a team culture where pairing is normal. They name the practice ("let's pair on this"), book time for it on calendars, and treat it as the most efficient use of two senior heads, not an admission of difficulty. The team that pair-debugs naturally is the team whose bugs get found fastest — because the practice is also <em>training</em>. Every pair session transfers knowledge between engineers. After a year, every senior engineer has a working mental model of every part of the system.</p>
</div>
</template>

<template data-page-title="What Is Bisection Debugging?" data-part="I — Foundations">
<span class="badge">Part I · Foundations</span>
<h2 class="page-title">What Is Bisection Debugging?</h2>
<p class="lede">Bisection debugging is the engineer's version of the "guess a number between 1 and 100" game. Instead of testing every suspect one by one, you cut the suspect list in half each round. With 1,024 suspects, you find the culprit in <strong>10 tests</strong> instead of up to 1,024. That's the entire idea — but the implications run deep.</p>

<h3>The childhood game, reframed</h3>
<p>Imagine your friend picks a number from 1 to 100. If you guess <em>linearly</em> — "1? 2? 3?" — you'll average 50 guesses. If you guess in the middle — "50? higher. 75? lower. 62? lower." — you'll always finish in about 7. That's <strong>O(log₂ n)</strong> versus <strong>O(n)</strong>. The math is so favorable that experienced engineers reach for bisection before almost any other technique when a bug is hiding inside a large set.</p>

<h3>Why this matters in real software</h3>
<p>Every test you run costs something:</p>
<ul>
  <li><strong>Time.</strong> A CI run can take 20 minutes. 1,000 linear runs is a month of wall-clock. 10 bisection runs is 3 hours.</li>
  <li><strong>Money.</strong> CI minutes, cloud compute, and engineer salary all cost real dollars.</li>
  <li><strong>Cognitive load.</strong> Every minute spent waiting is a minute you cannot focus on the actual bug.</li>
</ul>
<p>So we trade a tiny amount of <em>setup work</em> (a predicate script, a way to split the input) for a <em>massive</em> reduction in tests. That trade almost always pays off.</p>

<h3>The three things you need</h3>
<div class="callout">
<div class="callout-title">The Bisection Triangle</div>
<ol>
  <li><strong>An ordered (or splittable) set</strong> — commits in history, files in a directory, items in a list, parameter values in a range.</li>
  <li><strong>A predicate</strong> — a yes/no test you can run against any element or subset. "Does the build fail?" "Does the leak appear?" "Does the test time out?"</li>
  <li><strong>The monotonic invariant</strong> — the predicate must flip from "good" to "bad" exactly once across the set. We'll spend the next page on this; it's where most bisection attempts go wrong.</li>
</ol>
</div>

<h3>Where you'll see bisection in this course</h3>
<p>We'll bisect across nine very different domains. The mental model is the same every time:</p>
<table class="cmp">
<tr><th>Domain</th><th>The "set"</th><th>The predicate</th></tr>
<tr><td>Git history</td><td>Commits between v1.4 and HEAD</td><td>Does <code>pnpm test</code> pass?</td></tr>
<tr><td>Source files</td><td>All <code>*.svelte</code> in <code>src/lib</code></td><td>Does <code>svelte-check</code> succeed?</td></tr>
<tr><td>Components in memory</td><td>Mounted children of a page</td><td>Does retained heap grow?</td></tr>
<tr><td>Dependencies</td><td>Entries in <code>package.json</code></td><td>Does the app boot?</td></tr>
<tr><td>Tests</td><td>Files in your <code>vitest</code> suite</td><td>Does the suspect test still flake?</td></tr>
<tr><td>Configuration</td><td>Keys in <code>tsconfig.json</code></td><td>Does the build succeed?</td></tr>
<tr><td>Feature flags</td><td>The flag set in your control plane</td><td>Does the bug reproduce?</td></tr>
<tr><td>Data rows</td><td>A CSV that crashes ingestion</td><td>Does the row import cleanly?</td></tr>
<tr><td>Service versions</td><td>Image tags across a fleet</td><td>Does end-to-end work?</td></tr>
</table>

<h3>A first taste — by hand, on the napkin</h3>
<p>Here is the smallest possible bisection script. It takes a list of files, runs a predicate, and narrows down to one culprit. We will rewrite this six different ways before the course is over.</p>

<pre class="code" data-lang="shell" data-title="napkin-bisect.sh">#!/usr/bin/env bash
# napkin-bisect.sh — the absolute simplest bisection.
# Usage:  ./napkin-bisect.sh "svelte-check --filter {}" src/lib/**/*.svelte
#
# {} is replaced with the file being tested.

predicate="$1"; shift
files=("$@")

lo=0; hi=$((${#files[@]} - 1))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  half=("${files[@]:lo:mid-lo+1}")
  echo "Testing files [$lo..$mid] (${#half[@]} files)"
  cmd="${predicate//\{\}/${half[*]}}"
  if eval "$cmd" &gt;/dev/null 2&gt;&amp;1; then
    lo=$((mid + 1))   # this half is good → bad must be in upper half
  else
    hi=$mid           # this half is bad → keep narrowing
  fi
done
echo "Culprit: ${files[$lo]}"
</pre>

<p>Don't worry if every line isn't clear yet — by Part VI you'll be able to write this from memory and explain every choice. For now, just notice: <em>each iteration halves the search space.</em></p>
<p style="color: var(--fg-dim); font-size: 13px; margin-top: 18px;">⊕ <em>Why is log₂(N) optimal, not just clever?</em> See <strong>Part IX — The Information Theory of Bisection</strong> for the Shannon-style lower bound that proves no algorithm can beat it.</p>
</template>

<template data-page-title="The Bisection Invariant" data-part="I — Foundations">
<span class="badge">Part I · Foundations</span>
<h2 class="page-title">The Bisection Invariant — and Why Bisection Lies</h2>
<p class="lede">Bisection works because of a single mathematical property: <strong>monotonicity</strong>. Without it, the whole technique gives you a confidently wrong answer. Senior engineers who get burned by bisection got burned here. Read this page twice.</p>

<h3>What monotonicity means in plain English</h3>
<p>"Monotonic" sounds intimidating; it isn't. It means: <em>as you walk through the set, the predicate flips from "good" to "bad" exactly once, and never flips back.</em> Like a light switch: off, off, off, off, <strong>ON</strong>, on, on, on. Never off-on-off-on.</p>
<p>For git bisect, that means: every commit before the bad one is good; every commit at-or-after the bad one is bad. For file bisection: every subset that excludes the bad file is good; every subset that includes it is bad.</p>

<h3>Three ways the invariant breaks (and how to repair it)</h3>

<h4>1. Flakiness — the predicate is noisy</h4>
<p>The test fails 30% of the time even on a good commit. Bisection sees the noise as a real signal and points at an innocent commit. <strong>Fix:</strong> wrap your predicate in a "best of N" loop.</p>

<pre class="code" data-lang="shell" data-title="flake-resistant-predicate.sh">#!/usr/bin/env bash
# flake-resistant-predicate.sh
# Runs the test up to 5 times. Calls it "good" only if it passes ≥4 times.
# Exit codes follow `git bisect run` convention:
#   0   = good
#   1   = bad
#   125 = skip (cannot determine — e.g. build itself broken)
set -uo pipefail

RUNS=5
THRESHOLD=4
passes=0

# Refuse to judge if the build is broken — that's a "skip", not a "bad".
if ! pnpm install --frozen-lockfile &gt;/dev/null 2&gt;&amp;1; then exit 125; fi
if ! pnpm build &gt;/dev/null 2&gt;&amp;1; then exit 125; fi

for i in $(seq 1 "$RUNS"); do
  if pnpm test --run --bail 1 &gt;/dev/null 2&gt;&amp;1; then
    passes=$((passes + 1))
  fi
done

if (( passes &gt;= THRESHOLD )); then exit 0; else exit 1; fi
</pre>

<h4>2. Non-determinism — the environment drifts</h4>
<p>The bug only appears with a specific Node version, OS, or system clock. Halfway through bisection, <code>nvm</code> picks up a different Node and your predicate changes meaning. <strong>Fix:</strong> pin everything explicitly inside the predicate.</p>

<pre class="code" data-lang="shell" data-title="hermetic-predicate.sh">#!/usr/bin/env bash
# hermetic-predicate.sh — pin every variable that could shift under us.
set -euo pipefail

# Pin Node, pnpm, locale, timezone, random seed.
export NODE_VERSION="20.18.0"
export PNPM_VERSION="9.12.0"
export LC_ALL=C.UTF-8
export TZ=UTC
export NODE_OPTIONS="--no-warnings"
export VITEST_SEED=42

# Use a deterministic ordering for tests.
export VITEST_SEQUENCE_SHUFFLE=false

# Honor .nvmrc only if it matches the pin; otherwise fail loudly.
if command -v nvm &gt;/dev/null 2&gt;&amp;1; then
  nvm use "$NODE_VERSION" &gt;/dev/null 2&gt;&amp;1 || { echo "Wrong Node"; exit 125; }
fi

# Clean every byproduct cache — caches lie under bisection.
rm -rf node_modules/.vite node_modules/.cache .svelte-kit dist

pnpm install --frozen-lockfile --prefer-offline &gt;/dev/null 2&gt;&amp;1 || exit 125
pnpm test --run
</pre>

<h4>3. Multiple causes — the bug isn't a single switch</h4>
<p>Two unrelated commits together cause the failure; neither alone reproduces it. Bisection will land on <em>one</em> of them and tell you it's the culprit. It's not lying — it's telling you the smallest commit that, given everything else after it, produces the failure. <strong>Fix:</strong> when you find the "bad" commit, confirm by cherry-picking it onto a known good base and checking the bug still reproduces. If it doesn't, you have a multi-cause bug — split it.</p>

<h3>The cardinal rule</h3>
<blockquote><strong>Before you bisect anything, prove the predicate is stable.</strong> Run it 3 times on a known-good state. Run it 3 times on a known-bad state. If both runs agree with themselves, you're safe to bisect. If they don't, fix the predicate first, then bisect. Skipping this step is the #1 way principal engineers waste a Friday.</blockquote>
</template>

<template data-page-title="Manual Bisection — The Napkin Method" data-part="I — Foundations">
<span class="badge">Part I · Foundations</span>
<h2 class="page-title">Manual Bisection — The Napkin Method</h2>
<p class="lede">Before automating, you should be able to bisect with a piece of paper and a clear head. This page shows the technique by hand so the automation later feels obvious instead of magical.</p>

<h3>A worked example: 1,024 files, 10 tests</h3>
<p>You broke <code>svelte-check</code>. You don't know which file. You have 1,024 <code>.svelte</code> files. You could check them one at a time (linear), or:</p>
<ol>
  <li><strong>Round 1.</strong> Move files 1–512 out of the project. Run <code>svelte-check</code>. Pass? The bad file is in 1–512. Fail? It's in 513–1,024. Move them back.</li>
  <li><strong>Round 2.</strong> Take the suspect half and split it again — 256 files moved out. Test.</li>
  <li><strong>Round 3.</strong> 128 files.</li>
  <li>… <strong>Round 10.</strong> 1 file. That's your culprit.</li>
</ol>
<p>Ten tests instead of up to 1,024. Each round costs you one <code>svelte-check</code> run and a few seconds of file shuffling.</p>

<h3>The mental model: <code>lo</code>, <code>hi</code>, <code>mid</code></h3>
<p>Every bisection has three pointers. Memorize them:</p>
<ul>
  <li><code>lo</code> — the index of the first <em>possibly-bad</em> element.</li>
  <li><code>hi</code> — the index of the last <em>possibly-bad</em> element.</li>
  <li><code>mid</code> — <code>(lo + hi) / 2</code>, the element you'll test this round.</li>
</ul>
<p>After each test, you either move <code>lo</code> up to <code>mid + 1</code> ("the bad one is above mid") or move <code>hi</code> down to <code>mid</code> ("the bad one is at or below mid"). You stop when <code>lo == hi</code>. That index is your answer.</p>

<h3>A reusable manual log sheet</h3>
<p>When bisecting by hand — especially during a stressful incident — write the table. It prevents the most common mistake: forgetting whether a tested subset was good or bad.</p>

<pre class="code" data-lang="markdown" data-title="bisection-log.md"># Bisection log: SvelteCheck failing after main merge
Date: 2026-06-03  Engineer: you  Predicate: `pnpm exec svelte-check`

Initial suspect range: src/lib/**/*.svelte → 1024 files (sorted alphabetically)

| Round | lo   | hi   | mid  | tested subset    | result | new lo | new hi |
|------:|-----:|-----:|-----:|------------------|:------:|-------:|-------:|
| 1     |    0 | 1023 |  511 | files[0..511]    | BAD    |      0 |    511 |
| 2     |    0 |  511 |  255 | files[0..255]    | GOOD   |    256 |    511 |
| 3     |  256 |  511 |  383 | files[256..383]  | BAD    |    256 |    383 |
| 4     |  256 |  383 |  319 | files[256..319]  | GOOD   |    320 |    383 |
| 5     |  320 |  383 |  351 | files[320..351]  | BAD    |    320 |    351 |
| 6     |  320 |  351 |  335 | files[320..335]  | BAD    |    320 |    335 |
| 7     |  320 |  335 |  327 | files[320..327]  | GOOD   |    328 |    335 |
| 8     |  328 |  335 |  331 | files[328..331]  | BAD    |    328 |    331 |
| 9     |  328 |  331 |  329 | files[328..329]  | GOOD   |    330 |    331 |
| 10    |  330 |  331 |  330 | files[330..330]  | BAD    |    330 |    330 |

→ Culprit: files[330] = src/lib/components/data/HeavyChart.svelte
</pre>

<h3>The "split the suspect set" script</h3>
<p>To actually move files in/out by hand, this helper does it deterministically — and is reversible. Move-then-test-then-move-back avoids the most common foot-gun: leaving the repo in a half-modified state and forgetting which.</p>

<pre class="code" data-lang="shell" data-title="halve-and-test.sh">#!/usr/bin/env bash
# halve-and-test.sh — interactively halve a suspect file list.
# Moves files into .bisect-stash/, runs your predicate, restores on exit.
# Usage:  ./halve-and-test.sh 'pnpm exec svelte-check' src/lib/**/*.svelte
set -euo pipefail

PREDICATE="$1"; shift
ALL=("$@")
STASH=".bisect-stash"
mkdir -p "$STASH"

restore() {
  echo "Restoring stashed files…"
  if [ -d "$STASH" ]; then
    find "$STASH" -type f | while read -r f; do
      mv "$f" "${f#$STASH/}"
    done
    rm -rf "$STASH"
  fi
}
trap restore EXIT INT TERM

lo=0; hi=$(( ${#ALL[@]} - 1 ))
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  echo
  echo "── Round: lo=$lo hi=$hi mid=$mid (testing lower half [lo..mid]) ──"

  # Stash the UPPER half so only [lo..mid] remain under test.
  for (( i = mid + 1; i &lt;= hi; i++ )); do
    f="${ALL[$i]}"
    mkdir -p "$STASH/$(dirname "$f")"
    mv "$f" "$STASH/$f"
  done

  if eval "$PREDICATE" &gt;/dev/null 2&gt;&amp;1; then
    echo "  → lower half GOOD; bad file is in upper half"
    # Restore upper, stash lower for next iteration.
    find "$STASH" -type f | while read -r f; do mv "$f" "${f#$STASH/}"; done
    lo=$((mid + 1))
  else
    echo "  → lower half BAD; narrowing"
    find "$STASH" -type f | while read -r f; do mv "$f" "${f#$STASH/}"; done
    hi=$mid
  fi
done

echo
echo "═══════════════════════════════════════════"
echo "Culprit: ${ALL[$lo]}"
echo "═══════════════════════════════════════════"
</pre>

<p>Note the <code>trap restore EXIT INT TERM</code> line. <strong>Always</strong> guarantee restoration. Bisection scripts crash. Networks drop. Cats walk on keyboards. Without a restore guarantee, you leave the repository in a broken state — far worse than the original bug.</p>
</template>

<template data-page-title="git bisect Basics" data-part="II — Git Bisect">
<span class="badge">Part II · Git Bisect</span>
<h2 class="page-title">git bisect — The Canonical Tool</h2>
<p class="lede"><code>git bisect</code> is the bisection technique built into git itself. It's been there since 2007 and it remains, in 2026, the single most leveraged debugging command most engineers never use. By the end of this page you'll be running it confidently.</p>

<h3>The five commands you actually need</h3>
<table class="cmp">
<tr><th>Command</th><th>What it does</th></tr>
<tr><td><code>git bisect start</code></td><td>Begins a bisection session. Tells git: "I'm hunting for the commit that introduced something."</td></tr>
<tr><td><code>git bisect bad &lt;ref&gt;</code></td><td>Marks a commit (default: HEAD) as <em>bad</em> — the bug is present here.</td></tr>
<tr><td><code>git bisect good &lt;ref&gt;</code></td><td>Marks a commit as <em>good</em> — the bug was not present.</td></tr>
<tr><td><code>git bisect reset</code></td><td>Ends the session and returns you to your original branch.</td></tr>
<tr><td><code>git bisect run &lt;cmd&gt;</code></td><td>Automates the loop. We cover this in detail on the next page.</td></tr>
</table>

<h3>A real session, narrated</h3>
<p>You shipped v2.4 last week. Today, login is broken. You know v2.3 worked. Somewhere in the 60 commits between them is the bad one. Here's the entire session:</p>

<pre class="code" data-lang="shell" data-title="manual-git-bisect.sh"># 1. Start the session.
git bisect start

# 2. Tell git the current state is bad.
git bisect bad HEAD

# 3. Tell git which earlier commit was known good.
git bisect good v2.3

# Git replies with something like:
#   Bisecting: 30 revisions left to test after this (roughly 5 steps)
#   [a1b2c3d] Refactor session store
# It has checked out the middle commit and is waiting for you.

# 4. Test the checked-out commit. Manually run login. Did it work?
#    If yes:
git bisect good
#    If no:
git bisect bad
#    Git checks out the next midpoint and repeats.

# 5. Repeat steps 3–4 until git tells you:
#   a1b2c3d is the first bad commit
#   commit a1b2c3d
#   Author: someone
#   Date:   Tue May 27 14:02:31 2026 +0000
#       Refactor session store to use signed cookies

# 6. End the session and go back to your branch.
git bisect reset
</pre>

<h3>What git is actually doing under the hood</h3>
<p>This is the kind of detail that separates engineers who <em>use</em> the tool from engineers who <em>own</em> the technique:</p>
<ul>
  <li>Git keeps two refs: <code>refs/bisect/bad</code> and <code>refs/bisect/good-&lt;sha&gt;</code> (one per good commit).</li>
  <li>It computes the set of commits reachable from <code>bad</code> but not from any <code>good</code>. That's your search space.</li>
  <li>It picks the commit with the most-balanced descendant/ancestor split. For a linear history this is the midpoint; for branchy history it's a graph-aware "best bisect" using a polynomial described in <code>git-bisect-lk2009.txt</code>.</li>
  <li>It detaches HEAD to that commit. Your working tree is now at the suspect.</li>
  <li>It writes <code>BISECT_LOG</code> with everything that happened. You can resume with <code>git bisect replay</code>.</li>
</ul>

<h3>Three commands you'll need eventually</h3>
<pre class="code" data-lang="shell" data-title="git-bisect-extras.sh"># Skip the current commit (build broken, can't decide).
git bisect skip

# Save the bisection log for later (e.g. resume after a crash, or for review).
git bisect log &gt; /tmp/bisect.log
git bisect reset                 # end session
# Later:
git bisect start
git bisect replay /tmp/bisect.log

# Visualize the remaining search space.
git bisect visualize             # uses gitk if installed
# or, simpler:
git bisect view --stat
</pre>

<h3>The shortcut form</h3>
<p>The verbose form above is great for learning. In practice you'll use this one-liner:</p>
<pre class="code" data-lang="shell" data-title="git-bisect-oneline.sh"># Start, bad, and good in a single command.
git bisect start HEAD v2.3
# (positional: &lt;bad&gt; &lt;good...&gt;; you can pass multiple goods)
</pre>
</template>

<template data-page-title="Automated git bisect run" data-part="II — Git Bisect">
<span class="badge">Part II · Git Bisect</span>
<h2 class="page-title">Automating with <code class="no-style">git bisect run</code></h2>
<p class="lede">Manual bisection is great for learning. In real life you'll write a script and walk away. <code>git bisect run</code> drives the whole loop for you — it can find a needle in 300 commits while you make coffee.</p>

<h3>The contract: exit codes are the API</h3>
<p><code>git bisect run</code> calls your script at each midpoint. Your script's <em>exit code</em> is the only thing that matters:</p>
<table class="cmp">
<tr><th>Exit</th><th>Meaning</th><th>When to return it</th></tr>
<tr><td><code>0</code></td><td>good</td><td>Bug not present. Tests pass.</td></tr>
<tr><td><code>1–124, 126, 127</code></td><td>bad</td><td>Bug present. Tests fail.</td></tr>
<tr><td><code>125</code></td><td>skip</td><td>Cannot tell — build broken, dependencies won't install, environment problem. Git will pick a neighboring commit.</td></tr>
<tr><td><code>128+</code></td><td>abort</td><td>Fatal error. Git stops the bisection entirely.</td></tr>
</table>

<h3>A production-quality predicate</h3>
<p>Here is the script I actually drop into projects. It handles every corner: hermetic install, build/test separation, retries for flakes, and clean exit codes.</p>

<pre class="code" data-lang="shell" data-title="bisect-predicate.sh">#!/usr/bin/env bash
# bisect-predicate.sh — generic predicate for `git bisect run`.
#
# WHAT TO EDIT:  the THREE variables below + the SUSPECT_TEST.
# WHY EXIT 125: build/install failure isn't the bug; it's an environment problem.
#               Skipping lets bisection continue around the broken commits.
# USAGE:
#   git bisect start HEAD v2.3
#   git bisect run ./bisect-predicate.sh

set -uo pipefail

INSTALL_CMD="pnpm install --frozen-lockfile --prefer-offline"
BUILD_CMD="pnpm build"
SUSPECT_TEST="pnpm vitest run tests/auth/login.test.ts"
FLAKE_RETRIES=3            # run the suspect test N times before declaring bad

# 1) Reset known-dirty caches that survive checkouts.
rm -rf node_modules/.vite .svelte-kit .turbo dist 2&gt;/dev/null || true

# 2) Hermetic install. If the lockfile or registry rejects this commit, SKIP.
if ! $INSTALL_CMD &gt;/tmp/bisect-install.log 2&gt;&amp;1; then
  echo "::skip:: install failed at $(git rev-parse --short HEAD)"
  exit 125
fi

# 3) Build. Broken build isn't necessarily the bug — but it might be.
#    If the bug you're hunting is "the build broke", change exit 125 → exit 1 here.
if ! $BUILD_CMD &gt;/tmp/bisect-build.log 2&gt;&amp;1; then
  echo "::skip:: build failed at $(git rev-parse --short HEAD)"
  exit 125
fi

# 4) Run the suspect test multiple times, declare bad only on a clear majority.
fails=0
for i in $(seq 1 "$FLAKE_RETRIES"); do
  if ! $SUSPECT_TEST &gt;/tmp/bisect-test.$i.log 2&gt;&amp;1; then
    fails=$((fails + 1))
  fi
done

if (( fails &gt; FLAKE_RETRIES / 2 )); then
  echo "::bad:: $(git rev-parse --short HEAD) failed $fails/$FLAKE_RETRIES"
  exit 1
fi

echo "::good:: $(git rev-parse --short HEAD)"
exit 0
</pre>

<h3>Driving it</h3>
<pre class="code" data-lang="shell" data-title="drive-bisect.sh">#!/usr/bin/env bash
# drive-bisect.sh — end-to-end automated bisection between two refs.
set -euo pipefail

BAD="${1:-HEAD}"
GOOD="${2:?usage: drive-bisect.sh &lt;bad-ref&gt; &lt;good-ref&gt;}"
PREDICATE="${3:-./bisect-predicate.sh}"

chmod +x "$PREDICATE"

git bisect start
git bisect bad "$BAD"
git bisect good "$GOOD"
git bisect run "$PREDICATE" | tee /tmp/bisect-output.log

# Whatever happened, leave the repo clean.
git bisect log &gt; /tmp/bisect-history.log
git bisect reset

# Surface the verdict.
grep -E "is the first bad commit" /tmp/bisect-output.log || \
  echo "Bisection inconclusive — check /tmp/bisect-output.log"
</pre>

<h3>Reading the output</h3>
<p>At the end, git prints something like:</p>
<pre class="code" data-lang="shell" data-title="bisect-output.txt">a1b2c3d4e5f6 is the first bad commit
commit a1b2c3d4e5f6
Author: jordan@example.com
Date:   Tue May 27 14:02:31 2026 +0000

    refactor: move session decryption to edge middleware

 src/lib/server/session.ts | 42 +++++++++++++-----------
 src/hooks.server.ts       | 18 ++++++++--
 2 files changed, 41 insertions(+), 19 deletions(-)

bisect found first bad commit
</pre>

<p>That's it — the commit, the author, the files, ready for your code review. From here you either revert it, fix it forward, or have a precise conversation with the author about what they intended.</p>
</template>

<template data-page-title="Skips, Flakes, Merge Commits" data-part="II — Git Bisect">
<span class="badge">Part II · Git Bisect</span>
<h2 class="page-title">Skips, Flakes, and the Treacherous Merge Commit</h2>
<p class="lede">In a clean linear history, <code>git bisect run</code> is paradise. In a real repository — with squashes, reverts, force-pushes, and merge commits from upstream — it can get strange. This page is the survival guide.</p>

<h3>Skipping intelligently</h3>
<p>When your predicate returns 125, git tries the neighboring commits. But what if a whole <em>range</em> is broken (a botched merge that took 5 commits to fix forward)? You can pre-skip them:</p>

<pre class="code" data-lang="shell" data-title="bisect-skip-range.sh"># Skip a known-broken range so bisection avoids it.
git bisect skip $(git rev-list abc123^..def456)

# Or skip the merges from a noisy upstream branch.
git bisect skip $(git rev-list --merges --first-parent HEAD~50..HEAD)
</pre>

<h3>The <code>--first-parent</code> trick</h3>
<p>If your team uses merge commits, the linear history of <code>main</code> hides hundreds of feature-branch commits. Most of the time you want bisection to step through <em>merges into main</em>, not into the internals of each PR.</p>

<pre class="code" data-lang="shell" data-title="bisect-first-parent.sh"># Bisect only along the first-parent chain of main.
# This treats each PR merge as a single unit instead of descending into it.
git bisect start --first-parent
git bisect bad HEAD
git bisect good v2.3
git bisect run ./bisect-predicate.sh
</pre>

<p>Trade-off: you'll identify the offending <em>PR</em>, not the offending commit-within-the-PR. That's usually what you want anyway; PR-level granularity matches how you do code review.</p>

<h3>Handling flakes mid-bisection</h3>
<p>What if you discover a flake only halfway through? Don't restart — you can edit the verdict:</p>

<pre class="code" data-lang="shell" data-title="bisect-fix-mistake.sh"># I told git this commit was good; now I think it was bad. Fix the log.
git bisect log &gt; /tmp/bisect-log

# Edit /tmp/bisect-log in your editor. Change `good abc123` to `bad abc123`,
# or delete the line entirely if you can't tell.

git bisect reset
git bisect replay /tmp/bisect-log
# Bisection resumes with the corrected history.
</pre>

<h3>The "good-after-bad" anomaly</h3>
<p>Sometimes you'll see git report:</p>
<pre class="code" data-lang="shell" data-title="bisect-anomaly.txt">$ git bisect bad
Bisecting: 3 revisions left to test after this
running ./predicate
::good:: f3a2b1c
Bisecting: ...
::bad:: a4d5e6f
::good:: 9c8b7a6     # ← but 9c8b7a6 is AFTER a4d5e6f!
</pre>
