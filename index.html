<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<script>
(function () {
  // ---- collect pages from <template> nodes
  const templates = Array.from(document.querySelectorAll('template[data-page-title]'));
  const PAGES = templates.map((tpl, i) => ({
    idx: i,
    title: tpl.dataset.pageTitle,
    part: tpl.dataset.part || '',
    node: tpl.content.cloneNode(true)
  }));

  const host = document.getElementById('page-host');
  PAGES.forEach((p) => {
    const sec = document.createElement('section');
    sec.className = 'page';
    sec.dataset.page = String(p.idx);
    sec.appendChild(p.node);
    host.appendChild(sec);
  });

  // ---- TOC
  const tocList = document.getElementById('toc-list');
  let lastPart = null;
  PAGES.forEach((p) => {
    if (p.part !== lastPart) {
      const h = document.createElement('div');
      h.className = 'part';
      h.textContent = p.part;
      tocList.appendChild(h);
      lastPart = p.part;
    }
    const a = document.createElement('a');
    a.href = '#page-' + (p.idx + 1);
    a.dataset.idx = String(p.idx);
    a.innerHTML = '<span class="num">' + String(p.idx + 1).padStart(2, '0') + '</span><span>' + p.title + '</span>';
    tocList.appendChild(a);
  });

  document.getElementById('tot-page').textContent = String(PAGES.length);

  // ---- router
  function currentIdx() {
    const m = location.hash.match(/^#page-(\d+)$/);
    if (!m) return 0;
    return Math.max(0, Math.min(PAGES.length - 1, parseInt(m[1], 10) - 1));
  }

  function go(idx) {
    idx = Math.max(0, Math.min(PAGES.length - 1, idx));
    location.hash = '#page-' + (idx + 1);
  }

  function render() {
    const idx = currentIdx();
    document.querySelectorAll('section.page').forEach((s) => s.classList.remove('active'));
    const active = document.querySelector('section.page[data-page="' + idx + '"]');
    if (active) active.classList.add('active');

    document.querySelectorAll('#toc-list a').forEach((a) =>
      a.classList.toggle('active', Number(a.dataset.idx) === idx)
    );

    document.getElementById('cur-page').textContent = String(idx + 1);
    document.getElementById('cur-title').textContent = PAGES[idx].title;
    document.getElementById('prev-btn').disabled = idx === 0;
    document.getElementById('next-btn').disabled = idx === PAGES.length - 1;

    // Lazily hydrate code blocks on the active page.
    hydrateCodeOnPage(active);

    // Scroll the main column to top.
    document.getElementById('content').scrollTop = 0;
  }

  document.getElementById('prev-btn').addEventListener('click', () => go(currentIdx() - 1));
  document.getElementById('next-btn').addEventListener('click', () => go(currentIdx() + 1));

  window.addEventListener('hashchange', render);
  window.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft')  go(currentIdx() - 1);
    if (e.key === 'ArrowRight') go(currentIdx() + 1);
  });

  // ---- Monaco bootstrap
  let monacoReady = null;
  const editors = []; // track every Monaco instance so we can re-theme them.

  function ensureMonaco() {
    if (monacoReady) return monacoReady;
    monacoReady = new Promise((resolve) => {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
      require(['vs/editor/editor.main'], () => {
        monaco.editor.defineTheme('bisect-dark', {
          base: 'vs-dark',
          inherit: true,
          rules: [],
          colors: {
            'editor.background': '#1e1e1e',
            'editor.foreground': '#e6edf3',
            'editor.lineHighlightBackground': '#252526',
            'editorLineNumber.foreground': '#5a6171'
          }
        });
        monaco.editor.defineTheme('bisect-light', {
          base: 'vs',
          inherit: true,
          rules: [],
          colors: {
            'editor.background': '#ffffff',
            'editor.foreground': '#1c2025',
            'editor.lineHighlightBackground': '#f5f7fa',
            'editorLineNumber.foreground': '#a0a8b4'
          }
        });
        resolve();
      });
    });
    return monacoReady;
  }

  function currentMonacoTheme() {
    return document.body.dataset.theme === 'light' ? 'bisect-light' : 'bisect-dark';
  }

  function langFor(tag) {
    const map = {
      shell: 'shell', bash: 'shell', sh: 'shell', zsh: 'shell',
      javascript: 'javascript', js: 'javascript', mjs: 'javascript',
      typescript: 'typescript', ts: 'typescript',
      yaml: 'yaml', yml: 'yaml',
      json: 'json',
      svelte: 'html', html: 'html',
      markdown: 'markdown', md: 'markdown'
    };
    return map[(tag || '').toLowerCase()] || 'plaintext';
  }

  async function hydrateCodeOnPage(section) {
    if (!section) return;
    const blocks = section.querySelectorAll('pre.code:not([data-hydrated])');
    if (!blocks.length) return;

    await ensureMonaco();
    blocks.forEach((pre) => {
      pre.setAttribute('data-hydrated', '1');
      const lang = langFor(pre.dataset.lang);
      const title = pre.dataset.title || lang;
      const code = pre.textContent.replace(/\s+$/, '');

      const wrap = document.createElement('div');
      wrap.className = 'code-wrap';

      const header = document.createElement('div');
      header.className = 'code-header';
      header.innerHTML =
        '<span><span class="lang-tag">' + lang + '</span> &nbsp;·&nbsp; ' + escapeHtml(title) + '</span>' +
        '<button class="copy-btn" type="button">Copy</button>';
      wrap.appendChild(header);

      const editorHost = document.createElement('div');
      editorHost.className = 'monaco-host';
      const lines = code.split('\n').length;
      editorHost.style.height = Math.min(560, Math.max(80, lines * 19 + 18)) + 'px';
      wrap.appendChild(editorHost);

      pre.replaceWith(wrap);

      const editor = monaco.editor.create(editorHost, {
        value: code,
        language: lang,
        theme: currentMonacoTheme(),
        readOnly: true,
        automaticLayout: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        fontSize: 13,
        fontFamily: '"JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,monospace',
        renderLineHighlight: 'none',
        wordWrap: 'off',
        scrollbar: { vertical: 'auto', horizontal: 'auto', alwaysConsumeMouseWheel: false }
      });
      editors.push(editor);

      const copyBtn = header.querySelector('.copy-btn');
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(editor.getValue());
          copyBtn.textContent = 'Copied!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('copied');
          }, 1400);
        } catch (e) {
          copyBtn.textContent = 'Copy failed';
        }
      });
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
  }

  // ---- theme toggle
  const THEME_KEY = 'bisect-curriculum-theme';
  function applyTheme(theme) {
    document.body.dataset.theme = theme;
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (theme === 'light') { icon.textContent = '☼'; label.textContent = 'Dark'; }
    else                   { icon.textContent = '☾'; label.textContent = 'Light'; }
    // Re-theme every existing Monaco editor.
    if (window.monaco) {
      monaco.editor.setTheme(currentMonacoTheme());
    }
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  }
  (function initTheme() {
    let stored;
    try { stored = localStorage.getItem(THEME_KEY); } catch {}
    if (stored === 'light' || stored === 'dark') {
      applyTheme(stored);
    } else {
      // Prefer system preference if no stored value.
      const prefersLight = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(prefersLight ? 'light' : 'dark');
    }
  })();
  document.getElementById('theme-btn').addEventListener('click', () => {
    applyTheme(document.body.dataset.theme === 'light' ? 'dark' : 'light');
  });

  // ---- search
  function highlightInString(haystack, needle) {
    if (!needle) return escapeHtml(haystack);
    const re = new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return escapeHtml(haystack).replace(
      new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'),
      '<mark>$1</mark>'
    );
  }
  // Build a haystack per page = title + text content (without code blocks).
  const pageHaystacks = PAGES.map((p, i) => {
    const sec = document.querySelector('section.page[data-page="' + i + '"]');
    const clone = sec ? sec.cloneNode(true) : null;
    if (clone) clone.querySelectorAll('pre.code').forEach(el => el.remove());
    const text = (clone ? clone.textContent : p.title).replace(/\s+/g, ' ').trim();
    return (p.title + ' ' + text).toLowerCase();
  });

  function applySearch(q) {
    const needle = q.trim().toLowerCase();
    const tocAnchors = Array.from(document.querySelectorAll('#toc-list a'));
    const tocParts   = Array.from(document.querySelectorAll('#toc-list .part'));

    if (!needle) {
      tocAnchors.forEach((a) => {
        a.classList.remove('hidden');
        const i = Number(a.dataset.idx);
        a.querySelector('span:last-child').textContent = PAGES[i].title;
      });
      tocParts.forEach(p => p.classList.remove('hidden'));
      const empty = document.getElementById('search-empty');
      if (empty) empty.remove();
      return;
    }

    let matches = 0;
    tocAnchors.forEach((a) => {
      const i = Number(a.dataset.idx);
      const hit = pageHaystacks[i].includes(needle);
      a.classList.toggle('hidden', !hit);
      if (hit) {
        matches++;
        // Highlight the matched portion of the title (if any).
        const titleSpan = a.querySelector('span:last-child');
        titleSpan.innerHTML = highlightInString(PAGES[i].title, q.trim());
      }
    });

    // Hide a Part heading if every page under it is hidden.
    tocParts.forEach((p) => {
      let next = p.nextElementSibling;
      let anyVisible = false;
      while (next && next.tagName === 'A') {
        if (!next.classList.contains('hidden')) { anyVisible = true; break; }
        next = next.nextElementSibling;
      }
      p.classList.toggle('hidden', !anyVisible);
    });

    let empty = document.getElementById('search-empty');
    if (matches === 0) {
      if (!empty) {
        empty = document.createElement('div');
        empty.id = 'search-empty';
        empty.className = 'search-empty';
        empty.textContent = 'No pages match.';
        document.getElementById('toc-list').appendChild(empty);
      }
    } else if (empty) empty.remove();
  }

  const searchInput = document.getElementById('search');
  let searchTimer = null;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => applySearch(e.target.value), 80);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { searchInput.value = ''; applySearch(''); searchInput.blur(); }
    if (e.key === 'Enter') {
      // Jump to first visible match.
      const first = document.querySelector('#toc-list a:not(.hidden)');
      if (first) go(Number(first.dataset.idx));
    }
  });
  // Global "/" focuses search.
  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  // first render
  render();
})();
</script>
