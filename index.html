    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm action MUST come BEFORE setup-node when you want setup-node
      # to cache pnpm's store — setup-node needs to know the package manager
      # is installed already to discover its store path.
      - uses: pnpm/action-setup@v4
        # No "version" — it reads packageManager from package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'                # caches ~/.local/share/pnpm/store between runs

      - run: pnpm install --frozen-lockfile     # NOT bare `pnpm install` — CI must be reproducible
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
</pre>

<p>The <code>packageManager</code> field in <code>package.json</code> is what makes this work. <code>pnpm/action-setup@v4</code> reads it and installs the exact pinned version — no <code>with: { version: 9 }</code> in YAML, no version drift between dev and CI. The same field also drives <a href="https://nodejs.org/api/corepack.html" target="_blank" rel="noopener">corepack</a> on developers' machines.</p>

<p>Alternative without the third-party action — use corepack directly:</p>

<pre class="code" data-lang="yaml" data-title="day-12-ci-corepack.yml">      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable     # Node 16.9+ has corepack built-in
      - run: pnpm install --frozen-lockfile
</pre>

<div class="callout">
<div class="callout-title"><code>pnpm install</code> vs <code>pnpm install --frozen-lockfile</code></div>
<table class="cmp">
<tr><th><code>pnpm install</code> (bare)</th><th><code>pnpm install --frozen-lockfile</code></th></tr>
<tr><td>Reads <code>package.json</code>, may update <code>pnpm-lock.yaml</code> when they disagree</td><td>Reads <code>pnpm-lock.yaml</code>, refuses to proceed if it disagrees with <code>package.json</code></td></tr>
<tr><td>Reuses existing <code>node_modules/</code> symlinks where possible</td><td>Treats the lockfile as the source of truth — no implicit updates</td></tr>
<tr><td>Faster on warm cache; convenient locally</td><td>Strictly deterministic; same result every time</td></tr>
<tr><td>Use locally</td><td><strong>Use in CI. Always.</strong> Same role as <code>npm ci</code>.</td></tr>
</table>
<p>Bonus pnpm-specific: <code>pnpm install --prefer-offline</code> lowers network round-trips even further by trusting the store first; combined with <code>--frozen-lockfile</code> it's the fastest reproducible install you'll get out of any Node package manager.</p>
</div>

<h3>Day 13 — Versioning</h3>

<p>pnpm inherits npm's built-in version command — bumps the version field, follows semver, produces a tagged git commit, runs lifecycle hooks:</p>

<pre class="code" data-lang="shell" data-title="day-13.sh">pnpm version patch        # 0.1.0 → 0.1.1
pnpm version minor        # 0.1.0 → 0.2.0
pnpm version major        # 0.1.0 → 1.0.0
pnpm version premajor --preid=alpha   # 0.1.0 → 1.0.0-alpha.0

# Each runs: preversion → bump version → version → git commit + tag → postversion
# Hook these to enforce quality:
pnpm pkg set scripts.preversion="pnpm test"
pnpm pkg set scripts.postversion="git push &amp;&amp; git push --tags"
</pre>

<p>For monorepos, graduate to <a href="https://github.com/changesets/changesets" target="_blank" rel="noopener">Changesets</a> — it tracks per-package version intent across PRs and bumps them all on release.</p>

<h3>Day 14 — Publishing (skip if private)</h3>

<p>If your app stays <code>private: true</code> (a SaaS), you'll never <code>pnpm publish</code>. If you're shipping a library:</p>

<pre class="code" data-lang="shell" data-title="day-14.sh">pnpm pkg delete private                  # un-private the package
pnpm pkg set publishConfig.access="public"
pnpm pkg set files='["dist","README.md","LICENSE"]' --json
pnpm pkg set scripts.prepublishOnly="pnpm test &amp;&amp; pnpm build"

pnpm publish --dry-run     # see exactly what would ship, without shipping
pnpm publish               # do it for real
</pre>

<p>The <code>"files"</code> array is the <em>allowlist</em> of what ends up in the tarball. Without it, you can accidentally publish <code>.env</code> files, test fixtures, or your source <code>.ts</code> alongside compiled <code>.js</code>. <strong>Always set <code>"files"</code> explicitly for published packages.</strong></p>

<p>The <code>prepublishOnly</code> hook is your last-line gate: it runs only on <code>pnpm publish</code> (not on <code>pnpm install</code>) and aborts the publish if tests fail or the build breaks.</p>

<h3>Day 15 — Auditing &amp; updating</h3>

<pre class="code" data-lang="shell" data-title="day-15.sh">pnpm outdated                # list deps with newer versions available
pnpm audit                   # list known vulnerabilities
pnpm audit --fix               # auto-update vulnerable deps within semver range
pnpm audit --fix  # ⚠️ pnpm audit --fix is conservative; --force has no direct equivalent       # ⚠️ may bump major versions, breaking your build

pnpm update                  # update within the semver ranges in package.json
pnpm update express          # update one package

# To bump a package PAST its semver range:
pnpm add express@latest
</pre>

<p>For long-term maintenance, automate this with Dependabot (GitHub-native, free) or Renovate (more configurable). Both open PRs proposing dependency updates; your CI runs against the PR and tells you whether to merge.</p>

<h3>The final, production-ready package.json</h3>

<p>15 days in, this is your file. Annotated to show the role of each section:</p>

<pre class="code" data-lang="json" data-title="day-15-final.json">{
  "name": "my-app",
  "version": "0.3.7",
  "private": true,
  "type": "module",
  "description": "What this app does, in one line.",

  "packageManager": "pnpm@9.12.0",
  "engines": {
    "node": "&gt;=20",
    "pnpm": "&gt;=9"
  },

  "scripts": {
    "preinstall":   "npx --yes only-allow pnpm",

    "dev":          "run-p dev:server dev:client",
    "dev:server":   "node --watch server.js",
    "dev:client":   "vite",

    "prebuild":     "rm -rf dist",
    "build":        "tsc &amp;&amp; vite build",

    "test":         "vitest run",
    "test:watch":   "vitest",
    "test:coverage":"vitest run --coverage",

    "lint":         "eslint .",
    "lint:fix":     "eslint . --fix",

    "format":       "prettier --write .",
    "format:check": "prettier --check .",

    "check":        "pnpm lint &amp;&amp; pnpm format:check &amp;&amp; pnpm test &amp;&amp; pnpm build",

    "preversion":   "pnpm test",
    "postversion":  "git push &amp;&amp; git push --tags",

    "prepare":      "husky",
    "start":        "node dist/server.js"
  },

  "lint-staged": {
    "*.{js,ts,jsx,tsx}":            ["eslint --fix", "prettier --write"],
    "*.{json,md,css,yml,yaml}":     ["prettier --write"]
  },

  "pnpm": {
    "//-- block known-bad versions across the dep tree --": "",
    "overrides": {
      "minimatch@&lt;3.0.5": "&gt;=3.0.5"
    },
    "//-- approve postinstall scripts explicitly (pnpm 9.5+ requires this) --": "",
    "onlyBuiltDependencies": ["esbuild"]
  },

  "dependencies": {
    "express":  "^4.19.2"
  },

  "devDependencies": {
    "@types/node":              "^20.12.7",
    "eslint":                   "^9.2.0",
    "eslint-config-prettier":   "^9.1.0",
    "husky":                    "^9.0.11",
    "lint-staged":              "^15.2.2",
    "npm-run-all":              "^4.1.5",
    "prettier":                 "^3.2.5",
    "typescript":               "^5.4.5",
    "vite":                     "^5.2.10",
    "vitest":                   "^1.6.0"
  }
}
</pre>

<p>Three pnpm-distinctive fields worth understanding:</p>
<ul>
  <li><strong><code>packageManager</code></strong> — corepack reads it, CI actions read it, future-you reads it. One source of truth for "what pnpm version does this project run."</li>
  <li><strong><code>pnpm.overrides</code></strong> — force a specific version of a transitive dep across the entire tree. The equivalent of npm's <code>overrides</code> or yarn's <code>resolutions</code>. Indispensable for security patches: pin <code>minimatch@&gt;=3.0.5</code> and every package depending on minimatch gets the safe version.</li>
  <li><strong><code>pnpm.onlyBuiltDependencies</code></strong> — pnpm 9.5+ requires you to <em>explicitly approve</em> which deps may run install-time scripts. Without it, untrusted <code>postinstall</code> from a transitive dep is silently blocked. The most important supply-chain-defense feature of any modern package manager.</li>
</ul>

<h3>The decisions you'll re-make on every project</h3>

<h4>Where does each new dep go?</h4>
<table class="cmp">
<tr><th>Question</th><th>Answer</th></tr>
<tr><td>"Will production runtime <code>require()</code> this?"</td><td><code>dependencies</code></td></tr>
<tr><td>"Will <code>pnpm build</code> use it but not the runtime?"</td><td><code>devDependencies</code></td></tr>
<tr><td>"Will <code>pnpm test</code>, <code>lint</code>, or <code>format</code> use it?"</td><td><code>devDependencies</code></td></tr>
<tr><td>"Is this a library that expects the host app to provide React/Vue/etc.?"</td><td><code>peerDependencies</code></td></tr>
<tr><td>"Do I want this only on certain Node versions or OSes?"</td><td><code>optionalDependencies</code></td></tr>
</table>

<h4>When do I split into a workspace / monorepo?</h4>
<p>When two parts of your codebase have <em>different deploy boundaries</em> — a server and an SDK, a marketing site and an app, multiple services. Until then, one <code>package.json</code> at the root is correct. Premature workspaces are the most common over-engineering pattern in modern Node.</p>

<p>pnpm uses a <strong>separate file</strong>, not a field inside <code>package.json</code>. This is one of the first places pnpm diverges from npm/yarn — and one of the best decisions pnpm made, because workspace topology shouldn't be tangled with package metadata.</p>

<pre class="code" data-lang="yaml" data-title="pnpm-workspace.yaml">packages:
  - 'packages/*'
  - 'apps/*'
  - '!**/test/**'        # negative patterns supported
</pre>

<p>Root <code>package.json</code> stays clean and only carries scripts that orchestrate across packages:</p>

<pre class="code" data-lang="json" data-title="workspaces.json">{
  "name": "my-monorepo",
  "private": true,
  "packageManager": "pnpm@9.12.0",
  "scripts": {
    "build":  "pnpm -r build",
    "test":   "pnpm -r test",
    "lint":   "pnpm -r lint",
    "dev":    "pnpm -r --parallel dev"
  }
}
</pre>

<p>Each subdirectory in <code>packages/</code> and <code>apps/</code> gets its own <code>package.json</code>; the root coordinates. The <code>-r</code> flag means "recursive across all workspace packages." <code>--parallel</code> runs them concurrently (the right default for <code>dev</code>). <code>--filter</code> targets specific packages: <code>pnpm --filter @myorg/api build</code>.</p>

<div class="callout">
<div class="callout-title">Why pnpm wins for monorepos</div>
<p>pnpm's <strong>content-addressable store</strong> hard-links every package version once into <code>~/.local/share/pnpm/store</code> and symlinks it into each project's <code>node_modules/</code>. A 50-package monorepo where every package depends on React doesn't install React 50 times — it links to one store entry. Disk usage drops 70–90% versus npm/yarn classic. <code>pnpm install</code> on warm cache is often 10× faster than <code>npm install</code>.</p>
</div>

<h3>Anti-patterns to avoid from day 1</h3>
<div class="callout bad">
<div class="callout-title">Avoid</div>
<ul>
  <li><strong><code>"dependencies"</code> with a hundred packages.</strong> Audit: do half of them actually run in production, or did they leak from <code>devDependencies</code>? Re-classify before they cost you image size.</li>
  <li><strong>Mixed package managers.</strong> Pick one (<code>npm</code>, <code>pnpm</code>, or <code>yarn</code>) and stick with it. Mixed teams produce inconsistent lockfiles and broken caches.</li>
  <li><strong>Scripts that <code>cd</code> elsewhere.</strong> npm runs scripts from the package root by default. A script that does <code>cd subdir && build</code> works locally but breaks in subtle ways under workspaces and CI matrix jobs.</li>
  <li><strong>Hardcoded paths.</strong> <code>"start": "/usr/local/bin/node server.js"</code> works only on your laptop. Just <code>node</code> — npm adds the correct Node to PATH.</li>
  <li><strong>"scripts" full of one-off commands.</strong> If a script was used once and never again, delete it. <code>package.json</code> is the contract surface; it should describe what the project <em>does</em>, not what you once did.</li>
  <li><strong>Forgetting to update <code>engines.node</code> when you start using new APIs.</strong> The day you write <code>await fs.glob()</code>, bump <code>engines.node</code> to 22.</li>
</ul>
</div>

<h3>The mechanics cheatsheet</h3>

<pre class="code" data-lang="shell" data-title="cheatsheet.sh"># Bootstrap once per machine — corepack ships with Node 16.9+.
corepack enable

# Initialize
pnpm init                    # creates package.json (no -y; defaults are non-interactive)

# Install / add / remove
pnpm install                 # install everything in package.json + pnpm-lock.yaml
pnpm add pkg                 # → dependencies
pnpm add -D pkg              # → devDependencies
pnpm add -E pkg              # → exact version (no caret/tilde)
pnpm add pkg@1.2.3           # specific version
pnpm add pkg@latest          # bump past current semver range
pnpm add ./local-folder      # local package (symlinked)
pnpm add github:owner/repo   # straight from GitHub
pnpm add -g pkg              # global install (uses corepack-friendly location)
pnpm remove pkg              # removes from package.json + node_modules

# Reproducible installs (CI)
pnpm install --frozen-lockfile          # like npm ci — refuses to drift
pnpm install --frozen-lockfile --prod   # production deps only
pnpm install --frozen-lockfile --prefer-offline   # fastest reproducible install

# Inspect / modify package.json without editing JSON
pnpm pkg get scripts
pnpm pkg set scripts.foo="bar"
pnpm pkg delete scripts.foo

# Update / audit
pnpm outdated                # what's behind?
pnpm update                  # update within semver ranges
pnpm update --latest         # bump past semver, accepting major bumps
pnpm audit                   # security check
pnpm audit --fix             # auto-remediate

# Run scripts (pnpm allows omitting "run" for any script, not just reserved ones)
pnpm start                   # reserved name
pnpm test                    # reserved name
pnpm &lt;name&gt;                  # any other script — no `run` needed
pnpm &lt;name&gt; -- --extra-flag  # forward flags

# One-off tools (replaces npx)
pnpm dlx pkg                 # download, run, discard
pnpm dlx pkg@version arg     # pin the version

# Monorepos
pnpm -r build                # run "build" in every workspace package
pnpm -r --parallel dev       # run dev in parallel across workspaces
pnpm --filter @org/api test  # target a specific workspace package
</pre>

<h3>The principle</h3>
<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>Every line in <code>package.json</code> was added <em>deliberately</em>, in response to a need that emerged from the work. Nothing is there because a generator put it there; nothing is there because "every project has this." The file reads, top to bottom, like a chronological summary of decisions: "here are my deps, here are my dev deps, here are the operations a human or CI runner can perform on this project, here is how publishing works." That clarity is the entire deliverable.</p>
</div>
</template>

<template data-page-title="The Build Orchestration Layer — package.json" data-part="IX — Advanced &amp; Theoretical">
<span class="badge">Part IX · Advanced &amp; Theoretical</span>
<h2 class="page-title">The Build Orchestration Layer — package.json as DSL</h2>
<p class="lede">A bisection script that runs once on your laptop is a toy. A bisection script that survives — runs in CI, gets used by colleagues, gets re-run a year later when you've forgotten how it works — needs a build system. For a Node project, that build system is <code>package.json</code>'s <code>"scripts"</code> field. Used well, it's a tiny declarative DSL that wires every command in your repo into one composable graph. Used poorly, it's a graveyard of <code>&amp;&amp; true || true</code>.</p>

<h3>The mental model: what <code>npm run &lt;name&gt;</code> actually does</h3>
<p>Strip away the folklore. Here is the entire algorithm:</p>
<ol>
  <li>npm walks up from <code>cwd</code> to find a <code>package.json</code>.</li>
  <li>It looks up <code>scripts.&lt;name&gt;</code>.</li>
  <li>It augments <code>PATH</code> with <code>./node_modules/.bin</code> and the current Node's bin dir.</li>
  <li>It populates <code>npm_*</code> env vars (<code>npm_package_version</code>, <code>npm_lifecycle_event</code>, etc.).</li>
  <li>It invokes <code>sh -c "&lt;command&gt;"</code> on POSIX, <code>cmd /c</code> on Windows.</li>
  <li>Exit code propagates.</li>
</ol>
<p>That's all. No magic, no graph engine, no caching. Just PATH-augmented shell invocation plus two crucial conveniences: <strong>lifecycle hooks</strong> and <strong>script composition</strong>.</p>

<h3>Lifecycle hooks — the feature most engineers underuse</h3>
<p>For <em>any</em> script named <code>foo</code>, the package manager automatically runs <code>prefoo</code> before and <code>postfoo</code> after. Not advisory — mandatory. The implications are deep:</p>
<ul>
  <li>Composition without explicit <code>&amp;&amp;</code> chains.</li>
  <li>Failure of <code>prefoo</code> short-circuits the whole sequence (the runner aborts cleanly).</li>
  <li>The shape of a pipeline becomes <em>visible at the table-of-contents level</em>: <code>prebuild</code>, <code>build</code>, <code>postbuild</code> read as one logical unit.</li>
</ul>

<div class="callout bad">
<div class="callout-title">pnpm-specific: this only works if you opt in</div>
<p><strong>pnpm disables auto-fired <code>preX</code>/<code>postX</code> hooks for arbitrary scripts by default.</strong> Only the standard npm lifecycle hooks (<code>preinstall</code>, <code>postinstall</code>, <code>prepare</code>, <code>prepublishOnly</code>, etc.) fire on their own. Your <code>prebuild</code> will silently no-op.</p>
<p>To restore npm-compatible behavior, add to <code>.npmrc</code> at the repo root:</p>
<pre class="code" data-lang="ini" data-title="npmrc.ini">enable-pre-post-scripts=true
engine-strict=true
auto-install-peers=true
</pre>
<p>The first line is the fix. The other two are widely-recommended defaults: refuse install on the wrong Node/pnpm version, and stop the "peer dep missing" warnings that plague modern React/Vue projects. This <code>.npmrc</code> file is one of the highest-value four-line files you'll ever commit.</p>
</div>

<h3>Our project's package.json</h3>

<pre class="code" data-lang="json" data-title="package.json">{
  "name": "bisection-debugging",
  "version": "1.0.0",
  "private": true,
  "description": "A principal-engineer-level curriculum on bisection debugging.",
  "type": "module",
  "packageManager": "pnpm@9.12.0",
  "engines": {
    "node": "&gt;=20",
    "pnpm": "&gt;=9"
  },
  "scripts": {
    "preinstall":"npx --yes only-allow pnpm",

    "escape":    "node fix-html-escaping.mjs",
    "extract":   "node extract-scripts.mjs",
    "verify":    "./verify-scripts.sh",

    "prebuild":  "pnpm escape",
    "build":     "pnpm extract",
    "postbuild": "pnpm verify",

    "pretest":   "pnpm extract",
    "test":      "pnpm verify",

    "dev":       "pnpm dlx serve@14 -l 8080 .",
    "start":     "pnpm dev",

    "clean":     "rm -rf scripts/foundations scripts/git-bisect scripts/file-bisect scripts/dep-build scripts/test-perf scripts/bash scripts/zsh scripts/ci scripts/advanced",

    "check":     "pnpm build",
    "prepush":   "pnpm check"
  }
}
</pre>

<h3>Walking it line by line</h3>

<h4><code>"private": true</code></h4>
<p>Refuses to publish to the npm registry. A single line that prevents an entire class of disaster (accidentally publishing internal code, leaking secrets in a tarball). Every internal project should have this; the only projects without it are intentionally published packages.</p>

<h4><code>"type": "module"</code></h4>
<p>Makes <code>.js</code> files default to ES module syntax. Our scripts use <code>.mjs</code> extensions for explicit clarity, but this flag matters anytime you add a <code>.js</code> file and expect <code>import</code>/<code>export</code> to work.</p>

<h4><code>"engines": { "node": ">=20" }</code></h4>
<p>Declares the Node version this project requires. By default it's advisory (a warning); pair with <code>npm config set engine-strict true</code> or a workspace <code>.npmrc</code> with <code>engine-strict=true</code> to make it a hard error. <strong>This is the cheapest CI fix you'll ever ship.</strong> A script that uses Node 20's <code>node:fs/promises.glob()</code> will fail mysteriously on Node 18; <code>engines</code> turns the mystery into a clean error at install time.</p>

<h4>The three primitive scripts</h4>
<table class="cmp">
<tr><th>Script</th><th>Does</th><th>Why it's a primitive</th></tr>
<tr><td><code>escape</code></td><td>Decode-then-encode every code block's HTML entities</td><td>Idempotent, deterministic, no side effects outside <code>index.html</code></td></tr>
<tr><td><code>extract</code></td><td>Walk <code>index.html</code>, write each <code>&lt;pre&gt;</code> block to <code>scripts/&lt;category&gt;/&lt;name&gt;</code></td><td>Pure derivation from one input file; safe to re-run anytime</td></tr>
<tr><td><code>verify</code></td><td>Run <code>bash -n</code>, <code>zsh -n</code>, or <code>node --check</code> on every extracted file</td><td>Side-effect-free; quality gate</td></tr>
</table>

<h4>The composed pipeline</h4>
<p>This is where lifecycle hooks pay off:</p>
<pre class="code" data-lang="text" data-title="build-pipeline.txt">pnpm build
  → prebuild   = pnpm escape    (fix HTML entities)
  → build      = pnpm extract   (regenerate scripts/)
  → postbuild  = pnpm verify    (syntax-check the lot)

Failure of any step aborts the sequence. Exit codes propagate up.
</pre>
<p>One command does the right thing in the right order, every time, without a flaky <code>&amp;&amp;</code> chain that future-me will accidentally reorder.</p>

<h4><code>test</code> as a reserved name</h4>
<p>npm gives a small set of script names special treatment — you can invoke them without <code>run</code>:</p>
<pre class="code" data-lang="text" data-title="reserved-scripts.txt">pnpm test     ≡ pnpm test
pnpm start    ≡ pnpm start
pnpm restart  ≡ pnpm restart  (runs prerestart, restart, postrestart)
pnpm stop     ≡ pnpm stop
</pre>
<p>By convention, <code>test</code> means "run the test suite" and <code>start</code> means "run the thing." We follow both: <code>pnpm test</code> runs <code>verify</code> with <code>pretest</code> regenerating <code>scripts/</code> first; <code>pnpm start</code> launches the dev server. The convention matters: anyone cloning this repo will try <code>pnpm test</code> first, and they should be rewarded.</p>

<h4><code>dev</code> with <code>pnpm dlx --yes</code></h4>
<p><code>pnpm dlx serve@14</code> downloads <code>serve</code> on first invocation and caches it; subsequent runs are instant. No <code>devDependencies</code> entry, no <code>node_modules/</code> bloat, no <code>pnpm install</code> step required. The <code>@14</code> pin matters: an unpinned <code>pnpm dlx serve</code> would silently break the day <code>serve</code> v15 changes a flag.</p>

<h4><code>prepare</code> — the install-time lifecycle hook</h4>
<p>Reserved by npm. Runs after <code>pnpm install</code> in a clone (but not on installs in a published-package consumer). Perfect for: husky setup, generated-file initialization, post-clone first-time messages. We use it for a friendly welcome string so a new contributor sees actionable next steps.</p>

<h3>The full lifecycle map</h3>
<p>npm has more lifecycle hooks than most engineers realize. Knowing which one to use is a senior-engineer skill:</p>
<table class="cmp">
<tr><th>Hook</th><th>Fires when</th><th>Use it for</th></tr>
<tr><td><code>preinstall</code></td><td>Before <code>pnpm install</code> runs</td><td>Almost never — runs before deps exist</td></tr>
<tr><td><code>install</code></td><td>During install (deprecated meaning today)</td><td>Don't write this</td></tr>
<tr><td><code>postinstall</code></td><td>After deps install</td><td>Generated files, native module compile. <em>Security-sensitive</em> — many orgs ban it.</td></tr>
<tr><td><code>prepare</code></td><td>After install in a clone; before <code>pnpm publish</code>; on <code>npm pack</code></td><td>Husky, prebuild compiled output</td></tr>
<tr><td><code>prepublishOnly</code></td><td>Before <code>pnpm publish</code> only (never on install)</td><td>Run tests; refuse to publish broken</td></tr>
<tr><td><code>pre&lt;name&gt;</code> / <code>post&lt;name&gt;</code></td><td>Around every script you write</td><td>Composition without <code>&amp;&amp;</code></td></tr>
</table>

<h3>Cross-platform: what breaks on Windows</h3>
<p>npm scripts run in <code>sh -c</code> on Unix and <code>cmd /c</code> on Windows. The shared subset is smaller than you think:</p>
<table class="cmp">
<tr><th>Idiom</th><th>Works on Windows?</th><th>Cross-platform alternative</th></tr>
<tr><td><code>&amp;&amp;</code>, <code>||</code></td><td>Yes</td><td>—</td></tr>
<tr><td><code>FOO=bar cmd</code> (inline env)</td><td>No — cmd.exe ignores it</td><td><code>cross-env FOO=bar cmd</code></td></tr>
<tr><td><code>$VAR</code> expansion</td><td>No — cmd.exe uses <code>%VAR%</code></td><td>Read env vars inside your Node script instead of in the npm command</td></tr>
<tr><td><code>rm -rf x</code></td><td>No</td><td><code>rimraf x</code> or <code>shx rm -rf x</code></td></tr>
<tr><td><code>cp src dst</code></td><td>No</td><td><code>shx cp src dst</code></td></tr>
<tr><td><code>cmd1 &amp; cmd2</code> (parallel)</td><td>Behaves differently</td><td><code>npm-run-all -p cmd1 cmd2</code> or <code>concurrently</code></td></tr>
<tr><td>Glob expansion (<code>foo *.js</code>)</td><td>No — cmd.exe doesn't expand globs</td><td>Let your Node script glob: <code>node script.mjs '**/*'</code></td></tr>
</table>
<p>Our project uses <code>rm -rf</code> in the <code>clean</code> script — we accept Linux/macOS only because the curriculum is delivered as a single HTML file consumed in a browser, not as a Windows-distributed tool. <strong>If you ship a tool people run, audit your scripts for Windows compatibility. If you ship a website, don't bother.</strong></p>

<h3>Composition patterns</h3>

<h4>Serial (one after another)</h4>
<pre class="code" data-lang="json" data-title="serial.json">{
  "scripts": {
    "ship": "pnpm lint &amp;&amp; pnpm test &amp;&amp; pnpm build"
  }
}
</pre>

<h4>Parallel (concurrently)</h4>
<pre class="code" data-lang="json" data-title="parallel.json">{
  "scripts": {
    "dev": "npm-run-all --parallel dev:server dev:watch",
    "dev:server": "node server.mjs",
    "dev:watch":  "vite build --watch"
  },
  "devDependencies": { "npm-run-all": "^4.1.5" }
}
</pre>

<h4>Pre/post composition (no operators)</h4>
<pre class="code" data-lang="json" data-title="prepost.json">{
  "scripts": {
    "predeploy":  "pnpm build",
    "deploy":     "node deploy.mjs",
    "postdeploy": "node notify-slack.mjs"
  }
}
</pre>

<h4>Argument forwarding</h4>
<pre class="code" data-lang="json" data-title="forward-args.json">{
  "scripts": {
    "lint": "eslint .",
    "test": "vitest"
  }
}
</pre>
<p>Then <code>pnpm lint -- --fix</code> forwards <code>--fix</code> to ESLint. The <code>--</code> separator tells npm "everything after this is for the underlying command." Critical when you want to add ad-hoc flags without editing <code>package.json</code>.</p>

<h4>Reading variables npm injects</h4>
<pre class="code" data-lang="json" data-title="npm-env.json">{
  "version": "1.4.2",
  "scripts": {
    "release": "echo Releasing $npm_package_version &amp;&amp; git tag v$npm_package_version"
  }
}
</pre>
<p>Inside a script, <code>$npm_package_version</code>, <code>$npm_package_name</code>, and dozens of others are populated. <code>$npm_lifecycle_event</code> tells a shared script which entry point invoked it — useful when you have one Node file behind multiple script names.</p>

<h3>Common antipatterns</h3>
<div class="callout bad">
<div class="callout-title">Avoid</div>
<ul>
  <li><strong>Overloading <code>prebuild</code> with arbitrary tasks.</strong> Pre-hooks should be tightly coupled to their parent. If you want a "lint + test before build" gate, write <code>"check": "pnpm lint &amp;&amp; pnpm test &amp;&amp; pnpm build"</code> and call it from CI explicitly.</li>
  <li><strong>Hiding side effects in <code>postinstall</code>.</strong> Many orgs (and CI runners) now refuse packages that fetch code, compile binaries, or phone home in <code>postinstall</code>. Treat <code>postinstall</code> as security-radioactive.</li>
  <li><strong>Long unreadable chains.</strong> <code>"ship": "rm -rf dist &amp;&amp; pnpm lint &amp;&amp; pnpm test &amp;&amp; tsc &amp;&amp; webpack &amp;&amp; node deploy.mjs"</code> hides which step failed in CI logs. Break it up into named scripts and compose.</li>
  <li><strong>Recursive <code>npm run</code> that loops.</strong> A script that runs itself (directly or via another script) hangs forever.</li>
  <li><strong>Implicit shell features.</strong> Don't rely on Bash arrays, process substitution, or <code>$()</code> nesting; the script will break the day someone runs it under <code>sh</code> on Alpine.</li>
  <li><strong>Forgetting <code>pnpm install --frozen-lockfile</code> in CI.</strong> <code>pnpm install</code> can mutate <code>pnpm-lock.yaml</code>; <code>pnpm install --frozen-lockfile</code> installs exactly what the lockfile says and fails otherwise. CI should always use <code>ci</code>.</li>
</ul>
</div>

<h3>The hierarchy of build systems</h3>
<p>npm scripts aren't the only orchestration layer. Knowing where they sit in the stack is part of the job:</p>
<table class="cmp">
<tr><th>Layer</th><th>When to use it</th></tr>
<tr><td><strong>package.json scripts</strong></td><td>JS-ecosystem-native, project-local. Default choice. What this project uses.</td></tr>
<tr><td><strong>Makefile / justfile</strong></td><td>Cross-language repos, or when you need DAG semantics (target depends on target depends on file mtime). Often calls <em>into</em> npm scripts.</td></tr>
<tr><td><strong>Turborepo / Nx / Bazel</strong></td><td>Monorepos where caching, remote execution, and dependency-graph correctness matter at scale.</td></tr>
<tr><td><strong>CI YAML</strong></td><td>Top of the stack. Should be thin: <code>setup-node</code> + <code>pnpm install --frozen-lockfile</code> + <code>pnpm check</code>. Avoid putting business logic in YAML.</td></tr>
</table>

<h3>Wiring git hooks to npm scripts</h3>
<p>Pre-commit and pre-push hooks should delegate to npm, never duplicate commands.</p>

<h4>Pure git (zero deps)</h4>
<pre class="code" data-lang="shell" data-title="setup-githooks.sh">#!/usr/bin/env bash
# setup-githooks.sh
# Wire pre-push to `pnpm prepush`. Version-controlled in .githooks/.
set -euo pipefail
mkdir -p .githooks
cat &gt; .githooks/pre-push &lt;&lt;'HOOK'
#!/usr/bin/env bash
exec pnpm prepush
HOOK
chmod +x .githooks/pre-push
git config core.hooksPath .githooks
echo "Done. .githooks/pre-push will run 'pnpm prepush' before every git push."
</pre>

<h4>Husky (when you need more)</h4>
<pre class="code" data-lang="shell" data-title="setup-husky.sh">#!/usr/bin/env bash
# Husky version when you want lint-staged, commit-msg checks, etc.
pnpm add -D husky lint-staged
pnpm dlx husky init
echo "pnpm prepush" &gt; .husky/pre-push
chmod +x .husky/pre-push
</pre>
<p>For this project, pure-git hooks are enough. The rule of thumb: reach for Husky only when you want <code>lint-staged</code> or commit-message validation. For a single <code>pre-push</code>, pure git is six lines and zero dependencies.</p>

<h3>The CI side</h3>
<p>Because all complexity lives in <code>package.json</code>, the CI YAML is three lines:</p>

<pre class="code" data-lang="yaml" data-title=".github/workflows/ci.yml">name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc' }
      - run: pnpm install --frozen-lockfile          # NOT pnpm add — uses lockfile exactly
      - run: pnpm check   # ← all logic is here
</pre>

<p>This is the principal-engineer move: <strong>CI YAML should be a thin shim, not a place to write build logic</strong>. If your <code>check</code> recipe needs to change, it should change in <code>package.json</code> (reviewable, version-controlled, runnable locally) — not in the YAML behind a 5-minute round-trip through GitHub Actions.</p>

<h3>The 60-second clone test</h3>
<div class="callout good">
<div class="callout-title">The bar</div>
<p>A new engineer should be able to clone this repo and produce a verified artifact in under 60 seconds with no documentation other than <code>package.json</code>. Here's the run:</p>
<pre class="code" data-lang="shell" data-title="onboarding-60s.sh">git clone https://github.com/billyribeiro-ux/bisection-debugging
cd bisection-debugging
pnpm build
# → prebuild   : Re-encoded 84 code blocks
# → build      : Wrote 83 files under scripts/, .github/workflows/auto-bisect.yml
# → postbuild  : All scripts pass syntax checks.

pnpm dev     # serves at http://localhost:8080
</pre>
<p>If your project can't pass that test, the fix is rarely "write better docs" — it's "make the <code>package.json</code> match the docs you would have written."</p>
</div>

<h3>Reading list for going deeper</h3>
<table class="cmp">
<tr><th>Resource</th><th>What you get</th></tr>
<tr><td><code>pnpm help run</code> (the actual man page)</td><td>Authoritative lifecycle reference; faster than the docs site.</td></tr>
<tr><td>The npm <em>config</em> docs (<code>pnpm help config</code>)</td><td>Every flag that changes script behavior (<code>--silent</code>, <code>--foreground-scripts</code>, <code>ignore-scripts</code>).</td></tr>
<tr><td>"You Don't Need a Task Runner" — various blog posts circa 2015</td><td>The argument for using npm scripts instead of Gulp/Grunt. Mostly won; worth reading to understand why your inherited Gulpfiles exist.</td></tr>
<tr><td><a href="https://github.com/just-containers/s6-overlay" target="_blank" rel="noopener">just</a> + <a href="https://github.com/casey/just" target="_blank" rel="noopener">justfile</a></td><td>When package.json composition runs out of room, <code>just</code> is the next step up — Make-like syntax, no Make's footguns.</td></tr>
<tr><td><a href="https://earthly.dev" target="_blank" rel="noopener">Earthly</a></td><td>"Make + Docker": reproducible builds with content-addressable caching. Read it to see what npm scripts can't give you.</td></tr>
</table>

<h3>The principle, distilled</h3>
<div class="callout">
<div class="callout-title">L7 mindset</div>
<p>npm scripts aren't a build system. They're a <em>contract</em>: "this is the surface area of operations a human (or a CI runner) can perform on this repo." A good <code>package.json</code> reads like a table of contents for the project's operational behaviors. A bad one reads like git history of every command anyone happened to type. Curate it.</p>
</div>
</template>

<template data-page-title="Case Studies &amp; Further Reading" data-part="IX — Advanced &amp; Theoretical">
<span class="badge">Part IX · Advanced &amp; Theoretical</span>
<h2 class="page-title">Case Studies and Further Reading</h2>
<p class="lede">Bisection has solved enough famous bugs to fill a book. Here are a handful that every engineer should know — and the papers and books that go deeper than this curriculum can.</p>

<h3>Historical wins</h3>

<h4>1. The "first <code>git bisect</code> case" (Linux kernel, ca. 2008)</h4>
<p>Linus Torvalds, frustrated with hunting regressions in a kernel of millions of lines, formalized <code>git bisect</code>. The first publicly documented save: a kernel boot regression that bisection localized to a single commit changing an interrupt-mask routine. The bisection ran overnight on a kernel-boot harness. The fix was a one-line revert. The technique has saved Linux's reviewer time for two decades since.</p>

<h4>2. The npm <code>event-stream</code> attack (2018)</h4>
<p>A malicious actor took over maintenance of <code>event-stream</code>, added a dependency on a backdoored package <code>flatmap-stream</code>, and shipped credential-stealing code targeting <em>one</em> specific downstream user (a Bitcoin wallet). Forensics relied on supply-chain time bisection: which install date introduced the new transitive dependency? Once narrowed to a 3-day window, the malicious publish was obvious.</p>

<h4>3. The "Spectre regression in Chromium V8" (2018)</h4>
<p>After Spectre mitigations landed, JavaScript benchmarks regressed 20–40% on some workloads. The V8 team used <code>--opt-bisect-limit</code> (the LLVM/V8 equivalent) to bisect across the new mitigation passes. The result identified one specific bounds-check insertion as the dominant cost; a redesign recovered most of the lost throughput within months.</p>

<h4>4. The Heartbleed disclosure window</h4>
<p>OpenSSL's CVE-2014-0160 was introduced in commit <code>4817504d</code> in December 2011, exposed for ~28 months before discovery. After disclosure, every distro maintainer used <code>git bisect</code> to confirm which point-releases of OpenSSL were affected, and to backport the fix to the oldest still-supported branches.</p>

<h4>5. Andreas Zeller's "Yesterday, My Program Worked. Today, It Does Not. Why?" (1999)</h4>
<p>The paper that gave Delta Debugging its name. Zeller demonstrated minimizing a Mozilla browser crash to a 200-character HTML input from a 900,000-character original. The technique we now call <code>ddmin</code> originated here.</p>

<h3>Patterns from these cases</h3>
<ul>
  <li><strong>Long-lived bugs hide because nobody bisects them.</strong> Heartbleed sat for 28 months in a regularly-reviewed codebase. Bisection isn't a one-time technique; it should be part of CI for every release branch you support.</li>
  <li><strong>Bisection without disclosure is half the work.</strong> Identifying a malicious publish (event-stream) or a vulnerable commit (Heartbleed) is the easy part. Coordinating remediation across users is the hard part.</li>
  <li><strong>Performance bisections often beat correctness bisections in user impact.</strong> Spectre/V8's 20% slowdown affected billions of pageviews per day; bisection was the only feasible path to recovery.</li>
</ul>

<h3>Recommended reading</h3>

<h4>Books</h4>
<table class="cmp">
<tr><th>Title</th><th>Why it's worth your time</th></tr>
<tr><td><em>Why Programs Fail</em> — Andreas Zeller</td><td>The bisection/delta-debugging canonical reference. Every chapter is "build a tool that finds bugs automatically."</td></tr>
<tr><td><em>Effective Debugging</em> — Diomidis Spinellis</td><td>66 specific techniques, several of which are bisection in disguise. The book that complements this curriculum best for general debugging skills.</td></tr>
<tr><td><em>Information Theory, Inference, and Learning Algorithms</em> — David MacKay</td><td>Chapter 6 (noisy channel coding) is the mathematical foundation for the "Bayesian Bisection" page.</td></tr>
<tr><td><em>The Linux Programming Interface</em> — Michael Kerrisk</td><td>For when bisection narrows your bug to a syscall and you need to understand its semantics precisely.</td></tr>
</table>

<h4>Papers</h4>
<table class="cmp">
<tr><th>Paper</th><th>What it gives you</th></tr>
<tr><td>"Yesterday, my program worked…" (Zeller, ESEC/FSE 1999)</td><td>Delta debugging, ddmin, and the formal minimization framework.</td></tr>
<tr><td>"Simplifying and Isolating Failure-Inducing Input" (Zeller &amp; Hildebrandt, IEEE TSE 2002)</td><td>The canonical ddmin paper; pseudocode you can implement in 30 lines.</td></tr>
<tr><td>"HDD: Hierarchical Delta Debugging" (Misherghi &amp; Su, ICSE 2006)</td><td>Tree-aware ddmin. Direct foundation for the HDD page in Part IX.</td></tr>
<tr><td>"Practical Algorithms for Finding the First Bad Commit" (Couder, Git ML 2008)</td><td>Linus / Junio Hamano's discussion of git's graph-aware bisection heuristic.</td></tr>
<tr><td>"Identifying the Performance-Critical Subspace" (numerous papers in PLDI/CGO 2014–2024)</td><td>Compiler-pass bisection state-of-the-art.</td></tr>
<tr><td>"Generic Information-Theoretic Bisection" (Horstein 1973, BCJR family)</td><td>Bayesian bisection's theoretical backbone.</td></tr>
</table>

<h4>Tooling to know</h4>
<table class="cmp">
<tr><th>Tool</th><th>What it bisects</th></tr>
<tr><td><code>git bisect</code></td><td>Commits in a git history.</td></tr>
<tr><td><code>cargo-bisect-rustc</code></td><td>Rust nightly toolchains and individual rustc commits.</td></tr>
<tr><td><code>creduce</code> / <code>cvise</code></td><td>C/C++ source code minimization for compiler bug repros.</td></tr>
<tr><td><code>shrinkray</code></td><td>Generic input shrinker by David MacIver (creator of Hypothesis).</td></tr>
<tr><td><code>git imerge</code></td><td>Incremental merging that exposes one conflict at a time — bisection for merges.</td></tr>
<tr><td><code>rr</code> / Pernosco</td><td>Record/replay for deterministic execution; enables time-bisection.</td></tr>
<tr><td>Hypothesis / QuickCheck</td><td>Property-based testing; built-in shrinking is bisection applied to inputs.</td></tr>
<tr><td><code>git when-merged</code></td><td>Identifies which merge brought a commit into a branch — useful when bisection points at a merge.</td></tr>
</table>

<h3>The principal-engineer mindset to take away</h3>
<div class="callout good">
<div class="callout-title">Last word</div>
<p>Bisection is not really about commits or files. It's about <em>turning ignorance into information at log-rate</em>. Once you internalize that view, you stop thinking "I'll use bisection here" and start asking, of every search problem, "what's my predicate, what's my candidate set, and is the invariant monotonic?" The technique disappears into the way you think.</p>
<p>If you take one habit from this curriculum: <strong>before debugging, always ask "is this a search problem?" If yes, bisect. If no, think about why not.</strong></p>
</div>
</template>

<template data-page-title="Bisecting Kubernetes Deployments" data-part="X — Modern Systems">
<span class="badge">Part X · Modern Systems</span>
<h2 class="page-title">Bisecting Kubernetes Manifests and Deployments</h2>
<p class="lede">Your service was healthy yesterday and is crashing today. The code didn't change — but ten YAML files did. Bisection over Kubernetes manifests narrows the offending change in log₂(N) deploys instead of N. The technique works for any declarative-config system but Kubernetes is the most common case.</p>

<h3>The setup</h3>
<p>Modern services are deployed by applying a folder of YAML files to a Kubernetes cluster. Engineers edit these YAMLs in pull requests; over time a service accumulates hundreds of changes to deployments, services, configmaps, and ingress. A recent edit broke pod startup, but the PR was big and touched several files.</p>

<h3>The predicate</h3>

<pre class="code" data-lang="shell" data-title="k8s-bisect-predicate.sh">#!/usr/bin/env bash
# k8s-bisect-predicate.sh
# Apply the current commit's manifests to a disposable namespace and check
# whether the deployment becomes ready within a deadline.
#
# Exit codes follow `git bisect run`: 0 = good, 1 = bad, 125 = skip.
set -uo pipefail

NS="bisect-$(git rev-parse --short HEAD)"
TIMEOUT="${TIMEOUT:-180s}"

cleanup() { kubectl delete namespace "$NS" --wait=false 2&gt;/dev/null || true; }
trap cleanup EXIT

kubectl create namespace "$NS"             || exit 125  # cluster issue, not the bug

# Apply the whole manifest folder for THIS commit.
kubectl -n "$NS" apply -f ./k8s/            || exit 1

# Wait for every Deployment in this namespace to become Available.
kubectl -n "$NS" wait --for=condition=Available \
        --timeout="$TIMEOUT" deployment --all
RC=$?

# Optional functional check: hit a smoke endpoint inside the pod.
if [ $RC -eq 0 ]; then
  kubectl -n "$NS" exec deploy/api -- curl -sf http://localhost:8080/healthz \
    || RC=1
fi

exit $RC
</pre>

<h3>Running the bisection</h3>

<pre class="code" data-lang="shell" data-title="k8s-bisect-run.sh">#!/usr/bin/env bash
# Find the commit that broke the deployment.
LAST_GOOD="${1:?usage: $0 &lt;last-known-good-sha&gt;}"

git bisect start HEAD "$LAST_GOOD" -- k8s/    # restrict bisection to k8s/
chmod +x k8s-bisect-predicate.sh
git bisect run ./k8s-bisect-predicate.sh
git bisect reset
</pre>

<p>Note <code>-- k8s/</code>: this limits bisection to commits that touched the manifest folder. If the bug is in YAML, code-only commits get skipped automatically — saving rounds.</p>

<h3>The four most common Kubernetes regressions and what they look like</h3>
<table class="cmp">
<tr><th>Symptom in <code>kubectl describe pod</code></th><th>Almost-always-the-cause</th></tr>
<tr><td><code>ImagePullBackOff</code></td><td>Image tag was edited to one that doesn't exist (typo or premature reference to an unbuilt image).</td></tr>
<tr><td><code>CrashLoopBackOff</code> with healthy logs</td><td>readinessProbe or livenessProbe timing changed; pod is killed before it finishes startup.</td></tr>
<tr><td><code>0/3 nodes are available: insufficient memory</code></td><td>resources.requests was bumped beyond cluster capacity.</td></tr>
<tr><td>Pod starts but service has 0 endpoints</td><td>Label selector mismatch — someone renamed a label in <code>Deployment</code> but not in <code>Service</code>.</td></tr>
</table>

<h3>Working at the namespace level</h3>
<p>The predicate above creates a fresh namespace per commit — clean isolation, no leftover state. The cost: cluster pressure. For large manifests (50+ resources), consider:</p>
<ul>
  <li>Using a dedicated bisection cluster (kind, minikube, k3d) rather than your dev or staging cluster.</li>
  <li>Setting <code>--timeout</code> aggressively (60s instead of 180s) — most legitimately broken manifests fail fast.</li>
  <li>Using <code>kubectl diff</code> at the suspect commit to <em>see</em> the change before letting kubectl apply it — sometimes the diff is so obvious you skip the bisection.</li>
</ul>

<h3>Helm and Kustomize</h3>
<p>Same technique, different render step:</p>

<pre class="code" data-lang="shell" data-title="helm-bisect-predicate.sh">#!/usr/bin/env bash
# For Helm-rendered manifests, materialize the chart first, then apply.
set -uo pipefail
helm template ./charts/api --values ./values.yaml | kubectl -n "$NS" apply -f - \
  || exit 1
# ... same wait/check as before ...
</pre>

<pre class="code" data-lang="shell" data-title="kustomize-bisect-predicate.sh">#!/usr/bin/env bash
# For Kustomize, render with `kubectl kustomize` (or kustomize build).
set -uo pipefail
kubectl -n "$NS" apply -k ./overlays/staging || exit 1
# ... same wait/check ...
</pre>

<h3>GitOps (Flux / ArgoCD)</h3>
<p>When your cluster is managed by GitOps, you don't run <code>kubectl apply</code> — the cluster pulls from git automatically. To bisect:</p>
<ol>
  <li>Create a temporary branch (e.g., <code>bisect-test</code>) that the GitOps controller is NOT watching.</li>
  <li>For each candidate commit, force-push that commit to <code>bisect-test</code> on a separate cluster (or namespace) and observe.</li>
  <li>Once the culprit is found, the real fix goes through normal PR flow.</li>
</ol>

<div class="callout">
<div class="callout-title">L7 mindset</div>
<p>A team that needs Kubernetes bisection often has a deeper problem: PRs that change too many manifests at once. The senior move isn't just to bisect faster — it's to <em>change the PR culture</em> so every manifest change is its own atomic, reviewable commit. Then bisection becomes trivial because each commit is one logical change. Tooling and culture work together; one without the other is half the win.</p>
</div>
</template>

<template data-page-title="Bisecting Infrastructure-as-Code" data-part="X — Modern Systems">
<span class="badge">Part X · Modern Systems</span>
<h2 class="page-title">Bisecting Terraform &amp; Infrastructure-as-Code</h2>
<p class="lede">Your AWS bill jumped 40% last month. Or a load balancer started dropping connections after a deploy. Or an S3 bucket suddenly went public. The cause is somewhere in your Terraform history — and Terraform has hundreds of commits. Bisection across IaC commits finds the offending change in log₂(N) plans instead of staring at a year of diffs.</p>

<h3>The unique challenge of IaC bisection</h3>
<p>Code commits roll forward and backward freely. Infrastructure changes don't:</p>
<ul>
  <li>Some Terraform changes are <em>destructive</em> — applying an old commit might delete and recreate a database.</li>
  <li>Some IaC providers are <em>stateful</em> — a security-group rule that was deleted in commit 7 can't be re-added by checking out commit 4 unless you understand the dependency order.</li>
  <li>The <em>plan</em> (what Terraform would do) is usually safer to bisect than the <em>apply</em> (what it actually does).</li>
</ul>
<p>The principle: <strong>bisect plans, not applies, whenever possible.</strong></p>

<h3>The plan-only predicate (read-only, safe)</h3>

<pre class="code" data-lang="shell" data-title="terraform-bisect-plan.sh">#!/usr/bin/env bash
# terraform-bisect-plan.sh
# Bisects without ever applying. Looks for the commit at which `terraform plan`
# starts producing a specific diff signature — e.g. "creating an open S3 bucket"
# or "destroying RDS database".
#
# Exit 0 = good (diff signature absent), 1 = bad (signature present).
set -uo pipefail

WORKSPACE="${WORKSPACE:-bisect}"
SIGNATURE="${SIGNATURE:?set SIGNATURE — a string that uniquely identifies the bad change in a plan output}"

# Sanity: skip if the commit doesn't even initialize.
terraform init -input=false -no-color &gt;/dev/null 2&gt;&amp;1 || exit 125
terraform workspace select "$WORKSPACE" 2&gt;/dev/null || terraform workspace new "$WORKSPACE"

# Run a non-destructive plan.
terraform plan -no-color -input=false -refresh=false -out=/tmp/tfplan &gt;/tmp/plan.out 2&gt;&amp;1
RC=$?

# Provider errors (e.g. AWS credentials expired) — skip, not the bug.
grep -qE "Error:|InvalidClientToken|AccessDenied" /tmp/plan.out &amp;&amp; [ $RC -ne 0 ] &amp;&amp; exit 125

if grep -qF "$SIGNATURE" /tmp/plan.out; then
  exit 1   # the bad change is present
else
  exit 0   # not yet
fi
</pre>

<h3>Example signatures that work well</h3>
<table class="cmp">
<tr><th>Bug</th><th>Signature string</th></tr>
<tr><td>Public S3 bucket appeared</td><td><code>"acl" = "public-read"</code></td></tr>
<tr><td>RDS instance to be replaced</td><td><code>"# aws_db_instance.main must be replaced"</code></td></tr>
<tr><td>Open SG rule appeared</td><td><code>"cidr_blocks = [\"0.0.0.0/0\"]"</code></td></tr>
<tr><td>Instance class downgraded</td><td><code>"instance_class" = "db.t3.micro"</code> (when it should be larger)</td></tr>
<tr><td>Bucket lifecycle removed</td><td><code>"- lifecycle_rule"</code> in the diff</td></tr>
</table>

<h3>Bisecting <em>state</em>, not config</h3>
<p>Sometimes the config didn't change — Terraform <em>drifted</em>. Someone clicked something in the AWS console. To find when:</p>

<pre class="code" data-lang="shell" data-title="terraform-state-bisect.sh">#!/usr/bin/env bash
# Bisects across terraform state snapshots (backed up by remote state versioning,
# e.g. S3 versioning or Terraform Cloud state history).
#
# For each historical state, run `terraform plan` AGAINST IT and check whether
# the drift signature is present. The "good" version is the last one without drift.
STATES_DIR="${1:?path to versioned state files}"
SIGNATURE="$2"

for state in $(ls "$STATES_DIR"/*.tfstate | sort); do
  cp "$state" terraform.tfstate
  terraform plan -no-color -refresh=true &gt;/tmp/p.out 2&gt;&amp;1
  if grep -qF "$SIGNATURE" /tmp/p.out; then
    echo "DRIFT first appears in state: $state"
    break
  fi
done
</pre>

<h3>For Pulumi, CloudFormation, CDK</h3>
<table class="cmp">
<tr><th>Tool</th><th>Plan command</th><th>Bisection-suitable</th></tr>
<tr><td>Terraform</td><td><code>terraform plan -refresh=false</code></td><td>Yes — easiest case</td></tr>
<tr><td>Pulumi</td><td><code>pulumi preview --json</code></td><td>Yes — JSON output is ideal for grep</td></tr>
<tr><td>AWS CDK</td><td><code>cdk diff</code></td><td>Yes — diff output is grep-friendly</td></tr>
<tr><td>AWS CloudFormation</td><td><code>aws cloudformation create-change-set</code></td><td>Yes but slower — change-sets take 30+ seconds</td></tr>
<tr><td>Ansible (imperative)</td><td>—</td><td>No native plan — bisection is harder, use <code>--check</code> mode</td></tr>
</table>

<h3>The senior move: signature your changes</h3>
<p>The hardest part of IaC bisection is naming the right signature. A team that adopts the practice of writing one-line comments above sensitive changes makes their own bisections trivial later:</p>

<pre class="code" data-lang="terraform" data-title="signed-change.tf"># BISECT-MARKER: opening security group for monitoring stack (2026-05-12, PR #4827)
resource "aws_security_group_rule" "monitoring_ingress" {
  type        = "ingress"
  from_port   = 9090
  to_port     = 9090
  protocol    = "tcp"
  cidr_blocks = ["10.0.0.0/8"]
  security_group_id = aws_security_group.monitoring.id
}
</pre>

<p>A year later, when monitoring traffic mysteriously stops reaching this rule, the bisection signature is literally the comment text.</p>

<div class="callout bad">
<div class="callout-title">When NOT to bisect IaC</div>
<p>If applying an old commit would cost money or break production, don't. Use the plan-only approach. If even the plan is unsafe (e.g., it requires credentials your CI can't safely give), do a <em>git log -p k8s/</em> or <em>git log -p terraform/</em> and read the diffs manually — sometimes 10 minutes of careful reading is faster than setting up a safe bisection environment.</p>
</div>
</template>

<template data-page-title="Bisecting Feature Flags" data-part="X — Modern Systems">
<span class="badge">Part X · Modern Systems</span>
<h2 class="page-title">Bisecting Feature Flag Configurations</h2>
<p class="lede">Modern apps run dozens to hundreds of feature flags simultaneously. When something breaks, the cause is often "a specific combination of flags." Linear search is O(N²) over flag combinations; bisection turns it into O(log N). This page walks through how.</p>

<h3>The combinatorial problem</h3>
<p>You have 12 feature flags, each on or off. That's 2¹² = 4,096 possible combinations. Users hit different combinations depending on their cohort. A bug appears for some users but not others — meaning <em>some combination</em> is buggy.</p>
<p>You can't test all 4,096 combinations. But you can bisect.</p>

<h3>The single-flag case</h3>
<p>The simplest version: you suspect one flag introduced the bug. Toggle it for an internal user; reproduce the bug; turn it back on. Confirmed in one round.</p>
<p>This is just a controlled experiment, not bisection. Use it when you have a strong hypothesis about which flag.</p>

<h3>The "which flag is it?" case</h3>
<p>You don't know which of N flags is to blame. Test the user with all N flags enabled (bug reproduces). Now turn off half:</p>

<pre class="code" data-lang="javascript" data-title="flag-bisect.mjs">#!/usr/bin/env node
// flag-bisect.mjs
// Bisect across N feature flags to find which one(s) cause a regression.
//
// USAGE:
//   FLAGS=flagA,flagB,flagC,...  node flag-bisect.mjs "&lt;test command&gt;"
//
// The test command should exit 0 if the bug is NOT present, nonzero if it IS.
//
import { spawnSync } from 'child_process';

const ALL = (process.env.FLAGS || '').split(',').filter(Boolean);
const TEST = process.argv[2];

if (!ALL.length || !TEST) {
  console.error('Set FLAGS and pass a test command');
  process.exit(2);
}

function reproduces(enabled) {
  // Apply the chosen flag set via env var (or your flag system's API).
  const envFlags = Object.fromEntries(
    ALL.map(f =&gt; [`FLAG_${f.toUpperCase()}`, enabled.includes(f) ? '1' : '0'])
  );
  const r = spawnSync('sh', ['-c', TEST], {
    env: { ...process.env, ...envFlags },
    stdio: 'inherit',
  });
  return r.status !== 0;   // nonzero = bug present
}

// Confirm endpoints.
if (!reproduces(ALL)) { console.error('No bug when ALL flags on — repro broken'); process.exit(2); }
if (reproduces([]))  { console.error('Bug present with NO flags — not a flag issue'); process.exit(2); }

// Standard ddmin-style narrowing.
let suspects = ALL.slice();
while (suspects.length &gt; 1) {
  const mid = Math.floor(suspects.length / 2);
  const left = suspects.slice(0, mid);
  const right = suspects.slice(mid);
  if (reproduces(left))       suspects = left;
  else if (reproduces(right)) suspects = right;
  else {
    // Bug needs flags from BOTH halves — proper Delta Debugging time.
    console.error('Multi-flag interaction detected; switching to ddmin');
    suspects = ddmin(suspects);
    break;
  }
  console.log(`narrowed to ${suspects.length} flags: ${suspects.join(', ')}`);
}

console.log('Culprit flag(s):', suspects.join(', '));

// Delta Debugging fallback when single bisection isn't enough.
function ddmin(input) {
  let S = input;
  let n = 2;
  while (S.length &gt;= 2) {
    const sz = Math.ceil(S.length / n);
    let progressed = false;
    for (let i = 0; i &lt; S.length; i += sz) {
      const complement = [...S.slice(0, i), ...S.slice(i + sz)];
      if (reproduces(complement)) { S = complement; n = Math.max(n - 1, 2); progressed = true; break; }
    }
    if (!progressed) {
      if (n &gt;= S.length) break;
      n = Math.min(n * 2, S.length);
    }
  }
  return S;
}
</pre>

<h3>The "flag-with-flag" interaction</h3>
<p>Some bugs only appear when two specific flags are both on. Single-flag toggling won't find these; the <code>ddmin</code> fallback above does. It's the same Delta Debugging algorithm from Part IX, applied to flag sets.</p>

<h3>Integrating with real flag systems</h3>
<table class="cmp">
<tr><th>System</th><th>How to set per-test overrides</th></tr>
<tr><td>LaunchDarkly</td><td><code>ldClient.variation(key, user, default)</code> — pass a custom user with attributes matching the test cohort</td></tr>
<tr><td>Statsig</td><td>Use Statsig's <em>local overrides</em> in dev/test: <code>statsig.overrideGate(name, value)</code></td></tr>
<tr><td>Unleash</td><td>Environment-specific strategies — point the bisector at a dedicated test environment</td></tr>
<tr><td>Home-grown (env vars)</td><td>Just pass <code>FLAG_X=1</code> in the env, as in the script above</td></tr>
<tr><td>GrowthBook</td><td><code>growthbook.setForcedFeatures(new Map(...))</code> for test isolation</td></tr>
</table>

<h3>What signals a flag-related bug vs. a code bug</h3>
<ul>
  <li>Bug appears for some users, not others, on the SAME version of the code → likely flag-related.</li>
  <li>Bug appears more often as flag rollouts increase → almost certainly flag-related.</li>
  <li>Bug appears in tests when flags are randomized → flag-related (your suite is finding a real issue).</li>
  <li>Bug appears for ALL users at the moment a flag was rolled to 100% → confirmed flag-related.</li>
</ul>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>Heavy flag use is great for safe rollouts but generates a debugging tax over time. The senior engineer's role isn't only to bisect when bugs appear, but to <em>cap the tax</em>: enforce flag expiry policies (every flag has a kill date), track flag combinations exercised in CI, and make every flag's full state observable in production. A team with 100 long-lived flags is a team that will eventually spend a week bisecting an unreproducible bug. A team with 10 short-lived flags is fast forever.</p>
</div>
</template>

<template data-page-title="Bisecting Docker Image Layers" data-part="X — Modern Systems">
<span class="badge">Part X · Modern Systems</span>
<h2 class="page-title">Bisecting Docker Image Layers</h2>
<p class="lede">Your container's been working for months. Today it builds successfully but the resulting image is 800 MB larger than yesterday's, or crashes immediately on startup, or has a vulnerability scan failure. The Dockerfile has 30 lines and 30 layers. Bisecting layers narrows the culprit to one line.</p>

<h3>Why layers are bisectable</h3>
<p>A Dockerfile produces a stack of layers — each <code>RUN</code>, <code>COPY</code>, <code>ADD</code> instruction makes one. Docker (and Buildah, Podman) caches them content-addressably. If you stop the build at layer N, you get an intermediate image you can run and inspect. Bisecting across N is fast because cached layers don't rebuild.</p>

<h3>The basic technique: target stages</h3>

<pre class="code" data-lang="dockerfile" data-title="instrumented-Dockerfile">FROM node:20-alpine AS stage-base
WORKDIR /app
COPY package.json pnpm-lock.yaml ./

FROM stage-base AS stage-deps
RUN corepack enable &amp;&amp; pnpm install --frozen-lockfile

FROM stage-deps AS stage-build
COPY . .
RUN pnpm build

FROM stage-build AS stage-prune
RUN pnpm prune --prod

FROM node:20-alpine AS stage-final
WORKDIR /app
COPY --from=stage-prune /app /app
CMD ["node", "dist/server.js"]
</pre>

<p>Now you can build any intermediate stage and probe it:</p>

<pre class="code" data-lang="shell" data-title="docker-stage-probe.sh">#!/usr/bin/env bash
# Build a target stage and inspect its size.
STAGE="${1:-stage-final}"
docker build --target "$STAGE" -t bisect:"$STAGE" .
docker image ls bisect:"$STAGE" --format '{{.Size}}'
</pre>

<h3>The image-size bisector</h3>

<pre class="code" data-lang="shell" data-title="docker-size-bisect.sh">#!/usr/bin/env bash
# docker-size-bisect.sh
# Bisect Dockerfile instructions to find which line bloated the image.
#
# Strategy: comment out lines from the BOTTOM up, rebuild, measure size.
# Binary search the cutoff line.
set -uo pipefail

THRESHOLD_MB="${THRESHOLD_MB:?expected acceptable size in MB}"
DOCKERFILE="${DOCKERFILE:-Dockerfile}"
LINES=$(grep -cE '^(RUN|COPY|ADD)' "$DOCKERFILE")

size_at_line() {
  local cutoff="$1"
  awk -v c="$cutoff" 'NR&lt;=c { print; next } /^(RUN|COPY|ADD)/ { print "# CUT: "$0; next } { print }' \
    "$DOCKERFILE" &gt; /tmp/Dockerfile.bisect
  docker build -q -f /tmp/Dockerfile.bisect -t bisect:probe . &gt;/dev/null 2&gt;&amp;1 || return 125
  docker image inspect bisect:probe --format '{{.Size}}'
}

lo=1; hi=$LINES
while (( lo &lt; hi )); do
  mid=$(( (lo + hi) / 2 ))
  bytes=$(size_at_line "$mid")
  mb=$(( bytes / 1024 / 1024 ))
  echo "lines 1..$mid: $mb MB"
  if (( mb &lt; THRESHOLD_MB )); then lo=$((mid + 1)); else hi=$mid; fi
done

echo "Bloat-introducing instruction is on line $lo (or just before)."
awk "NR==$lo" "$DOCKERFILE"
</pre>

<h3>The startup-crash bisector</h3>
<p>Image builds fine; container crashes on start. The bug is either in the final layer's <code>CMD</code> or in something a prior layer installed. Use multi-stage probe:</p>

<pre class="code" data-lang="shell" data-title="docker-crash-bisect.sh">#!/usr/bin/env bash
# docker-crash-bisect.sh
# Find the layer at which `docker run image -- node dist/server.js` starts crashing.
set -uo pipefail
STAGES=( stage-base stage-deps stage-build stage-prune stage-final )

for s in "${STAGES[@]}"; do
  docker build -q --target "$s" -t bisect:"$s" . &gt;/dev/null
  # Override the entrypoint to run the same smoke test in every stage.
  if docker run --rm bisect:"$s" sh -c 'node -e "console.log(process.versions.node)"' &gt;/dev/null 2&gt;&amp;1; then
    echo "$s: OK"
  else
    echo "$s: CRASH"
    break
  fi
done
</pre>

<h3>Inspecting individual layers</h3>
<p><code>dive</code> (<a href="https://github.com/wagoodman/dive" target="_blank" rel="noopener">github.com/wagoodman/dive</a>) is the canonical layer-inspection tool. It lets you walk through each layer's filesystem changes — "what did this RUN actually add?" Indispensable for "where did this 300 MB come from?"</p>

<pre class="code" data-lang="shell" data-title="dive-inspect.sh">dive bisect:stage-deps    # interactive — arrow keys to navigate layers
</pre>

<h3>Bisecting base image upgrades</h3>
<p>You bumped <code>FROM node:20-alpine</code> to <code>FROM node:22-alpine</code>. Something broke. Bisect the base image:</p>

<pre class="code" data-lang="shell" data-title="base-image-bisect.sh">#!/usr/bin/env bash
# Each line is one version to test.
for tag in 22-alpine 21-alpine 20-alpine 18-alpine; do
  sed -i.bak "s|^FROM node:.*-alpine|FROM node:$tag|" Dockerfile
  if docker build -t bisect:"$tag" . &amp;&amp; docker run --rm bisect:"$tag" pnpm test; then
    echo "$tag: OK"
  else
    echo "$tag: FAIL"
  fi
done
mv Dockerfile.bak Dockerfile
</pre>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>The senior move is preventing the need to bisect Docker layers — by writing Dockerfiles that are short, layered for cacheability, and have explicit named stages. A 30-line Dockerfile that "works" is technical debt; a 12-line one that's deliberately structured is an asset. Bisection is the diagnostic tool when prevention failed; prevention is the better engineering.</p>
</div>
</template>

<template data-page-title="Bisecting API Contracts and Schemas" data-part="X — Modern Systems">
<span class="badge">Part X · Modern Systems</span>
<h2 class="page-title">Bisecting API Contracts and GraphQL Schemas</h2>
<p class="lede">A frontend and a backend evolve together. One day, the frontend starts crashing with "Cannot read property 'name' of undefined." The API contract changed somewhere in the last 50 commits — a field got renamed, a type went from required to optional, or a deprecated field was removed. Bisecting the OpenAPI spec or GraphQL schema finds the breaking change.</p>

<h3>OpenAPI / REST contracts</h3>

<pre class="code" data-lang="shell" data-title="openapi-diff-bisect.sh">#!/usr/bin/env bash
# openapi-diff-bisect.sh
# Bisect across commits of an OpenAPI spec to find a breaking change.
#
# Uses oasdiff (https://github.com/oasdiff/oasdiff) — a CLI that classifies
# spec diffs as breaking, non-breaking, or info-level.
#
# Predicate: at this commit, does the spec contain ANY breaking change
# relative to the last known good?
LAST_GOOD="${1:?last-known-good SHA}"
SPEC="${2:-openapi.yaml}"

# Materialize the good baseline once.
git show "$LAST_GOOD:$SPEC" &gt; /tmp/openapi.good.yaml

cat &gt; predicate.sh &lt;&lt;'EOF'
#!/usr/bin/env bash
set -uo pipefail
SPEC="${SPEC:-openapi.yaml}"
[ -f "$SPEC" ] || exit 125
# oasdiff returns nonzero if there are breaking changes.
oasdiff breaking /tmp/openapi.good.yaml "$SPEC" --format text
EOF
chmod +x predicate.sh

git bisect start HEAD "$LAST_GOOD"
git bisect run ./predicate.sh
git bisect reset
</pre>

<h3>What "breaking" actually means</h3>
<table class="cmp">
<tr><th>Change to the spec</th><th>Breaking?</th></tr>
<tr><td>Adding a new endpoint</td><td>No</td></tr>
<tr><td>Adding an optional field to a response</td><td>No</td></tr>
<tr><td>Adding a required field to a request body</td><td>Yes — existing clients won't send it</td></tr>
<tr><td>Removing a field from a response</td><td>Yes — clients reading it will fail</td></tr>
<tr><td>Changing a field's type (string → number)</td><td>Yes</td></tr>
<tr><td>Making a previously-optional field required</td><td>Yes for the request side</td></tr>
<tr><td>Renaming an enum value</td><td>Yes</td></tr>
<tr><td>Tightening validation (e.g., max length)</td><td>Yes</td></tr>
<tr><td>Removing an endpoint</td><td>Yes</td></tr>
</table>

<h3>GraphQL schemas</h3>
<p>GraphQL's type system makes contract changes machine-checkable. Use <code>graphql-inspector</code> (<a href="https://the-guild.dev/graphql/inspector" target="_blank" rel="noopener">the-guild.dev/graphql/inspector</a>):</p>

<pre class="code" data-lang="shell" data-title="graphql-bisect.sh">#!/usr/bin/env bash
# graphql-bisect.sh — find the commit that introduced a breaking schema change.
LAST_GOOD="${1:?last-known-good SHA}"
SCHEMA="${2:-schema.graphql}"

git show "$LAST_GOOD:$SCHEMA" &gt; /tmp/schema.good.graphql

cat &gt; predicate.sh &lt;&lt;'EOF'
#!/usr/bin/env bash
set -uo pipefail
SCHEMA="${SCHEMA:-schema.graphql}"
[ -f "$SCHEMA" ] || exit 125
# Exit 1 if BREAKING changes are present.
pnpm dlx @graphql-inspector/cli diff \
  /tmp/schema.good.graphql "$SCHEMA" \
  --fail-on-breaking
EOF
chmod +x predicate.sh

git bisect start HEAD "$LAST_GOOD"
git bisect run ./predicate.sh
git bisect reset
</pre>

<h3>Bisecting at the runtime level (not just the spec)</h3>
<p>Sometimes the spec is unchanged but the server's behavior changed (the implementation drifted from the spec). For that, use a <em>contract test</em> as the predicate:</p>

<pre class="code" data-lang="javascript" data-title="contract-test-predicate.mjs">#!/usr/bin/env node
// contract-test-predicate.mjs
// Boots the server, runs a small set of contract assertions, exits 0/1.
import { spawn, spawnSync } from 'child_process';

const server = spawn('node', ['dist/server.js'], { stdio: 'inherit' });
await new Promise(r =&gt; setTimeout(r, 1500));

try {
  // Replace with your contract assertions.
  const cases = [
    ['GET', '/users/1',     { ok: r =&gt; r.id === 1 &amp;&amp; r.email } ],
    ['GET', '/orders/42',   { ok: r =&gt; r.total &gt; 0 &amp;&amp; r.items.length } ],
    ['POST','/checkout',    { ok: r =&gt; r.transactionId } ],
  ];
  for (const [method, path, { ok }] of cases) {
    const res = await fetch('http://localhost:3000' + path, { method });
    if (!res.ok) process.exit(1);
    const body = await res.json();
    if (!ok(body)) process.exit(1);
  }
  process.exit(0);
} finally {
  server.kill();
}
</pre>

<h3>Frontend-side: bisecting against the live API</h3>
<p>When you can't bisect the backend (it's owned by another team), bisect the frontend's expectations against a stable API:</p>

<pre class="code" data-lang="javascript" data-title="frontend-bisect-predicate.mjs">#!/usr/bin/env node
// Boots the frontend (current commit), points it at the production API, runs
// Playwright through the broken user flow. If the flow fails, this commit
// is incompatible with the current API.
import { spawnSync } from 'child_process';
const r = spawnSync('pnpm', ['dlx', 'playwright', 'test', 'e2e/checkout.spec.ts',
  '--', '--config=playwright.production-api.config.ts'], { stdio: 'inherit' });
process.exit(r.status);
</pre>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>The principal engineer's move on API contracts isn't to be the fastest bisector — it's to make contract drift impossible. Run <code>oasdiff</code>/<code>graphql-inspector</code> as a required check on every PR that touches the spec. Block merges that introduce breaking changes without an explicit "breaking-change-approved" label. Force a deprecation window before removal. When you've done this, you almost never need to bisect a contract regression — because they don't reach <code>main</code>.</p>
</div>
</template>

<template data-page-title="Designing Systems to Be Bisectable" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">Designing Systems to Be Bisectable</h2>
<p class="lede">Engineers below the senior level treat bisection as a debugging tactic. Principal engineers treat it as a <em>system property</em> — something you design in, not bolt on later. A system that's bisectable is fundamentally cheaper to operate, because every regression is a 30-minute investigation instead of a multi-day one. This page is the design playbook.</p>

<h3>The eight properties of a bisectable system</h3>

<table class="cmp">
<tr><th>Property</th><th>Why it matters for bisection</th></tr>
<tr><td>1. Atomic commits</td><td>Each commit is one logical change. A bisection that lands on a 5,000-line PR is useless; one that lands on a 30-line commit is a fix.</td></tr>
<tr><td>2. Reversible deploys</td><td>If you can't roll back, you can't easily test "is this version good or bad?"</td></tr>
<tr><td>3. Reproducible builds</td><td>The same commit must produce the same artifact every time. Otherwise "this commit is bad" might just be a flaky build.</td></tr>
<tr><td>4. Hermetic tests</td><td>The same test on the same commit must produce the same result. Otherwise flakes destroy the bisection.</td></tr>
<tr><td>5. Fast feedback</td><td>Bisecting is N rounds of "build + test." Each round at 8 minutes = ~80-minute bisection. Each round at 60 seconds = 10-minute bisection.</td></tr>
<tr><td>6. Observable behavior</td><td>The predicate needs to <em>see</em> what's happening. Add structured logs, metrics, traces.</td></tr>
<tr><td>7. Stable interfaces</td><td>A bisection that lands on a commit where the API doesn't exist yet is wasted. Stable public surfaces let predicates outlast individual versions.</td></tr>
<tr><td>8. Versioned data</td><td>If a bug depends on data shape, the data version must be known per commit (database migrations, fixtures).</td></tr>
</table>

<h3>Designing for property 1: atomic commits</h3>
<p>The single highest-leverage design choice for bisectability is a culture of small, well-described, single-purpose commits. Concrete practices:</p>
<ul>
  <li><strong>Commit-lint in CI.</strong> Reject PRs whose commits don't follow conventional-commits format (<code>type(scope): subject</code>).</li>
  <li><strong>Rebase, don't merge.</strong> Linear history is far easier to bisect than a tangle of merges.</li>
  <li><strong>Squash judgement, not policy.</strong> Sometimes squashing helps; sometimes it loses bisection-relevant detail. Train engineers to decide per-PR.</li>
  <li><strong>"What broke?" comments in every PR description.</strong> When bisection lands here a year later, the PR description is what the on-call reads.</li>
</ul>

<h3>Designing for property 4: hermetic tests</h3>
<p>Tests that touch the real network, real time, real disk, or real database state will flake. Flaky tests poison bisections (Part I's "Flake-Resistant Predicates" walks the tactics). The structural fix is to <em>make hermetic the default</em>:</p>
<ul>
  <li>All HTTP in tests goes through a mock server (MSW, nock, WireMock).</li>
  <li>All time uses a fake clock (sinon, vi.useFakeTimers).</li>
  <li>All randomness uses a seeded RNG controlled by the test.</li>
  <li>All filesystem use is under a per-test temp directory.</li>
  <li>All databases are per-test schemas (or in-memory engines like SQLite).</li>
</ul>
<p>Yes, this takes engineering effort. The return: every test is deterministic forever. Every future bisection works. The investment compounds.</p>

<h3>Designing for property 5: fast feedback</h3>
<p>If your build takes 15 minutes, bisection over 20 commits takes 75 minutes minimum. The senior move: make CI fast as a design priority, not an afterthought.</p>
<ul>
  <li><strong>Incremental builds.</strong> Don't rebuild what didn't change. Bazel, Nx, Turborepo all do this; package.json + pnpm can with care.</li>
  <li><strong>Parallelized tests.</strong> 1000 tests / 10 cores = 100 unit-tests-per-core, not 1000-tests-serial.</li>
  <li><strong>Cached dependencies.</strong> <code>pnpm install --frozen-lockfile --prefer-offline</code> + a CI cache of the pnpm store. Install drops from minutes to seconds.</li>
  <li><strong>Layer Docker builds.</strong> A multi-stage Dockerfile where dependency-install is one layer means changing source doesn't reinstall deps.</li>
</ul>

<h3>Designing for property 7: stable interfaces</h3>
<p>Bisection predicates are usually scripts that exercise an API. If the API changes shape every week, your predicate keeps breaking. The senior move:</p>
<ul>
  <li><strong>Versioned API endpoints</strong> (<code>/v1/users</code>, <code>/v2/users</code>) so old clients keep working during transitions.</li>
  <li><strong>Generate clients from spec</strong> so bisection predicates regenerate when the spec changes.</li>
  <li><strong>Treat the spec as code.</strong> Lint it. Diff it. Block breaking PRs.</li>
</ul>

<h3>Designing for property 8: versioned data</h3>
<p>Bug repros often need specific data shapes. If the schema migrated at commit X, predicates that run before X need the old schema. The design move:</p>
<ul>
  <li><strong>Number every migration.</strong> 0001, 0002, ..., committed alongside the code that uses them.</li>
  <li><strong>Predicates start with "migrate to the current commit's schema."</strong> This is one line in most ORMs.</li>
  <li><strong>Migrations must be reversible.</strong> Otherwise bisection going backward can't move past a migration.</li>
</ul>

<h3>The full "bisectability scorecard"</h3>

<pre class="code" data-lang="markdown" data-title="bisectability-scorecard.md"># Bisectability Scorecard — score each system you maintain

## Commit hygiene
[ ] Conventional-commit format enforced in CI
[ ] Linear history (rebase-merge or squash-merge, not true merges)
[ ] Average commit size &lt; 200 lines added

## Reproducibility
[ ] Same commit + same input → bitwise-identical artifact
[ ] Lockfile committed and honored in CI
[ ] Build cache invalidates correctly on dependency changes

## Test hermeticity
[ ] All HTTP mocked
[ ] Time mockable
[ ] Random seeded per test
[ ] DB per-test isolation
[ ] No test depends on test order

## Feedback speed
[ ] Single commit → CI in &lt; 5 minutes for the common case
[ ] Incremental builds working
[ ] Parallelism in test runner

## Observability
[ ] Structured logs (JSON) for every non-trivial event
[ ] Metrics on every public endpoint
[ ] Distributed tracing in production

## Interface stability
[ ] API versioning policy in place
[ ] Schema diff blocking on breaking changes
[ ] Deprecation window enforced

## Data versioning
[ ] Numbered migrations
[ ] Reversible migrations
[ ] Migration state queryable

Score = boxes checked / total. Below 50% = bisection will be painful.
</pre>

<div class="callout good">
<div class="callout-title">L7 mindset</div>
<p>"Make it bisectable" is not a project. It's a tax you pay continuously, on every PR, in exchange for hours back when something breaks. The principal engineer's job isn't to do every checklist item — it's to advocate for the design choices that make the checklist achievable, then teach the team why each one matters. The teams whose bisections always work are the teams that designed for it three years ago. Be that engineer.</p>
</div>
</template>

<template data-page-title="Bisection in Production Incident Response" data-part="XI — Principal Engineering">
<span class="badge">Part XI · Principal Engineering</span>
<h2 class="page-title">Bisection in Production Incident Response</h2>
<p class="lede">A real outage is happening. Users can't log in. The CTO is in your channel. You have to choose between "find the cause" (slow, correct) and "stop the bleeding" (fast, possibly imperfect). This page is about how bisection fits into the incident response workflow — and when to use it vs. when to skip it for now.</p>

<h3>The incident timeline</h3>
<table class="cmp">
